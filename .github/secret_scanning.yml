# GitHub secret-scanning push-protection allowlist.
#
# SCOPE: testdata/session-detail/** ONLY. The redaction example fixture
# (testdata/session-detail/redactions.yaml) intentionally carries REALISTIC
# secret FORMATS (e.g. AKIA-prefixed AWS key IDs, ghp_ GitHub PAT shapes,
# sk_live_ Stripe keys) so it exemplifies what pkg/redact actually detects.
# These are non-functional example/test values — no real credentials.
#
# This allowlist is deliberately NARROW: it does NOT disable secret scanning
# repo-wide. Any secret pattern OUTSIDE testdata/session-detail/ is still
# push-protected. Do not broaden these paths.
paths-ignore:
  - "testdata/session-detail/**"
