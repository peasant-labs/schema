name: Bubble merge

# After a PR is squash-merged into develop, "bubble" the resulting single-parent
# squash S into the merge-commit-triangle landing shape: build M with parents
# [T, S] (first-parent T, M.tree == S.tree) and fast-forward develop S -> M. The
# whole operation is the release-guard `bubble` subcommand running purely against
# the GitHub Git Data API (POST git/commits + PATCH refs force:false FF-CAS) — it
# never checks out develop and never does working-tree git, so there is NO
# actions/checkout here. The CLI is run straight from the module via `go run
# <module>@<sha>` (release-guard lives in this schema module), pinned to the
# just-merged commit so the bubble always runs the exact tool version present on
# develop at merge time. Repoint the pin to a published `@vX.Y.Z` tag if
# reproducibility-pinning is preferred over dogfooding develop.
#
# Trigger discipline (B7): the bubble runs ONLY on a native squash-merge of an
# approved PR — no auto-merge label, no /merge comment. Approval is enforced
# upstream by branch-protection required-reviews gating the native squash button.
#
# Loop guard (B3): the develop advance is a push-class API ref update, which is
# NOT a pull_request event, so it never re-triggers this workflow. DecideBubble's
# AlreadyBubbled is defense-in-depth idempotency on top of that event-type break.
#
# MANUAL SEED / GUARD-REFUSAL ESCAPE HATCH (workflow_dispatch):
# The drain is guarded — if the first-parent walk back to the last merge boundary
# would cross already-released history (a release tag on a pending squash), the
# bubble REFUSES and leaves develop untouched. That is correct behaviour, and the
# only intended resolution is an operator deciding, explicitly, where the drain
# floor should sit. `--boundary <sha>` does exactly that, but it cannot be passed
# from the pull_request path (nothing there to type it into), and the operator
# generally cannot run release-guard locally — the develop advance needs the
# peasant-labs-releaser App token, which only lives in Actions.
#
# So this workflow is ALSO manually dispatchable. Procedure, for ANY guard
# refusal (first run on a repo with pre-existing squashes, a release cut between
# bubbles, an aborted bubble — not just the first time):
#   1. Read the refusal message in the failed bubble run; it names the commits it
#      refused to cross.
#   2. Note the CURRENT develop tip SHA (Code → commits, or
#      `gh api repos/peasant-labs/schema/git/ref/heads/develop`). Everything at or
#      below it is what you are declaring "already landed, do not re-bubble".
#   3. Actions → "Bubble merge" → Run workflow (from branch `develop`) with
#        pr       = the PR number that should be bubbled
#        boundary = that develop tip SHA
#      The walk then stops at `boundary` instead of walking into released history,
#      and only squashes ABOVE it are drained.
# Leave `boundary` empty to re-run a normal, unguarded bubble by hand.
#
# `boundary` accepts an ABBREVIATED SHA (>= 7 hex chars, as `git log --abbrev-commit`
# prints) as well as the full 40-char one — copying the short SHA off a commit
# listing is fine. It must name a commit on develop's FIRST-PARENT chain at or above
# the last merge boundary. A boundary that matches nothing, or that is too short /
# ambiguous, is REFUSED with an actionable error and develop is left unchanged — it
# is never silently ignored, so a mistyped floor cannot drain past what you intended.
#
# The branch dropdown is NOT cosmetic: a dispatch pins the release-guard version to
# the launch branch's tip (github.sha), so launching from anywhere but develop would
# run a foreign tool build against develop. That is enforced — a dispatch from any
# other ref fails immediately, before the App token is minted.
#
# OPS PREREQUISITES (the USER's, not testable in this file): on peasant-labs/schema
#   - install the peasant-labs-releaser App with Contents:write + Pull-requests:read,
#   - configure develop branch-protection to allow that App's fast-forward ref
#     update (required-PR bypass for the App),
#   - set repo merge settings to squash-only (disable merge-commit + rebase).

on:
  pull_request:
    types: [closed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to bubble (its squash must be on develop already)"
        required: true
        type: string
      boundary:
        description: "Optional drain-floor commit SHA (--boundary). Usually the current develop tip. Short SHA (>=7 hex chars) or full 40-char both work; must be on develop's first-parent chain. Leave empty for a normal bubble."
        required: false
        default: ""
        type: string

# Serialize bubbles so two merges never race the develop FF-CAS; never cancel an
# in-flight bubble (cancelling mid-chain could leave develop partially advanced).
concurrency:
  group: bubble-develop
  cancel-in-progress: false

# The workflow's own GITHUB_TOKEN stays read-only; the protected-develop write is
# done with the minted App token, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  bubble:
    name: bubble squash-merge into develop
    # Only a real MERGE triggers the automatic bubble; a non-merged close is a
    # no-op. The merged== check is scoped to the pull_request event so it never
    # suppresses a manual workflow_dispatch seed run (which has no PR payload).
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A dispatch takes its TOOL_REF from github.sha, which is the tip of
      # WHICHEVER branch the operator picked in the Run-workflow dropdown. Picking
      # anything but develop would run a different release-guard build against
      # develop's refs — a tool that mutates develop must be the version develop
      # actually ships. Fail loud and early rather than skipping the job: a skipped
      # job renders as success, and the operator would believe the seed ran.
      - name: Guard — manual dispatch must be launched from develop
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop'
        env:
          LAUNCH_REF: ${{ github.ref }}
        run: |
          echo "::error title=Bubble dispatched from the wrong branch::Manual bubble was launched from '${LAUNCH_REF}', not 'refs/heads/develop'."
          echo "WHAT: this workflow_dispatch run was started from ref '${LAUNCH_REF}'." >&2
          echo "WHY IT MATTERS: on a dispatch the release-guard version is pinned to github.sha," >&2
          echo "  i.e. the tip of the launch branch. Launching from '${LAUNCH_REF}' would run THAT" >&2
          echo "  branch's release-guard against develop's refs, mutating develop with a tool build" >&2
          echo "  develop does not ship. Refusing before any token is minted or any ref is touched." >&2
          echo "HOW TO FIX: re-run via Actions -> 'Bubble merge' -> 'Run workflow', selecting branch" >&2
          echo "  'develop' in the branch dropdown, with the same pr/boundary inputs." >&2
          exit 1

      - name: Mint App token (Contents:write to FF-advance develop; Pull-requests:read for provenance)
        id: tok
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PEASANT_RELEASER_APP_ID }}
          private-key: ${{ secrets.PEASANT_RELEASER_APP_PRIVATE_KEY }}
          owner: peasant-labs
          repositories: schema
          permission-contents: write
          permission-pull-requests: read

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # No checkout means no local go.mod to read; pin a stable toolchain and
          # let `go run` auto-upgrade to the fetched module's go directive if needed.
          go-version: stable

      - name: Bubble the squash-merge into develop (pure Git Data API)
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
          GITHUB_TOKEN: ${{ steps.tok.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # NOTE: no GITHUB_API_URL — the release-guard go-github client targets
          # api.github.com (the MVP host) and does not read that variable, so
          # setting it would be dead config that silently misleads on GHES. GHES
          # support is a future follow-up: wire the host through go-github's
          # WithEnterpriseURLs in newGitHubClient, then thread github.api_url here.
          # Per-event resolution. pull_request: the merged PR and its squash sha
          # (the tool version present on develop at merge time). workflow_dispatch:
          # the operator-supplied PR number, and github.sha — for a dispatch on
          # develop that IS the develop tip, i.e. still the tool version on develop.
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr || github.event.pull_request.number }}
          TOOL_REF: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.merge_commit_sha }}
          # Drain floor, manual path only; empty on pull_request and on a dispatch
          # that left the input blank. Emitted as --boundary ONLY when non-empty.
          BOUNDARY: ${{ github.event_name == 'workflow_dispatch' && inputs.boundary || '' }}
          # Fetch the module straight from GitHub (schema is public): the public
          # module proxy can lag on a just-pushed merge sha and 500/"unknown
          # revision"; direct fetch resolves the fresh commit deterministically.
          GOPROXY: direct
        run: |
          set -euo pipefail
          args=(bubble --pr "$PR_NUMBER")
          if [ -n "$BOUNDARY" ]; then
            args+=(--boundary "$BOUNDARY")
          fi
          go run "github.com/peasant-labs/schema/cmd/release-guard@${TOOL_REF}" "${args[@]}"
