name: go-apidiff comment

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the reviewed script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: reviewed
          persist-credentials: false
      - name: Download the triggering run's payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: go-apidiff-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: apidiff-comment
      - name: Upsert the API diff comment
        env:
          GH_TOKEN: ${{ secrets.JOURNEY_GITHUB_USER_PAT }}
          EVIDENCE_DIR: apidiff-comment
        run: node reviewed/scripts/post-go-apidiff-comment.mjs
