name: Release PR

# The schema repo's PR-title-driven release ceremony, mirroring peasant's
# release-pr.yml but for a contract LIBRARY. SUBTRACTED vs peasant: the
# release-validate (per-distro packaging) and full-stack e2e reusable calls —
# the schema module ships no binary and runs no consumer e2e (Model A: consumers
# validate in their own CI on pin bump).
#
# Trigger A — while a release PR is OPEN: validate the title grammar (via the
#   release-guard CLI, the single source of the grammar) + assert the author is a
#   maintainer, and run the full Tests gate (make check + contract gates) so every
#   release PR proves the contract is green before merge.
#
# Trigger B — when a release PR MERGES: assert ≥1 maintainer APPROVED review, run
#   make nix-vendor-hash on the merge commit (commit a flake.nix fix if needed),
#   then push an annotated tag on the hash-current commit using a GitHub App token
#   (the default GITHUB_TOKEN cannot push a tag that re-triggers release.yml).
#
# The App token needs Contents:write on peasant-labs/schema (an App INSTALLATION
# setting in the GitHub UI — NOT testable pre-merge; the live v0.1.0-rc1 run is
# the planned proof). Reuses the same `peasant-labs-releaser` App as peasant,
# installed additionally on the schema repo.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, closed]
    branches: [develop]

concurrency:
  group: release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Trigger A: validate an OPEN release PR (grammar + maintainer author).
  validate:
    name: validate release PR
    if: >-
      github.event.action != 'closed' &&
      startsWith(github.event.pull_request.title, 'release(')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate release PR title grammar
        run: go run ./cmd/release-guard parse-title "$PR_TITLE"

      - name: Assert author is a maintainer (admin/maintain)
        run: go run ./cmd/release-guard check-maintainer --user "$PR_AUTHOR"

  # Full quality gate on an OPEN release PR — REGARDLESS of files touched. tests.yml
  # is path-filtered on its own pull_request trigger, so a release marker commit
  # that touches no gated path would otherwise skip it. Call it here as a reusable
  # workflow so every release PR proves make check + the contract gates pre-merge.
  tests:
    name: tests (release PR)
    needs: validate
    if: >-
      startsWith(github.event.pull_request.title, 'release(') &&
      contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action)
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  # Trigger B: a release PR MERGED — assert maintainer approval, then tag.
  tag:
    name: tag merged release
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'release(')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Mint App token (Contents:write to push the tag)
        id: tok
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PEASANT_RELEASER_APP_ID }}
          private-key: ${{ secrets.PEASANT_RELEASER_APP_PRIVATE_KEY }}
          owner: peasant-labs
          repositories: schema

      - name: Checkout repository (full history + tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.tok.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Derive version + kind from the PR title
        id: title
        run: go run ./cmd/release-guard parse-title "$PR_TITLE"

      - name: Assert at least one maintainer APPROVED review
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./cmd/release-guard check-approval --pr "$PR_NUMBER"

      - name: Update Nix vendor hash before tagging
        id: nix_hash
        run: |
          set -euo pipefail
          if [ -z "${MERGE_SHA}" ]; then
            echo "::error::merge_commit_sha is empty; cannot update vendorHash before tagging. (Was the PR actually merged?)"
            exit 1
          fi
          git checkout -B release-nix-hash "${MERGE_SHA}"
          nix develop -c make nix-vendor-hash
          if git diff --quiet -- flake.nix; then
            tag_sha="$(git rev-parse HEAD)"
            echo "tag_sha=${tag_sha}" >> "$GITHUB_OUTPUT"
            echo "::notice::vendorHash already current at ${tag_sha}"
            exit 0
          fi
          git config user.name "peasant-release-bot"
          git config user.email "bots@peasant-labs.invalid"
          git add flake.nix
          git commit -m "chore: update nix vendor hash"
          max_push_attempts=3
          for attempt in $(seq 1 "$max_push_attempts"); do
            git fetch origin develop
            if ! git rebase origin/develop; then
              echo "::error::failed to rebase nix vendor hash commit onto origin/develop on attempt ${attempt}/${max_push_attempts}. Resolve the flake.nix conflict on develop and rerun the release PR."
              git rebase --abort || true
              exit 1
            fi
            if git push origin "HEAD:develop"; then
              tag_sha="$(git rev-parse HEAD)"
              echo "tag_sha=${tag_sha}" >> "$GITHUB_OUTPUT"
              echo "::notice::updated vendorHash and will tag ${tag_sha}"
              exit 0
            fi
            echo "::warning::push to develop failed on attempt ${attempt}/${max_push_attempts}; fetching and rebasing before retry."
          done
          echo "::error::failed to push nix vendor hash commit to develop after ${max_push_attempts} attempts. Check for a protected-branch rejection or repeated concurrent updates, then rerun the release PR."
          exit 1

      - name: Push annotated tag (hard-fail if it exists)
        env:
          VERSION: ${{ steps.title.outputs.version }}
          TAG_SHA: ${{ steps.nix_hash.outputs.tag_sha }}
        run: |
          set -euo pipefail
          if [ -z "${TAG_SHA}" ]; then
            echo "::error::tag_sha is empty; cannot tag."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::tag ${VERSION} already exists; refusing to move a published tag. Bump the version in a new release PR."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error::tag ${VERSION} already exists on origin; refusing to overwrite. Bump the version in a new release PR."
            exit 1
          fi
          git config user.name "peasant-release-bot"
          git config user.email "bots@peasant-labs.invalid"
          git tag -a "${VERSION}" "${TAG_SHA}" -m "${PR_TITLE}"
          git push origin "refs/tags/${VERSION}"
          echo "::notice::pushed annotated tag ${VERSION} on ${TAG_SHA}"
