name: Release

# Tag-triggered release pipeline for the contract LIBRARY. The tag is pushed by
# release-pr.yml's App token (the default GITHUB_TOKEN cannot push a tag that
# re-triggers a workflow), so this runs automatically when a release PR merges.
#
# MIRRORS peasant's release.yml gate chain (guard -> nix-vendor-hash -> gates ->
# publish) but SUBTRACTS every CLI-binary stage: NO goreleaser build, NO
# deb/rpm/AUR/Homebrew/nix packaging, NO release-validate distro matrix, NO
# release-e2e / e2e / smoke. The publisher is a single GitHub Release carrying the
# generated/ OpenAPI specs as downloadable ASSETS (prerelease for -rcN).
#
# The job graph is asserted by `release-guard check-workflow` (run in `make
# check`): the `release` publish job must sit behind guard, nix-vendor-hash, and
# contract-gates.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release + upload assets
  actions: read # release-guard check-final reads rc release-run conclusions

jobs:
  # Gate the build: reject non-schema tags, and for FINAL releases require a
  # same-version rc that is green AND an ancestor of the final commit.
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    # The tag's release kind ("rc" | "final"), derived once here by the tested
    # `release-guard parse-tag` (internal/release Kind() over the anchored tag
    # grammar). Downstream jobs consume `needs.guard.outputs.kind` rather than
    # re-detecting rc-ness with an untested shell substring match.
    outputs:
      kind: ${{ steps.parse.outputs.kind }}
    steps:
      - name: Checkout repository (full history + tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Parse + classify the tag
        id: parse
        run: go run ./cmd/release-guard parse-tag "$TAG"

      - name: Final-release guard (green same-version rc + ancestor)
        if: steps.parse.outputs.kind == 'final'
        run: go run ./cmd/release-guard check-final --tag "$TAG"

  nix-vendor-hash:
    name: assert nix vendorHash current
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Check Nix vendor hash freshness
        run: |
          set -euo pipefail
          nix develop -c make nix-vendor-hash
          if ! git diff --quiet -- flake.nix; then
            echo "::error::flake.nix vendorHash is stale on ${GITHUB_REF_NAME}. Create the release tag from a commit that has run make nix-vendor-hash."
            git diff -- flake.nix
            exit 1
          fi

  # Contract gates on the release commit: vacuum lints the published specs, and
  # (when a prior release tag exists) oasdiff + go-apidiff diff against it. The
  # heavy breaking-change gating already ran on the PR; this is the final
  # belt-and-suspenders before publication.
  contract-gates:
    name: contract gates
    needs: [guard, nix-vendor-hash]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout repository (full history + tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Determine prior release tag (the released golden to diff against)
        id: prior
        run: |
          set -euo pipefail
          # Prereleases (kind == "rc", classified once by the guard job's tested
          # `release-guard parse-tag`) are unstable: they may carry breaking changes
          # vs the prior release as they converge toward a final vX.Y.Z, so the
          # vs-prior breaking diff (oasdiff + go-apidiff) does NOT apply to an rc.
          # The compatibility guarantee is enforced only at a FINAL release (here,
          # plus `release-guard check-final`); PR-time gates already cover breaks vs
          # develop. For an rc, leave BASE_REF empty so contract-gates.sh runs
          # vacuum lint only (its empty-base behaviour skips the breaking diffs).
          if [ "${{ needs.guard.outputs.kind }}" = "rc" ]; then
            echo "base_ref=" >> "$GITHUB_OUTPUT"
            echo "::notice::prerelease ${TAG}: skipping the vs-prior breaking diff (rc tags may break); vacuum lint only."
          else
            # The most recent v* tag that is an ancestor of this tag, excluding it.
            prior="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
            echo "base_ref=${prior}" >> "$GITHUB_OUTPUT"
            if [ -n "${prior}" ]; then
              echo "::notice::diffing the contract against prior release ${prior}"
            else
              echo "::notice::no prior release tag; running vacuum lint only (first release)"
            fi
          fi

      - name: Run contract gates
        run: nix develop -c make gates BASE_REF="${{ steps.prior.outputs.base_ref }}"

  # Publish: a single GitHub Release carrying the generated OpenAPI specs as
  # assets. Prerelease for -rcN; full release for a final vX.Y.Z.
  release:
    name: publish GitHub Release
    needs: [guard, nix-vendor-hash, contract-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Create the GitHub Release with the OpenAPI specs as assets
        run: |
          set -euo pipefail
          # Prerelease iff the guard job classified the tag as an rc — the single
          # tested source of truth (release-guard parse-tag -> internal/release Kind()),
          # not a re-derived shell substring match.
          prerelease_flag=""
          if [ "${{ needs.guard.outputs.kind }}" = "rc" ]; then
            prerelease_flag="--prerelease"
          fi
          # Assets: every generated contract artifact (OpenAPI specs + the publish
          # JSON Schema), both JSON and YAML.
          assets=(generated/*.json generated/*.yaml)
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            $prerelease_flag \
            "${assets[@]}"
          echo "::notice::published GitHub Release $TAG with ${#assets[@]} contract assets"

  # Publish the generated @peasant-labs/schema TypeScript package to npm. Sits
  # behind the SAME three gates as the GitHub Release publish job above (guard ->
  # nix-vendor-hash -> contract-gates), but is otherwise independent of it: an npm
  # publish failure here must never block the GitHub Release, and a GitHub
  # Release asset failure must never block this job. The committed
  # typescript/package.json stays "0.0.0-development" + "private": true as the
  # local safety; this job stamps the real version and drops "private" in the CI
  # working copy only, never committing either change back to the repo.
  #
  # Authentication is npm Trusted Publishing (OIDC) - NOT a long-lived NPM_TOKEN
  # secret. `permissions.id-token: write` lets GitHub mint a short-lived OIDC
  # token for this job, scoped to the "npm-publish" GitHub Actions environment
  # (below) that the npm Trusted Publisher registration is bound to; pnpm
  # (native OIDC trusted-publish support since the v11 publish reimplementation;
  # the flake pins 11.24.0, chosen over the npm CLI to stay on this repo's one
  # package-manager toolchain for install/build/test/publish) exchanges that
  # token with the npm registry itself when no registry auth token is
  # configured, so there is no secret to provision, rotate, or leak. Provenance
  # attestation is automatic with a trusted-publishing publish; no extra flag
  # needed. This requires one-time, maintainer-side registrations (the
  # "npm-publish" GitHub environment, and this repo+workflow+environment as the
  # package's Trusted Publisher on npmjs.com) documented in
  # docs/release-runbook.md, "npm publication".
  npm-publish:
    name: publish npm package
    needs: [guard, nix-vendor-hash, contract-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read # checkout only; no tag/commit is pushed from this job
      id-token: write # mint the OIDC token npm Trusted Publishing exchanges
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Install locked TypeScript dependencies
        run: nix develop -c pnpm --dir typescript install --frozen-lockfile --ignore-scripts

      - name: Stamp the package version (working copy only, never committed)
        run: |
          set -euo pipefail
          version="${TAG#v}"
          nix develop -c node -e '
            const fs = require("fs");
            const pkgPath = "typescript/package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            pkg.version = process.argv[1];
            delete pkg.private;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
          ' "$version"
          echo "::notice::stamped typescript/package.json to version ${version} for this publish only; develop keeps 0.0.0-development / private"

      - name: Run the TypeScript package gates against the staged publish manifest (typecheck, test, package:audit, package:smoke)
        run: |
          nix develop -c pnpm --dir typescript run typecheck
          nix develop -c pnpm --dir typescript test
          nix develop -c pnpm --dir typescript run package:audit
          nix develop -c pnpm --dir typescript run package:smoke

      - name: Determine the npm dist-tag from the tag kind
        id: disttag
        env:
          KIND: ${{ needs.guard.outputs.kind }}
        run: |
          set -euo pipefail
          # Dist-tag policy, keyed off the guard job's already-tested classification
          # (release-guard parse-tag -> internal/release Kind()), never re-derived
          # here: an rc prerelease publishes under `next`; a final vX.Y.Z takes
          # `latest`.
          if [ "${KIND}" = "rc" ]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @peasant-labs/schema to npm (OIDC trusted publishing)
        run: |
          set -euo pipefail
          nix develop -c pnpm --dir typescript publish --access public --no-git-checks --tag "${{ steps.disttag.outputs.tag }}"
          published_version="$(nix develop -c node -p "require('./typescript/package.json').version")"
          echo "::notice::published @peasant-labs/schema@${published_version} to npm under dist-tag ${{ steps.disttag.outputs.tag }} via OIDC trusted publishing"
