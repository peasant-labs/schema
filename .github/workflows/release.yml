name: Release

# Tag-triggered release pipeline for the contract LIBRARY. The tag is pushed by
# release-batch.yml's App token (the default GITHUB_TOKEN cannot push a tag that
# re-triggers a workflow), so this runs automatically when a release PR merges.
#
# MIRRORS peasant's release.yml gate chain (guard -> nix-vendor-hash -> gates ->
# publish) but SUBTRACTS every CLI-binary stage: NO goreleaser build, NO
# deb/rpm/AUR/Homebrew/nix packaging, NO release-validate distro matrix, NO
# release-e2e / e2e / smoke. The publisher is a single GitHub Release carrying the
# generated/ OpenAPI specs as downloadable ASSETS (prerelease for -rcN).
#
# The job graph is asserted by `release-guard check-workflow` (run in `make
# check`): the `release` publish job must sit behind guard, nix-vendor-hash, and
# contract-gates.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Gate the build: reject non-schema tags and classify rc vs final releases.
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout only; the guard parses the pushed tag locally
    env:
      TAG: ${{ github.ref_name }}
    # The tag's release kind ("rc" | "final"), derived once here by the tested
    # `release-guard parse-tag` (internal/release Kind() over the anchored tag
    # grammar). Downstream jobs consume `needs.guard.outputs.kind` rather than
    # re-detecting rc-ness with an untested shell substring match.
    outputs:
      kind: ${{ steps.parse.outputs.kind }}
      prerelease: ${{ steps.parse.outputs.kind == 'rc' }}
      latest: ${{ steps.parse.outputs.kind == 'final' }}
    steps:
      - name: Checkout repository (full history + tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Parse + classify the tag
        id: parse
        run: go run ./cmd/release-guard parse-tag "$TAG"

  verify-tag:
    name: verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: peasant-labs/infra
          ref: cb913e71af97d6070ed80224ecc0b6cb865644eb
          path: infra-tool
          sparse-checkout: tools/release
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: infra-tool/tools/release/go.mod
          cache: false
      - name: Build release-intent
        env:
          GOWORK: "off"
        run: go build -C infra-tool/tools/release -o "${RUNNER_TEMP}/release-intent" ./cmd/release-intent
      - name: Verify the tag is on the default branch
        run: '"${RUNNER_TEMP}/release-intent" verify-tag --tag "${GITHUB_REF_NAME}" --branch "origin/${DEFAULT_BRANCH}"'

  nix-vendor-hash:
    name: assert nix vendorHash current
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout only; no release artifact is written here
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Check Nix vendor hash freshness
        run: |
          set -euo pipefail
          nix develop -c make nix-vendor-hash
          if ! git diff --quiet -- flake.nix; then
            echo "::error::flake.nix vendorHash is stale on ${GITHUB_REF_NAME}. Create the release tag from a commit that has run make nix-vendor-hash."
            git diff -- flake.nix
            exit 1
          fi

  # Contract gates on the release commit: vacuum lints the published specs, and
  # (when a prior release tag exists) oasdiff + go-apidiff diff against it. The
  # heavy breaking-change gating already ran on the PR; this is the final
  # belt-and-suspenders before publication.
  contract-gates:
    name: contract gates
    needs: [guard, nix-vendor-hash]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout only; compatibility gates read repository history
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout repository (full history + tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check out release-intent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: peasant-labs/infra
          ref: cb913e71af97d6070ed80224ecc0b6cb865644eb
          path: infra-tool
          sparse-checkout: tools/release
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: infra-tool/tools/release/go.mod
          cache: false

      - name: Build release-intent
        env:
          GOWORK: "off"
        run: go build -C infra-tool/tools/release -o "${RUNNER_TEMP}/release-intent" ./cmd/release-intent

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Determine the previous final tag
        id: prior
        env:
          FLOOR: ${{ vars.RELEASE_BATCH_FLOOR }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/release-intent" check-contract --until "${TAG}" --print-range-base --floor "${FLOOR}" | tee "${RUNNER_TEMP}/range-base.txt"
          prior="$(sed -n 's/^range_base=//p' "${RUNNER_TEMP}/range-base.txt")"
          test -n "${prior}" || { echo "::error::no prior final tag for ${TAG}; cannot establish the contract range"; exit 1; }
          echo "base_ref=${prior}" >> "$GITHUB_OUTPUT"

      - name: Build the tag contract report
        env:
          BASE: ${{ steps.prior.outputs.base_ref }}
        run: nix develop -c ./scripts/contract-gates.sh all "${BASE}" --head "${TAG}" --out "${RUNNER_TEMP}/contract-report.yaml"

      - name: Check the tag contract
        env:
          FLOOR: ${{ vars.RELEASE_BATCH_FLOOR }}
        run: '"${RUNNER_TEMP}/release-intent" check-contract --report "${RUNNER_TEMP}/contract-report.yaml" --until "${TAG}" --floor "${FLOOR}"'

  build:
    name: prepare release assets
    needs: [guard, nix-vendor-hash, contract-gates, verify-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Prepare the generated contracts and release notes
        run: |
          set -euo pipefail
          mkdir -p dist
          cp generated/*.json generated/*.yaml dist/
          awk -v tag="$TAG" -v version="${TAG#v}" '
            /^## / {
              if (found) exit
              heading=substr($0, 4)
              sub(/ - .*/, "", heading)
              if (heading == tag || heading == version || heading == "[" tag "]" || heading == "[" version "]") { found=1; next }
            }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > dist/release-notes.md
          test -s dist/release-notes.md || { echo "::error::no changelog notes for ${TAG}; fix forward with a new release"; exit 1; }
      - name: Hand the assets to the publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  release:
    name: publish GitHub Release
    needs: [guard, nix-vendor-hash, contract-gates, verify-tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release + upload assets
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist

      - name: Look for an existing release
        id: view
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY"

      - name: Create the draft release
        id: create
        if: steps.view.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.guard.outputs.kind == 'rc' }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --notes-file dist/release-notes.md --prerelease="$PRERELEASE"

      - name: Upload the release assets
        if: steps.view.outcome == 'failure' && steps.create.outcome == 'success'
        uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe # v2.4.2
        with:
          tag_name: ${{ github.ref_name }}
          repository: ${{ github.repository }}
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: true
          prerelease: ${{ needs.guard.outputs.prerelease }}

      - name: Publish the release
        if: steps.view.outcome == 'failure' && steps.create.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.guard.outputs.kind == 'rc' }}
          LATEST: ${{ needs.guard.outputs.kind == 'final' }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$PRERELEASE" --latest="$LATEST"

  # Publish the generated @peasant-labs/schema TypeScript package to npm. Sits
  # behind the SAME three gates as the GitHub Release publish job above (guard ->
  # nix-vendor-hash -> contract-gates), but is otherwise independent of it: an npm
  # publish failure here must never block the GitHub Release, and a GitHub
  # Release asset failure must never block this job. The release PR writes the
  # committed version; this job checks it against the tag and removes "private"
  # only in the CI working copy.
  #
  # Authentication is npm Trusted Publishing (OIDC) - NOT a long-lived NPM_TOKEN
  # secret. `permissions.id-token: write` lets GitHub mint a short-lived OIDC
  # token for this job, scoped to the "npm-publish" GitHub Actions environment
  # (below) that the npm Trusted Publisher registration is bound to; pnpm
  # (native OIDC trusted-publish support since the v11 publish reimplementation;
  # the package pins pnpm 11.24.0 in packageManager, and pnpm switches to it;
  # chosen over the npm CLI to stay on this repo's one package-manager
  # toolchain for install/build/test/publish) exchanges that
  # token with the npm registry itself when no registry auth token is
  # configured, so there is no secret to provision, rotate, or leak. Provenance
  # attestation is automatic with a trusted-publishing publish; no extra flag
  # needed. This requires one-time, maintainer-side registrations (the
  # "npm-publish" GitHub environment, and this repo+workflow+environment as the
  # package's Trusted Publisher on npmjs.com) documented in
  # docs/release-runbook.md, "npm publication".
  npm-publish:
    name: publish npm package
    needs: [guard, nix-vendor-hash, contract-gates, verify-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read # checkout only; no tag/commit is pushed from this job
      id-token: write # mint the OIDC token npm Trusted Publishing exchanges
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Install locked TypeScript dependencies
        run: nix develop -c pnpm --dir typescript install --frozen-lockfile --ignore-scripts

      - name: Guard tag and package version consistency
        run: |
          set -euo pipefail
          version="${TAG#v}"
          pkg_version="$(jq -r '.version' typescript/package.json)"
          test "${version}" = "${pkg_version}" || { echo "::error::tag ${TAG} does not match typescript/package.json version ${pkg_version}; tags are immutable, so fix forward"; exit 1; }

      - name: Remove the private flag in the publish working copy
        run: |
          set -euo pipefail
          nix develop -c node -e '
            const fs = require("fs");
            const pkgPath = "typescript/package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            delete pkg.private;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Run the TypeScript package gates against the staged publish manifest (typecheck, test, package:audit, package:smoke)
        run: |
          nix develop -c pnpm --dir typescript run typecheck
          nix develop -c pnpm --dir typescript test
          nix develop -c pnpm --dir typescript run package:audit
          nix develop -c pnpm --dir typescript run package:smoke

      - name: Determine the npm dist-tag from the tag kind
        id: disttag
        env:
          KIND: ${{ needs.guard.outputs.kind }}
        run: |
          set -euo pipefail
          # Dist-tag policy, keyed off the guard job's already-tested classification
          # (release-guard parse-tag -> internal/release Kind()), never re-derived
          # here: an rc prerelease publishes under `next`; a final vX.Y.Z takes
          # `latest`.
          if [ "${KIND}" = "rc" ]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @peasant-labs/schema to npm (OIDC trusted publishing)
        run: |
          set -euo pipefail
          nix develop -c pnpm --dir typescript publish --access public --no-git-checks --tag "${{ steps.disttag.outputs.tag }}"
          published_version="$(jq -r '.version' typescript/package.json)"
          echo "::notice::published @peasant-labs/schema@${published_version} to npm under dist-tag ${{ steps.disttag.outputs.tag }} via OIDC trusted publishing"
