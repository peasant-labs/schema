name: Tests

# The schema repo quality gate. Mirrors peasant's tests.yml but for a
# contract-only leaf: NO web/pnpm jobs, NO CGO=0 redact job (the leaf is pure Go,
# ships no binary). Two jobs:
#   - check          : `nix develop -c make check` — gofmt + vet + the release-
#                      workflow guard + `go test -race ./...` (which includes the
#                      leaf-audit test and the oasdiff/go-apidiff synthetic-break
#                      tests; inside the dev shell those gate binaries are present
#                      and run for real).
#   - contract-gates : the breaking-change gates vs the PR base — oasdiff (spec
#                      diff vs the prior released golden), go-apidiff (exported Go
#                      API), and vacuum (OpenAPI lint). PR-only (a base ref is
#                      required to diff against).
#
# Everything runs through the project's own nix dev shell so the toolchain (Go,
# oasdiff, go-apidiff, vacuum, actionlint, …) matches local exactly. Runs on
# GitHub-hosted ubuntu-latest (no org-specific runner dependency for a fresh
# public repo); swap in self-hosted runners if/when provisioned.
on:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "generated/**"
      - "openapi/**"
      - "Makefile"
      - "flake.nix"
      - "flake.lock"
      - ".vacuum.yaml"
      - "scripts/**"
      - "typescript/**"
      - "testcase/testdata/**"
      - "testdata/**"
      - "README.md"
      - "TESTING.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - ".github/workflows/tests.yml"
      # The release-workflow guard (make check -> release-guard check-workflow)
      # validates release.yml against the policy file, so a change to EITHER must
      # re-run this gate to catch drift.
      - ".github/workflows/release.yml"
      - ".github/release-guard.policy.yml"
  push:
    branches: [develop, main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "generated/**"
      - "openapi/**"
      - "Makefile"
      - "flake.nix"
      - "flake.lock"
      - ".vacuum.yaml"
      - "scripts/**"
      - "typescript/**"
      - "testcase/testdata/**"
      - "testdata/**"
      - "README.md"
      - "TESTING.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - ".github/workflows/tests.yml"
      # The release-workflow guard (make check -> release-guard check-workflow)
      # validates release.yml against the policy file, so a change to EITHER must
      # re-run this gate to catch drift.
      - ".github/workflows/release.yml"
      - ".github/release-guard.policy.yml"
  # Reusable entry point: release-pr.yml calls this on a release(...) PR so the
  # quality gate runs even when the release marker commit touches none of the
  # path-filtered files above. Also handy for on-demand reruns.
  workflow_call:
    inputs:
      via_release_gate:
        description: >-
          Set true by release-pr.yml when it calls this workflow as the
          authoritative release-PR gate. It lets the DIRECT pull_request run skip
          on a release(...)-titled PR (that PR's gate is this reusable call) while
          the call itself still runs, and it separates the two runs' concurrency
          groups so the direct run can never cancel the gate run.
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  # Separate the direct pull_request run from the reusable release-PR gate call
  # (via_release_gate) so the direct run, which skips on a release PR, can never
  # cancel the authoritative gate run; a normal PR still cancels its own stale
  # in-progress run (same group across pushes to the same ref).
  group: tests-${{ github.ref }}-${{ inputs.via_release_gate && 'release-gate' || 'direct' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: make check
    # Skip the DIRECT pull_request run on a release(...)-titled PR: that PR's
    # authoritative gate is the reusable call from release-pr.yml (via_release_gate),
    # so a direct run here would duplicate it (and previously collided on the shared
    # concurrency group). Normal PRs, pushes, workflow_dispatch, and the release-gate
    # call itself all still run.
    if: >-
      inputs.via_release_gate ||
      !startsWith(github.event.pull_request.title || '', 'release(')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Go build + modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: make check
        run: |
          nix develop -c pnpm --dir typescript install --frozen-lockfile --ignore-scripts
          nix develop -c make check

  contract-gates:
    name: contract gates (vs base)
    # The breaking-change gates need a base ref to diff against; only meaningful
    # on a pull request. Also skip the DIRECT run on a release(...)-titled PR (the
    # reusable release-gate call runs them instead), matching the check job.
    if: >-
      github.event_name == 'pull_request' &&
      (inputs.via_release_gate ||
      !startsWith(github.event.pull_request.title || '', 'release('))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # READ-ONLY: this workflow requests no write scope on any job, so it can be
    # called as a reusable gate by release-pr.yml (whose token ceiling is
    # pull-requests: read). The go-apidiff PR comment is posted out-of-band by the
    # write-scoped go-apidiff-comment.yml (workflow_run), fed by the artifact this
    # job uploads below.
    permissions:
      contents: read # checkout only
    steps:
      - name: Checkout repository (full history for the base diff)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Go build + modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-gates-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-gates-

      - name: Fetch the PR base ref
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Run contract gates vs base
        env:
          APIDIFF_CHANGES_FILE: ${{ runner.temp }}/apidiff-changes.txt
          APIDIFF_COMPATIBLE_FILE: ${{ runner.temp }}/apidiff-compatible.txt
        run: nix develop -c make gates BASE_REF="origin/${{ github.base_ref }}"

      # Hand the go-apidiff outcome off to the write-scoped go-apidiff-comment.yml
      # via a single artifact (this job holds no pull-requests:write). always() so
      # the payload is uploaded even when an EARLIER step failed — a failed run
      # still needs its comment reconciled.
      - name: Stage go-apidiff comment payload
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          APIDIFF_CHANGES_FILE: ${{ runner.temp }}/apidiff-changes.txt
          APIDIFF_COMPATIBLE_FILE: ${{ runner.temp }}/apidiff-compatible.txt
          STAGE_DIR: ${{ runner.temp }}/go-apidiff-comment
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p "$STAGE_DIR"
          # The commenter runs in a workflow_run event, where context.issue.number
          # is unavailable — carry the PR number in the artifact.
          printf '%s\n' "$PR_NUMBER" > "$STAGE_DIR/pr-number.txt"
          # Changes file: copy ONLY if go-apidiff actually wrote it. Its ABSENCE is
          # the "gate blind / established nothing" tri-state (distinct from an EMPTY
          # file = clean); fabricating an empty file here would masquerade as clean,
          # so the absence is preserved and the commenter reproduces the
          # not-established branch via readFileSync-catch.
          if [ -f "$APIDIFF_CHANGES_FILE" ]; then
            cp "$APIDIFF_CHANGES_FILE" "$STAGE_DIR/apidiff-changes.txt"
          fi
          # Compatible file: absent and empty are equivalent in the comment logic,
          # so normalise to an always-present (possibly empty) file for a robust
          # download.
          if [ -f "$APIDIFF_COMPATIBLE_FILE" ]; then
            cp "$APIDIFF_COMPATIBLE_FILE" "$STAGE_DIR/apidiff-compatible.txt"
          else
            : > "$STAGE_DIR/apidiff-compatible.txt"
          fi

      - name: Upload go-apidiff comment payload
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: go-apidiff-comment
          path: ${{ runner.temp }}/go-apidiff-comment
          if-no-files-found: error
          retention-days: 1
