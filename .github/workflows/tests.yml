name: Tests

# The schema repo quality gate. Mirrors peasant's tests.yml but for a
# contract-only leaf: NO web/pnpm jobs, NO CGO=0 redact job (the leaf is pure Go,
# ships no binary). Two jobs:
#   - check          : `nix develop -c make check` — gofmt + vet + the release-
#                      workflow guard + `go test -race ./...` (which includes the
#                      leaf-audit test and the oasdiff/go-apidiff synthetic-break
#                      tests; inside the dev shell those gate binaries are present
#                      and run for real).
#   - contract-gates : the breaking-change gates vs the PR base — oasdiff (spec
#                      diff vs the prior released golden), go-apidiff (exported Go
#                      API), and vacuum (OpenAPI lint). PR-only (a base ref is
#                      required to diff against).
#
# Everything runs through the project's own nix dev shell so the toolchain (Go,
# oasdiff, go-apidiff, vacuum, actionlint, …) matches local exactly. Runs on
# GitHub-hosted ubuntu-latest (no org-specific runner dependency for a fresh
# public repo); swap in self-hosted runners if/when provisioned.
on:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "generated/**"
      - "openapi/**"
      - "Makefile"
      - "flake.nix"
      - "flake.lock"
      - ".vacuum.yaml"
      - "scripts/**"
      - ".github/workflows/tests.yml"
  push:
    branches: [develop, main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "generated/**"
      - "openapi/**"
      - "Makefile"
      - "flake.nix"
      - "flake.lock"
      - ".vacuum.yaml"
      - "scripts/**"
      - ".github/workflows/tests.yml"
  # Reusable entry point: release-pr.yml calls this on a release(...) PR so the
  # quality gate runs even when the release marker commit touches none of the
  # path-filtered files above. Also handy for on-demand reruns.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Go build + modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: make check
        run: nix develop -c make check

  contract-gates:
    name: contract gates (vs base)
    # The breaking-change gates need a base ref to diff against; only meaningful
    # on a pull request.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout
      pull-requests: write # upsert the single sticky go-apidiff comment (job-scoped)
    steps:
      - name: Checkout repository (full history for the base diff)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Go build + modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-gates-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-gates-

      - name: Fetch the PR base ref
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Run contract gates vs base
        env:
          APIDIFF_CHANGES_FILE: ${{ runner.temp }}/apidiff-changes.txt
          APIDIFF_COMPATIBLE_FILE: ${{ runner.temp }}/apidiff-compatible.txt
        run: nix develop -c make gates BASE_REF="origin/${{ github.base_ref }}"

      - name: Upsert go-apidiff PR comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        env:
          APIDIFF_CHANGES_FILE: ${{ runner.temp }}/apidiff-changes.txt
          APIDIFF_COMPATIBLE_FILE: ${{ runner.temp }}/apidiff-compatible.txt
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- go-apidiff-gate -->';

            // Incompatible signal is a TRI-STATE derived from go-apidiff's OWN outcome:
            //   readFileSync throws (absent) => blind / fail-closed => established nothing
            //   present + empty              => go-apidiff CLEAN (oasdiff state irrelevant)
            //   present + non-empty          => WARN (incompatible change(s) to report)
            let established = true, changes = '';
            try { changes = fs.readFileSync(process.env.APIDIFF_CHANGES_FILE, 'utf8').trim(); }
            catch (e) { established = false; }
            let compatible = '';
            try { compatible = fs.readFileSync(process.env.APIDIFF_COMPATIBLE_FILE, 'utf8').trim(); }
            catch (e) { compatible = ''; }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            let existing = null;
            try {
              const all = await github.paginate(github.rest.issues.listComments,
                { owner, repo, issue_number, per_page: 100 });
              existing = all.find(c => c.body && c.body.includes(marker));
            } catch (e) { core.warning(`list comments failed: ${e.message}`); }

            const incompatibleSection = changes
              ? `### go-apidiff — incompatible exported-Go-API change(s) vs base\n\n`
                + `Pre-release policy: these are **warnings, not blockers** (the module is pre-1.0). `
                + `Ship a version bump when you release.\n\n\`\`\`\n${changes}\n\`\`\`\n\n`
              : '';
            const compatibleSection = compatible
              ? `### go-apidiff — compatible (non-breaking) changes vs base\n\n`
                + `Informational (additive) — no action required.\n\n\`\`\`\n${compatible}\n\`\`\`\n\n`
              : '';

            let body;
            if (!established) {
              // Fail-closed / gate blind: establish nothing; never touch a prior comment.
              core.info('go-apidiff: outcome not established (fail-closed/absent signal); leaving any prior comment untouched.');
              return;
            } else if (changes) {
              body = `${marker}\n${incompatibleSection}${compatibleSection}`.trimEnd();     // warning + BOTH sections
            } else if (compatible) {
              // Compatible-only additive delta -> informational comment (no warning, green job).
              // Settled at Plan UAT: purely-additive PRs post their own informational delta comment.
              body = `${marker}\n${compatibleSection}`.trimEnd();
            } else if (existing) {
              // Truly clean AND a prior comment exists -> flip to "no changes", REGARDLESS of oasdiff.
              body = `${marker}\n### go-apidiff — no incompatible or compatible exported-Go-API changes vs base\n\n`
                + `The previously-listed change(s) no longer apply to the latest commit on this pull request.`;
            } else {
              core.info('go-apidiff: clean and no prior comment; nothing to post.');         // silent
              return;
            }
            try {
              if (existing) { await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body }); }
              else { await github.rest.issues.createComment({ owner, repo, issue_number, body }); }
            } catch (e) {
              // Fork PRs get a read-only token: degrade gracefully, never fail the job.
              core.warning(`go-apidiff: could not upsert PR comment (likely a fork PR read-only token): ${e.message}`);
            }
