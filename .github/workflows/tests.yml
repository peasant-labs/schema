name: Tests

on:
  pull_request:
  merge_group:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    # A merge group may wait up to 20 minutes for its base's queue verdict.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      deps: ${{ steps.diff.outputs.deps }}
      release: ${{ steps.entry.outputs.release }}
      release_only: ${{ steps.inherit.outputs.release_only || 'false' }}
      inherit: ${{ steps.inherit.outputs.inherit || 'false' }}
      inherited_from: ${{ steps.inherit.outputs.inherited_from }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          repository: peasant-labs/infra
          ref: 6a15bbbd87457dacc65a4048aee16017f22dc716
          path: infra-tool
          sparse-checkout: tools/release
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          go-version-file: infra-tool/tools/release/go.mod
          cache: false
      - name: Build release-intent
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GOWORK: "off"
        run: go build -C infra-tool/tools/release -o "${RUNNER_TEMP}/release-intent" ./cmd/release-intent
      - name: Classify the merge-group entry
        id: entry
        env:
          EVENT: ${{ github.event_name }}
          GROUP_REF: ${{ github.ref }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != merge_group ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          result="$("$RUNNER_TEMP/release-intent" group-pr --ref "$GROUP_REF")"
          number="${result#pr=}"
          test -n "$number" || { echo "::error::cannot identify merge-group entry"; exit 1; }
          payload="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json author,headRefName)"
          author="$(jq -r '.author.login' <<< "$payload")"
          branch="$(jq -r '.headRefName' <<< "$payload")"
          if ! git cat-file -e "$GROUP_BASE:.github/release-intent.yaml" 2>/dev/null; then
            GROUP_BASE="$(git rev-parse HEAD)"
          fi
          kind="$("$RUNNER_TEMP/release-intent" classify --author "$author" --head-branch "$branch" --rev "$GROUP_BASE")"
          if [ "$kind" = 'kind=release' ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      # A candidate whose whole base..head change is release content (the
      # changelog and the package.json version) inherits the verdict its exact
      # base recorded in that commit's merge-queue run instead of rerunning
      # make check. A release-only candidate whose base verdict is missing,
      # pending past the wait, failed or ambiguous fails here; it never falls
      # back to the suite. A merge group may be built on a group still ahead
      # of it in the queue, so it waits for that verdict.
      - name: Inherit the base commit's queue verdict
        id: inherit
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wait=0s
          if [ "$EVENT" = merge_group ]; then wait=20m; fi
          git fetch --no-tags origin "$BASE" "$HEAD"
          "$RUNNER_TEMP/release-intent" inherit-verdict --base "$BASE" --head "$HEAD" --repo "$GITHUB_REPOSITORY" --wait "$wait"
      - name: Classify changed paths
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}
          RELEASE: ${{ steps.entry.outputs.release }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ] || [ "$RELEASE" = true ] || [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "deps=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE" "$HEAD"
          git diff --name-only -z "$BASE" "$HEAD" > "$RUNNER_TEMP/changed-paths"
          code=false
          deps=false
          while IFS= read -r -d '' file; do
            case "$file" in
              *.go|go.mod|go.sum|generated/*|openapi/*|Makefile|flake.nix|flake.lock|.unstring.yaml|.unstring-baseline.yaml|.vacuum.yaml|scripts/*|typescript/*|testdata/*|*/testdata/*|.github/workflows/*|.github/release-guard.policy.yml|.github/release-queue.policy.yml|.github/release-intent.yaml) code=true ;;
            esac
            case "$file" in
              go.mod|go.sum|flake.nix|flake.lock|Makefile|scripts/update-nix-vendor-hash.sh|.github/workflows/nix-vendor-hash.yml) deps=true ;;
            esac
          done < "$RUNNER_TEMP/changed-paths"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"

  determine-runner:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
    uses: peasant-labs/infra/.github/workflows/runner-router.yml@71e687cef7eede9a63659be98ce9adac3c563398
    with:
      fallback: '["ubuntu-latest"]'
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  # make check runs without the race detector on every event. The merge-queue
  # run adds the selective race pass over the module's only concurrency, the
  # validator schema caches. Both are skipped for a release-only candidate
  # that inherited its base's queue verdict, which already covered them.
  check:
    name: make check
    needs: [changes, determine-runner]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.inherit != 'true'
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41
      - name: make check
        run: |
          nix develop -c pnpm --dir typescript install --frozen-lockfile --ignore-scripts
          nix develop -c make check
      - name: make race-selective
        if: github.event_name == 'merge_group'
        run: nix develop -c make race-selective

  contract-gates:
    name: contract gates
    needs: determine-runner
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: peasant-labs/infra
          ref: 6a15bbbd87457dacc65a4048aee16017f22dc716
          path: infra-tool
          sparse-checkout: tools/release
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: infra-tool/tools/release/go.mod
          cache: false
      - name: Build release-intent
        env:
          GOWORK: "off"
        run: go build -C infra-tool/tools/release -o "${RUNNER_TEMP}/release-intent" ./cmd/release-intent
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41
      - name: Resolve the entry PR and its live title
        id: pr
        env:
          EVENT: ${{ github.event_name }}
          EVENT_NUMBER: ${{ github.event.pull_request.number }}
          GROUP_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number="$EVENT_NUMBER"
          if [ "$EVENT" = merge_group ]; then
            resolved="$("$RUNNER_TEMP/release-intent" group-pr --ref "$GROUP_REF")"
            number="${resolved#pr=}"
          fi
          test -n "$number" || { echo "::error::cannot resolve the entry PR"; exit 1; }
          payload="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json title,headRefOid,baseRefOid)"
          title="$(jq -r '.title' <<< "$payload")"
          head="$(jq -r '.headRefOid' <<< "$payload")"
          base="$(jq -r '.baseRefOid' <<< "$payload")"
          if [ "$EVENT" = merge_group ]; then
            git fetch --no-tags origin develop
            base="$(git rev-parse origin/develop)"
          fi
          git fetch --no-tags origin "$head" "$base"
          base="$(git merge-base "$base" "$head")"
          git checkout --detach "$head"
          {
            echo "number=$number"
            echo "base=$base"
            printf 'title=%s\n' "$title"
          } >> "$GITHUB_OUTPUT"
      - name: Build the contract report
        env:
          BASE: ${{ steps.pr.outputs.base }}
          APIDIFF_CHANGES_FILE: ${{ runner.temp }}/apidiff-changes.txt
          APIDIFF_COMPATIBLE_FILE: ${{ runner.temp }}/apidiff-compatible.txt
        run: nix develop -c ./scripts/contract-gates.sh all "$BASE" --out "${RUNNER_TEMP}/contract-report.yaml"
      - name: Check the live title against the contract
        env:
          PR_TITLE: ${{ steps.pr.outputs.title }}
        run: printf '%s' "$PR_TITLE" | "${RUNNER_TEMP}/release-intent" check-contract --report "${RUNNER_TEMP}/contract-report.yaml"
      - name: Stage go-apidiff comment payload
        if: always() && github.event_name == 'pull_request'
        env:
          APIDIFF_CHANGES_FILE: ${{ runner.temp }}/apidiff-changes.txt
          APIDIFF_COMPATIBLE_FILE: ${{ runner.temp }}/apidiff-compatible.txt
          STAGE_DIR: ${{ runner.temp }}/go-apidiff-comment
        run: |
          set -euo pipefail
          mkdir -p "$STAGE_DIR"
          if [ -f "$APIDIFF_CHANGES_FILE" ]; then cp "$APIDIFF_CHANGES_FILE" "$STAGE_DIR/apidiff-changes.txt"; fi
          if [ -f "$APIDIFF_COMPATIBLE_FILE" ]; then cp "$APIDIFF_COMPATIBLE_FILE" "$STAGE_DIR/apidiff-compatible.txt"; else : > "$STAGE_DIR/apidiff-compatible.txt"; fi
      - name: Upload go-apidiff comment payload
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-apidiff-intermediate
          path: ${{ runner.temp }}/go-apidiff-comment
          if-no-files-found: error
          retention-days: 1

  # Always publish one artifact for a PR, even when contract-gates is skipped.
  # The placeholder is not an established API-diff signal.
  apidiff-payload:
    needs: [contract-gates]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Prepare the placeholder payload
        run: |
          mkdir -p "${RUNNER_TEMP}/apidiff-payload"
          : > "${RUNNER_TEMP}/apidiff-payload/placeholder.txt"
      - name: Collect the API diff payload
        if: needs.contract-gates.result != 'skipped'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: go-apidiff-intermediate
          path: ${{ runner.temp }}/apidiff-payload
      - name: Upload the comment payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: go-apidiff-comment
          path: ${{ runner.temp }}/apidiff-payload
          if-no-files-found: error
          retention-days: 1

  vendor-hash:
    needs: changes
    if: (github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true') || needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41
      - name: Check vendor hash
        continue-on-error: ${{ needs.changes.outputs.release != 'true' }}
        run: |
          set -euo pipefail
          nix develop -c make nix-vendor-hash
          if ! git diff --quiet -- flake.nix; then
            echo "::warning::flake.nix vendorHash is stale; the hash bot will open a fix PR after merge. A release group must wait for it."
            git diff -- flake.nix
            exit 1
          fi

  merge-gate:
    name: merge-gate
    needs: [changes, determine-runner, check, contract-gates, vendor-hash]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    # The last three steps record where this run's verdict came from; exactly
    # one runs. A later release-only candidate built on this commit reads them
    # back through release-intent inherit-verdict, so an inherited verdict
    # always traces back to a run where make check ran.
    steps:
      - name: Require successful or intentionally skipped jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          CODE: ${{ needs.changes.outputs.code }}
          RELEASE: ${{ needs.changes.outputs.release }}
          RELEASE_ONLY: ${{ needs.changes.outputs.release_only }}
          INHERIT: ${{ needs.changes.outputs.inherit }}
        run: |
          set -euo pipefail
          case "$RELEASE" in true|false) ;; *) echo "::error::release classification is missing or invalid"; exit 1 ;; esac
          case "$INHERIT" in true|false) ;; *) echo "::error::verdict inheritance is missing or invalid"; exit 1 ;; esac
          jq -e --arg release "$RELEASE" 'to_entries | all(.[]; .value.result == "success" or .value.result == "skipped" or (.key == "vendor-hash" and $release == "false" and .value.result == "failure"))' <<< "$RESULTS"
          test "$(jq -r '.changes.result' <<< "$RESULTS")" = success
          if [ "$INHERIT" = true ]; then
            case "$EVENT" in pull_request|merge_group) ;; *) echo "::error::only pull_request and merge_group runs inherit a verdict"; exit 1 ;; esac
            test "$RELEASE_ONLY" = true
            test "$(jq -r '.check.result' <<< "$RESULTS")" = skipped
          elif [ "$CODE" = true ]; then
            test "$(jq -r '.check.result' <<< "$RESULTS")" = success
          fi
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ]; then
            test "$(jq -r '."contract-gates".result' <<< "$RESULTS")" = success
          fi
          if [ "$RELEASE" = true ]; then test "$(jq -r '."vendor-hash".result' <<< "$RESULTS")" = success; fi
      - name: "verdict-source: full"
        if: needs.check.result == 'success'
        run: echo "verdict-source=full" >> "$GITHUB_STEP_SUMMARY"
      - name: "verdict-source: inherited"
        if: needs.changes.outputs.inherit == 'true' && needs.check.result == 'skipped'
        env:
          INHERITED_FROM: ${{ needs.changes.outputs.inherited_from }}
        run: echo "verdict-source=inherited:${INHERITED_FROM}" >> "$GITHUB_STEP_SUMMARY"
      - name: "verdict-source: unaffected"
        if: needs.changes.outputs.inherit != 'true' && needs.check.result == 'skipped'
        run: echo "verdict-source=unaffected" >> "$GITHUB_STEP_SUMMARY"
