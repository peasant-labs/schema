# go-github seam single-response cases. The httptest server serves one canned
# body (the `response` file under testdata/github) with the given `status`, and
# the REAL production githubClient wrapper is driven against it. Only the canned
# bytes moved to fixtures — the wrapper is never mocked.
#
# method selects which wrapper call runs:
#   collaborator_permission  (input: user;   expects wantPermission [+ wantPath])
#   workflow_runs            (input: commit; expects wantRunCount + wantGreen)
#   pull_reviews             (input: pr;     expects wantReviewCount + wantApprovers)
# A non-empty wantErrContains marks an error case: the call must fail with a
# message containing every listed substring (result fields are then ignored).
#
# The multi-page pagination happy paths are NOT here — they keep their inline
# Link-header handlers (sourcing page bodies from runs-page*.json /
# reviews-page*.json) because they assert page-count + ordering behavior.
#
# --- FIXTURE PROVENANCE -------------------------------------------------------
#
# Fixtures come in two grades, and it matters which is which: a DOCUMENTED-SHAPE
# body was hand-authored from GitHub's REST docs and only proves we parse what the
# docs describe, whereas a HARVESTED body is a verbatim capture of what the API
# really returned and additionally proves the docs match reality.
#
# HARVESTED (captured 2026-07-24 from peasant-labs/schema, a public repo, with
# read-only `gh api` GETs — no mutation was performed to obtain them):
#
#   create-commit.json
#     GET /repos/peasant-labs/schema/git/commits/2b6a8d8821bb368dffa449c7e723e46c0d36b499
#     This is M2, a merge commit our own CreateCommit call minted during the live
#     bubble seed (Actions run 30078583417). Harvesting it read-only is sound
#     because `POST git/commits` and `GET git/commits/{sha}` return the SAME
#     commit-object schema — the response body a create returns is the object a
#     get returns.
#
#   update-ref-ok.json
#     GET /repos/peasant-labs/schema/git/ref/heads/develop
#     develop's reference object as our fast-forward compare-and-swap left it in
#     that same run. Same reasoning: `PATCH git/refs/{ref}` and `GET git/ref/{ref}`
#     share the reference-object schema.
#
# DOCUMENTED-SHAPE (still hand-authored — no authentic capture exists yet):
#   update-ref-not-ff.json  — the 422 non-fast-forward body. Capturing a real one
#     means LOSING a compare-and-swap race, which has never happened in
#     production. Pending a deliberate sandbox recording.
#   update-ref-other-422.json, error-*.json, get-*.json, list-tags.json,
#   runs-*.json, reviews-*.json, permission-admin.json.

cases:
  - name: collaborator permission admin (happy path)
    method: collaborator_permission
    status: 200
    response: permission-admin.json
    user: octocat
    wantPermission: admin
    wantPath: /repos/peasant-labs/schema/collaborators/octocat/permission

  - name: collaborator permission 404 fires the actionable wrap
    method: collaborator_permission
    status: 404
    response: error-not-found.json
    user: ghost
    wantErrContains:
      - "cannot read the collaborator permission"
      - "ghost"
      - "peasant-labs/schema"
      - "GH_TOKEN can read repo collaborators"

  - name: workflow runs 500 fires the actionable wrap
    method: workflow_runs
    status: 500
    response: error-server.json
    commit: deadbeef
    wantErrContains:
      - "cannot list runs of release.yml"
      - "deadbeef"
      - "peasant-labs/schema"
      - "GH_TOKEN can read Actions"

  - name: workflow runs empty is fail-safe
    method: workflow_runs
    status: 200
    response: runs-empty.json
    commit: deadbeef
    wantRunCount: 0
    wantGreen: false

  - name: workflow runs skips null element
    method: workflow_runs
    status: 200
    response: runs-null-element.json
    commit: deadbeefcafe
    wantRunCount: 1
    wantGreen: true

  - name: pull reviews 404 fires the actionable wrap
    method: pull_reviews
    status: 404
    response: error-not-found.json
    pr: 7
    wantErrContains:
      - "cannot list reviews for PR #7"
      - "peasant-labs/schema"
      - "GH_TOKEN can read pull requests"

  - name: pull reviews empty is fail-safe
    method: pull_reviews
    status: 200
    response: reviews-empty.json
    pr: 7
    wantReviewCount: 0
    wantApprovers: []

  - name: pull reviews skips null element
    method: pull_reviews
    status: 200
    response: reviews-null-element.json
    pr: 7
    wantReviewCount: 1
    wantApprovers: ["alice"]

  # --- git-data ops (SLICE-1 bubble extension) ---

  - name: ref resolves to the object sha (happy path)
    method: ref
    status: 200
    response: get-ref.json
    ref: heads/develop
    wantSHA: aa11bb22cc33dd44ee55ff66aa77bb88cc99dd00
    wantPath: /repos/peasant-labs/schema/git/ref/heads/develop

  - name: ref 404 fires the actionable wrap
    method: ref
    status: 404
    response: error-not-found.json
    ref: heads/nope
    wantErrContains:
      - "cannot resolve git ref"
      - "heads/nope"
      - "peasant-labs/schema"
      - "GH_TOKEN can read"

  - name: commit maps tree sha and parent shas (happy path)
    method: commit
    status: 200
    response: get-commit.json
    sha: cc33dd44ee55ff66aa77bb88cc99dd00aa11bb22
    wantSHA: cc33dd44ee55ff66aa77bb88cc99dd00aa11bb22
    wantTreeSHA: 5dc4ea0f11223344556677889900aabbccddeeff
    wantParents: ["aa11bb22cc33dd44ee55ff66aa77bb88cc99dd00"]
    wantMessage: "Squash merge PR #42\n\nSquashed changes."

  - name: commit 404 fires the actionable wrap
    method: commit
    status: 404
    response: error-not-found.json
    sha: deadbeef
    wantErrContains:
      - "cannot read git commit deadbeef"
      - "peasant-labs/schema"
      - "GH_TOKEN can read"

  - name: pull maps number and title (happy path)
    method: pull
    status: 200
    response: get-pull.json
    pr: 42
    wantNumber: 42
    wantTitle: Add release-guard squash-merge bubble

  - name: pull 404 fires the actionable wrap
    method: pull
    status: 404
    response: error-not-found.json
    pr: 42
    wantErrContains:
      - "cannot read pull request #42"
      - "peasant-labs/schema"
      - "GH_TOKEN can read pull requests"

  # Real body (see PROVENANCE): the M2 bubble merge our own CreateCommit minted.
  # Inputs mirror what the bubbler actually POSTed for it, so request and response
  # are a matched pair rather than an invented one.
  - name: create commit maps new sha tree and parents (happy path, real body)
    method: create_commit
    status: 201
    response: create-commit.json
    message: "Merge PR #38: ci(release-guard): manual workflow_dispatch seed trigger for bubble --boundary"
    tree: e2b98895746fb17be48ec4c12f39dead5b3eab0a
    parents:
      - 245069a38ab8d4b1e78f43c1fc24788bbd87769a
      - cb200266fec5cf07f041222002f364be3c1e85d2
    wantSHA: 2b6a8d8821bb368dffa449c7e723e46c0d36b499
    wantTreeSHA: e2b98895746fb17be48ec4c12f39dead5b3eab0a
    wantParents:
      - 245069a38ab8d4b1e78f43c1fc24788bbd87769a
      - cb200266fec5cf07f041222002f364be3c1e85d2

  - name: create commit 422 fires the actionable wrap
    method: create_commit
    status: 422
    response: update-ref-other-422.json
    message: "bubble"
    tree: badtree
    parents: ["badparent"]
    wantErrContains:
      - "cannot create git commit"
      - "badtree"
      - "peasant-labs/schema"
      - "GH_TOKEN can write"

  # Real body (see PROVENANCE): develop's ref exactly as our FF-CAS left it, so
  # newSHA is the M2 sha the successful advance actually moved develop to.
  - name: update ref fast-forward ok (happy path, real body)
    method: update_ref
    status: 200
    response: update-ref-ok.json
    ref: heads/develop
    newSHA: 2b6a8d8821bb368dffa449c7e723e46c0d36b499

  # NOTE: update-ref-not-ff.json is still a DOCUMENTED-SHAPE body, not harvested.
  # A real one requires losing a compare-and-swap race against develop, which has
  # never happened in production — there is nothing authentic to capture. It stays
  # documented-shape pending a deliberate sandbox recording (two racing ref
  # updates against a throwaway repo).
  - name: update ref 422 non-fast-forward maps to ErrNotFastForward
    method: update_ref
    status: 422
    response: update-ref-not-ff.json
    ref: heads/develop
    newSHA: 2b6a8d8821bb368dffa449c7e723e46c0d36b499
    wantNotFastForward: true

  - name: update ref 422 other reason is NOT reported as non-fast-forward
    method: update_ref
    status: 422
    response: update-ref-other-422.json
    ref: heads/develop
    newSHA: badsha
    wantErrContains:
      - "cannot update git ref"
      - "heads/develop"
      - "peasant-labs/schema"
      - "GH_TOKEN can write"

  - name: tags maps name and dereferenced commit sha (happy path)
    method: tags
    status: 200
    response: list-tags.json
    wantTags:
      - "v1.2.3=aa11bb22cc33dd44ee55ff66aa77bb88cc99dd00"
      - "v1.2.3-rc1=cc33dd44ee55ff66aa77bb88cc99dd00aa11bb22"
      - "pkg/schema/v0.2.0=99ee88ff77aa66bb55cc44dd33ee22ff11aa0099"
