cases:
  - name: exact initial final in a fresh repository proceeds
    input: {requested: v1.0.0, configured: v1.0.0, productTags: [v1.0.0]}
    expected: {}
    classification: must-pass
    provenance: {source: requirement, ref: initial-final-cli}
    mutation: {description: provides only the current exact final tag}
  - name: prior rc disables bootstrap
    input: {requested: v1.0.0, configured: v1.0.0, productTags: [v1.0.0-rc1, v1.0.0]}
    expected: {errorContains: no same-version release candidate}
    classification: must-fail
    provenance: {source: requirement, ref: no-prior-product-tags}
    mutation: {description: adds a prior product rc tag to the repository}
  - name: prior final disables bootstrap
    input: {requested: v1.0.0, configured: v1.0.0, productTags: [v0.9.0, v1.0.0]}
    expected: {errorContains: no same-version release candidate}
    classification: must-fail
    provenance: {source: requirement, ref: bootstrap-self-disable}
    mutation: {description: adds an earlier final product tag}
  - name: malformed release-like tag fails closed
    input: {requested: v1.0.0, configured: v1.0.0, productTags: [v1.0.0-rc, v1.0.0]}
    expected: {errorContains: release-like tag "v1.0.0-rc" is malformed}
    classification: must-fail
    provenance: {source: requirement, ref: malformed-release-tags}
    mutation: {description: adds a malformed v-prefixed tag}
  - name: repository tag evidence failure fails closed
    input: {requested: v1.0.0, configured: v1.0.0, productTagError: tag database unavailable}
    expected: {errorContains: cannot prove the initial-final repository is fresh}
    classification: must-fail
    provenance: {source: requirement, ref: repository-evidence-error}
    mutation: {description: replaces the product-tag result with a repository error}
  - name: configured rc is rejected at the cli boundary
    input: {requested: v1.0.0, configured: v1.0.0-rc1}
    expected: {errorContains: must name one exact final version}
    classification: must-fail
    provenance: {source: boundary, ref: exact-final-cli}
    mutation: {description: changes the configured final to an rc}
  - name: requested final differs from configured final
    input: {requested: v1.0.1, configured: v1.0.0, productTags: [v1.0.1]}
    expected: {errorContains: exact configured final v1.0.0}
    classification: must-fail
    provenance: {source: requirement, ref: exact-initial-final-cli}
    mutation: {description: changes the requested final away from the configured version}
  - name: completed configured final rejects second invocation
    input: {requested: v1.0.0, configured: v1.0.0, productTags: [v1.0.0], publicationCompleted: true}
    expected: {errorContains: already has a published repository release}
    classification: must-fail
    provenance: {source: requirement, ref: bootstrap-self-disable-cli}
    mutation: {description: changes the repository release observation from absent to published}
  - name: publication evidence failure fails closed
    input: {requested: v1.0.0, configured: v1.0.0, productTags: [v1.0.0], publicationError: releases api unavailable}
    expected: {errorContains: cannot prove whether initial final v1.0.0 already completed publication}
    classification: must-fail
    provenance: {source: requirement, ref: publication-evidence-error}
    mutation: {description: replaces the repository release lookup with an API error}
  - name: later final falls through to green ancestor rc
    input:
      requested: v1.1.0
      configured: v1.0.0
      productTags: [v1.0.0, v1.1.0-rc1, v1.1.0]
      rcTags: [v1.1.0-rc1]
      greenRC: true
      forbidPublicationLookup: true
    expected: {}
    classification: must-pass
    provenance: {source: requirement, ref: later-final-cli-fallback}
    mutation: {description: adds prior product history and a green same-version ancestor rc}
