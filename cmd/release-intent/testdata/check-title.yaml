required_names:
  - base-read-failure-is-internal
  - head-removes-protection-rejected
  - pr-behind-base-passes
  - scripts-only-after-release-passes
  - version-field-edit-rejected
  - version-field-removed-rejected
  - group-shaped-base-passes
  - ordinary-scripts-edit-accepted

cases:
  cases:
    - name: base-read-failure-is-internal
      input: {title: "feat(graph)[minor]: add facet", author: "octocat", headBranch: "feature/work", setup: "mock-base-failure"}
      expected: {exit: 1, stdout: [], absent: ["error="]}
      classification: must-fail
      sibling: ordinary-scripts-edit-accepted
      provenance: {source: requirement, ref: "a failed base config fetch exits 1 with no accept"}
      mutation: {description: "Fails the base config blob read with a non-absent error."}
    - name: head-removes-protection-rejected
      input: {title: "feat(graph)[minor]: add facet", author: "octocat", headBranch: "feature/work", setup: "protection-removed"}
      expected: {exit: 2, code: "protected-path", stdout: []}
      classification: must-fail
      sibling: ordinary-scripts-edit-accepted
      provenance: {source: requirement, ref: "base config protections apply even when the head drops them"}
      mutation: {description: "Removes the version-file protection in the head config and bumps the version."}
    - name: pr-behind-base-passes
      input: {title: "feat(graph)[minor]: add facet", author: "octocat", headBranch: "feature/work", setup: "pr-behind-base"}
      expected: {exit: 0, code: "", stdout: ["error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "a PR behind its base diffs from the merge base"}
      mutation: {description: "Lands a commit on the base after the PR branched."}
    - name: scripts-only-after-release-passes
      input: {title: "fix(scripts)[patch]: quiet lint", author: "octocat", headBranch: "feature/work", setup: "scripts-only-after-release"}
      expected: {exit: 0, code: "", stdout: ["error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "version fields compare at the merge base, not the base tip"}
      mutation: {description: "Lands a release after the PR branched, then edits only scripts."}
    - name: version-field-edit-rejected
      input: {title: "feat(graph)[minor]: add facet", author: "octocat", headBranch: "feature/work", setup: "version-field-edit"}
      expected: {exit: 2, code: "protected-path", stdout: []}
      classification: must-fail
      sibling: scripts-only-after-release-passes
      provenance: {source: requirement, ref: "a version field edit by a non-release PR is rejected"}
      mutation: {description: "Bumps the protected version field in the head."}
    - name: version-field-removed-rejected
      input: {title: "feat(graph)[minor]: add facet", author: "octocat", headBranch: "feature/work", setup: "version-field-removed"}
      expected: {exit: 2, code: "protected-path", message: "has no top-level field", stdout: []}
      classification: must-fail
      sibling: ordinary-scripts-edit-accepted
      provenance: {source: requirement, ref: "a removed protected field names the exact fault"}
      mutation: {description: "Removes the version field from the version file in the head."}
    - name: group-shaped-base-passes
      input: {title: "feat(b)[minor]: entry b", author: "octocat", headBranch: "queue-b", setup: "group-shaped-base"}
      expected: {exit: 0, code: "", stdout: ["error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "a merge-group base that is not an ancestor still diffs"}
      mutation: {description: "Diffs two divergent queue entries from their merge base."}
    - name: ordinary-scripts-edit-accepted
      input: {title: "fix(scripts)[patch]: quiet lint", author: "octocat", headBranch: "feature/work", setup: "ordinary-scripts-edit"}
      expected: {exit: 0, code: "", stdout: ["error="]}
      classification: must-pass
      provenance: {source: requirement, ref: "a scripts-only version-file edit is accepted"}
      mutation: {description: "Edits only unprotected fields of a version file."}

