required_names:
  - feat-minor-accepted
  - fix-patch-no-scope-accepted
  - refactor-no-bracket-accepted
  - author-release-patch-accepted
  - missing-bump-rejected
  - bump-on-docs-rejected
  - unknown-type-rejected
  - old-release-form-rejected
  - bang-patch-below-one-rejected
  - bang-major-below-one-rejected
  - major-without-bang-below-one-rejected
  - revert-button-malformed

cases:
  cases:
    - name: feat-minor-accepted
      input: {title: "feat(transcript)[minor]: add group facet", releases: true, belowOne: true}
      expected: {code: ""}
      classification: must-pass
      provenance: {source: requirement, ref: "plan 7.1 feat with minor releases"}
      mutation: {description: "Baseline releasing title."}
    - name: fix-patch-no-scope-accepted
      input: {title: "fix[patch]: typo in the empty state", releases: true, belowOne: true}
      expected: {code: ""}
      classification: must-pass
      provenance: {source: requirement, ref: "plan 7.1 bracket with no scope is accepted"}
      mutation: {description: "Omits the scope to prove scopes are optional."}
    - name: refactor-no-bracket-accepted
      input: {title: "refactor(store): split the reader", releases: true, belowOne: true}
      expected: {code: ""}
      classification: must-pass
      provenance: {source: requirement, ref: "plan 7.1 may-release without a bracket releases nothing"}
      mutation: {description: "Uses a may-release type with no bracket."}
    - name: author-release-patch-accepted
      input: {title: "release[patch]: publish the pending dependency updates", releases: true, belowOne: true}
      expected: {code: ""}
      classification: must-pass
      provenance: {source: requirement, ref: "plan 7.1 release is an ordinary releasing type"}
      mutation: {description: "Uses the author-usable releasing type."}
    - name: missing-bump-rejected
      input: {title: "feat(transcript): add group facet", releases: true, belowOne: true}
      expected: {code: "missing-bump"}
      classification: must-fail
      provenance: {source: requirement, ref: "plan 7.1 missing-bump"}
      mutation: {description: "Drops the bracket from a must-release type."}
    - name: bump-on-docs-rejected
      input: {title: "docs(readme)[patch]: fix a link", releases: true, belowOne: true}
      expected: {code: "bump-on-non-releasing"}
      classification: must-fail
      provenance: {source: requirement, ref: "plan 7.1 bump-on-non-releasing"}
      mutation: {description: "Puts a bracket on a never-release type."}
    - name: unknown-type-rejected
      input: {title: "wip(x): try", releases: true, belowOne: true}
      expected: {code: "unknown-type"}
      classification: must-fail
      provenance: {source: requirement, ref: "plan 7.1 unknown-type"}
      mutation: {description: "Uses a type outside the closed set."}
    - name: old-release-form-rejected
      input: {title: "release(v0.0.67): cut", releases: true, belowOne: true}
      expected: {code: "old-release-title"}
      classification: must-fail
      provenance: {source: requirement, ref: "plan 7.1 old-release-title with conversion steps"}
      mutation: {description: "Uses the old numbered release form."}
    - name: bang-patch-below-one-rejected
      input: {title: "feat(transcript)![patch]: break", releases: true, belowOne: true}
      expected: {code: "bang-bump-mismatch"}
      classification: must-fail
      provenance: {source: requirement, ref: "plan 7.1 bang-bump-mismatch below 1.0"}
      mutation: {description: "Uses ! with patch below 1.0."}
    - name: bang-major-below-one-rejected
      input: {title: "feat(types)![major]: drop the legacy turn field", releases: true, belowOne: true}
      expected: {code: "bang-bump-mismatch"}
      classification: must-fail
      provenance: {source: requirement, ref: "plan 7.1 ![major] below 1.0 is rejected"}
      mutation: {description: "Uses ! with major below 1.0."}
    - name: major-without-bang-below-one-rejected
      input: {title: "feat(transcript)[major]: big change", releases: true, belowOne: true}
      expected: {code: "bang-bump-mismatch"}
      classification: must-fail
      provenance: {source: requirement, ref: "plan 7.1 major with no bang below 1.0 is rejected"}
      mutation: {description: "Uses major with no bang below 1.0."}
    - name: revert-button-malformed
      input: {title: "Revert \"feat(x)[minor]: thing\"", releases: true, belowOne: true}
      expected: {code: "malformed"}
      classification: must-fail
      provenance: {source: requirement, ref: "plan 7.1 Revert button form is malformed"}
      mutation: {description: "Uses the Revert button title shape."}
