cases:
  - &accept_pr
    name: pr-functional-declared
    input: {event: pr, title: "fix(local-api)[patch]: change", local: functional}
    expected: {exit: 0}
    classification: must-pass
    provenance: &p {source: requirement, ref: "spec changes are judged against the live title"}
    mutation: &m {description: "Change the title, event, or surface report."}
  - name: pr-functional-nonrelease
    input: {event: pr, title: "docs(local-api): change", local: functional, sibling: pr-functional-declared}
    expected: {exit: 2, code: spec-change-needs-bump}
    classification: must-fail
    provenance: *p
    mutation: *m
  - name: pr-missing-surface
    input: {event: pr, title: "fix[patch]: change", local: functional, sibling: pr-functional-declared}
    expected: {exit: 2, code: surface-mismatch}
    classification: must-fail
    provenance: *p
    mutation: *m
