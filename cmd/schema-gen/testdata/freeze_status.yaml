cases:
  - name: clean-tree
    input: {edit: unchanged}
    expected: {surface: local-api, state: clean}
    classification: must-pass
    provenance: &p {source: requirement, ref: "computed surface state"}
    mutation: &m {description: "Change one working document."}
  - name: openapi-description-only
    input: {edit: openapi-description}
    expected: {surface: local-api, state: docs-ahead}
    classification: must-pass
    provenance: *p
    mutation: *m
  - name: openapi-new-field
    input: {edit: openapi-new-field, sibling: clean-tree}
    expected: {surface: local-api, state: ahead}
    classification: must-fail
    provenance: *p
    mutation: *m
  - name: openapi-changed-type
