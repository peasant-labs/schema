tool_pin: 7d2a604afe5b50a3dcc20df06f02e85c2a0d4027
version_guard_required:
  - matching-version
  - mismatched-version-is-refused
version_guard_cases:
  - name: matching-version
    tag: v1.2.3
    package_version: 1.2.3
    expected_exit: 0
    expected_output: ""
  - name: mismatched-version-is-refused
    tag: v1.2.3
    package_version: 1.2.4
    expected_exit: 1
    expected_output: "tag v1.2.3 does not match typescript/package.json version 1.2.4; tags are immutable, so fix forward"
existing_release_required:
  - complete-published-release
  - draft-with-assets
  - draft-without-assets
  - draft-with-invalid-assets
  - published-without-assets
  - missing-draft-state
  - invalid-assets
  - non-json-response
  - api-failure
existing_release_cases:
  - name: complete-published-release
    response: '{"isDraft":false,"assets":[{"name":"spec.json"}]}'
    expected_exit: 0
    expected_output: "existing release is published and has assets"
  - name: draft-with-assets
    response: '{"isDraft":true,"assets":[{"name":"spec.json"}]}'
    expected_exit: 1
    expected_output: 'release is an unpublished draft; list the drafts for this tag with gh api repos/$GITHUB_REPOSITORY/releases, delete each by id with gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/<id> (never gh release delete $TAG), then rerun; do not create a new tag'
  - name: draft-without-assets
    response: '{"isDraft":true,"assets":[]}'
    expected_exit: 1
    expected_output: 'release is an unpublished draft; list the drafts for this tag with gh api repos/$GITHUB_REPOSITORY/releases, delete each by id with gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/<id> (never gh release delete $TAG), then rerun; do not create a new tag'
  - name: draft-with-invalid-assets
    response: '{"isDraft":true,"assets":null}'
    expected_exit: 1
    expected_output: 'release is an unpublished draft; list the drafts for this tag with gh api repos/$GITHUB_REPOSITORY/releases, delete each by id with gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/<id> (never gh release delete $TAG), then rerun; do not create a new tag'
  - name: published-without-assets
    response: '{"isDraft":false,"assets":[]}'
    expected_exit: 1
    expected_output: "published release has no assets; tags are immutable, so fix forward with a new tag"
  - name: missing-draft-state
    response: '{"assets":[{"name":"spec.json"}]}'
    expected_exit: 1
    expected_output: "release draft status is invalid; inspect the release before retrying"
  - name: invalid-assets
    response: '{"isDraft":false,"assets":null}'
    expected_exit: 1
    expected_output: "published release assets are invalid; inspect the release before retrying"
  - name: non-json-response
    response: "not-json"
    expected_exit: 1
    expected_output: "parse error"
  - name: api-failure
    api_exit: 1
    expected_exit: 1
    expected_output: "mock API unavailable"
draft_release_required:
  - draft-with-assets
  - draft-without-assets
  - draft-with-invalid-assets
  - published-instead-of-draft
  - missing-draft-state
  - api-failure
draft_release_cases:
  - name: draft-with-assets
    response: '{"isDraft":true,"assets":[{"name":"spec.json"},{"name":"spec.yaml"}]}'
    expected_exit: 0
    expected_output: "draft holds 2 assets"
  - name: draft-without-assets
    response: '{"isDraft":true,"assets":[]}'
    expected_exit: 1
    expected_output: 'the draft is missing or has no assets and was not published; list the drafts for this tag with gh api repos/$GITHUB_REPOSITORY/releases, delete each by id with gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/<id> (never gh release delete $TAG), then rerun; no new tag is needed'
  - name: draft-with-invalid-assets
    response: '{"isDraft":true,"assets":null}'
    expected_exit: 1
    expected_output: 'the draft is missing or has no assets and was not published; list the drafts for this tag with gh api repos/$GITHUB_REPOSITORY/releases, delete each by id with gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/<id> (never gh release delete $TAG), then rerun; no new tag is needed'
  - name: published-instead-of-draft
    response: '{"isDraft":false,"assets":[{"name":"spec.json"}]}'
    expected_exit: 1
    expected_output: 'the draft is missing or has no assets and was not published; list the drafts for this tag with gh api repos/$GITHUB_REPOSITORY/releases, delete each by id with gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/<id> (never gh release delete $TAG), then rerun; no new tag is needed'
  - name: missing-draft-state
    response: '{"assets":[{"name":"spec.json"}]}'
    expected_exit: 1
    expected_output: 'the draft is missing or has no assets and was not published; list the drafts for this tag with gh api repos/$GITHUB_REPOSITORY/releases, delete each by id with gh api -X DELETE repos/$GITHUB_REPOSITORY/releases/<id> (never gh release delete $TAG), then rerun; no new tag is needed'
  - name: api-failure
    api_exit: 1
    expected_exit: 1
    expected_output: "mock API unavailable"
published_release_required:
