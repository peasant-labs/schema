tool_pin: cb913e71af97d6070ed80224ecc0b6cb865644eb
version_guard_required:
  - matching-version-with-shell-banner
  - mismatched-version-is-refused
version_guard_cases:
  - name: matching-version-with-shell-banner
    tag: v1.2.3
    package_version: 1.2.3
    expected_exit: 0
    expected_output: ""
  - name: mismatched-version-is-refused
    tag: v1.2.3
    package_version: 1.2.4
    expected_exit: 1
    expected_output: "tag v1.2.3 does not match typescript/package.json version 1.2.4; tags are immutable, so fix forward"
existing_release_required:
  - complete-published-release
  - draft-with-assets
  - draft-without-assets
  - published-without-assets
  - missing-draft-state
  - invalid-assets
  - api-failure
existing_release_cases:
  - name: complete-published-release
    response: '{"isDraft":false,"assets":[{"name":"spec.json"}]}'
    expected_exit: 0
    expected_output: "existing release is published and has assets"
  - name: draft-with-assets
    response: '{"isDraft":true,"assets":[{"name":"spec.json"}]}'
    expected_exit: 1
    expected_output: "release is incomplete; tags are immutable, so fix forward with a new tag"
  - name: draft-without-assets
    response: '{"isDraft":true,"assets":[]}'
    expected_exit: 1
    expected_output: "release is incomplete; tags are immutable, so fix forward with a new tag"
  - name: published-without-assets
    response: '{"isDraft":false,"assets":[]}'
    expected_exit: 1
    expected_output: "release is incomplete; tags are immutable, so fix forward with a new tag"
  - name: missing-draft-state
    response: '{"assets":[{"name":"spec.json"}]}'
    expected_exit: 1
    expected_output: "release is incomplete; tags are immutable, so fix forward with a new tag"
  - name: invalid-assets
    response: '{"isDraft":false,"assets":null}'
    expected_exit: 1
    expected_output: "release is incomplete; tags are immutable, so fix forward with a new tag"
  - name: api-failure
    api_exit: 1
    expected_exit: 1
    expected_output: "mock API unavailable"
prepared_tag_required:
  - release-commit-snapshot
  - branch-advances-after-plan
  - branch-advances-before-plan
  - tag-points-at-wrong-commit
  - lightweight-tag
  - unexpected-tag-ref
  - multiple-tag-refs
  - candidate-outside-plan-source
  - candidate-outside-run-branch
  - corrupt-bundle
  - invalid-candidate-sha
  - invalid-plan-source-sha
  - unavailable-plan-source
prepared_tag_cases:
  - name: release-commit-snapshot
    success: true
  - name: branch-advances-after-plan
    advance_after_plan: true
    success: true
  - name: branch-advances-before-plan
    advance_before_plan: true
    success: true
  - name: tag-points-at-wrong-commit
    tag_at_base: true
    error_contains: "prepared tag does not point at the planned release candidate"
  - name: lightweight-tag
    lightweight: true
    error_contains: "prepared release tag must be annotated"
  - name: unexpected-tag-ref
    unexpected_ref: true
    error_contains: "prepared tag bundle must contain only the planned tag"
  - name: multiple-tag-refs
    extra_ref: true
    error_contains: "prepared tag bundle must contain only the planned tag"
  - name: candidate-outside-plan-source
    source_at_base: true
    error_contains: "release candidate is not an ancestor of the plan source"
  - name: candidate-outside-run-branch
    candidate_off_branch: true
    error_contains: "release candidate is not on the default-branch run"
  - name: corrupt-bundle
    corrupt_bundle: true
    error_contains: "prepared tag bundle is invalid"
  - name: invalid-candidate-sha
    invalid_candidate: true
    error_contains: "release candidate is not a full commit SHA"
  - name: invalid-plan-source-sha
    invalid_source: true
    error_contains: "plan source is not a full commit SHA"
  - name: unavailable-plan-source
    unavailable_source: true
    error_contains: "could not fetch the recorded plan source"
merge_gate_required:
  - release-vendor-failed
  - release-vendor-skipped
  - release-vendor-success
  - content-vendor-failed
  - content-vendor-skipped
  - content-vendor-success
  - content-other-job-failed
  - unknown-release-is-refused
merge_gate_cases:
  - name: release-vendor-failed
    release: "true"
    results_json: '{"changes":{"result":"success"},"check":{"result":"success"},"contract-gates":{"result":"success"},"vendor-hash":{"result":"failure"}}'
    expected_exit: 1
  - name: release-vendor-skipped
    release: "true"
    results_json: '{"changes":{"result":"success"},"check":{"result":"success"},"contract-gates":{"result":"success"},"vendor-hash":{"result":"skipped"}}'
    expected_exit: 1
  - name: release-vendor-success
    release: "true"
    results_json: '{"changes":{"result":"success"},"check":{"result":"success"},"contract-gates":{"result":"success"},"vendor-hash":{"result":"success"}}'
    expected_exit: 0
  - name: content-vendor-failed
    release: "false"
    results_json: '{"changes":{"result":"success"},"check":{"result":"success"},"contract-gates":{"result":"success"},"vendor-hash":{"result":"failure"}}'
    expected_exit: 0
  - name: content-vendor-skipped
    release: "false"
    results_json: '{"changes":{"result":"success"},"check":{"result":"success"},"contract-gates":{"result":"success"},"vendor-hash":{"result":"skipped"}}'
    expected_exit: 0
  - name: content-vendor-success
    release: "false"
    results_json: '{"changes":{"result":"success"},"check":{"result":"success"},"contract-gates":{"result":"success"},"vendor-hash":{"result":"success"}}'
    expected_exit: 0
  - name: content-other-job-failed
    release: "false"
    results_json: '{"changes":{"result":"success"},"check":{"result":"failure"},"contract-gates":{"result":"success"},"vendor-hash":{"result":"failure"}}'
    expected_exit: 1
  - name: unknown-release-is-refused
    release: ""
    results_json: '{"changes":{"result":"success"},"check":{"result":"success"},"contract-gates":{"result":"success"},"vendor-hash":{"result":"skipped"}}'
    expected_exit: 1
pre_tag_commands:
  contract: 'release-intent check-contract --report "${RUNNER_TEMP}/candidate-report.yaml" --until "${CANDIDATE}" --floor "${FLOOR}"'
precheck:
  id: precheck
  setup_if: "steps.precheck.outputs.proceed == 'true'"
  setup_steps:
    - Check out the repository (full history and tags)
    - Check out the release-intent tool
    - Set up Go
    - Build release-intent
    - Install Nix
provenance_gates:
  candidate_output: "${{ steps.verdict.outputs.candidate }}"
  pull_requests: read
  job_conditions:
    verify: "!cancelled() && needs.plan.result == 'success' && needs.plan.outputs.proceed == 'true'"
    release: "!cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.plan.result == 'success' && needs.plan.outputs.proceed == 'true' && needs.verify.result == 'success'"
  job_needs:
    verify: [plan]
    release: [plan, verify]
publication_required: [build, release, npm-publish]
publication_needs:
  build: [guard, nix-vendor-hash, contract-gates, verify-tag]
  release: [guard, nix-vendor-hash, contract-gates, verify-tag, build]
  npm-publish: [guard, nix-vendor-hash, contract-gates, verify-tag]
provenance_candidate: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
provenance_config:
  automation_author: app/peasant-labs-releaser
  bot_branches:
    release: automation/release
provenance_examples:
  bot: &provenance-bot
    merged_at: "2026-01-01T00:00:00Z"
    merge_commit_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    head: {ref: automation/release}
    user: {login: "peasant-labs-releaser[bot]"}
provenance_required:
  - merged-bot-release
  - merged-app-author-form
  - open-pr-ignored
  - no-associated-pr
  - unmerged-pr
  - wrong-branch
  - human-author
  - wrong-merge-commit
  - multiple-merged-prs
  - multiple-prs-across-pages
  - malformed-response
  - empty-api-output
  - failed-api
  - invalid-candidate
  - wrong-config-author
provenance_cases:
  - name: merged-bot-release
    pages: [[*provenance-bot]]
    expected_exit: 0
  - name: merged-app-author-form
    pages:
      - - <<: *provenance-bot
          user: {login: app/peasant-labs-releaser}
    expected_exit: 0
  - name: open-pr-ignored
    pages:
      - - *provenance-bot
        - <<: *provenance-bot
          merged_at: null
    expected_exit: 0
  - name: no-associated-pr
    pages: [[]]
    expected_exit: 1
  - name: unmerged-pr
    pages:
      - - <<: *provenance-bot
          merged_at: null
    expected_exit: 1
  - name: wrong-branch
    pages:
      - - <<: *provenance-bot
          head: {ref: human/release}
    expected_exit: 1
  - name: human-author
    pages:
      - - <<: *provenance-bot
          user: {login: human}
          title: "release[patch]: update the changelog"
    expected_exit: 1
  - name: wrong-merge-commit
    pages:
      - - <<: *provenance-bot
          merge_commit_sha: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    expected_exit: 1
  - name: multiple-merged-prs
    pages: [[*provenance-bot, *provenance-bot]]
    expected_exit: 1
  - name: multiple-prs-across-pages
    pages:
      - [*provenance-bot]
      - - <<: *provenance-bot
          user: {login: human}
    expected_exit: 1
  - name: malformed-response
    raw_output: "not-json"
    expected_exit: 1
  - name: empty-api-output
    expected_exit: 1
  - name: failed-api
    pages: [[*provenance-bot]]
    api_exit: 1
    expected_exit: 1
  - name: invalid-candidate
    candidate: not-a-sha
    pages: [[*provenance-bot]]
    expected_exit: 1
  - name: wrong-config-author
    config:
      automation_author: app/not-the-releaser
      bot_branches: {release: automation/release}
    pages: [[*provenance-bot]]
    expected_exit: 1
cut_default_branch_if: "github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.RELEASE_BATCH_MODE == 'tag'"
cut_jobs: [prepare, cut]
required:
  - pr-and-group-live-title
  - pr-and-group-contract-report
  - release-group-requires-vendor-hash
  - vendor-hash-is-advisory-on-content-pr
  - vendor-hash-diff-is-one-line
  - pre-tag-contract-has-floor
  - tag-requires-verified-release-pr
  - tag-creation-requires-provenance
  - prepared-tag-is-snapshot-verified
  - tag-push-checks-default-branch-ancestry
  - tag-push-follows-default-branch-check
  - pending-range-has-floor
  - tag-range-has-floor
  - tag-judges-contract
  - npm-tag-matches-version
  - npm-published-version-has-no-shell-banner
  - release-checks-for-existing
  - existing-release-must-be-complete
  - release-creates-a-draft
  - release-uploads-before-publishing
  - release-publishes-after-upload
  - vendor-hash-mints-only-for-work
  - precheck-identifies-repository
  - plan-mode-and-floor-env
  - cut-commit-uses-default-branch
  - cut-pr-targets-default-branch
cases:
  - name: pr-and-group-live-title
    workflow: tests.yml
    job: contract-gates
    step: Resolve the entry PR and its live title
    run_contains: ["group-pr", "gh pr view", "git merge-base", "git checkout --detach"]
  - name: pr-and-group-contract-report
    workflow: tests.yml
    job: contract-gates
    step: Check the live title against the contract
    run_contains: ["check-contract", "--report", "PR_TITLE"]
  - name: release-group-requires-vendor-hash
    workflow: tests.yml
    job: merge-gate
    step: Require successful or intentionally skipped jobs
    run_contains: ['if [ "$RELEASE" = true ]', '."vendor-hash".result']
  - name: vendor-hash-is-advisory-on-content-pr
    workflow: tests.yml
    job: vendor-hash
    step: Check vendor hash
    continue_contains: ["needs.changes.outputs.release != 'true'"]
  - name: vendor-hash-diff-is-one-line
    workflow: nix-vendor-hash.yml
    job: prepare
    step: Compute and bundle the vendor hash
    run_contains: ["git diff --numstat", "vendorHash", "removed != 1 || added != 1", "git bundle create"]
  - name: pre-tag-contract-has-floor
    workflow: release-batch.yml
    job: plan
    step: Verify the candidate contract
    run_contains: ["check-contract", "--until", "--floor"]
    id: verify-contract
  - name: tag-requires-verified-release-pr
    workflow: release-batch.yml
    job: plan
    step: Verify the release candidate PR provenance
    id: provenance
    no_continue: true
    no_job_continue: true
    after: Plan with the contract verdict
    if_value: "!cancelled() && steps.precheck.outputs.proceed == 'true' && steps.verdict.outputs.action == 'tag'"
    env_values:
      GH_TOKEN: "${{ github.token }}"
      CANDIDATE: "${{ steps.verdict.outputs.candidate }}"
      PLAN_SOURCE: "${{ steps.plan.outputs.source }}"
    run_contains: ['git show "${PLAN_SOURCE}:.github/release-intent.yaml"', 'gh api --paginate', '/commits/${CANDIDATE}/pulls?per_page=100', 'merged_at', 'merge_commit_sha', '.head.ref', '.user.login']
  - name: tag-creation-requires-provenance
    workflow: release-batch.yml
    job: plan
    step: Make the annotated release tag
    after: Verify the release candidate PR provenance
    if_value: "!cancelled() && steps.precheck.outputs.proceed == 'true' && steps.verdict.outputs.action == 'tag' && steps.provenance.outcome == 'success'"
  - name: prepared-tag-is-snapshot-verified
    workflow: release-batch.yml
    job: verify
    step: Verify the prepared tag
    if_value: "!cancelled() && needs.plan.outputs.tag-action == 'tag'"
    no_continue: true
    no_job_continue: true
    env_values:
      TAG: "${{ needs.plan.outputs.tag }}"
      CANDIDATE: "${{ needs.plan.outputs.candidate }}"
      PLAN_SOURCE: "${{ needs.plan.outputs.plan-source }}"
    run_contains: ['git bundle verify', 'git bundle list-heads', 'refs/tags/${TAG}^{commit}', '${CANDIDATE}', '${PLAN_SOURCE}', '${GITHUB_SHA}']
    run_excludes: ["origin/develop", 'release-intent" plan', 'TIP=', FRESH_ACTION]
  - name: tag-push-checks-default-branch-ancestry
    workflow: release-batch.yml
    job: release
    step: Check the release tag is on the default branch
    after: Fetch the release tag
    if_value: "needs.plan.outputs.tag-action == 'tag'"
    no_continue: true
    no_job_continue: true
    run_contains: ['git merge-base --is-ancestor "refs/tags/${TAG}" "${GITHUB_SHA}"']
  - name: tag-push-follows-default-branch-check
    workflow: release-batch.yml
    job: release
    step: Tag the fresh release candidate
    after: Check the release tag is on the default branch
    if_value: "needs.plan.outputs.tag-action == 'tag'"
    no_continue: true
    no_job_continue: true
  - name: pending-range-has-floor
    workflow: release-batch.yml
    job: plan
    step: Check the pending range before preparing a release PR
    run_contains: ["check-contract", "--until", "--floor", "contract-gates.sh report"]
  - name: tag-range-has-floor
    workflow: release.yml
    job: contract-gates
    step: Determine the previous final tag
    run_contains: ["check-contract", "--until", "--floor", "--print-range-base"]
  - name: tag-judges-contract
    workflow: release.yml
    job: contract-gates
    step: Check the tag contract
    run_contains: ["check-contract", "--until", "--floor", "--report"]
  - name: npm-tag-matches-version
    workflow: release.yml
    job: npm-publish
    step: Guard tag and package version consistency
    run_contains: ["jq -r '.version' typescript/package.json", "${TAG#v}", '"${version}" = "${pkg_version}"']
    run_excludes: ["nix develop"]
  - name: npm-published-version-has-no-shell-banner
    workflow: release.yml
    job: npm-publish
    step: Publish @peasant-labs/schema to npm (OIDC trusted publishing)
    run_contains: ['published_version="$(jq -r ''.version'' typescript/package.json)"']
    run_excludes: ['published_version="$(nix develop']
  - name: release-checks-for-existing
    workflow: release.yml
    job: release
    step: Look for an existing release
    id: view
    continue_contains: ["true"]
    run_contains: ['gh release view "$TAG" --repo "$GITHUB_REPOSITORY"']
    run_excludes: ['--json', 'isImmutable']
    job_run_excludes: ['gh release upload', 'isImmutable']
    job_run_only:
      gh release create: Create the draft release
      gh release edit: Publish the release
  - name: existing-release-must-be-complete
    workflow: release.yml
    job: release
    step: Verify the existing release is complete
    after: Look for an existing release
    if_value: "steps.view.outcome == 'success'"
    no_continue: true
    no_job_continue: true
    env_values:
      GH_TOKEN: "${{ github.token }}"
    run_contains: ['gh release view "$TAG" --repo "$GITHUB_REPOSITORY"', '--json isDraft,assets', '--jq', 'error(', 'tags are immutable', 'fix forward with a new tag']
  - name: release-creates-a-draft
    workflow: release.yml
    job: release
    step: Create the draft release
    id: create
    after: Verify the existing release is complete
    if_value: "steps.view.outcome == 'failure'"
    env_values:
      PRERELEASE: "${{ needs.guard.outputs.kind == 'rc' }}"
    run_contains: ['gh release create "$TAG"', '--repo "$GITHUB_REPOSITORY"', '--draft', '--verify-tag', '--title "$TAG"', '--notes-file dist/release-notes.md', '--prerelease="$PRERELEASE"']
    run_excludes: ['dist/*', '--latest']
  - name: release-uploads-before-publishing
    workflow: release.yml
    job: release
    step: Upload the release assets
    uses: softprops/action-gh-release@5be0e66d93ac7ed76da52eca8bb058f665c3a5fe
    after: Create the draft release
    if_value: "steps.view.outcome == 'failure' && steps.create.outcome == 'success'"
    with_values:
      tag_name: "${{ github.ref_name }}"
      repository: "${{ github.repository }}"
      files: "dist/*"
      fail_on_unmatched_files: "true"
      overwrite_files: "true"
      draft: "true"
      prerelease: "${{ needs.guard.outputs.prerelease }}"
    with_excludes: [make_latest]
  - name: release-publishes-after-upload
    workflow: release.yml
    job: release
    step: Publish the release
    after: Upload the release assets
    if_value: "steps.view.outcome == 'failure' && steps.create.outcome == 'success'"
    env_values:
      PRERELEASE: "${{ needs.guard.outputs.kind == 'rc' }}"
      LATEST: "${{ needs.guard.outputs.kind == 'final' }}"
    run_contains: ['gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease="$PRERELEASE" --latest="$LATEST"']
  - name: vendor-hash-mints-only-for-work
    workflow: nix-vendor-hash.yml
    job: update
    step: Mint the releaser App token
    if_value: "needs.prepare.outputs.changed == 'true' || needs.prepare.outputs.number != ''"
  - name: precheck-identifies-repository
    workflow: release-batch.yml
    job: plan
    step: Check whether a scheduled run has work to do
    env_values:
      GH_REPO: "${{ github.repository }}"
  - name: plan-mode-and-floor-env
    workflow: release-batch.yml
    job: plan
    step: Plan from the branch tip
    env_values:
      MODE: "${{ vars.RELEASE_BATCH_MODE }}"
      FLOOR: "${{ vars.RELEASE_BATCH_FLOOR }}"
    run_contains: ['--mode "${MODE}"', '--floor "${FLOOR}"']
  - name: cut-commit-uses-default-branch
    workflow: cut-release.yml
    job: prepare
    step: Commit an empty release commit on the bot branch
    env_values:
      DEFAULT_BRANCH: "${{ github.event.repository.default_branch }}"
    run_contains: ['origin/${DEFAULT_BRANCH}']
    run_excludes: [origin/develop]
  - name: cut-pr-targets-default-branch
    workflow: cut-release.yml
    job: cut
    step: Open the cut-release PR
    run_contains: [gh pr create, automation/cut-release]
    run_excludes: [--base]
