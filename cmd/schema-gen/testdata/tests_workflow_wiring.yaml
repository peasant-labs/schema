# Wiring of .github/workflows/tests.yml that verdict inheritance and the
# selective race pass rely on, checked by TestTestsWorkflowWiring.
#
# verdict_markers mirrors infra's exported marker step set at the pinned
# release tool (tools/release/internal/intent/testdata/verdict_markers.yaml,
# intent.VerdictMarkerStepNames and intent.VerdictMarkersVersion). The tool
# reads these names back from a base commit's run, so a change on either side
# must bump the version and move both together at a re-pin.
verdict_markers:
  version: 1
  names:
    - "verdict-source: full"
    - "verdict-source: inherited"
    - "verdict-source: unaffected"
# The aggregator's final steps, in order, with the condition that makes
# exactly one of them run.
aggregator_job: merge-gate
aggregator_needs: [check, race]
marker_steps:
  - {name: "verdict-source: full", if: "needs.check.result == 'success' && (github.event_name != 'merge_group' || needs.race.result == 'success')"}
  - {name: "verdict-source: inherited", if: "needs.changes.outputs.inherit == 'true' && needs.check.result == 'skipped'"}
  - {name: "verdict-source: unaffected", if: "needs.changes.outputs.inherit != 'true' && needs.check.result == 'skipped'"}
marker_cases:
  - name: pull-request-full-without-race
    event: pull_request
    check: success
    race: skipped
    inherit: "false"
    expected: "verdict-source: full"
cache:
  jobs: [check, race]
  restore_action: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
  save_action: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
  path: |
    ${{ env.GOCACHE }}
    ${{ env.GOMODCACHE }}
  key: "${{ runner.os }}-${{ runner.arch }}-go-check-${{ hashFiles('flake.nix', 'flake.lock') }}-${{ hashFiles('go.sum', 'tools/redaction-categories/go.sum') }}"
  save_if: "success() && steps.cache-go.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/develop'"
  save_key: "${{ steps.cache-go.outputs.cache-primary-key }}"
# The full-suite job is skipped exactly when the verdict was inherited (or
# no code changed).
check_job: check
check_if: "needs.changes.outputs.code == 'true' && needs.changes.outputs.inherit != 'true'"
# The selective race pass runs in its own job on merge groups only, and
# nowhere else.
race_selective:
  job: race
  step: make race-selective
  if: "github.event_name == 'merge_group' && needs.changes.outputs.code == 'true' && needs.changes.outputs.inherit != 'true'"
  run: "nix develop -c sh -c 'go env GOMAXPROCS GOFLAGS GOCACHE GOMODCACHE || true; exec make race-selective'"
# The proof step: always runs, never fails softly.
inherit_step: {job: changes, id: inherit}
