cases:
  - name: sparse turn second call exact id
    input:
      detail: '{"turns":[{"index":42,"toolCalls":[{"arguments":"echo no"},{"arguments":"gh pr create","result":"https://github.com/Acme/repo/pull/17","id":"exact-id"}]}]}'
    expected:
      rows: '[{"owner":"Acme","repo":"repo","number":17,"url":"https://github.com/Acme/repo/pull/17","source":{"turnIndex":42,"toolCallIndex":1,"toolCallId":"exact-id"}}]'
    classification: must-pass
    provenance:
      source: boundary
      ref: recorded session source
    mutation:
      description: sparse turn second call exact id
  - name: empty id retained by call index
    input:
      detail: '{"turns":[{"index":42,"toolCalls":[{"arguments":"echo no","id":""},{"arguments":"gh pr create","result":"https://github.com/Acme/repo/pull/17","id":""}]}]}'
    expected:
      rows: '[{"owner":"Acme","repo":"repo","number":17,"url":"https://github.com/Acme/repo/pull/17","source":{"turnIndex":42,"toolCallIndex":1}}]'
    classification: must-pass
    provenance:
      source: boundary
      ref: recorded session source
    mutation:
      description: empty id retained by call index
  - name: casefold dedup keeps first source
    input:
      detail: '{"turns":[{"index":9,"toolCalls":[{"arguments":"gh pr create","result":"https://github.com/Acme/repo/pull/17"}]},{"index":11,"depth":1,"toolCalls":[{"arguments":"gh pr create","result":"https://github.com/acme/REPO/pull/17"}]}]}'
    expected:
      rows: '[{"owner":"Acme","repo":"repo","number":17,"url":"https://github.com/Acme/repo/pull/17","source":{"turnIndex":9,"toolCallIndex":0}}]'
    classification: must-pass
    provenance:
      source: boundary
      ref: recorded session source
    mutation:
      description: casefold dedup keeps first source
  - name: nested turn included
