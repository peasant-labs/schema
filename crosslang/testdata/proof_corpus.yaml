# Cross-language proof corpus. This one corpus is consumed byte-identically by
# both the Go side (schema/testcase LoadCorpus, in this package's test) and the
# TypeScript side (transcript-browser packages/browser, a vendored copy parsed
# with yaml). It is a minimal, self-contained corpus for a "non-empty string is
# accepted" validator: input is the string, expected is whether it should be
# accepted. The point is that both languages parse the SAME bytes into the SAME
# case shape, anchored by the committed source-hash.
cases:
  - name: a non-empty string is accepted
    input: "hello"
    expected: true
    classification: must-pass
    provenance:
      source: requirement
      ref: "the validator accepts any non-empty string"
    mutation:
      description: "a representative valid input, left unmodified"
  - name: the empty string is rejected
    input: ""
    expected: false
    classification: must-fail
    provenance:
      source: boundary
      ref: "the empty-string boundary of the non-empty rule"
    mutation:
      description: "cleared the input down to the empty string"
