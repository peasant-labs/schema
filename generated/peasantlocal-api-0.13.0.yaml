openapi: 3.1.0
info:
  description: Local web dashboard API for viewing AI agent session analytics. Includes
    REST endpoints and WebSocket channel message schemas.
  title: Peasant Local Dashboard API
  version: 0.13.0
paths:
  /api/v1/annotation-types:
    get:
      description: List all registered annotation types.
      operationId: listAnnotationTypes
      parameters:
      - description: Filter by lifecycle status (active, deprecated, etc.)
        in: query
        name: status
        schema:
          description: Filter by lifecycle status (active, deprecated, etc.)
          type: string
      - description: Filter by origin (system, user, group)
        in: query
        name: origin
        schema:
          description: Filter by origin (system, user, group)
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SchemaAnnotationTypeSummary'
                type:
                - "null"
                - array
          description: OK
      tags:
      - annotations
  /api/v1/annotations:
    get:
      description: List annotations for a session.
      operationId: listAnnotations
      parameters:
      - description: Session ID to filter annotations
        in: query
        name: session_id
        required: true
        schema:
          description: Session ID to filter annotations
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SchemaAnnotationSummary'
                type:
                - "null"
                - array
          description: OK
      tags:
      - annotations
    post:
      description: Create a new annotation.
      operationId: createAnnotation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaCreateAnnotationRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaCreateAnnotationResponse'
          description: Created
      tags:
      - annotations
  /api/v1/config/capabilities:
    get:
      description: Discover optional UI behavior enabled for this server process.
      operationId: getUICapabilities
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UICapabilitiesResponse'
          description: OK
      tags:
      - config
  /api/v1/config/mock:
    get:
      description: Get mock data configuration.
      operationId: getMockConfig
      responses:
        "200":
          content:
            application/json:
              examples:
                mocksEnabled:
                  summary: Mock data enabled for web
                  value:
                    enabled: true
                    web:
                    - dashboard
                    - sessions
                    - trends
              schema:
                $ref: '#/components/schemas/SchemaMockConfigResponse'
          description: OK
      tags:
      - config
  /api/v1/health:
    get:
      description: Health check endpoint.
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              examples:
                healthy:
                  summary: Healthy server
                  value:
                    status: ok
              schema:
                $ref: '#/components/schemas/SchemaHealthResponse'
          description: OK
      tags:
      - health
  /api/v1/map/{projectHash}:
    get:
      description: Get the full map graph for a project (optionally at a commit).
      operationId: getMapGraph
      parameters:
      - description: Optional commit SHA to build the graph at (default HEAD)
        in: query
        name: commit
        schema:
          description: Optional commit SHA to build the graph at (default HEAD)
          type: string
      - description: Opaque project hash
        in: path
        name: projectHash
        required: true
        schema:
          $ref: '#/components/schemas/SchemaProjectHash'
          description: Opaque project hash
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaMapGraphPayload'
          description: OK
      tags:
      - map
  /api/v1/map/{projectHash}/node:
    get:
      description: Get the rail panel detail for one map node.
      operationId: getMapNodeDetail
      parameters:
      - description: Repo-relative node ID
        in: query
        name: path
        required: true
        schema:
          description: Repo-relative node ID
          type: string
      - description: Opaque project hash
        in: path
        name: projectHash
        required: true
        schema:
          $ref: '#/components/schemas/SchemaProjectHash'
          description: Opaque project hash
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaMapNodeDetailPayload'
          description: OK
      tags:
      - map
  /api/v1/map/{projectHash}/tasks:
    get:
      description: List a project's tasks (reverse-chronological, cap 500).
      operationId: listProjectTasks
      parameters:
      - description: Optional file or directory filter
        in: query
        name: file
        schema:
          description: Optional file or directory filter
          type: string
      - description: Opaque project hash
        in: path
        name: projectHash
        required: true
        schema:
          $ref: '#/components/schemas/SchemaProjectHash'
          description: Opaque project hash
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaProjectTasksPayload'
          description: OK
      tags:
      - map
  /api/v1/projects/resolve:
    get:
      description: Resolve one explicit project display identity without enumerating
        sibling projects.
      operationId: resolveProject
      parameters:
      - description: Exact project display identity from a saved route
        in: query
        name: name
        required: true
        schema:
          description: Exact project display identity from a saved route
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaProjectResolutionPayload'
          description: OK
      tags:
      - map
  /api/v1/projects/summary:
    get:
      description: List per-project summary rows for the home picker (sessions, recorded
        coverage, last work, open changes).
      operationId: listProjectSummaries
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaProjectSummariesPayload'
          description: OK
      tags:
      - map
  /api/v1/review/{projectHash}:
    get:
      description: List a project's changes (open branches, then merged).
      operationId: listReviewChanges
      parameters:
      - description: Opaque project hash
        in: path
        name: projectHash
        required: true
        schema:
          $ref: '#/components/schemas/SchemaProjectHash'
          description: Opaque project hash
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaReviewListPayload'
          description: OK
      tags:
      - review
  /api/v1/review/{projectHash}/change:
    get:
      description: Get the Review detail payload for one branch.
      operationId: getChangeDetail
      parameters:
      - description: Branch name (may contain slashes)
        in: query
        name: branch
        required: true
        schema:
          description: Branch name (may contain slashes)
          type: string
      - description: Opaque project hash
        in: path
        name: projectHash
        required: true
        schema:
          $ref: '#/components/schemas/SchemaProjectHash'
          description: Opaque project hash
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaChangeDetailPayload'
          description: OK
      tags:
      - review
  /api/v1/review/{projectHash}/diff:
    get:
      description: Get the rendered per-file unified diff for one changed file of
        a branch.
      operationId: getChangeDiff
      parameters:
      - description: Branch name (may contain slashes)
        in: query
        name: branch
        required: true
        schema:
          description: Branch name (may contain slashes)
          type: string
      - description: Repo-relative file path
        in: query
        name: file
        required: true
        schema:
          description: Repo-relative file path
          type: string
      - description: Opaque project hash
        in: path
        name: projectHash
        required: true
        schema:
          $ref: '#/components/schemas/SchemaProjectHash'
          description: Opaque project hash
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaChangeDiffPayload'
          description: OK
      tags:
      - review
  /api/v1/search:
    get:
      description: Full-text search across recorded (redacted) message entries; matches
        the first ~2000 chars of each turn plus truncated tool input/output.
      operationId: searchMessages
      parameters:
      - description: Search query (min 2 chars; whitespace tokens ANDed)
        in: query
        name: q
        required: true
        schema:
          description: Search query (min 2 chars; whitespace tokens ANDed)
          type: string
      - description: Max results (default 20, capped at 50)
        in: query
        name: limit
        schema:
          description: Max results (default 20, capped at 50)
          type: integer
      - description: Set to grouped to return owner-nested helper groups
        in: query
        name: view
        schema:
          description: Set to grouped to return owner-nested helper groups
          enum:
          - grouped
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SearchPayload'
                - $ref: '#/components/schemas/SchemaLocalSessionListPayload'
          description: OK
      tags:
      - search
  /api/v1/session-groups/{groupId}/members:
    get:
      description: List authorized saved helper sessions within the originating grouped
        query scope.
      operationId: listLocalHelperGroupMembers
      parameters:
      - description: Opaque member scope from the originating grouped response
        in: query
        name: scope
        required: true
        schema:
          description: Opaque member scope from the originating grouped response
          type: string
      - description: One-based member page
        in: query
        name: page
        schema:
          description: One-based member page
          minimum: 1
          type: integer
      - description: Maximum members per page
        in: query
        name: limit
        schema:
          description: Maximum members per page
          minimum: 1
          type: integer
      - in: path
        name: groupId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaLocalHelperMembersPayload'
          description: OK
      tags:
      - sessions
  /api/v1/session-summaries:
    get:
      description: 'Get session summaries for an explicit set of session identifiers.
        This operation resolves links, so it applies NEITHER origin scope NOR selection
        scope: a session hidden from every discovery list is still returned here when
        its identifier is named. An identifier that names no session on this machine
        is omitted from the response rather than failing the batch, so a partially
        stale link still resolves the sessions that do exist.'
      operationId: getSessionSummariesByID
      parameters:
      - description: Comma-separated session IDs to resolve
        in: query
        name: ids
        required: true
        schema:
          description: Comma-separated session IDs to resolve
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaSessionsPayload'
          description: OK
      tags:
      - sessions
  /api/v1/sessions:
    get:
      description: List session summaries.
      operationId: listSessions
      parameters:
      - description: Set to grouped to return owner-nested helper groups
        in: query
        name: view
        schema:
          description: Set to grouped to return owner-nested helper groups
          enum:
          - grouped
          type: string
      responses:
        "200":
          content:
            application/json:
              examples:
                twoSessions:
                  summary: Two session summaries
                  value:
                    sessions:
                    - durationMins: 45.2
                      harness: claude-code
                      id: 99d59925-36bc-424c-a789-8be54d9702ba
                      project: myapp
                      startTime: "2024-02-28T10:00:00Z"
                      toolCallCount: 8
                      totalTokens: 23000
                      turnCount: 12
                    - durationMins: 22.7
                      harness: opencode
                      id: b2c3d4e5-6789-0abc-def1-234567890abc
                      project: another-project
                      startTime: "2024-02-28T14:30:00Z"
                      toolCallCount: 4
                      totalTokens: 11500
                      turnCount: 6
              schema:
                oneOf:
                - $ref: '#/components/schemas/SchemaSessionsPayload'
                - $ref: '#/components/schemas/SchemaLocalSessionListPayload'
          description: OK
      tags:
      - sessions
  /api/v1/sessions/{id}:
    get:
      description: Get session detail by ID.
      operationId: getSession
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              examples:
                detailedSession:
                  summary: Session with turns
                  value:
                    durationMins: 45.2
                    endTime: "2024-02-28T10:45:12Z"
                    harness: claude-code
                    id: 99d59925-36bc-424c-a789-8be54d9702ba
                    startTime: "2024-02-28T10:00:00Z"
                    tokensIn: 15000
                    tokensOut: 8000
                    toolCallCount: 1
                    totalTokens: 23000
                    turnCount: 2
                    turns:
                    - content: Add OpenAPI examples to the schema types
                      depth: 0
                      index: 0
                      role: user
                      timestamp: "2024-02-28T10:00:00Z"
                    - content: I'll add WithExamples calls to each JSONSchema method...
                      depth: 0
                      index: 1
                      role: assistant
                      timestamp: "2024-02-28T10:00:15Z"
                      toolCalls:
                      - arguments: '{"path":"pkg/schema/types.go"}'
                        id: tool_01
                        name: Read
                        result: file contents...
              schema:
                $ref: '#/components/schemas/SchemaSessionDetailReadPayload'
          description: OK
      tags:
      - sessions
  /api/v1/sessions/{id}/transcript:
    get:
      description: Get the flat additive session transcript by ID.
      operationId: getSessionTranscript
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaSessionDetailReadPayload'
          description: OK
      tags:
      - sessions
  /api/v1/shutdown:
    post:
      description: Gracefully shutdown the server (localhost only).
      operationId: postShutdown
      responses:
        "200":
          content:
            application/json:
              examples:
                shuttingDown:
                  summary: Server shutting down
                  value:
                    status: shutting_down
              schema:
                $ref: '#/components/schemas/SchemaShutdownResponse'
          description: OK
      tags:
      - lifecycle
  /api/v1/sync/sessions:
    get:
      description: List sync candidates with optional owner-nested helper groups.
      operationId: listSyncSessionsGrouped
      parameters:
      - description: Set to grouped for grouped rows
        in: query
        name: view
        schema:
          description: Set to grouped for grouped rows
          enum:
          - grouped
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/LocalSyncSessionsPayload'
                - $ref: '#/components/schemas/SchemaLocalSessionListPayload'
          description: OK
      tags:
      - sync
components:
  schemas:
    AnnotationsPayload:
      properties:
        annotations:
          items:
            $ref: '#/components/schemas/SchemaAnnotationSummary'
          type:
          - array
          - "null"
        axis:
          $ref: '#/components/schemas/SchemaAnnotationAxis'
        id:
          type: string
      required:
      - axis
      - id
      - annotations
      type: object
    BestiaryHarness:
      description: AI coding tool or development environment
      enum:
      - claude-code
      - gemini-cli
      - codex
      - opencode
      - cursor
      - antigravity
      - strike
      - pi
      examples:
      - claude-code
      - opencode
      title: Harness
      type: string
    ClientMessage:
      properties:
        channels:
          items:
            $ref: '#/components/schemas/SchemaChannelSubscription'
          type: array
        type:
          $ref: '#/components/schemas/SchemaMessageType'
      required:
      - type
      type: object
    DashboardPayload:
      properties:
        acceptanceRate:
          format: double
          type: number
        avgDurationMins:
          format: double
          type: number
        avgTurnsPerSession:
          format: double
          type: number
        harnessBreakdown:
          additionalProperties:
            type: integer
          type:
          - object
          - "null"
        totalSessions:
          type: integer
        totalTokens:
          type: integer
      required:
      - totalSessions
      - totalTokens
      - avgDurationMins
      - harnessBreakdown
      - avgTurnsPerSession
      - acceptanceRate
      type: object
    LocalSyncSessionsPayload:
      properties:
        sessions:
          items:
            $ref: '#/components/schemas/SchemaLocalSyncSummary'
          type: array
      required:
      - sessions
      type: object
    QualityPayload:
      properties:
        sessions:
          items:
            $ref: '#/components/schemas/SchemaQualitySession'
          type:
          - array
          - "null"
      required:
      - sessions
      type: object
    SchemaActivityEdge:
      properties:
        from:
          type: string
        taskCount:
          type: integer
        to:
          type: string
      required:
      - from
      - to
      - taskCount
      type: object
    SchemaActorOrigin:
      description: Closed session graph value
      enum:
      - operator
      - agent_delegate
      - harness
      - unknown
      examples:
      - operator
      - agent_delegate
      - harness
      - unknown
      title: Actor Origin
      type: string
    SchemaAnnotationAxis:
      description: Subscription dimension for annotation channels
      enum:
      - type
      - session
      - project
      examples:
      - type
      - session
      - project
      title: Annotation Axis
      type: string
    SchemaAnnotationDatatype:
      description: Storage type for annotation values (maps to SQLite STRICT column
        type)
      enum:
      - text
      - integer
      - real
      - boolean
      examples:
      - text
      - integer
      title: Annotation Datatype
      type: string
    SchemaAnnotationStatus:
      description: ISO 11179 lifecycle state of an annotation type
      enum:
      - proposed
      - active
      - deprecated
      - retired
      examples:
      - active
      - deprecated
      title: Annotation Status
      type: string
    SchemaAnnotationSummary:
      properties:
        annotatorKind:
          $ref: '#/components/schemas/SchemaAnnotatorKind'
        annotatorName:
          type: string
        confidence:
          anyOf:
          - type:
            - "null"
            - number
          - type: "null"
        contentHash:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        createdAt:
          format: int64
          type: integer
        id:
          type: string
        isPrimary:
          type: boolean
        provenance:
          anyOf:
          - $ref: '#/components/schemas/SchemaProvenance'
          - type: "null"
        reason:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        supersededBy:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        targetAnnotationId:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        targetAssociationId:
          anyOf:
          - $ref: '#/components/schemas/SchemaAssociationID'
          - type: "null"
        targetContentHash:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        targetEntryEndIndex:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        targetEntryIndex:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        targetFilePath:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        targetKind:
          $ref: '#/components/schemas/SchemaTargetKind'
        targetProjectHash:
          anyOf:
          - $ref: '#/components/schemas/SchemaProjectHash'
          - type: "null"
        targetSessionId:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        typeId:
          type: string
        typeName:
          type: string
        value:
          type: string
      required:
      - id
      - targetKind
      - isPrimary
      - annotatorKind
      - annotatorName
      - typeId
      - typeName
      - value
      - createdAt
      type: object
    SchemaAnnotationTypeSummary:
      properties:
        allowedTargetKinds:
          items:
            $ref: '#/components/schemas/SchemaTargetKind'
          type: array
        class:
          type: string
        description:
          type: string
        displayName:
          type: string
        family:
          type: string
        id:
          type: string
        lowerIsBetter:
          anyOf:
          - type:
            - "null"
            - boolean
          - type: "null"
        origin:
          $ref: '#/components/schemas/SchemaTypeOrigin'
        priorityOverride:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        scaleKind:
          $ref: '#/components/schemas/SchemaScaleKind'
        status:
          $ref: '#/components/schemas/SchemaAnnotationStatus'
        typeId:
          type: string
        valueDomain:
          $ref: '#/components/schemas/SchemaValueDomain'
        version:
          type: integer
      required:
      - typeId
      - version
      - displayName
      - family
      - class
      - valueDomain
      - status
      - origin
      type: object
    SchemaAnnotatorKind:
      description: 'Type of entity that produced an annotation: human, agent (AI model),
        or rule (automated classifier)'
      enum:
      - human
      - agent
      - rule
      examples:
      - human
      - agent
      - rule
      title: Annotator Kind
      type: string
    SchemaAssociationConclusion:
      description: 'Producer-supplied conclusion for a session-to-commit association:
        confirmed or candidate'
      enum:
      - confirmed
      - candidate
      examples:
      - confirmed
      - candidate
      title: Association Conclusion
      type: string
    SchemaAssociationEvidenceKind:
      description: Atomic observation supporting a session-to-commit association
      enum:
      - recorded_commit
      - touched_file
      - branch_membership
      - time_window
      examples:
      - recorded_commit
      - touched_file
      - branch_membership
      - time_window
      title: Association Evidence Kind
      type: string
    SchemaAssociationEvidenceObservation:
      properties:
        branchName:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        kind:
          $ref: '#/components/schemas/SchemaAssociationEvidenceKind'
        recordedCommitHash:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        touchedFilePath:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        windowEndMs:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        windowStartMs:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
      required:
      - kind
      type: object
    SchemaAssociationID:
      description: Opaque durable Peasant identifier for one session-to-commit association
      examples:
      - assoc-20260726:session-a:commit-1
      maxLength: 128
      minLength: 1
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
      title: Association ID
      type: string
    SchemaChangeBinding:
      description: Strength of the evidence connecting a recorded session to a code
        change
      enum:
      - bound
      - candidate
      examples:
      - bound
      - candidate
      title: Change Binding
      type: string
    SchemaChangeDetailPayload:
      properties:
        baseRef:
          type: string
        branch:
          type: string
        costUsd:
          anyOf:
          - type:
            - "null"
            - number
          - type: "null"
        defaultBranch:
          type: string
        files:
          items:
            $ref: '#/components/schemas/SchemaFileChange'
          type:
          - array
          - "null"
        frictions:
          items:
            $ref: '#/components/schemas/SchemaFrictionCluster'
          type:
          - array
          - "null"
        insights:
          items:
            $ref: '#/components/schemas/SchemaSessionInsight'
          type: array
        linesAdded:
          type: integer
        linesRemoved:
          type: integer
        newEdges:
          items:
            $ref: '#/components/schemas/SchemaMapEdge'
          type:
          - array
          - "null"
        newNodes:
          items:
            type: string
          type:
          - array
          - "null"
        outputTokens:
          format: int64
          type: integer
        removedEdges:
          items:
            $ref: '#/components/schemas/SchemaMapEdge'
          type:
          - array
          - "null"
        removedNodes:
          items:
            type: string
          type:
          - array
          - "null"
        slice:
          $ref: '#/components/schemas/SchemaMapSlice'
        unrecordedCommits:
          items:
