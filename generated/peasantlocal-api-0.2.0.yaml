openapi: 3.1.0
info:
  description: Local web dashboard API for viewing AI agent session analytics. Includes
    REST endpoints and WebSocket channel message schemas.
  title: Peasant Local Dashboard API
  version: 0.2.0
paths:
  /api/v1/annotation-types:
    get:
      description: List all registered annotation types.
      operationId: listAnnotationTypes
      parameters:
      - description: Filter by lifecycle status (active, deprecated, etc.)
        in: query
        name: status
        schema:
          description: Filter by lifecycle status (active, deprecated, etc.)
          type: string
      - description: Filter by origin (system, user, group)
        in: query
        name: origin
        schema:
          description: Filter by origin (system, user, group)
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SchemaAnnotationTypeSummary'
                type:
                - "null"
                - array
          description: OK
      tags:
      - annotations
  /api/v1/annotations:
    get:
      description: List annotations for a session.
      operationId: listAnnotations
      parameters:
      - description: Session ID to filter annotations
        in: query
        name: session_id
        required: true
        schema:
          description: Session ID to filter annotations
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SchemaAnnotationSummary'
                type:
                - "null"
                - array
          description: OK
      tags:
      - annotations
    post:
      description: Create a new annotation.
      operationId: createAnnotation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaCreateAnnotationRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaCreateAnnotationResponse'
          description: Created
      tags:
      - annotations
  /api/v1/config/mock:
    get:
      description: Get mock data configuration.
      operationId: getMockConfig
      responses:
        "200":
          content:
            application/json:
              examples:
                mocksEnabled:
                  summary: Mock data enabled for web
                  value:
                    enabled: true
                    web:
                    - dashboard
                    - sessions
                    - trends
              schema:
                $ref: '#/components/schemas/SchemaMockConfigResponse'
          description: OK
      tags:
      - config
  /api/v1/health:
    get:
      description: Health check endpoint.
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              examples:
                healthy:
                  summary: Healthy server
                  value:
                    status: ok
              schema:
                $ref: '#/components/schemas/SchemaHealthResponse'
          description: OK
      tags:
      - health
  /api/v1/map/{projectHash}:
    get:
      description: Get the full map graph for a project (optionally at a commit).
      operationId: getMapGraph
      parameters:
      - description: Optional commit SHA to build the graph at (default HEAD)
        in: query
        name: commit
        schema:
          description: Optional commit SHA to build the graph at (default HEAD)
          type: string
      - description: Opaque project hash
        in: path
        name: projectHash
        required: true
        schema:
          description: Opaque project hash
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaMapGraphPayload'
          description: OK
      tags:
      - map
  /api/v1/map/{projectHash}/node:
    get:
      description: Get the rail panel detail for one map node.
      operationId: getMapNodeDetail
      parameters:
      - description: Repo-relative node ID
        in: query
        name: path
        required: true
        schema:
          description: Repo-relative node ID
          type: string
      - description: Opaque project hash
        in: path
        name: projectHash
        required: true
        schema:
          description: Opaque project hash
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaMapNodeDetailPayload'
          description: OK
      tags:
      - map
  /api/v1/map/{projectHash}/tasks:
    get:
      description: List a project's tasks (reverse-chronological, cap 500).
      operationId: listProjectTasks
      parameters:
      - description: Optional file or directory filter
        in: query
        name: file
        schema:
          description: Optional file or directory filter
          type: string
      - description: Opaque project hash
        in: path
        name: projectHash
        required: true
        schema:
          description: Opaque project hash
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaProjectTasksPayload'
          description: OK
      tags:
      - map
  /api/v1/projects/summary:
    get:
      description: List per-project summary rows for the home picker (sessions, recorded
        coverage, last work, open changes).
      operationId: listProjectSummaries
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaProjectSummariesPayload'
          description: OK
      tags:
      - map
  /api/v1/review/{projectHash}:
    get:
      description: List a project's changes (open branches, then merged).
      operationId: listReviewChanges
      parameters:
      - description: Opaque project hash
        in: path
        name: projectHash
        required: true
        schema:
          description: Opaque project hash
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaReviewListPayload'
          description: OK
      tags:
      - review
  /api/v1/review/{projectHash}/change:
    get:
      description: Get the Review detail payload for one branch.
      operationId: getChangeDetail
      parameters:
      - description: Branch name (may contain slashes)
        in: query
        name: branch
        required: true
        schema:
          description: Branch name (may contain slashes)
          type: string
      - description: Opaque project hash
        in: path
        name: projectHash
        required: true
        schema:
          description: Opaque project hash
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaChangeDetailPayload'
          description: OK
      tags:
      - review
  /api/v1/review/{projectHash}/diff:
    get:
      description: Get the rendered per-file unified diff for one changed file of
        a branch.
      operationId: getChangeDiff
      parameters:
      - description: Branch name (may contain slashes)
        in: query
        name: branch
        required: true
        schema:
          description: Branch name (may contain slashes)
          type: string
      - description: Repo-relative file path
        in: query
        name: file
        required: true
        schema:
          description: Repo-relative file path
          type: string
      - description: Opaque project hash
        in: path
        name: projectHash
        required: true
        schema:
          description: Opaque project hash
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaChangeDiffPayload'
          description: OK
      tags:
      - review
  /api/v1/search:
    get:
      description: Full-text search across recorded (redacted) message entries; matches
        the first ~2000 chars of each turn plus truncated tool input/output.
      operationId: searchMessages
      parameters:
      - description: Search query (min 2 chars; whitespace tokens ANDed)
        in: query
        name: q
        required: true
        schema:
          description: Search query (min 2 chars; whitespace tokens ANDed)
          type: string
      - description: Max results (default 20, capped at 50)
        in: query
        name: limit
        schema:
          description: Max results (default 20, capped at 50)
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaSearchPayload'
          description: OK
      tags:
      - search
  /api/v1/sessions:
    get:
      description: List session summaries.
      operationId: listSessions
      responses:
        "200":
          content:
            application/json:
              examples:
                twoSessions:
                  summary: Two session summaries
                  value:
                    sessions:
                    - durationMins: 45.2
                      harness: claude-code
                      id: 99d59925-36bc-424c-a789-8be54d9702ba
                      project: myapp
                      startTime: "2024-02-28T10:00:00Z"
                      toolCallCount: 8
                      totalTokens: 23000
                      turnCount: 12
                    - durationMins: 22.7
                      harness: opencode
                      id: b2c3d4e5-6789-0abc-def1-234567890abc
                      project: another-project
                      startTime: "2024-02-28T14:30:00Z"
                      toolCallCount: 4
                      totalTokens: 11500
                      turnCount: 6
              schema:
                $ref: '#/components/schemas/SchemaSessionsPayload'
          description: OK
      tags:
      - sessions
  /api/v1/sessions/{id}:
    get:
      description: Get session detail by ID.
      operationId: getSession
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              examples:
                detailedSession:
                  summary: Session with turns
                  value:
                    durationMins: 45.2
                    endTime: "2024-02-28T10:45:12Z"
                    harness: claude-code
                    id: 99d59925-36bc-424c-a789-8be54d9702ba
                    startTime: "2024-02-28T10:00:00Z"
                    tokensIn: 15000
                    tokensOut: 8000
                    toolCallCount: 1
                    totalTokens: 23000
                    turnCount: 2
                    turns:
                    - content: Add OpenAPI examples to the schema types
                      depth: 0
                      index: 0
                      role: user
                      timestamp: "2024-02-28T10:00:00Z"
                    - content: I'll add WithExamples calls to each JSONSchema method...
                      depth: 0
                      index: 1
                      role: assistant
                      timestamp: "2024-02-28T10:00:15Z"
                      toolCalls:
                      - arguments: '{"path":"pkg/schema/types.go"}'
                        id: tool_01
                        name: Read
                        result: file contents...
              schema:
                $ref: '#/components/schemas/SchemaSessionDetailPayload'
          description: OK
      tags:
      - sessions
  /api/v1/shutdown:
    post:
      description: Gracefully shutdown the server (localhost only).
      operationId: postShutdown
      responses:
        "200":
          content:
            application/json:
              examples:
                shuttingDown:
                  summary: Server shutting down
                  value:
                    status: shutting_down
              schema:
                $ref: '#/components/schemas/SchemaShutdownResponse'
          description: OK
      tags:
      - lifecycle
components:
  schemas:
    AnnotationsPayload:
      definitions:
        SchemaAnnotationSummary:
          properties:
            annotatorKind:
              $ref: '#/components/schemas/SchemaAnnotatorKind'
            annotatorName:
              type: string
            confidence:
              type:
              - "null"
              - number
            contentHash:
              type:
              - "null"
              - string
            createdAt:
              format: int64
              type: integer
            id:
              type: string
            isPrimary:
              type: boolean
            provenance:
              $ref: '#/components/schemas/SchemaProvenance'
            reason:
              type:
              - "null"
              - string
            supersededBy:
              type:
              - "null"
              - string
            targetAnnotationId:
              type:
              - "null"
              - string
            targetEntryEndIndex:
              type:
              - "null"
              - integer
            targetEntryIndex:
              type:
              - "null"
              - integer
            targetKind:
              $ref: '#/components/schemas/SchemaTargetKind'
            targetProjectHash:
              type:
              - "null"
              - string
            targetSessionId:
              type:
              - "null"
              - string
            typeId:
              type: string
            typeName:
              type: string
            value:
              type: string
          type: object
        SchemaAnnotatorKind:
          description: 'Type of entity that produced an annotation: human, agent (AI
            model), or rule (automated classifier)'
          enum:
          - human
          - agent
          - rule
          examples:
          - human
          - agent
          - rule
          title: Annotator Kind
          type: string
        SchemaProvenance:
          properties:
            details:
              additionalProperties:
                type: string
              type: object
            function:
              type: string
            method:
              type: string
            version:
              type: string
          type: object
        SchemaTargetKind:
          description: 'What is being annotated: session-level, entry-level (turn/tool
            call), meta-annotation, or project-level'
          enum:
          - session
          - entry
          - annotation
          - project
          examples:
          - session
          - entry
          title: Target Kind
          type: string
      properties:
        annotations:
          items:
            $ref: '#/components/schemas/SchemaAnnotationSummary'
          type:
          - array
          - "null"
        axis:
          type: string
        id:
          type: string
      type: object
    BestiaryHarness:
      description: AI coding tool or development environment
      enum:
      - claude-code
      - gemini-cli
      - codex
      - opencode
      - cursor
      - antigravity
      examples:
      - claude-code
      - opencode
      title: Harness
      type: string
    ClientMessage:
      properties:
        channels:
          items:
            $ref: '#/components/schemas/SchemaChannelSubscription'
          type: array
        type:
          type: string
      type: object
    DashboardPayload:
      properties:
        acceptanceRate:
          format: double
          type: number
        avgDurationMins:
          format: double
          type: number
        avgTurnsPerSession:
          format: double
          type: number
        harnessBreakdown:
          additionalProperties:
            type: integer
          type:
          - object
          - "null"
        totalSessions:
          type: integer
        totalTokens:
          type: integer
      type: object
    QualityPayload:
      properties:
        sessions:
          items:
            $ref: '#/components/schemas/SchemaQualitySession'
          type:
          - array
          - "null"
      type: object
    SchemaActivityEdge:
      properties:
        from:
          type: string
        taskCount:
          type: integer
        to:
          type: string
      type: object
    SchemaAnnotationDatatype:
      description: Storage type for annotation values (maps to SQLite STRICT column
        type)
      enum:
      - text
      - integer
      - real
      - boolean
      examples:
      - text
      - integer
      title: Annotation Datatype
      type: string
    SchemaAnnotationStatus:
      description: ISO 11179 lifecycle state of an annotation type
      enum:
      - proposed
      - active
      - deprecated
      - retired
      examples:
      - active
      - deprecated
      title: Annotation Status
      type: string
    SchemaAnnotationSummary:
      properties:
        annotatorKind:
          $ref: '#/components/schemas/SchemaAnnotatorKind'
        annotatorName:
          type: string
        confidence:
          type:
          - "null"
          - number
        contentHash:
          type:
          - "null"
          - string
        createdAt:
          format: int64
          type: integer
        id:
          type: string
        isPrimary:
          type: boolean
        provenance:
          $ref: '#/components/schemas/SchemaProvenance'
        reason:
          type:
          - "null"
          - string
        supersededBy:
          type:
          - "null"
          - string
        targetAnnotationId:
          type:
          - "null"
          - string
        targetEntryEndIndex:
          type:
          - "null"
          - integer
        targetEntryIndex:
          type:
          - "null"
          - integer
        targetKind:
          $ref: '#/components/schemas/SchemaTargetKind'
        targetProjectHash:
          type:
          - "null"
          - string
        targetSessionId:
          type:
          - "null"
          - string
        typeId:
          type: string
        typeName:
          type: string
        value:
          type: string
      type: object
    SchemaAnnotationTypeSummary:
      properties:
        allowedTargetKinds:
          items:
            $ref: '#/components/schemas/SchemaTargetKind'
          type: array
        class:
          type: string
        description:
          type: string
        displayName:
          type: string
        family:
          type: string
        id:
          type: string
        lowerIsBetter:
          type:
          - "null"
          - boolean
        origin:
          $ref: '#/components/schemas/SchemaTypeOrigin'
        priorityOverride:
          type:
          - "null"
          - integer
        scaleKind:
          $ref: '#/components/schemas/SchemaScaleKind'
        status:
          $ref: '#/components/schemas/SchemaAnnotationStatus'
        typeId:
          type: string
        valueDomain:
          $ref: '#/components/schemas/SchemaValueDomain'
        version:
          type: integer
      type: object
    SchemaAnnotatorKind:
      description: 'Type of entity that produced an annotation: human, agent (AI model),
        or rule (automated classifier)'
      enum:
      - human
      - agent
      - rule
      examples:
      - human
      - agent
      - rule
      title: Annotator Kind
      type: string
    SchemaChangeDetailPayload:
      properties:
        baseRef:
          type: string
        branch:
          type: string
        costUsd:
          type:
          - "null"
          - number
        defaultBranch:
          type: string
        files:
          items:
            $ref: '#/components/schemas/SchemaFileChange'
          type:
          - array
          - "null"
        frictions:
          items:
            $ref: '#/components/schemas/SchemaFrictionCluster'
          type:
          - array
          - "null"
        linesAdded:
          type: integer
        linesRemoved:
          type: integer
        newEdges:
          items:
            $ref: '#/components/schemas/SchemaMapEdge'
          type:
          - array
          - "null"
        newNodes:
          items:
            type: string
          type:
          - array
          - "null"
        outputTokens:
          format: int64
          type: integer
        removedEdges:
          items:
            $ref: '#/components/schemas/SchemaMapEdge'
          type:
          - array
          - "null"
        removedNodes:
          items:
            type: string
          type:
          - array
          - "null"
        slice:
          $ref: '#/components/schemas/SchemaMapSlice'
        unrecordedCommits:
          items:
            $ref: '#/components/schemas/SchemaCommitRef'
          type:
          - array
          - "null"
        unusual:
          items:
            $ref: '#/components/schemas/SchemaUnusualSignal'
          type:
          - array
          - "null"
        violations:
          items:
            $ref: '#/components/schemas/SchemaEdgeViolation'
          type:
          - array
          - "null"
        work:
          items:
            $ref: '#/components/schemas/SchemaChangeSession'
          type:
          - array
          - "null"
      type: object
    SchemaChangeDiffPayload:
      properties:
        binary:
          type: boolean
        branch:
          type: string
        file:
          type: string
        hunks:
          items:
            $ref: '#/components/schemas/SchemaDiffHunk'
          type:
          - array
          - "null"
        oldPath:
          type:
          - "null"
          - string
        status:
          type: string
        truncated:
          type: boolean
      type: object
    SchemaChangeSession:
      properties:
        binding:
          type: string
        harness:
          type: string
        sessionId:
          type: string
        startMs:
          type:
          - "null"
          - integer
        tasks:
          items:
            $ref: '#/components/schemas/SchemaTaskSummary'
          type:
          - array
          - "null"
        title:
          type: string
      type: object
    SchemaChangeSummary:
      properties:
        aheadCount:
          type: integer
        baseHash:
          type: string
        behindCount:
          type: integer
        branch:
          type: string
        filesChanged:
          type: integer
        lastWorkMs:
          type:
          - "null"
          - integer
        mergeCommitHash:
          type: string
        merged:
          type: boolean
        mergedAtMs:
          type:
          - "null"
          - integer
        newEdges:
          type: integer
        removedEdges:
          type: integer
        reverted:
          type: boolean
        sessionCount:
          type: integer
        taskCount:
          type: integer
        tipCommitMs:
          type:
          - "null"
          - integer
        violations:
          type: integer
      type: object
    SchemaChannelSubscription:
      properties:
        axis:
          type: string
        id:
          type: string
        topic:
          type: string
      type: object
    SchemaChildSessionRef:
      properties:
        id:
          type: string
        project:
          type: string
        startTime:
          format: date-time
          type: string
      type: object
    SchemaCommitRef:
      properties:
        hasSession:
          type: boolean
        hash:
          type: string
        subject:
          type: string
        timeMs:
          type:
          - "null"
          - integer
      type: object
    SchemaCreateAnnotationRequest:
      properties:
        annotatorName:
          type: string
        confidence:
          type:
          - "null"
          - number
        isPrimary:
          type: boolean
        reason:
          type:
          - "null"
          - string
        sessionId:
          type: string
        targetAnnotationId:
          type:
          - "null"
          - string
        targetEntryEndIndex:
          type:
          - "null"
          - integer
        targetEntryIndex:
          type:
          - "null"
          - integer
        typeId:
          type: string
        value:
          type: string
      type: object
    SchemaCreateAnnotationResponse:
      properties:
        id:
          type: string
      type: object
    SchemaDayStats:
      properties:
        date:
          type: string
        sessions:
          type: integer
        tokens:
          type: integer
      type: object
    SchemaDiffHunk:
      properties:
        header:
          type: string
        lines:
          items:
            $ref: '#/components/schemas/SchemaDiffLine'
          type:
          - array
          - "null"
        newLines:
          type: integer
        newStart:
          type: integer
        oldLines:
          type: integer
        oldStart:
          type: integer
        sessionId:
          type: string
        sessionTitle:
          type: string
      type: object
    SchemaDiffLine:
      properties:
        kind:
          type: string
        text:
          type: string
      type: object
    SchemaEdgeViolation:
      properties:
        from:
          type: string
        kind:
          type: string
        to:
          type: string
      type: object
    SchemaEntryType:
      description: Classification of a single entry within an agent session transcript
      enum:
      - text
      - tool_use
      - tool_result
      - thinking
      - system
      - error
      - result
      examples:
      - text
      - tool_use
      - tool_result
      title: Entry Type
      type: string
    SchemaFileChange:
      properties:
        linesAdded:
          type: integer
        linesRemoved:
          type: integer
        oldPath:
          type:
          - "null"
          - string
        path:
          type: string
        status:
          type: string
      type: object
    SchemaFrictionCluster:
      properties:
        count:
          type: integer
        file:
          type: string
        kind:
          type: string
        label:
          type: string
        sessions:
          type: integer
      type: object
    SchemaHealthResponse:
      properties:
        status:
          type: string
      type: object
    SchemaMapEdge:
      properties:
        count:
          type: integer
        from:
          type: string
        to:
          type: string
      type: object
    SchemaMapGraphPayload:
      properties:
        activityEdges:
          items:
            $ref: '#/components/schemas/SchemaActivityEdge'
          type:
          - array
          - "null"
        atCommit:
          type: string
        generatedAtMs:
          format: int64
          type: integer
        nodes:
          items:
            $ref: '#/components/schemas/SchemaMapNode'
          type:
          - array
          - "null"
        parsedLanguages:
          items:
            type: string
          type:
          - array
          - "null"
        projectHash:
          type: string
        repoFound:
          type: boolean
        repoPath:
          type: string
        structureEdges:
          items:
            $ref: '#/components/schemas/SchemaMapEdge'
          type:
          - array
          - "null"
        violations:
          items:
            $ref: '#/components/schemas/SchemaEdgeViolation'
          type:
          - array
          - "null"
      type: object
    SchemaMapNode:
      properties:
        effortDensity:
          format: double
          type: number
        fileCount:
          type: integer
        id:
          type: string
        kind:
          type: string
        language:
          type: string
        layer:
          type: integer
        loc:
          type: integer
        name:
          type: string
        order:
          type: integer
        parent:
          type: string
        recordedFiles:
          type: integer
        totalFiles:
