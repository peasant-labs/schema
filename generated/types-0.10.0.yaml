openapi: 3.1.0
info:
  description: Shared domain type catalog for Peasant APIs. No operations; register
    these components for SDK code generation and cross-API type sharing.
  title: Peasant Types
  version: 0.10.0
components:
  schemas:
    ActivityEdge:
      properties:
        from:
          type: string
        taskCount:
          type: integer
        to:
          type: string
      required:
      - from
      - to
      - taskCount
      type: object
    AnnotationAxis:
      description: Subscription dimension for annotation channels
      enum:
      - type
      - session
      - project
      examples:
      - type
      - session
      - project
      title: Annotation Axis
      type: string
    AnnotationDatatype:
      description: Storage type for annotation values (maps to SQLite STRICT column
        type)
      enum:
      - text
      - integer
      - real
      - boolean
      examples:
      - text
      - integer
      title: Annotation Datatype
      type: string
    AnnotationEntryTarget:
      properties:
        endIndex:
          type: integer
        entryIndex:
          type: integer
        sessionId:
          minLength: 1
          type: string
      required:
      - sessionId
      - entryIndex
      - endIndex
      type: object
    AnnotationManifestResponse:
      properties:
        digest:
          description: Deterministic, order-independent digest over the hash set;
            a client computing the same digest over its local set knows nothing diverged.
          type: string
        hashes:
          description: Hex-encoded SHA3-256 annotation content-hashes the village
            holds for the owner (sorted, de-duplicated).
          items:
            type: string
          type: array
      required:
      - hashes
      - digest
      type: object
    AnnotationPushItem:
      oneOf:
      - not:
          anyOf:
          - properties:
              sessionId:
                not:
                  type: "null"
            required:
            - sessionId
          - properties:
              entryTarget:
                not:
                  type: "null"
            required:
            - entryTarget
          - properties:
              annotationId:
                not:
                  type: "null"
            required:
            - annotationId
          - properties:
              projectHash:
                not:
                  type: "null"
            required:
            - projectHash
        properties:
          targetAssociationId:
            $ref: '#/components/schemas/AssociationID'
          targetKind:
            const: association
        required:
        - targetKind
        - targetAssociationId
      - not:
          anyOf:
          - properties:
              targetAssociationId:
                not:
                  type: "null"
            required:
            - targetAssociationId
          - properties:
              entryTarget:
                not:
                  type: "null"
            required:
            - entryTarget
          - properties:
              annotationId:
                not:
                  type: "null"
            required:
            - annotationId
          - properties:
              projectHash:
                not:
                  type: "null"
            required:
            - projectHash
        properties:
          sessionId:
            minLength: 1
            type: string
          targetKind:
            const: session
        required:
        - targetKind
        - sessionId
      - not:
          anyOf:
          - properties:
              targetAssociationId:
                not:
                  type: "null"
            required:
            - targetAssociationId
          - properties:
              sessionId:
                not:
                  type: "null"
            required:
            - sessionId
          - properties:
              annotationId:
                not:
                  type: "null"
            required:
            - annotationId
          - properties:
              projectHash:
                not:
                  type: "null"
            required:
            - projectHash
        properties:
          entryTarget:
            $ref: '#/components/schemas/AnnotationEntryTarget'
          targetKind:
            const: entry
        required:
        - targetKind
        - entryTarget
      - not:
          anyOf:
          - properties:
              targetAssociationId:
                not:
                  type: "null"
            required:
            - targetAssociationId
          - properties:
              sessionId:
                not:
                  type: "null"
            required:
            - sessionId
          - properties:
              entryTarget:
                not:
                  type: "null"
            required:
            - entryTarget
          - properties:
              projectHash:
                not:
                  type: "null"
            required:
            - projectHash
        properties:
          annotationId:
            minLength: 1
            type: string
          targetKind:
            const: annotation
        required:
        - targetKind
        - annotationId
      - not:
          anyOf:
          - properties:
              targetAssociationId:
                not:
                  type: "null"
            required:
            - targetAssociationId
          - properties:
              sessionId:
                not:
                  type: "null"
            required:
            - sessionId
          - properties:
              entryTarget:
                not:
                  type: "null"
            required:
            - entryTarget
          - properties:
              annotationId:
                not:
                  type: "null"
            required:
            - annotationId
        properties:
          projectHash:
            $ref: '#/components/schemas/ProjectHash'
          targetKind:
            const: project
        required:
        - targetKind
        - projectHash
      properties:
        annotationId:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        annotatorName:
          type: string
        confidence:
          anyOf:
          - type:
            - "null"
            - number
          - type: "null"
        contentHash:
          type: string
        entryTarget:
          anyOf:
          - $ref: '#/components/schemas/AnnotationEntryTarget'
          - type: "null"
        isPrimary:
          type: boolean
        projectHash:
          anyOf:
          - $ref: '#/components/schemas/ProjectHash'
          - type: "null"
        provenance:
          anyOf:
          - $ref: '#/components/schemas/Provenance'
          - type: "null"
        reason:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        sessionId:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        targetAssociationId:
          anyOf:
          - $ref: '#/components/schemas/AssociationID'
          - type: "null"
        targetKind:
          $ref: '#/components/schemas/TargetKind'
        typeId:
          type: string
        value:
          type: string
      required:
      - contentHash
      - targetKind
      - typeId
      - value
      - isPrimary
      type: object
    AnnotationPushRequest:
      properties:
        annotations:
          items:
            $ref: '#/components/schemas/AnnotationPushItem'
          type: array
        retractions:
          items:
            type: string
          type: array
      required:
      - annotations
      type: object
    AnnotationPushResponse:
      properties:
        created:
          type: integer
        errors:
          type: integer
        results:
          items:
            $ref: '#/components/schemas/AnnotationPushResult'
          type: array
        skipped:
          type: integer
        updated:
          type: integer
      required:
      - created
      - updated
      - skipped
      - errors
      type: object
    AnnotationPushResult:
      properties:
        contentHash:
          type: string
        error:
          type: string
        status:
          $ref: '#/components/schemas/AnnotationPushStatus'
      required:
      - status
      type: object
    AnnotationPushStatus:
      description: Per-item annotation push outcome
      enum:
      - created
      - updated
      - skipped
      - error
      examples:
      - created
      - updated
      - skipped
      - error
      title: Annotation Push Status
      type: string
    AnnotationStatus:
      description: ISO 11179 lifecycle state of an annotation type
      enum:
      - proposed
      - active
      - deprecated
      - retired
      examples:
      - active
      - deprecated
      title: Annotation Status
      type: string
    AnnotationSummary:
      properties:
        annotatorKind:
          $ref: '#/components/schemas/AnnotatorKind'
        annotatorName:
          type: string
        confidence:
          anyOf:
          - type:
            - "null"
            - number
          - type: "null"
        contentHash:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        createdAt:
          format: int64
          type: integer
        id:
          type: string
        isPrimary:
          type: boolean
        provenance:
          anyOf:
          - $ref: '#/components/schemas/Provenance'
          - type: "null"
        reason:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        supersededBy:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        targetAnnotationId:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        targetAssociationId:
          anyOf:
          - $ref: '#/components/schemas/AssociationID'
          - type: "null"
        targetContentHash:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        targetEntryEndIndex:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        targetEntryIndex:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        targetFilePath:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        targetKind:
          $ref: '#/components/schemas/TargetKind'
        targetProjectHash:
          anyOf:
          - $ref: '#/components/schemas/ProjectHash'
          - type: "null"
        targetSessionId:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        typeId:
          type: string
        typeName:
          type: string
        value:
          type: string
      required:
      - id
      - targetKind
      - isPrimary
      - annotatorKind
      - annotatorName
      - typeId
      - typeName
      - value
      - createdAt
      type: object
    AnnotationTypeSummary:
      properties:
        allowedTargetKinds:
          items:
            $ref: '#/components/schemas/TargetKind'
          type: array
        class:
          type: string
        description:
          type: string
        displayName:
          type: string
        family:
          type: string
        id:
          type: string
        lowerIsBetter:
          anyOf:
          - type:
            - "null"
            - boolean
          - type: "null"
        origin:
          $ref: '#/components/schemas/TypeOrigin'
        priorityOverride:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        scaleKind:
          $ref: '#/components/schemas/ScaleKind'
        status:
          $ref: '#/components/schemas/AnnotationStatus'
        typeId:
          type: string
        valueDomain:
          $ref: '#/components/schemas/ValueDomain'
        version:
          type: integer
      required:
      - typeId
      - version
      - displayName
      - family
      - class
      - valueDomain
      - status
      - origin
      type: object
    AnnotationsPayload:
      properties:
        annotations:
          items:
            $ref: '#/components/schemas/AnnotationSummary'
          type:
          - array
          - "null"
        axis:
          $ref: '#/components/schemas/AnnotationAxis'
        id:
          type: string
      required:
      - axis
      - id
      - annotations
      type: object
    AnnotatorKind:
      description: 'Type of entity that produced an annotation: human, agent (AI model),
        or rule (automated classifier)'
      enum:
      - human
      - agent
      - rule
      examples:
      - human
      - agent
      - rule
      title: Annotator Kind
      type: string
    AnnotatorSummary:
      properties:
        description:
          type: string
        displayName:
          type: string
        id:
          type: string
        kind:
          $ref: '#/components/schemas/AnnotatorKind'
        modelId:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        name:
          type: string
        providerKey:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        status:
          type: string
      required:
      - id
      - kind
      - name
      - displayName
      - status
      type: object
    AssociationConclusion:
      description: 'Producer-supplied conclusion for a session-to-commit association:
        confirmed or candidate'
      enum:
      - confirmed
      - candidate
      examples:
      - confirmed
      - candidate
      title: Association Conclusion
      type: string
    AssociationEvidenceKind:
      description: Atomic observation supporting a session-to-commit association
      enum:
      - recorded_commit
      - touched_file
      - branch_membership
      - time_window
      examples:
      - recorded_commit
      - touched_file
      - branch_membership
      - time_window
      title: Association Evidence Kind
      type: string
    AssociationEvidenceObservation:
      properties:
        branchName:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        kind:
          $ref: '#/components/schemas/AssociationEvidenceKind'
        recordedCommitHash:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        touchedFilePath:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        windowEndMs:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        windowStartMs:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
      required:
      - kind
      type: object
    AssociationID:
      description: Opaque durable Peasant identifier for one session-to-commit association
      examples:
      - assoc-20260726:session-a:commit-1
      maxLength: 128
      minLength: 1
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
      title: Association ID
      type: string
    AuthoritativeCommitInfo:
      additionalProperties: false
      properties:
        authorEmail:
          type: string
        authorName:
          type: string
        authorTime:
          format: int64
          type: integer
        commitTime:
          format: int64
          type: integer
        hash:
          type: string
        message:
          type: string
      required:
      - hash
      - message
      - authorName
      - authorEmail
      - commitTime
      - authorTime
      type: object
    AuthoritativeDiagnosticEntry:
      additionalProperties: false
      properties:
        errorType:
          type: string
        location:
          type: string
        message:
          type: string
        remediation:
          type: string
      required:
      - errorType
      - location
      - message
      - remediation
      type: object
    AuthoritativeDiagnosticsInfo:
      additionalProperties: false
      properties:
        partial:
          anyOf:
          - type:
            - "null"
            - boolean
          - type: "null"
        warnings:
          items:
            $ref: '#/components/schemas/AuthoritativeDiagnosticEntry'
          type: array
      required:
      - warnings
      type: object
    AuthoritativeGitContext:
      additionalProperties: false
      properties:
        associations:
          items:
            $ref: '#/components/schemas/PublishedAssociation'
          type: array
        branch:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        commits:
          items:
            $ref: '#/components/schemas/AuthoritativeCommitInfo'
          type: array
        remote:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        tracking:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        worktree:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
      type: object
    AuthoritativeModelInfo:
      additionalProperties: false
      properties:
        harness:
          $ref: '#/components/schemas/Harness'
        hostSlug:
          $ref: '#/components/schemas/HostSlug'
        model:
          $ref: '#/components/schemas/ModelID'
        version:
          type: string
      required:
      - harness
      - model
      type: object
    AuthoritativeProjectContext:
      additionalProperties: false
      properties:
        filePath:
          type: string
        hash:
          $ref: '#/components/schemas/ProjectHash'
        name:
          type: string
      required:
      - hash
      - name
      type: object
    AuthoritativePublishRequest:
      additionalProperties: false
      properties:
        contentHash:
          $ref: '#/components/schemas/TranscriptContentHash'
        diagnostics:
          $ref: '#/components/schemas/AuthoritativeDiagnosticsInfo'
        entries:
          items:
            $ref: '#/components/schemas/AuthoritativeSessionEntry'
          type: array
        git:
          $ref: '#/components/schemas/AuthoritativeGitContext'
        identity:
          $ref: '#/components/schemas/AuthoritativeSessionIdentity'
        license:
          $ref: '#/components/schemas/License'
        model:
          $ref: '#/components/schemas/AuthoritativeModelInfo'
        project:
          $ref: '#/components/schemas/AuthoritativeProjectContext'
        quality:
          $ref: '#/components/schemas/AuthoritativeQualityMetrics'
        source:
          $ref: '#/components/schemas/AuthoritativeSourceInfo'
        stats:
          $ref: '#/components/schemas/AuthoritativeSessionStats'
        subagents:
          items:
            $ref: '#/components/schemas/AuthoritativeSubagentRef'
          type: array
        timestamp:
          $ref: '#/components/schemas/AuthoritativeTimestampInfo'
        visibilityIntent:
          $ref: '#/components/schemas/VisibilityIntent'
      required:
      - model
      - contentHash
      type: object
    AuthoritativePublishResponse:
      additionalProperties: false
      properties:
        applied:
          $ref: '#/components/schemas/PublishAppliedState'
        blobKey:
          type: string
        blobSizeBytes:
          format: int64
          type: integer
        contentHash:
          $ref: '#/components/schemas/TranscriptContentHash'
        created:
          type: boolean
        publishedAt:
          format: int64
          type: integer
        requestOperationFingerprint:
          $ref: '#/components/schemas/PublishRequestFingerprint'
        transcriptId:
          $ref: '#/components/schemas/TranscriptID'
        transcriptUrl:
          type: string
        updatedAt:
          format: int64
          type: integer
        visibility:
          $ref: '#/components/schemas/Visibility'
      required:
      - transcriptId
      - transcriptUrl
      - visibility
      - contentHash
      - requestOperationFingerprint
      - applied
      - blobKey
      - blobSizeBytes
      - publishedAt
      - updatedAt
      - created
      type: object
    AuthoritativeQualityMetrics:
      additionalProperties: false
      properties:
        computeVersion:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        computedAt:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        costCacheReadUsd:
          anyOf:
          - type:
            - "null"
            - number
          - type: "null"
        costCacheWriteUsd:
          anyOf:
          - type:
            - "null"
            - number
          - type: "null"
        costInputUsd:
          anyOf:
          - type:
            - "null"
            - number
          - type: "null"
        costModelId:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        costOutputUsd:
          anyOf:
          - type:
            - "null"
            - number
          - type: "null"
        costReasoningUsd:
          anyOf:
          - type:
            - "null"
            - number
          - type: "null"
        costTotalUsd:
          anyOf:
          - type:
            - "null"
            - number
          - type: "null"
        discoveryTurns:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        durationMinutes:
          anyOf:
          - type:
            - "null"
            - number
          - type: "null"
        explorationRatio:
          anyOf:
          - type:
            - "null"
            - number
          - type: "null"
        filesTouched:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        inputTokens:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        linesChanged:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        m2TokenOutcomeRatio:
          anyOf:
          - type:
            - "null"
            - number
          - type: "null"
        m3UniqueToolCount:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        m4ConsecutiveErrorMax:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        m4ErrorRecoveryCount:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        m5AvgMessageTokens:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        m5ContextUtilizationPct:
          anyOf:
          - type:
            - "null"
            - number
          - type: "null"
        m5PeakContextTokens:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        m6LinesSurvived:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        m6LinesTotal:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        m6OutputSurvivalPct:
          anyOf:
          - type:
            - "null"
            - number
          - type: "null"
        m7SpecHasConstraints:
          anyOf:
          - type:
            - "null"
            - boolean
          - type: "null"
        m7SpecHasExamples:
          anyOf:
          - type:
            - "null"
            - boolean
          - type: "null"
        m7SpecWordCount:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        outcome:
          anyOf:
          - $ref: '#/components/schemas/SessionOutcome'
          - type: "null"
        outputTokens:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        retryLoops:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        retryTokensWasted:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        scope:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        scopeBreadth:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        signalDensity:
          anyOf:
          - type:
            - "null"
            - number
          - type: "null"
        specQualityScore:
          anyOf:
          - type:
            - "null"
            - number
          - type: "null"
        subagentCount:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        titleGenerated:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        toolCalls:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        totalTokens:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        turnCount:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        withinSessionReverts:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
      type: object
    AuthoritativeSessionEntry:
      additionalProperties: false
      properties:
        contentPreview:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        depth:
          type: integer
        entryId:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        entryIndex:
          type: integer
        entryType:
          $ref: '#/components/schemas/EntryType'
        extra:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        harness:
          $ref: '#/components/schemas/Harness'
        hasThinking:
          type: boolean
        hasToolUse:
          type: boolean
        isError:
          type: boolean
        parentEntryId:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        parentIndex:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        partType:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        rawByteLength:
          anyOf:
          - type:
            - "null"
            - integer
          - type: "null"
        role:
          $ref: '#/components/schemas/Role'
        sessionId:
          $ref: '#/components/schemas/SessionID'
        stopReason:
