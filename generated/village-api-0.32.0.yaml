    SchemaSchemaVersionResponse:
      properties:
        annotationSchemaVersion:
          type: string
        contentCapabilities:
          items:
            description: Opaque, forward-open revision token in the deployment-specific
              content-capability set. Clients use exact set membership, never parse
              _v1 as Semantic Versioning or infer ranges, ignore unknown tokens, and
              tolerate duplicate or unordered input. Servers emit only their pinned
              known inventory, reject duplicates, and serialize lexicographically;
              token meanings are immutable. observed_model_v1 is required iff any
              root or nested assistant turn has observedModel, not for session model
              alone, and guarantees assistant-only value validation before persistence
              with no invalid DB/blob side effects plus byte-exact accepted observedModel
              strings through storage, typed migration, rewrite, serving, and pull;
              JSON whitespace and key order are excluded. thinking_level_v1 is required
              iff the session detail carries thinkingLevel, thinkingLevelRaw, or a
              non-empty thinkingLevelHistory, or any main or earlier-history turn
              carries thinkingLevel or thinkingLevelRaw, and guarantees canonical,
              raw-bound, and assistant-only validation before persistence with no
              invalid side effects plus byte-exact preservation of the values, their
              history order, and their absence through storage, typed migration, rewrite,
              serving, and pull.
            title: Content Capability
            type: string
          type: array
