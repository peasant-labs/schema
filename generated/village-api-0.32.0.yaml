  /api/v1/schema/version:
    get:
      description: 'Advertise the annotation schema version plus push and pull contract
        windows and the deployment-specific content-capability set. contentCapabilities
        omitted or empty means none and null is invalid. Its items are opaque, forward-open
        revision strings: clients match exactly without SemVer or suffix parsing,
        ignore unknown tokens, and tolerate/deduplicate duplicates; server output
        contains only pinned known tokens, rejects duplicates, has no semantic order,
        and is serialized lexicographically. observed_model_v1 is required exactly
        when any root or nested assistant turn carries observedModel, not for session
        model alone. It guarantees assistant-only value validation before persistence
        with no invalid database or blob side effects and byte-exact accepted observedModel
        strings through storage, typed migration, rewrite, serving, and pull; JSON
        whitespace and key order are not guaranteed.'
      operationId: getSchemaVersion
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaSchemaVersionResponse'
          description: OK
      tags:
      - schema
