  /api/v1/transcripts/{id}:
    get:
      description: Get transcript metadata and viewer-authorized relationship navigation.
        Navigation is read-only and is never stored in transcript content. Nonowner
        collective associations use the same narrow viewer-visible/contributor-discoverable
        projection as the dedicated collective read; omitted associations do not disclose
        hidden existence. Query failures are 500, never successful empty arrays. integrity
        is present only when the transcript is public and flagged, and its presence
        is the flag. Its flagged_turns are zero-based positions in the top-level sessionDetail.turns
        array (never TurnDetail.index values, never earlierHistory or child sessions)
        of the content whose bare hash is transcript.content_hash. A reader highlights
        turns only when the content read's Village-Content-Hash header equals transcript.content_hash.
        An empty list means the flag stands with no turn flagged in the current copy.
        A clean, pending or failed check adds nothing.
      operationId: getTranscriptMetadata
      parameters:
      - description: Transcript identifier
        in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/SchemaTranscriptID'
          description: Transcript identifier
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageTranscriptMetadataResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Internal Server Error
      tags:
      - transcripts
    patch:
      description: 'Update an owned transcript''s metadata and governance axes. Every
        field is optional: omission preserves stored state; empty title, description,
        or tags clear those fields; license null requests clear; and a canonical license
        replaces. Explicit null for title, description, tags, or visibility is rejected,
        as are unknown fields and invalid or duplicate tags. Clearing an already granted
        Creative Commons license remains subject to the server''s irrevocability rule.
        Only the owner may call this operation. A successful update returns the complete
        typed authoritative editable state, including the canonical transcript URL
        and positive update timestamp. Visibility accepts private and public; organization-scoped
        visibility remains deferred.'
      operationId: updateTranscript
      parameters:
      - description: Transcript identifier
        in: path
