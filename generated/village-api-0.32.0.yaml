  /api/v1/transcripts/{id}/integrity-check:
    post:
      description: 'Ask village to check one of the caller''s own transcripts for
        integrity. Only the signed-in owner may call it. The call is synchronous:
        the response carries the answer. Statuses are decided in this order: 401 when
        the caller is signed out; 400 for a malformed id; 404 when the caller cannot
        read the transcript; 403 when the caller can read it but does not own it;
        409 when the owner''s transcript is public; 503 when the check is not available;
        429 when the owner''s daily allowance is used up; otherwise village runs the
        check, and answers 503 if it does not complete, or 200. 409 means a public
        transcript, which is checked automatically. 429 means the owner''s daily checks
        for the UTC day are used up. 503 means the check is not available now. A check
        that does not complete spends nothing, and an unchecked result spends nothing.
        The answer is only flagged, not_flagged or unchecked, with no turns, rule
        or field. remaining_today is the number of checks left after this one. A requested
        check is never shown publicly and never affects the public status.'
      operationId: checkTranscriptIntegrity
      parameters:
      - description: Transcript identifier
        in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/SchemaTranscriptID'
