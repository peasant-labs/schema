        can read the transcript, so the route never reveals more than the transcript
        does. It also answers 404 when the transcript''s owner is anonymous to the
        caller (the public-owner rule decides), so it never exposes a hidden owner''s
        repository, paths or commit authors. 404 also means village holds no stored
        metadata for the transcript (transcripts published before metadata was stored).
        406 means the requested pull contract is below village''s minimum.'
