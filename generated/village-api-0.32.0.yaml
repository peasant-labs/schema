        has offered to one collective, including pairs whose latest event was a withdrawal.
        A caller with no pair receives 404, matching no-such-collective.
      operationId: listMyCollectiveSubmissions
      parameters:
      - description: Collective identifier
        in: path
        name: groupId
        required: true
        schema:
          $ref: '#/components/schemas/SchemaVillageUUID'
          description: Collective identifier
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SchemaVillageCollectiveSubmission'
                type:
                - "null"
                - array
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Internal Server Error
      tags:
      - contributions
  /api/v1/users/me/collectives/{groupId}/transcripts/{transcriptId}/events:
    get:
      description: 'List the full owner-only event history for one transcript and
        collective pair, oldest event first. The decided_by_actor field is an actor
        class, never a moderator user id. event_num identifies an attempt: pending
        may become approved/rejected/retracted/revoked at the same ordinal with immutable
        recorded_at and a newly recorded decided_at. An initially auto-approved attempt
        may have null decided_at. Terminal wire decision fields do not change; withdrawing/removing
        an approved contribution uses a new ordinal. Validate and reconcile with the
        canonical schema attempt helper, not a per-poll append log.'
      operationId: listShareEventHistory
      parameters:
      - description: Collective identifier
        in: path
        name: groupId
        required: true
        schema:
          $ref: '#/components/schemas/SchemaVillageUUID'
          description: Collective identifier
      - description: Transcript identifier
        in: path
        name: transcriptId
        required: true
        schema:
          $ref: '#/components/schemas/SchemaTranscriptID'
          description: Transcript identifier
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SchemaVillageShareEvent'
                type:
                - "null"
                - array
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Internal Server Error
      tags:
      - contributions
  /api/v1/users/me/collectives/contributions:
    get:
      description: List collectives the authenticated caller has offered transcripts
        to, with approved and pending transcript counts and rejected and withdrawn
        attempt counts.
      operationId: listMyCollectiveContributions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageContributedCollectivesResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Internal Server Error
      tags:
      - contributions
  /api/v1/users/me/email:
    delete:
      description: Remove the caller's notification email address. Village keeps no
        copy of it. The answer is the caller's own settings.
      operationId: removeMyNotificationEmail
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageUserSettings'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Internal Server Error
      tags:
      - users
    put:
      description: Set the caller's notification email address, replacing any earlier
        one, and email a verification token to it. The address is unverified until
        the token is confirmed, and Village emails invitations only to a verified
        address. The answer is the caller's own settings. 429 means too many verification
        emails were requested; 501 means this Village sends no email.
      operationId: setMyNotificationEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaVillageSetNotificationEmailRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageUserSettings'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Unauthorized
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Not Implemented
      tags:
      - users
  /api/v1/users/me/email/verify:
    post:
      description: Confirm the caller's notification email address with the token
        Village emailed to it. The token is bound to the caller's account and to that
        address, so it confirms nothing for anyone else. 400 means the token is wrong,
        expired, or for an address the caller has since replaced; the answer does
        not say which. The answer is the caller's own settings.
      operationId: verifyMyNotificationEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaVillageVerifyNotificationEmailRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageUserSettings'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Internal Server Error
      tags:
      - users
  /api/v1/users/me/invitations:
    get:
      description: List the caller's own pending invitations that have not expired,
        each with the collective's summary and the inviting owner as the caller may
        see them. The summary is disclosed even for a collective visible only to its
        members. Another person's invitations are never listed.
      operationId: listMyInvitations
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageMyInvitationsResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Internal Server Error
      tags:
      - users
  /api/v1/users/me/invitations/{invitationID}/accept:
    post:
      description: 'Accept one of the caller''s pending invitations and join the collective
        as a member. Accepting is consent: the collective''s owners may then see the
        caller''s profile, while other members still see the caller as anonymous.
        Accepting when the caller is already a member who consented joins nothing
        new and answers 200. 404 means the caller holds no pending, unexpired invitation
        with this id, including one addressed to someone else. The operation takes
        no body; a later choice made at the moment of joining, such as how the caller
        is credited, would be an optional body.'
      operationId: acceptMyInvitation
      parameters:
      - description: Invitation identifier
        in: path
        name: invitationID
        required: true
        schema:
          $ref: '#/components/schemas/SchemaVillageUUID'
          description: Invitation identifier
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageCollectiveStatusRoleResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Internal Server Error
      tags:
      - users
  /api/v1/users/me/invitations/{invitationID}/decline:
    post:
      description: 'Decline one of the caller''s pending invitations. The owners are
        not told: the invitation stays in their list unchanged until it expires, and
        inviting the caller again from the same collective before then notifies no
        one. 404 means the caller holds no pending, unexpired invitation with this
        id, including one addressed to someone else.'
      operationId: declineMyInvitation
      parameters:
      - description: Invitation identifier
        in: path
        name: invitationID
        required: true
        schema:
          $ref: '#/components/schemas/SchemaVillageUUID'
          description: Invitation identifier
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageStatusResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Internal Server Error
      tags:
      - users
  /api/v1/users/me/prompt-requests:
    get:
      description: List the caller's attachments that are waiting for a transcript
        from the caller's machine, naming both the base and head remotes of each pull
        request so a client can match the repository it is about to push against either.
      operationId: listMyPromptRequests
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillagePromptRequestsResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Internal Server Error
      tags:
      - users
  /api/v1/users/me/settings:
    get:
      description: Read the caller's settings, including preview_before_attach and
        auto_attach_pull_requests. auto_attach_pull_requests is off by default; when
        on, Village links the caller's transcripts that trace a pull request's commits
        when the pull request opens in a repository one of the caller's collectives
        links, and never changes who can read them. notification_email is the caller's
        own notification address with whether it is verified, or null; this is the
        only response that carries an email address, and only its owner receives it.
        email_invitations is on by default and decides whether Village emails the
        caller when a collective invites them, once the address is verified.
      operationId: getMySettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageUserSettings'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Internal Server Error
      tags:
      - users
    patch:
      description: Patch the caller's settings. A field that is omitted is left unchanged.
        The notification address is set, verified, and removed through its own operations
        under /api/v1/users/me/email, because setting it sends mail.
      operationId: updateMySettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaVillageUpdateUserSettingsRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageUserSettings'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Internal Server Error
      tags:
      - users
  /api/v1/users/me/stats:
    get:
      description: 'Read totals over every transcript the caller published: transcripts,
        turns, recorded duration, tokens, and the distinct pull requests attached
        to those transcripts that the caller may read under the visibility rule of
        listTranscriptPullRequests (state attached; detached pull requests are not
        counted). The totals cover every transcript, not one page of a list.'
      operationId: getMyStats
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageUserStats'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Internal Server Error
      tags:
      - users
components:
  schemas:
    BestiaryHarness:
      description: AI coding tool or development environment
      enum:
      - claude-code
      - gemini-cli
      - codex
      - opencode
      - cursor
      - antigravity
      - strike
      - pi
      examples:
      - claude-code
      - opencode
      title: Harness
      type: string
    FormDataOpenapiTranscriptPublishMultipartRequest:
      properties:
        metadata:
          $ref: '#/components/schemas/OpenapiAuthoritativeTranscriptPublishRequest'
          description: PublishRequest JSON encoded with Content-Type application/json.
        transcript_file:
          $ref: '#/components/schemas/MultipartFileHeader'
          description: Exact transcript bytes whose SHA3-256 digest equals metadata.contentHash.
      required:
      - metadata
      - transcript_file
      type: object
    MultipartFileHeader:
      contentMediaType: application/octet-stream
      format: binary
      type: string
    OpenapiAuthoritativeTranscriptPublishRequest:
      properties:
        client:
          $ref: '#/components/schemas/SchemaAuthoritativeClientInfo'
        contentHash:
          $ref: '#/components/schemas/SchemaTranscriptContentHash'
        diagnostics:
          $ref: '#/components/schemas/SchemaAuthoritativeDiagnosticsInfo'
        entries:
          items:
            $ref: '#/components/schemas/SchemaAuthoritativeSessionEntry'
          type: array
        git:
          $ref: '#/components/schemas/SchemaAuthoritativeGitContext'
        identity:
          $ref: '#/components/schemas/SchemaAuthoritativeSessionIdentity'
        license:
          $ref: '#/components/schemas/SchemaLicense'
        model:
          $ref: '#/components/schemas/SchemaAuthoritativeModelInfo'
        project:
          $ref: '#/components/schemas/SchemaAuthoritativeProjectContext'
        quality:
          $ref: '#/components/schemas/SchemaAuthoritativeQualityMetrics'
        source:
          $ref: '#/components/schemas/SchemaAuthoritativeSourceInfo'
        stats:
          $ref: '#/components/schemas/SchemaAuthoritativeSessionStats'
        subagents:
          items:
            $ref: '#/components/schemas/SchemaAuthoritativeSubagentRef'
          type: array
        timestamp:
          $ref: '#/components/schemas/SchemaAuthoritativeTimestampInfo'
        visibilityIntent:
          $ref: '#/components/schemas/SchemaVisibilityIntent'
      required:
      - contentHash
      - model
      type: object
    OpenapiTranscriptUpdateErrorResponse:
      properties:
        error:
          type: string
      required:
      - error
      type: object
    OpenapiVillageGroupedView:
      enum:
      - grouped
      type: string
    SchemaActorOrigin:
      description: Closed session graph value
      enum:
      - operator
      - agent_delegate
      - harness
      - unknown
      examples:
      - operator
      - agent_delegate
      - harness
      - unknown
      title: Actor Origin
      type: string
    SchemaAnnotationEntryTarget:
      properties:
        endIndex:
          type: integer
        entryIndex:
          type: integer
        sessionId:
          minLength: 1
          type: string
      required:
      - sessionId
      - entryIndex
      - endIndex
      type: object
    SchemaAnnotationManifestResponse:
      properties:
        digest:
          description: Deterministic, order-independent digest over the hash set;
            a client computing the same digest over its local set knows nothing diverged.
          type: string
        hashes:
          description: Hex-encoded SHA3-256 annotation content-hashes the village
            holds for the owner (sorted, de-duplicated).
          items:
            type: string
          type: array
      required:
      - hashes
      - digest
      type: object
    SchemaAnnotationPushItem:
      oneOf:
      - not:
          anyOf:
          - properties:
              sessionId:
                not:
                  type: "null"
            required:
            - sessionId
          - properties:
              entryTarget:
                not:
                  type: "null"
            required:
            - entryTarget
          - properties:
              annotationId:
                not:
                  type: "null"
            required:
            - annotationId
          - properties:
              projectHash:
                not:
                  type: "null"
            required:
            - projectHash
        properties:
          targetAssociationId:
            $ref: '#/components/schemas/SchemaAssociationID'
          targetKind:
            const: association
        required:
        - targetKind
        - targetAssociationId
      - not:
          anyOf:
          - properties:
              targetAssociationId:
                not:
                  type: "null"
            required:
            - targetAssociationId
          - properties:
              entryTarget:
                not:
                  type: "null"
            required:
            - entryTarget
          - properties:
              annotationId:
                not:
                  type: "null"
            required:
            - annotationId
          - properties:
              projectHash:
                not:
                  type: "null"
            required:
            - projectHash
        properties:
          sessionId:
            minLength: 1
            type: string
          targetKind:
            const: session
        required:
        - targetKind
        - sessionId
      - not:
          anyOf:
          - properties:
              targetAssociationId:
                not:
                  type: "null"
            required:
            - targetAssociationId
          - properties:
              sessionId:
                not:
                  type: "null"
            required:
            - sessionId
          - properties:
              annotationId:
                not:
                  type: "null"
            required:
            - annotationId
          - properties:
              projectHash:
                not:
                  type: "null"
            required:
            - projectHash
        properties:
          entryTarget:
            $ref: '#/components/schemas/SchemaAnnotationEntryTarget'
          targetKind:
            const: entry
        required:
        - targetKind
        - entryTarget
      - not:
          anyOf:
          - properties:
              targetAssociationId:
                not:
                  type: "null"
            required:
            - targetAssociationId
          - properties:
              sessionId:
                not:
                  type: "null"
            required:
            - sessionId
          - properties:
              entryTarget:
                not:
                  type: "null"
            required:
            - entryTarget
          - properties:
              projectHash:
                not:
                  type: "null"
            required:
            - projectHash
        properties:
          annotationId:
            minLength: 1
            type: string
          targetKind:
            const: annotation
        required:
        - targetKind
        - annotationId
      - not:
          anyOf:
          - properties:
              targetAssociationId:
                not:
                  type: "null"
            required:
            - targetAssociationId
          - properties:
              sessionId:
                not:
                  type: "null"
            required:
            - sessionId
          - properties:
              entryTarget:
                not:
                  type: "null"
            required:
            - entryTarget
          - properties:
              annotationId:
                not:
                  type: "null"
            required:
            - annotationId
        properties:
          projectHash:
            $ref: '#/components/schemas/SchemaProjectHash'
          targetKind:
            const: project
        required:
        - targetKind
        - projectHash
      properties:
        annotationId:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        annotatorName:
          type: string
        confidence:
          anyOf:
          - type:
            - "null"
            - number
          - type: "null"
        contentHash:
          type: string
        entryTarget:
          anyOf:
          - $ref: '#/components/schemas/SchemaAnnotationEntryTarget'
          - type: "null"
        isPrimary:
          type: boolean
        projectHash:
          anyOf:
          - $ref: '#/components/schemas/SchemaProjectHash'
          - type: "null"
        provenance:
          anyOf:
          - $ref: '#/components/schemas/SchemaProvenance'
          - type: "null"
        reason:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        sessionId:
          anyOf:
          - type:
            - "null"
            - string
          - type: "null"
        targetAssociationId:
          anyOf:
          - $ref: '#/components/schemas/SchemaAssociationID'
          - type: "null"
        targetKind:
          $ref: '#/components/schemas/SchemaTargetKind'
        typeId:
          type: string
        value:
          type: string
      required:
      - contentHash
      - targetKind
      - typeId
      - value
      - isPrimary
      type: object
    SchemaAnnotationPushRequest:
      properties:
        annotations:
          items:
            $ref: '#/components/schemas/SchemaAnnotationPushItem'
          type: array
        retractions:
          items:
            type: string
          type: array
      required:
      - annotations
      type: object
    SchemaAnnotationPushResponse:
      properties:
        created:
          type: integer
        errors:
          type: integer
        results:
          items:
            $ref: '#/components/schemas/SchemaAnnotationPushResult'
          type: array
        skipped:
          type: integer
        updated:
          type: integer
      required:
      - created
      - updated
      - skipped
      - errors
      type: object
    SchemaAnnotationPushResult:
      properties:
        contentHash:
          type: string
        error:
          type: string
        status:
          $ref: '#/components/schemas/SchemaAnnotationPushStatus'
      required:
      - status
      type: object
    SchemaAnnotationPushStatus:
      description: Per-item annotation push outcome
      enum:
      - created
      - updated
      - skipped
      - error
      examples:
      - created
      - updated
      - skipped
      - error
      title: Annotation Push Status
      type: string
    SchemaAnnotatorKind:
      description: 'Type of entity that produced an annotation: human, agent (AI model),
        or rule (automated classifier)'
      enum:
      - human
      - agent
      - rule
      examples:
      - human
      - agent
      - rule
      title: Annotator Kind
      type: string
    SchemaAssociationID:
      description: Opaque durable Peasant identifier for one session-to-commit association
      examples:
      - assoc-20260726:session-a:commit-1
      maxLength: 128
      minLength: 1
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
      title: Association ID
      type: string
    SchemaAuthoritativeClientInfo:
      additionalProperties: false
      properties:
        name:
          maxLength: 64
          minLength: 1
          pattern: ^[a-z][a-z0-9-]{0,63}$
          type: string
        version:
          maxLength: 128
          minLength: 5
          pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$
          type: string
      required:
      - name
      - version
      type: object
    SchemaAuthoritativeCommitInfo:
      additionalProperties: false
      properties:
        authorEmail:
          type: string
        authorName:
