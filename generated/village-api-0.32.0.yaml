            digits (for example 0.3.0). Village serves the highest version it supports
            that is no newer than this and no older than its minimum. Omitted or malformed
            (0.3, v0.3.0, any other text), it is treated as absent and Village serves
            its default (pullContractVersion), so a client with a buggy header still
            pulls. Below Village's minimum, the read is refused with 406 and a VillageErrorResponse.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaAuthoritativePublishRequest'
          description: OK
          headers:
            Peasant-Pull-Contract:
              description: The pull contract version this response was served under.
                0.2.0 bodies are the Legacy* envelope; 0.3.0 and any later 0.3.z bodies
                are the public owner envelope.
