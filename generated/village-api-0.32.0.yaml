          type: string
        minPushContractVersion:
          type: string
        pullContractMaxVersion:
          type: string
        pullContractVersion:
          type: string
        pushContractVersion:
          type: string
        supportedTargetKinds:
          items:
            type: string
          type:
          - array
          - "null"
        supportedTypeIds:
          items:
            type: string
          type:
          - array
          - "null"
      required:
      - annotationSchemaVersion
      - supportedTargetKinds
      - supportedTypeIds
      - pushContractVersion
      - minPushContractVersion
      type: object
