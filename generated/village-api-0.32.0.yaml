  /api/v1/pull/transcripts:
    get:
      description: List transcripts the authenticated user may pull (own + group-shared;
        public excluded by the canPullTranscript policy). Offset pagination. The optional
        collectives filter narrows the list to the approved shares of the listed collectives
        the caller belongs to; a collective the caller is not in contributes nothing.
      operationId: listPullableTranscripts
      parameters:
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: limit
        schema:
          type: integer
      - description: Optional comma-separated collective identifiers. Narrows the
          list to transcripts with an approved share into any listed collective the
          caller belongs to. Omission, or only empty elements, lists every pullable
          transcript.
        in: query
        name: collectives
        schema:
          description: Optional comma-separated collective identifiers. Narrows the
            list to transcripts with an approved share into any listed collective
            the caller belongs to. Omission, or only empty elements, lists every pullable
            transcript.
          type: string
      - description: Optional. The newest pull contract this client reads, as MAJOR.MINOR.PATCH
          digits (for example 0.3.0). Village serves the highest version it supports
          that is no newer than this and no older than its minimum. Omitted or malformed
          (0.3, v0.3.0, any other text), it is treated as absent and Village serves
          its default (pullContractVersion), so a client with a buggy header still
          pulls. Below Village's minimum, the read is refused with 406 and a VillageErrorResponse.
        in: header
        name: Peasant-Pull-Contract
        schema:
          description: Optional. The newest pull contract this client reads, as MAJOR.MINOR.PATCH
            digits (for example 0.3.0). Village serves the highest version it supports
            that is no newer than this and no older than its minimum. Omitted or malformed
            (0.3, v0.3.0, any other text), it is treated as absent and Village serves
            its default (pullContractVersion), so a client with a buggy header still
            pulls. Below Village's minimum, the read is refused with 406 and a VillageErrorResponse.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/SchemaPullListResponse'
                - $ref: '#/components/schemas/SchemaLegacyPullListResponse'
          description: OK
          headers:
            Peasant-Pull-Contract:
              description: The pull contract version this response was served under.
                0.2.0 bodies are the Legacy* envelope; 0.3.0 and any later 0.3.z bodies
                are the public owner envelope.
              required: true
              schema:
                pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
                type: string
              style: simple
        "406":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Not Acceptable
      tags:
      - pull
