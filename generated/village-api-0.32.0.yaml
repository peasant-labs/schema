  /api/v1/integrations/github/webhook:
    post:
      description: Receive a GitHub App webhook delivery. The body is GitHub's payload,
        authenticated by the X-Hub-Signature-256 HMAC over the raw body; X-GitHub-Delivery
        makes redelivery idempotent. Handles installation, pull_request, check_run,
        and issue_comment events and acknowledges every other event without acting.
        Returns 501 when the App or its webhook secret is not configured.
      operationId: receiveGitHubWebhook
      parameters:
      - description: GitHub event name
        in: header
        name: X-GitHub-Event
        required: true
        schema:
          description: GitHub event name
          type: string
      - description: Unique delivery identifier; Village records it so a redelivery
          is idempotent
        in: header
        name: X-GitHub-Delivery
        required: true
        schema:
          description: Unique delivery identifier; Village records it so a redelivery
            is idempotent
          type: string
      - description: HMAC SHA-256 of the raw body under the App webhook secret
        in: header
        name: X-Hub-Signature-256
        required: true
        schema:
          description: HMAC SHA-256 of the raw body under the App webhook secret
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaVillageGitHubWebhookPayload'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageStatusResponse'
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Unauthorized
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaVillageErrorResponse'
          description: Not Implemented
      tags:
      - integrations
