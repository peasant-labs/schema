# Release-config loader corpus: rows of intent.LoadConfig. Each document is
# the whole file under test; must-pass rows carry the decoded expectation.
required_names:
  - full-config
  - minimal-quiet-config
  - unknown-key
  - surfaces-while-quiet
  - empty-tag-prefix
  - empty-automation-author
  - empty-changelog
  - version-file-missing-field
  - bad-bot-kind
  - empty-branch-value
  - two-documents
cases:
  - name: full-config
    input:
      document: |
        releases: true
        tag_prefix: fairtrade-v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json, field: version }
        protected_paths:
          - docs/release-notes.md
        surfaces: {}
        bot_branches:
          release: automation/release
          vendor-hash: automation/vendor-hash
          cut-release: automation/cut-release
    expected:
      releases: true
      tag_prefix: fairtrade-v
      automation_author: peasant-labs-releaser[bot]
      changelog: CHANGELOG.md
      version_files:
        - { path: package.json, field: version }
      protected_paths:
        - docs/release-notes.md
      surfaces: {}
      bot_branches:
        release: automation/release
        vendor-hash: automation/vendor-hash
        cut-release: automation/cut-release
    classification: must-pass
    provenance: {source: requirement, ref: "config: a complete releasing config loads"}
    mutation: {description: "the canonical releasing config"}
  - name: minimal-quiet-config
    input:
      document: |
        releases: false
        tag_prefix: v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files: []
        protected_paths: []
        surfaces: {}
        bot_branches: {}
    expected:
      releases: false
      tag_prefix: v
      automation_author: peasant-labs-releaser[bot]
      changelog: CHANGELOG.md
      version_files: []
      protected_paths: []
      surfaces: {}
      bot_branches: {}
    classification: must-pass
    provenance: {source: requirement, ref: "config: a repo that does not release loads with no surfaces"}
    mutation: {description: "the minimal quiet config"}
  - name: unknown-key
    input:
      document: |
        releases: true
        tag_prefix: v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        scope_allowlist: [graph]
    expected: {code: "config-invalid"}
    classification: must-fail
    sibling: full-config
    provenance: {source: boundary, ref: "config: an unknown key fails closed"}
    mutation: {description: "added a typo'd key"}
  - name: surfaces-while-quiet
    input:
      document: |
        releases: false
        tag_prefix: v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        surfaces:
          types: types
    expected: {code: "config-invalid"}
    classification: must-fail
    sibling: minimal-quiet-config
    provenance: {source: requirement, ref: "config: a repo that does not release names no surfaces"}
    mutation: {description: "named a surface where releases are off"}
  - name: empty-tag-prefix
    input:
      document: |
        releases: true
        tag_prefix: ""
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
    expected: {code: "config-invalid"}
    classification: must-fail
    sibling: full-config
    provenance: {source: boundary, ref: "config: the tag prefix is required"}
    mutation: {description: "cleared the tag prefix"}
  - name: empty-automation-author
    input:
      document: |
        releases: true
        tag_prefix: v
        automation_author: ""
        changelog: CHANGELOG.md
    expected: {code: "config-invalid"}
    classification: must-fail
    sibling: full-config
    provenance: {source: boundary, ref: "config: the automation author is required"}
    mutation: {description: "cleared the automation author"}
  - name: empty-changelog
    input:
      document: |
        releases: true
        tag_prefix: v
        automation_author: peasant-labs-releaser[bot]
        changelog: ""
    expected: {code: "config-invalid"}
    classification: must-fail
    sibling: full-config
    provenance: {source: boundary, ref: "config: the changelog path is required"}
    mutation: {description: "cleared the changelog path"}
  - name: version-file-missing-field
    input:
      document: |
        releases: true
        tag_prefix: v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        version_files:
          - { path: package.json }
    expected: {code: "config-invalid"}
    classification: must-fail
    sibling: full-config
    provenance: {source: boundary, ref: "config: a version file entry needs its protected field"}
    mutation: {description: "dropped the field from a version file entry"}
  - name: bad-bot-kind
    input:
      document: |
        releases: true
        tag_prefix: v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        bot_branches:
          deploy: automation/deploy
    expected: {code: "config-invalid"}
    classification: must-fail
    sibling: full-config
    provenance: {source: requirement, ref: "config: the bot PR kinds are closed"}
    mutation: {description: "named a bot kind outside the closed set"}
  - name: empty-branch-value
    input:
      document: |
        releases: true
        tag_prefix: v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        bot_branches:
          release: ""
    expected: {code: "config-invalid"}
    classification: must-fail
    sibling: full-config
    provenance: {source: boundary, ref: "config: each bot kind needs its branch"}
    mutation: {description: "cleared a bot branch"}
  - name: two-documents
    input:
      document: |
        releases: true
        tag_prefix: v
        automation_author: peasant-labs-releaser[bot]
        changelog: CHANGELOG.md
        ---
        releases: false
    expected: {code: "config-invalid"}
    classification: must-fail
    sibling: full-config
    provenance: {source: boundary, ref: "config: the file is one document"}
    mutation: {description: "appended a second document"}
