      pending:
        - {type: "feat", scopes: ["x"], breaking: false, level: "minor", subject: "two", pr: 10}
      base_changelog: |
        # Changelog

        ## Unreleased

        - something pending from before

        ## 0.0.67

        - feat(x)[minor]: one (#9)
      version: "0.1.0"
      tag: "fairtrade-v0.1.0"
      date: "2026-11-12"
    expected:
      changelog: |
        # Changelog

        ## 0.1.0

        - something pending from before

        - two (#10)

        ## 0.0.67

        - feat(x)[minor]: one (#9)
      section: |
