# Generator corpus: rows of intent.Generate. Pending rides newest-first, as
# the planner returns it; the section lines run oldest-first.
required_names:
  - two-minors-schema-style
  - fairtrade-bare-style
  - unreleased-block-kept
  - unreleased-bare-style
  - breaking-marked
  - single-empty-release-line
  - no-pr-number
  - dated-style-missing-date
  - no-section-base
  - empty-pending-is-error
  - empty-tag-is-error
cases:
  - name: two-minors-schema-style
    input:
      config: {releases: true, tag_prefix: "v", automation_author: "bot", changelog: "CHANGELOG.md", version_files: [{path: "package.json", field: "version"}], protected_paths: [], surfaces: {}, bot_branches: {}}
      pending:
        - {type: "feat", scopes: ["y"], breaking: false, level: "minor", subject: "two", pr: 12}
        - {type: "feat", scopes: ["x"], breaking: false, level: "minor", subject: "one", pr: 11}
      base_changelog: |
        # Changelog

        All notable changes are documented here.

        ## [v0.1.0] - 2026-11-01

        - feat(x)[minor]: one (#9)
      version: "0.2.0"
      tag: "v0.2.0"
      date: "2026-11-12"
    expected:
      changelog: |
        # Changelog

        All notable changes are documented here.

        ## [v0.2.0] - 2026-11-12

        - one (#11)
        - two (#12)

        ## [v0.1.0] - 2026-11-01

        - feat(x)[minor]: one (#9)
      section: |
        ## [v0.2.0] - 2026-11-12

        - one (#11)
        - two (#12)
      versions: {"package.json": "0.2.0"}
    classification: must-pass
    provenance: {source: requirement, ref: "generator: the section follows the repo heading style with the date"}
    mutation: {description: "two pending minors over a bracketed dated base"}
  - name: fairtrade-bare-style
    input:
      config: {releases: true, tag_prefix: "fairtrade-v", automation_author: "bot", changelog: "CHANGELOG.md", version_files: [{path: "package.json", field: "version"}], protected_paths: [], surfaces: {}, bot_branches: {}}
      pending:
        - {type: "feat", scopes: ["y"], breaking: false, level: "minor", subject: "two", pr: 10}
      base_changelog: |
        # Changelog

        ## 0.0.67

        - feat(x)[minor]: one (#9)
      version: "0.1.0"
      tag: "fairtrade-v0.1.0"
      date: "2026-11-12"
    expected:
      changelog: |
        # Changelog

        ## 0.1.0

        - two (#10)

        ## 0.0.67

        - feat(x)[minor]: one (#9)
      section: |
        ## 0.1.0

        - two (#10)
      versions: {"package.json": "0.1.0"}
    classification: must-pass
    provenance: {source: requirement, ref: "generator: a bare heading keeps the bare version with no date"}
    mutation: {description: "a pending minor over a bare fairtrade-style base"}
  - name: unreleased-block-kept
    input:
      config: {releases: true, tag_prefix: "v", automation_author: "bot", changelog: "CHANGELOG.md", version_files: [], protected_paths: [], surfaces: {}, bot_branches: {}}
      pending:
        - {type: "feat", scopes: ["x"], breaking: false, level: "minor", subject: "two", pr: 10}
      base_changelog: |
        # Changelog

        ## [Unreleased]

        ### Added

        - something pending from before

        ## [v0.1.0] - 2026-11-01

        - feat(x)[minor]: one (#9)
      version: "0.2.0"
      tag: "v0.2.0"
      date: "2026-11-12"
    expected:
      changelog: |
        # Changelog

        ## [v0.2.0] - 2026-11-12

        ### Added

        - something pending from before

        - two (#10)

        ## [v0.1.0] - 2026-11-01

        - feat(x)[minor]: one (#9)
      section: |
        ## [v0.2.0] - 2026-11-12

        - two (#10)
      versions: {}
    classification: must-pass
    provenance: {source: requirement, ref: "generator: an Unreleased block keeps its entries above the generated lines"}
    mutation: {description: "a pending minor over a base with an Unreleased block"}
  - name: unreleased-bare-style
