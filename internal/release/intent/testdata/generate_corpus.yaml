  - name: breaking-marked
    input:
      config: {releases: true, tag_prefix: "v", automation_author: "bot", changelog: "CHANGELOG.md", version_files: [], protected_paths: [], surfaces: {}, bot_branches: {}}
      pending:
        - {type: "feat", scopes: ["types"], breaking: true, level: "minor", subject: "drop it", pr: 19}
        - {type: "fix", scopes: [], breaking: false, level: "patch", subject: "mend it", pr: 18}
      base_changelog: |
        # Changelog

        ## [v0.1.0] - 2026-11-01

        - feat(x)[minor]: one (#9)
      version: "0.2.0"
      tag: "v0.2.0"
      date: "2026-11-12"
    expected:
      changelog: |
        # Changelog

        ## [v0.2.0] - 2026-11-12

        - mend it (#18)
        - drop it (#19) (BREAKING)

        ## [v0.1.0] - 2026-11-01

        - feat(x)[minor]: one (#9)
      section: |
        ## [v0.2.0] - 2026-11-12

        - mend it (#18)
        - drop it (#19) (BREAKING)
      versions: {}
    classification: must-pass
    provenance: {source: requirement, ref: "generator: breaking subjects are marked in the notes"}
    mutation: {description: "a breaking subject beside a patch"}
  - name: single-empty-release-line
    input:
      config: {releases: true, tag_prefix: "v", automation_author: "bot", changelog: "CHANGELOG.md", version_files: [], protected_paths: [], surfaces: {}, bot_branches: {}}
      pending:
        - {type: "release", scopes: ["scope"], breaking: false, level: "patch", subject: "cut a release", pr: 16}
