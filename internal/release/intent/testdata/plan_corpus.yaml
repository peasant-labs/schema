# Planner corpus: rows of intent.Plan. Facts carry the branch tip history
# newest-first, every tag, the epoch, the floor, the mode, the verdict, and
# the per-commit freshness the command layer recorded.
required_names:
  - tag-mode-off-gives-none
  - fresh-candidate-verify
  - fresh-candidate-taggable
  - fresh-candidate-rejected
  - nothing-pending-close-pr
  - stale-candidate-open-pr
  - unknown-freshness-open-pr
  - bad-subject-fails-closed
  - no-final-tag
  - no-final-tag-on-chain
  - version-base-off-chain
  - epoch-missing
  - floor-not-on-chain
  - floor-drops-subjects
  - floor-at-base-ignored
  - floor-drops-bad-subject
  - single-empty-release-line
  - two-patches-one-batch
  - breaking-below-1
  - release-commit-excluded
  - epoch-commit-parsed
  - epoch-bad-subject-fails
  - prefixed-non-release-tag-ignored
  - rc-above-final-ignored
  - verdict-taggable-no-candidate
  - full-set-fresh-candidate-later-subject
  - full-set-without-candidate
  - fresh-candidate-rejected-later-subject
  - stale-candidate-later-subject
  - older-fresh-newer-stale-no-tag
  - fresh-candidate-later-subject-taggable
  - fresh-candidate-later-subject-verify
  - commits-after-fresh-candidate
  - stale-candidate-close-pr-when-empty
  - plan-only-with-fresh-candidate
cases:
  - name: tag-mode-off-gives-none
    input:
      config: {releases: true, tag_prefix: "v", automation_author: "bot", changelog: "CHANGELOG.md", version_files: [], protected_paths: [], surfaces: {}, bot_branches: {}}
      facts:
        commits:
          - {sha: "aaa", subject: "feat(x)[minor]: one (#11)", changes_changelog: false}
          - {sha: "e00", subject: "chore: adopt the release config", changes_changelog: false}
        tags: {"v0.1.0": "e00"}
        epoch: "e00"
        floor: ""
        mode: "plan-only"
        verdict: ""
        fresh: {}
    expected:
      action: "none"
      range_base: "v0.1.0"
      version_base: "v0.1.0"
      candidate: ""
      candidate_fresh: "unknown"
      pending:
        - {type: "feat", scopes: ["x"], breaking: false, level: "minor", subject: "one", pr: 11}
      level: "minor"
      breaking: false
      version: "0.2.0"
      tag: "v0.2.0"
      full:
        pending:
          - {type: "feat", scopes: ["x"], breaking: false, level: "minor", subject: "one", pr: 11}
        version: "0.2.0"
        tag: "v0.2.0"
        date: ""
      code: ""
    classification: must-pass
    provenance: {source: requirement, ref: "planner: tag mode off gives none"}
    mutation: {description: "a pending batch with the job disarmed"}
