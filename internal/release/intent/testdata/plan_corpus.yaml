    expected:
      action: "verify"
      range_base: "v0.1.0"
      version_base: "v0.1.0"
      candidate: "r11"
      candidate_fresh: "fresh"
      before:
        pending:
          - {type: "feat", scopes: ["x"], breaking: false, level: "minor", subject: "one", pr: 11}
        version: "0.2.0"
        tag: "v0.2.0"
        date: ""
      pending:
        - {type: "feat", scopes: ["x"], breaking: false, level: "minor", subject: "one", pr: 11}
      level: "minor"
      breaking: false
      version: "0.2.0"
      tag: "v0.2.0"
      full:
        pending:
          - {type: "feat", scopes: ["x"], breaking: false, level: "minor", subject: "one", pr: 11}
        version: "0.2.0"
        tag: "v0.2.0"
        date: ""
      code: ""
    classification: must-pass
    provenance: {source: requirement, ref: "planner: a fresh candidate with no verdict gives verify"}
    mutation: {description: "a fresh release commit awaiting its pre-tag report"}
