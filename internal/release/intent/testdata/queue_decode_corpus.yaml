# Queue-response decoder corpus: rows of intent.DecodeQueueResponse. Each
# document is the raw GraphQL response body; must-pass rows carry the decoded
# snapshot.
required_names:
  - two-entries-decode
  - empty-queue-decodes
  - malformed-json
  - errors-array
  - null-merge-queue
  - missing-total-count
  - count-mismatch-fewer-nodes
  - count-mismatch-more-nodes
  - missing-node-title
  - null-repository
cases:
  - name: two-entries-decode
    input:
      document: '{"data":{"repository":{"mergeQueue":{"entries":{"totalCount":2,"nodes":[{"position":0,"pullRequest":{"number":11,"title":"feat(x)[minor]: one"}},{"position":1,"pullRequest":{"number":12,"title":"release[patch]: cut"}}]}}}}}'
    expected:
      entries:
        - {position: 0, number: 11, title: "feat(x)[minor]: one"}
        - {position: 1, number: 12, title: "release[patch]: cut"}
    classification: must-pass
    provenance: {source: requirement, ref: "decoder: a complete page decodes to its entries and total"}
    mutation: {description: "the canonical queue read"}
  - name: empty-queue-decodes
    input:
      document: '{"data":{"repository":{"mergeQueue":{"entries":{"totalCount":0,"nodes":[]}}}}}'
    expected:
      entries: []
    classification: must-pass
    provenance: {source: requirement, ref: "decoder: a genuinely empty queue decodes empty"}
    mutation: {description: "a queue with no entries"}
  - name: malformed-json
    input:
      document: '{"data":{"repository":'
    expected:
      entries: []
    classification: must-fail
    provenance: {source: boundary, ref: "decoder: malformed JSON is a failed read"}
    mutation: {description: "truncated the response body"}
  - name: errors-array
    input:
      document: '{"data":null,"errors":[{"message":"timed out"}]}'
    expected:
      entries: []
    classification: must-fail
    provenance: {source: requirement, ref: "decoder: a non-empty errors array is a failed read"}
    mutation: {description: "answered with a service error"}
  - name: null-merge-queue
    input:
      document: '{"data":{"repository":{"mergeQueue":null}}}'
    expected:
      entries: []
    classification: must-fail
    provenance: {source: requirement, ref: "decoder: mergeQueue null is a failed read, never an empty queue"}
    mutation: {description: "nulled the merge queue"}
  - name: missing-total-count
    input:
      document: '{"data":{"repository":{"mergeQueue":{"entries":{"nodes":[]}}}}}'
    expected:
      entries: []
    classification: must-fail
    provenance: {source: requirement, ref: "decoder: a missing totalCount is a failed read"}
    mutation: {description: "dropped the total from the answer"}
  - name: count-mismatch-fewer-nodes
    input:
      document: '{"data":{"repository":{"mergeQueue":{"entries":{"totalCount":3,"nodes":[{"position":0,"pullRequest":{"number":11,"title":"feat(x)[minor]: one"}},{"position":1,"pullRequest":{"number":12,"title":"docs(y): words"}}]}}}}}'
    expected:
      entries: []
    classification: must-fail
    provenance: {source: requirement, ref: "decoder: fewer nodes than the total is a cut page"}
    mutation: {description: "reported three entries but listed two"}
  - name: count-mismatch-more-nodes
    input:
      document: '{"data":{"repository":{"mergeQueue":{"entries":{"totalCount":1,"nodes":[{"position":0,"pullRequest":{"number":11,"title":"feat(x)[minor]: one"}},{"position":1,"pullRequest":{"number":12,"title":"docs(y): words"}}]}}}}}'
    expected:
      entries: []
    classification: must-fail
    provenance: {source: requirement, ref: "decoder: more nodes than the total is a failed read"}
    mutation: {description: "reported one entry but listed two"}
  - name: missing-node-title
    input:
      document: '{"data":{"repository":{"mergeQueue":{"entries":{"totalCount":1,"nodes":[{"position":0,"pullRequest":{"number":11}}]}}}}}'
    expected:
      entries: []
    classification: must-fail
    provenance: {source: boundary, ref: "decoder: every entry needs its position, number, and title"}
    mutation: {description: "dropped a title from an entry"}
  - name: null-repository
    input:
      document: '{"data":{"repository":null}}'
    expected:
      entries: []
    classification: must-fail
    provenance: {source: boundary, ref: "decoder: a null repository is a failed read"}
    mutation: {description: "nulled the repository"}
