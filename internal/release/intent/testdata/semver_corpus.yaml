# SemVer parsing corpus: rows of intent.ParseSemVer.
required_names:
  - plain-version-parses
  - zero-version-parses
  - multi-digit-parses
  - missing-patch-rejected
  - v-prefix-rejected
  - suffix-rejected
  - empty-rejected
cases:
  - name: plain-version-parses
    input: {raw: "0.1.0"}
    expected: {value: "0.1.0"}
    classification: must-pass
    provenance: {source: requirement, ref: "versions: a bare X.Y.Z value parses"}
    mutation: {description: "the canonical version shape"}
  - name: zero-version-parses
    input: {raw: "0.0.0"}
    expected: {value: "0.0.0"}
    classification: must-pass
    provenance: {source: boundary, ref: "versions: zeros parse"}
    mutation: {description: "zeroed every number"}
  - name: multi-digit-parses
    input: {raw: "10.20.300"}
    expected: {value: "10.20.300"}
    classification: must-pass
    provenance: {source: boundary, ref: "versions: multi-digit numbers parse"}
    mutation: {description: "widened every number past one digit"}
  - name: missing-patch-rejected
    input: {raw: "0.1"}
    expected: {value: ""}
    classification: must-fail
    sibling: plain-version-parses
    provenance: {source: boundary, ref: "versions: two numbers are not a version"}
    mutation: {description: "dropped the patch number"}
  - name: v-prefix-rejected
    input: {raw: "v0.1.0"}
    expected: {value: ""}
    classification: must-fail
    sibling: plain-version-parses
    provenance: {source: requirement, ref: "versions: the tag prefix lives outside this type"}
    mutation: {description: "added the tag prefix to the value"}
  - name: suffix-rejected
    input: {raw: "0.1.0-rc1"}
    expected: {value: ""}
    classification: must-fail
    sibling: plain-version-parses
    provenance: {source: requirement, ref: "versions: titles never mint prerelease suffixes"}
    mutation: {description: "appended a prerelease suffix"}
  - name: empty-rejected
    input: {raw: ""}
    expected: {value: ""}
    classification: must-fail
    sibling: plain-version-parses
    provenance: {source: boundary, ref: "versions: the empty string is not a version"}
    mutation: {description: "cleared the value"}
