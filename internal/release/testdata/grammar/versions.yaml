# Release-version / release-tag / release-PR-title grammar corpus.
#
# Drives the pure grammar table-tests in parse_test.go: NewVersion,
# Version.Kind()/Base()/IsRC(), ParseReleaseTitle, and ParseTag. Each row is one
# input paired with its expected outcome; a must-fail row sets `wantErr: true`
# and carries no expected value (the test asserts KindInvalid on the error path
# for the title/tag parsers).

# NewVersion(raw) -> Version (leading "v", vMAJOR.MINOR.PATCH[-rcN])
new_version:
  - name: final
    raw: v0.1.0
    want: v0.1.0
  - name: final multi-digit
    raw: v12.34.56
    want: v12.34.56
  - name: rc1
    raw: v0.1.0-rc1
    want: v0.1.0-rc1
  - name: rc multi-digit
    raw: v2.0.0-rc12
    want: v2.0.0-rc12

  # must-fail grammar set
  - name: missing leading v
    raw: "0.1.0"
    wantErr: true
  - name: rc without number
    raw: v0.1.0-rc
    wantErr: true
  - name: pkg/schema namespaced
    raw: pkg/schema/v1.2.3
    wantErr: true
  - name: two-component
    raw: v0.1
    wantErr: true
  - name: trailing junk
    raw: v0.1.0-rc1-foo
    wantErr: true
  - name: prerelease not rc
    raw: v0.1.0-beta1
    wantErr: true
  - name: build metadata
    raw: v0.1.0+build
    wantErr: true
  - name: empty
    raw: ""
    wantErr: true
  - name: garbage
    raw: not-a-version
    wantErr: true
  - name: leading space
    raw: " v0.1.0"
    wantErr: true
  - name: uppercase V
    raw: V0.1.0
    wantErr: true

# Version.Kind()/Base()/IsRC() over a valid (already-constructed) version
version_kind:
  - raw: v0.1.0
    wantKind: final
    wantBase: v0.1.0
    wantRC: false
  - raw: v0.1.0-rc1
    wantKind: rc
    wantBase: v0.1.0
    wantRC: true
  - raw: v3.2.1-rc9
    wantKind: rc
    wantBase: v3.2.1
    wantRC: true

# ParseReleaseTitle(title) -> (Version, Kind)
parse_title:
  - name: rc
    title: "release(v0.1.0-rc1): first release candidate"
    wantVer: v0.1.0-rc1
    wantKind: rc
  - name: final
    title: "release(v0.1.0): first stable release"
    wantVer: v0.1.0
    wantKind: final
  - name: final multi-digit
    title: "release(v10.20.30): big one"
    wantVer: v10.20.30
    wantKind: final

  # must-fail grammar set
  - name: bad prefix released
    title: "released(v0.1.0): typo"
    wantErr: true
  - name: no parens
    title: "release v0.1.0: x"
    wantErr: true
  - name: missing v
    title: "release(0.1.0): x"
    wantErr: true
  - name: rc without number
    title: "release(v0.1.0-rc): x"
    wantErr: true
  - name: missing colon-space separator
    title: "release(v0.1.0):x"
    wantErr: true
  - name: missing subject and separator
    title: "release(v0.1.0)"
    wantErr: true
  - name: pkg schema in scope
    title: "release(pkg/schema/v1.2.3): x"
    wantErr: true
  - name: garbage
    title: "chore: bump deps"
    wantErr: true
  - name: empty
    title: ""
    wantErr: true
  - name: leading space
    title: " release(v0.1.0): x"
    wantErr: true

# ParseTag(tag) -> (Version, Kind); pkg/schema/v* must NEVER parse as a release
parse_tag:
  - name: final
    tag: v0.1.0
    wantVer: v0.1.0
    wantKind: final
  - name: rc
    tag: v0.1.0-rc1
    wantVer: v0.1.0-rc1
    wantKind: rc

  # must-fail grammar set
  - name: pkg/schema namespaced
    tag: pkg/schema/v1.2.3
    wantErr: true
  - name: rc without number
    tag: v0.1.0-rc
    wantErr: true
  - name: missing v
    tag: "0.1.0"
    wantErr: true
  - name: garbage
    tag: latest
    wantErr: true
  - name: empty
    tag: ""
    wantErr: true
