cases:
  - name: green ancestor rc proceeds
    input:
      final: v0.1.0
      rcs: [{tag: v0.1.0-rc1, runGreen: true, isAncestor: true}]
    expected: {}
    classification: must-pass
    provenance: {source: requirement, ref: final-rc-ancestry}
    mutation: {description: supplies one green same-version ancestor rc}
  - name: one qualifying rc proceeds
    input:
      final: v0.1.0
      rcs:
        - {tag: v0.1.0-rc1, runGreen: false, isAncestor: true}
        - {tag: v0.1.0-rc2, runGreen: true, isAncestor: true}
    expected: {}
    classification: must-pass
    provenance: {source: boundary, ref: multiple-rcs}
    mutation: {description: adds a qualifying rc after a failed candidate}
  - name: no rc is blocked
    input: {final: v0.1.0}
    expected: {errorContains: no same-version release candidate}
    classification: must-fail
    provenance: {source: requirement, ref: final-rc-ancestry}
    mutation: {description: removes every same-version rc}
  - name: non-green rc is blocked
    input:
      final: v0.1.0
      rcs: [{tag: v0.1.0-rc1, runGreen: false, isAncestor: true}]
    expected: {errorContains: not green}
    classification: must-fail
    provenance: {source: requirement, ref: workflow-status}
    mutation: {description: changes the ancestor rc run from green to failed}
  - name: non-ancestor rc is blocked
    input:
      final: v0.1.0
      rcs: [{tag: v0.1.0-rc1, runGreen: true, isAncestor: false}]
    expected: {errorContains: not an ancestor}
    classification: must-fail
    provenance: {source: requirement, ref: final-rc-ancestry}
    mutation: {description: moves the green rc off the final lineage}
  - name: different-base rc is blocked
    input:
      final: v0.2.0
      rcs: [{tag: v0.1.0-rc1, runGreen: true, isAncestor: true}]
    expected: {errorContains: no same-version release candidate}
    classification: must-fail
    provenance: {source: boundary, ref: same-version}
    mutation: {description: changes the final base version away from the rc}
  - name: rc input is rejected
    input: {final: v0.1.0-rc1}
    expected: {errorContains: non-final version}
    classification: must-fail
    provenance: {source: boundary, ref: final-only}
    mutation: {description: changes the requested final to an rc}
  - name: fresh exact initial final proceeds
    input: {final: v1.0.0, initialFinal: v1.0.0}
    expected: {}
    classification: must-pass
    provenance: {source: requirement, ref: initial-final-bootstrap}
    mutation: {description: configures the exact requested final with no prior releases}
  - name: wrong initial final is blocked
    input: {final: v1.0.1, initialFinal: v1.0.0}
    expected: {errorContains: exact configured final v1.0.0}
    classification: must-fail
    provenance: {source: requirement, ref: exact-initial-final}
    mutation: {description: changes the requested version away from the configured initial final}
  - name: existing release self-disables bootstrap
    input: {final: v1.0.0, initialFinal: v1.0.0, priorReleases: [v1.0.0]}
    expected: {errorContains: no same-version release candidate}
    classification: must-fail
    provenance: {source: requirement, ref: bootstrap-self-disable}
    mutation: {description: adds the configured initial final to prior repository releases}
  - name: later final still requires rc ancestry
    input:
      final: v1.1.0
      initialFinal: v1.0.0
      priorReleases: [v1.0.0]
      rcs: [{tag: v1.1.0-rc2, runGreen: true, isAncestor: true}]
    expected: {}
    classification: must-pass
    provenance: {source: requirement, ref: later-final-rc-ancestry}
    mutation: {description: adds a green ancestor rc for a final after bootstrap}
  - name: rc cannot configure initial final
    input: {final: v1.0.0, initialFinal: v1.0.0-rc1}
    expected: {errorContains: policy is invalid}
    classification: must-fail
    provenance: {source: boundary, ref: exact-final-policy}
    mutation: {description: changes the configured initial final to an rc}
