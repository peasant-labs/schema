jobs:
  guard:
    runs-on: ubuntu-latest
  nix-vendor-hash:
    needs: guard
    runs-on: ubuntu-latest
  contract-gates:
    needs: [guard, nix-vendor-hash]
    runs-on: ubuntu-latest
  npm-publish:
    needs: [guard, nix-vendor-hash, contract-gates]
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@peasant-labs/schema
    permissions:
      id-token: write
  release:
    needs: [guard, nix-vendor-hash, contract-gates]
    runs-on: ubuntu-latest
