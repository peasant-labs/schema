jobs:
  guard:
    runs-on: ubuntu-latest
  nix-vendor-hash:
    needs: guard
    runs-on: ubuntu-latest
  contract-gates:
    needs: [guard, nix-vendor-hash]
    runs-on: ubuntu-latest
  npm-publish:
    needs: [guard, nix-vendor-hash, contract-gates]
    runs-on: ubuntu-latest
    environment: npm-publish
  release:
    needs: [guard, nix-vendor-hash, contract-gates]
    runs-on: ubuntu-latest
