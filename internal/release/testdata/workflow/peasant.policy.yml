jobs:
  - name: guard
  - name: nix-vendor-hash
    needs: [guard]
  - name: e2e
    needs: [guard, nix-vendor-hash]
    reusable:
      uses: ./.github/workflows/e2e.yml
      secretsInherit: true
      forbidIf: true
  - name: release-e2e
    needs: [guard, nix-vendor-hash]
    reusable:
      uses: ./.github/workflows/release-e2e.yml
      secretsInherit: true
      forbidIf: true
  - name: release
    needs: [guard, nix-vendor-hash, e2e, release-e2e]
