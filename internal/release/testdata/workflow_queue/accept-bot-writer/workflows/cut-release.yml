name: Cut release
on:
  workflow_dispatch:
    inputs:
      level:
        description: Release level
        type: choice
        options: [patch, minor]
concurrency:
  group: cut-release-${{ github.ref }}
jobs:
  cut:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - id: mint
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_KEY }}
      - env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: git push origin HEAD:automation/cut-release
