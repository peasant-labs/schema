# Queue policy for the accept-everything repo: two required contexts, the
# release job with its branch and pre-tag steps in verdict order, and the two
# bot jobs on their own branches.
jobs:
  - name: guard
queue:
  required:
    - { context: merge-gate, workflow: ci.yml, job: merge-gate, aggregator: true }
    - { context: title-guard, workflow: title-guard.yml, job: title-guard, guard: true }
  release_job:
    workflow: release-batch.yml
    job: release
    branch: automation/release
    pre_tag_steps: [verify-contract, verify-freeze]
  bot_jobs:
    - { workflow: cut-release.yml, job: cut, branch: automation/cut-release }
    - { workflow: nix-vendor-hash.yml, job: update, branch: automation/vendor-hash }
