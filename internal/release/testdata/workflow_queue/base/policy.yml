# Queue policy for the fixture repo: two required contexts, the release job
# with its pre-tag steps in verdict order, and the two bot jobs by kind. The
# branches live in release-intent.yaml bot_branches, the one source.
jobs:
  - name: guard
queue:
  required:
    - { context: merge-gate, workflow: ci.yml, job: merge-gate, aggregator: true }
    - { context: title-guard, workflow: title-guard.yml, job: title-guard, guard: true }
  release_job:
    workflow: release-batch.yml
    job: release
    pre_tag_steps: [verify-contract, verify-freeze]
  bot_jobs:
    - { workflow: cut-release.yml, job: cut, kind: cut-release }
    - { workflow: nix-vendor-hash.yml, job: update, kind: vendor-hash }
