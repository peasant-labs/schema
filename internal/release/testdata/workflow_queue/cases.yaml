# Merge-queue workflow policy corpus: the base tree plus one small overlay per
# case. The harness copies base/ into a temp dir, applies the case overlay,
# and runs the production CheckWorkflows over it. A must-pass case must yield
# no diagnostics; a must-fail case must trip only its expected rule, with
# every want_contains fragment in the diagnostics. Every must-fail row names
# its accept sibling, which proves the sample fails for the one fault it names
# and not for an unrelated input error.
#
# required_names is the manifest: every case must be listed and every listed
# case must exist, so a dropped or stray sample fails loudly.
required_names:
  - accept-required-contexts
  - accept-merge-group
  - accept-concurrency
  - accept-release-actions
  - accept-title-guard
  - accept-range-floor
  - accept-no-default-branch-push
  - accept-token-mint
  - accept-unfiltered
  - accept-merge-gate-reports
  - accept-titles-plain
  - accept-cut-release
  - accept-tool-pin
  - accept-classify
  - accept-no-release-job
  - accept-cut-release-arm
  - accept-vendor-hash-arm-close
  - reject-required-contexts-missing-file
  - reject-required-contexts-missing-job
  - reject-merge-group-missing
  - reject-concurrency-pr-number-group
  - reject-concurrency-cancel-true
  - reject-concurrency-job-cancel
  - reject-release-actions-write-no-if
  - reject-release-actions-tag-second-job
  - reject-release-actions-verdict-missing-step
  - reject-release-actions-verdict-conclusion
  - reject-release-actions-pretag-or-true
  - reject-release-actions-pretag-script
  - reject-release-actions-no-status-function
  - reject-release-actions-push-no-push-test
  - reject-release-actions-arm-no-gate
  - reject-release-actions-disjunction
  - reject-release-actions-tagmode-ne
  - reject-title-guard-no-entry
  - reject-title-guard-job-if
  - reject-title-guard-event-action
  - reject-range-floor-missing
  - reject-no-push-cross-push
  - reject-no-push-cross-branch
  - reject-no-push-dup-kind
  - reject-no-push-unknown-kind
  - reject-no-push-tag-outside
  - reject-cut-release-trigger
  - reject-cut-release-level
  - reject-cut-release-no-tagmode
  - reject-token-mint-no-refcheck
  - reject-token-mint-run-only
  - reject-token-mint-no-tagmode
  - reject-tool-pin-tag
  - reject-tool-pin-mismatch
  - reject-classify-literal
  - reject-classify-no-call
  - reject-unfiltered
  - reject-merge-gate-always
  - reject-titles-interpolated
cases:
  - name: accept-required-contexts
    input: { overlay: "" }
    expected: { rule: "required-contexts", want_contains: [] }
    sibling: ""
    classification: must-pass
    provenance: { source: requirement, ref: "schema#226 merge-queue policy required-contexts" }
