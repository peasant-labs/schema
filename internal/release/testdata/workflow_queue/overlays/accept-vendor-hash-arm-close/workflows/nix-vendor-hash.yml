name: Vendor hash
on:
  push:
    branches: [develop]
  workflow_dispatch:
  schedule:
    - cron: "11 * * * *"
concurrency:
  group: vendor-hash-${{ github.ref }}
jobs:
  update:
    if: github.ref == 'refs/heads/develop' && vars.RELEASE_BATCH_MODE == 'tag'
    runs-on: ubuntu-latest
    steps:
      - id: mint
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_KEY }}
      - env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: git push origin HEAD:automation/vendor-hash
      - env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: gh pr create --head automation/vendor-hash --base develop --title "vendor" --body "bot"
      - id: arm
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: gh pr merge automation/vendor-hash --auto
      - id: close
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: gh pr close automation/vendor-hash
