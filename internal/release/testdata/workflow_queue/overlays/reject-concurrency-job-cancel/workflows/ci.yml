name: CI
on:
  pull_request:
  merge_group:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lib:
    runs-on: ubuntu-latest
    steps:
      - run: make lib
  merge-gate:
    if: always()
    needs: [lib]
    runs-on: ubuntu-latest
    concurrency:
      group: ci-job-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - run: echo gate
