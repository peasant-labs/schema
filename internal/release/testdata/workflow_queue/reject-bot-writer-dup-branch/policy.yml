# Queue policy with two bot jobs on the same branch: the fault
# bot-branch-one-writer guards against.
jobs:
  - name: guard
queue:
  required:
    - { context: title-guard, workflow: title-guard.yml, job: title-guard, guard: true }
  bot_jobs:
    - { workflow: cut-release.yml, job: cut, branch: automation/vendor }
    - { workflow: vendor.yml, job: update, branch: automation/vendor }
