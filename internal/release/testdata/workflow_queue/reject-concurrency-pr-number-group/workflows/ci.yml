name: CI
on:
  pull_request:
  merge_group:
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  lib:
    runs-on: ubuntu-latest
    steps:
      - run: make lib
  merge-gate:
    if: always()
    needs: [lib]
    runs-on: ubuntu-latest
    steps:
      - run: echo gate
