name: Title guard
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
concurrency:
  group: title-guard-${{ github.run_id }}
jobs:
  title-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check title
        if: github.event.action == 'edited'
        run: release-intent check-title --base x --head y --author z
