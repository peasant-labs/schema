name: Title guard
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
concurrency:
  group: title-guard-${{ github.run_id }}
jobs:
  title-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check title
        run: release-intent check-title --base ${{ github.event.pull_request.base.sha }} --head y --author z
