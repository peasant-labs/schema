# Queue policy with no guard entry: the fault
# title-guard-no-early-success guards against.
jobs:
  - name: guard
queue:
  required:
    - { context: merge-gate, workflow: ci.yml, job: merge-gate, aggregator: true }
    - { context: title-guard, workflow: title-guard.yml, job: title-guard }
  bot_jobs:
    - { workflow: vendor.yml, job: update, branch: automation/vendor }
