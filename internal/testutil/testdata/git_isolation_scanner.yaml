# Synthetic modules for the git-isolation scanner. Each case's input is a file
# tree written to a temporary directory; expected lists the test packages
# (directories relative to the module root, "." for the root) that need the
# isolation and those that lack it. must-fail cases report at least one
# violation; must-pass cases report none.
cases:
  - name: a test that runs git with the isolating TestMain passes
    input:
      files:
        go.mod: "module example.com/m\n\ngo 1.25\n"
        tool/tool_test.go: |
          package tool

          import (
          	"os/exec"
          	"testing"
          )

          func TestGit(t *testing.T) { _ = exec.Command("git", "status") }
        tool/main_test.go: |
          package tool

          import (
          	"os"
          	"testing"

          	"example.com/m/internal/testutil"
          )

          func TestMain(m *testing.M) { os.Exit(testutil.RunWithIsolatedGitConfig(m)) }
    expected:
      needs: [tool]
    classification: must-pass
    provenance:
      source: requirement
      ref: "every package whose tests run git has a package-level TestMain isolation"
    mutation:
      description: "the isolated package, unmodified"
  - name: a test that runs git without a TestMain is rejected
    input:
      files:
        go.mod: "module example.com/m\n\ngo 1.25\n"
        tool/tool_test.go: |
          package tool

          import (
          	"os/exec"
          	"testing"
          )

          func TestGit(t *testing.T) { _ = exec.Command("git", "commit") }
    expected:
      needs: [tool]
      violations: [tool]
    classification: must-fail
    provenance:
      source: bug
      ref: "cmd/schema-gen report tests committed with the developer's commit.gpgsign and timed out in gpg"
    mutation:
      description: "removed the isolating TestMain"
  - name: a TestMain that does not call the isolation is rejected
    input:
      files:
        go.mod: "module example.com/m\n\ngo 1.25\n"
        tool/tool_test.go: |
          package tool

          import (
          	"os"
          	"os/exec"
          	"testing"
          )

          func TestMain(m *testing.M) { os.Exit(m.Run()) }

          func TestGit(t *testing.T) { _ = exec.Command("git", "commit") }
    expected:
      needs: [tool]
      violations: [tool]
    classification: must-fail
    provenance:
      source: boundary
      ref: "a TestMain alone does not isolate git configuration"
    mutation:
      description: "replaced the isolation call with a bare m.Run"
  - name: a test that drives production code which runs git is rejected without isolation
    input:
      files:
        go.mod: "module example.com/m\n\ngo 1.25\n"
        tool/report.go: |
          package tool

          import "os/exec"

          func Revision() ([]byte, error) { return exec.Command("git", "rev-parse", "HEAD").Output() }
        tool/report_test.go: |
          package tool

          import "testing"

          func TestRevision(t *testing.T) { _, _ = Revision() }
    expected:
      needs: [tool]
      violations: [tool]
    classification: must-fail
    provenance:
      source: requirement
      ref: "tests that call production code which runs git need the isolation too"
    mutation:
      description: "moved the git call from the test into the package's production code"
  - name: a test that imports another package which reaches git is rejected without isolation
    input:
      files:
        go.mod: "module example.com/m\n\ngo 1.25\n"
        gitx/gitx.go: |
          package gitx

          import "os/exec"

          func Head() ([]byte, error) { return exec.Command("git", "rev-parse", "HEAD").Output() }
        wrap/wrap.go: |
          package wrap

          import "example.com/m/gitx"

          func Head() ([]byte, error) { return gitx.Head() }
        app/app_test.go: |
          package app_test

          import (
          	"testing"

          	"example.com/m/wrap"
          )

          func TestHead(t *testing.T) { _, _ = wrap.Head() }
    expected:
      needs: [app]
      violations: [app]
    classification: must-fail
    provenance:
      source: requirement
      ref: "tests that call production code which runs git need the isolation too"
    mutation:
      description: "reached the git call through two module-local imports"
  - name: packages that start no process need no isolation
    input:
      files:
        go.mod: "module example.com/m\n\ngo 1.25\n"
        types.go: |
          package m

          type Wire struct{ Git string }
        types_test.go: |
          package m

          import "testing"

          func TestWire(t *testing.T) { _ = Wire{Git: "git"} }
        gitx/gitx.go: |
          package gitx

          import "os/exec"

          func Head() ([]byte, error) { return exec.Command("git", "rev-parse", "HEAD").Output() }
    expected:
      needs: []
    classification: must-pass
    provenance:
      source: boundary
      ref: "the word git in data and production packages without tests do not need test isolation"
    mutation:
      description: "a package that only mentions git in data, beside an untested package that runs it"
  - name: nested modules and testdata are not scanned
    input:
      files:
        go.mod: "module example.com/m\n\ngo 1.25\n"
        tools/gen/go.mod: "module example.com/gen\n\ngo 1.25\n"
        tools/gen/gen_test.go: |
          package gen

          import (
          	"os/exec"
          	"testing"
          )

          func TestGit(t *testing.T) { _ = exec.Command("git", "status") }
        pkg/testdata/sample_test.go: |
          package sample

          import (
          	"os/exec"
          	"testing"
          )

          func TestGit(t *testing.T) { _ = exec.Command("git", "status") }
    expected:
      needs: []
    classification: must-pass
    provenance:
      source: boundary
      ref: "a nested module runs its own tests; testdata is not compiled"
    mutation:
      description: "placed unisolated git tests in a nested module and under testdata"
