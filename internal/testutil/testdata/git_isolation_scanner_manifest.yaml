# Required case names for git_isolation_scanner.yaml. Adding or removing a case
# updates this list in the same change.
requiredNames:
  - a test that runs git with the isolating TestMain passes
  - an isolating TestMain in the external test package passes
  - a test that runs git without a TestMain is rejected
  - a TestMain that does not call the isolation is rejected
  - an isolating TestMain behind a build constraint is rejected
  - packages that start no process need no isolation
  - nested modules and testdata are not scanned
  - isolation after running tests is rejected
  - discarded isolation result is rejected
  - discarded exit code is rejected
  - deferred isolation exit is rejected
  - a prelude before the isolated exit passes
  - competing exit before isolation is rejected
  - competing goleak runner is rejected
  - helper package alone is exempt
  - other package in helper module is not exempt
  - same helper directory in another module is not exempt
