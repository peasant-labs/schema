# Code generated by cmd/gen-license-corpus; DO NOT EDIT.
# Regenerate: go generate ./... (or go run ./cmd/gen-license-corpus).
# Source of truth: schema.AllLicenses (types.go). Widening the menu without
# regenerating this corpus reddens the exhaustive-coverage test.
cases:
    - name: license CC0-1.0 is valid
      input: CC0-1.0
      expected: true
      classification: must-pass
      provenance:
        source: enum
        ref: schema.AllLicenses (types.go)
      mutation:
        description: removing CC0-1.0 from the AllLicenses menu (or its SQLite CHECK mirror) would reject a license the wire still accepts.
    - name: license CC-BY-4.0 is valid
      input: CC-BY-4.0
      expected: true
      classification: must-pass
      provenance:
        source: enum
        ref: schema.AllLicenses (types.go)
      mutation:
        description: removing CC-BY-4.0 from the AllLicenses menu (or its SQLite CHECK mirror) would reject a license the wire still accepts.
    - name: license CC-BY-SA-4.0 is valid
      input: CC-BY-SA-4.0
      expected: true
      classification: must-pass
      provenance:
        source: enum
        ref: schema.AllLicenses (types.go)
      mutation:
        description: removing CC-BY-SA-4.0 from the AllLicenses menu (or its SQLite CHECK mirror) would reject a license the wire still accepts.
    - name: the non-menu value "MIT" is rejected
      input: MIT
      expected: false
      classification: must-fail
      provenance:
        source: enum
        ref: schema.License.IsValid (types.go)
      mutation:
        description: accepting "MIT" would silently widen the closed license menu beyond AllLicenses.
    - name: the empty license is rejected
      input: ""
      expected: false
      classification: must-fail
      provenance:
        source: enum
        ref: schema.License.IsValid (types.go)
      mutation:
        description: accepting the empty license would admit an unset value the closed menu never lists.
