required_names: [grouped-session-list, grouped-search, grouped-sync, flat-transcript-read, transcript-segment-directory, transcript-segment-read, transcript-window-descriptor, scoped-helper-members, recorded-session-commits, detected-session-pull-requests, quality-page]
routes:
  cases:
  - name: grouped-session-list
    input: {path: /api/v1/sessions, operationId: listSessions}
    expected: {parameters: [{name: view, in: query, type: string, enum: [grouped]}], responseRefs: ["#/components/schemas/SchemaSessionsPayload", "#/components/schemas/SchemaLocalSessionListPayload"], requiredRoot: [items, nextItems, page, perPage, total, revision, ordinarySessionTotal, helperThreadTotal], nonnullArrays: [items, nextItems]}
    classification: must-pass
    provenance: {source: requirement, ref: "grouped list is opt-in and legacy flat list remains"}
    mutation: {description: "binds the grouped view alongside the legacy response"}
  - name: grouped-search
    input: {path: /api/v1/search, operationId: searchMessages}
    expected: {parameters: [{name: q, in: query, type: string, required: true}, {name: limit, in: query, type: integer}, {name: view, in: query, type: string, enum: [grouped]}], responseRefs: ["#/components/schemas/SearchPayload", "#/components/schemas/SchemaLocalSessionListPayload"]}
    classification: must-pass
    provenance: {source: requirement, ref: "search retains matches on grouped rows"}
    mutation: {description: "adds grouped view without removing the legacy search response"}
  - name: grouped-sync
    input: {path: /api/v1/sync/sessions, operationId: listSyncSessionsGrouped}
    expected:
      parameters: [{name: view, in: query, type: string, enum: [grouped, home, project-options]}, {name: maxItems, in: query, type: integer, minimum: 0}, {name: page, in: query, type: integer, minimum: 1}, {name: pageToken, in: query, type: string}, {name: parentSessionId, in: query, type: string}, {name: projectHash, in: query, type: string}, {name: publication, in: query, type: string, enum: [all, not-published, published, auto]}]
      responseRefs: ["#/components/schemas/LocalSyncSessionsPayload", "#/components/schemas/SchemaLocalSessionListPayload", "#/components/schemas/LocalSyncSessionPage", "#/components/schemas/LocalSyncProjectOptions"]
      legacyBody: '{"sessions":[{"id":"s1","harness":"codex","projectName":"p","projectHash":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","hostSlug":"host","startTime":"2026-09-08T00:00:00Z","durationMs":42,"totalTokens":9,"turnCount":5,"model":"m","syncStatus":"new"}]}'
      groupedBody: '{"items":[],"nextItems":[],"page":1,"perPage":25,"total":0,"revision":"0","ordinarySessionTotal":0,"helperThreadTotal":0}'
    classification: must-pass
    provenance: {source: requirement, ref: "sync chooser grouped route"}
    mutation: {description: "binds sync-specific rows to the grouped payload"}
  - name: flat-transcript-read
    input: {path: "/api/v1/sessions/{id}/transcript", operationId: getSessionTranscript}
    expected: {parameters: [{name: id, in: path, type: string, required: true}], responseRefs: ["#/components/schemas/SchemaSessionDetailReadPayload"], requiredRoot: [id, turns], forbiddenRoot: [detail, sessionDetail]}
    classification: must-pass
    provenance: {source: requirement, ref: "flat additive transcript read"}
    mutation: {description: "returns the embedded read DTO with root detail fields"}
  - name: transcript-segment-directory
    input: {path: "/api/v1/sessions/{id}/transcript/segments", operationId: getSessionTranscriptSegments}
    expected:
      parameters: [{name: page, in: query, type: integer, minimum: 1}, {name: revision, in: query, type: string}, {name: id, in: path, type: string, required: true}]
      responseRefs: ["#/components/schemas/SchemaTranscriptSegmentDirectory"]
      requiredRoot: [sessionId, revision, totalTurns, totalSegments, segments]
      nonnullArrays: [segments]
      forbiddenRoot: [turns]
    classification: must-pass
    provenance: {source: requirement, ref: "the directory is the transcript's only global index"}
    mutation: {description: "declares the paged directory with no turn content"}
  - name: transcript-segment-read
    input: {path: "/api/v1/sessions/{id}/transcript/segments/{index}", operationId: getSessionTranscriptSegment}
    expected:
      parameters: [{name: revision, in: query, type: string}, {name: id, in: path, type: string, required: true}, {name: index, in: path, type: integer, minimum: 0, required: true}]
      responseRefs: ["#/components/schemas/SchemaTranscriptSegment"]
      requiredRoot: [index, revision, firstTurn, lastTurn, byteLength, hasOlder, hasNewer, turns]
      nonnullArrays: [turns]
    classification: must-pass
    provenance: {source: requirement, ref: "one segment's whole turns addressed by its directory ordinal"}
    mutation: {description: "declares the transport unit that carries one segment's turns"}
  - name: transcript-window-descriptor
    input: {path: "/api/v1/sessions/{id}/transcript/window", operationId: getSessionTranscriptWindow}
    expected:
      parameters: [{name: anchor, in: query, type: integer, minimum: 0, required: true}, {name: span, in: query, type: integer, minimum: 1}, {name: revision, in: query, type: string}, {name: id, in: path, type: string, required: true}]
      responseRefs: ["#/components/schemas/SchemaTranscriptWindow"]
      requiredRoot: [sessionId, revision, requestedAnchor, anchorTurn, span, firstTurn, lastTurn, segments, hasOlder, hasNewer]
      nonnullArrays: [segments]
      forbiddenRoot: [turns, content, toolCalls]
    classification: must-pass
    provenance: {source: requirement, ref: "the window read answers a descriptor and never turn content"}
    mutation: {description: "declares the descriptor that names its covering segment run"}
  - name: scoped-helper-members
    input: {path: "/api/v1/session-groups/{groupId}/members", operationId: listLocalHelperGroupMembers}
    expected: {parameters: [{name: scope, in: query, type: string, required: true}, {name: page, in: query, type: integer, minimum: 1}, {name: perPage, in: query, type: integer, enum: [25, 50, 100]}, {name: groupId, in: path, type: string, required: true}], responseRefs: ["#/components/schemas/SchemaLocalHelperMembersPayload"], requiredRoot: [members, nextItems, page, perPage, total, revision], nonnullArrays: [members, nextItems]}
    classification: must-pass
    provenance: {source: requirement, ref: "bounded helper member operation"}
    mutation: {description: "requires opaque scope and accepts only paging inputs"}
  - name: recorded-session-commits
    input: {path: "/api/v1/sessions/{id}/commits", operationId: getSessionCommits}
    expected: {parameters: [{name: id, in: path, type: string, required: true}], responseRefs: ["#/components/schemas/SchemaSessionCommitsResponse"], requiredRoot: [commits], nonnullArrays: [commits]}
    classification: must-pass
    provenance: {source: requirement, ref: "the session's recorded commit binding is readable on its own"}
    mutation: {description: "declares the recorded commit binding as a session read"}
  - name: detected-session-pull-requests
    input: {path: "/api/v1/sessions/{id}/pull-requests", operationId: getSessionPullRequests}
    expected: {parameters: [{name: id, in: path, type: string, required: true}], responseRefs: ["#/components/schemas/SchemaSessionPullRequestsResponse"], requiredRoot: [pullRequests], nonnullArrays: [pullRequests]}
    classification: must-pass
    provenance: {source: requirement, ref: "pull requests detected in the session's own calls are display-only evidence"}
    mutation: {description: "declares detected pull requests as a session read that carries no repository state"}
  - name: quality-page
    input: {path: /api/v1/quality, operationId: getQualityPage}
    expected: {parameters: [{name: page, in: query, type: integer, minimum: 1}, {name: maxItems, in: query, type: integer, minimum: 0}], responseRefs: ["#/components/schemas/SchemaQualityPage"], requiredRoot: [items, nextItems, page, perPage, total, revision, summary], nonnullArrays: [items, nextItems]}
    classification: must-pass
    provenance: {source: requirement, ref: "the quality read is one offset page beside the library-wide summary"}
    mutation: {description: "declares the quality page with the summary beside its offset rows"}
