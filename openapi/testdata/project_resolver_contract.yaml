contract:
  path: /api/v1/projects/resolve
  method: get
  operation_id: resolveProject
  query_name: name
  response_status: "200"
  media_type: application/json
  response_ref: "#/components/schemas/SchemaProjectResolutionPayload"
  response_component: SchemaProjectResolutionPayload
  required_properties: [project, projectHash]
  project_hash_property: projectHash
  project_hash_ref: "#/components/schemas/SchemaProjectHash"
  project_hash_component: SchemaProjectHash
  project_hash_pattern: "^[0-9a-f]{64}$"
  project_hash_min_length: 64
  project_hash_max_length: 64
  example_project_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
mutations:
  cases:
    - name: missing_operation_is_rejected
      input: {kind: remove-operation}
      expected: false
      classification: must-fail
      provenance: {source: requirement, ref: project resolver exact operation identity}
      mutation: {description: removes the resolver GET operation}
    - name: redirected_operation_id_is_rejected
      input: {kind: redirect-operation-id, target: unexpectedResolver}
      expected: false
      classification: must-fail
      provenance: {source: requirement, ref: project resolver exact operation identity}
      mutation: {description: redirects the resolver to a different operation identity}
    - name: optional_name_query_is_rejected
      input: {kind: make-query-optional}
      expected: false
      classification: must-fail
      provenance: {source: requirement, ref: saved routes require an exact project display identity}
      mutation: {description: makes the name query optional}
    - name: redirected_response_is_rejected
      input: {kind: redirect-response, target: "#/components/schemas/SchemaProjectSummariesPayload"}
      expected: false
      classification: must-fail
      provenance: {source: requirement, ref: project resolver response contract}
      mutation: {description: points the 200 response at the project list payload}
    - name: missing_required_hash_is_rejected
      input: {kind: remove-required-property, target: projectHash}
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: resolver responses always carry canonical project identity}
      mutation: {description: removes projectHash from the response required set}
    - name: loosened_hash_pattern_is_rejected
      input: {kind: change-hash-pattern, target: ".+"}
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: ProjectHash is 64-character lowercase hex}
      mutation: {description: accepts arbitrary project hash strings}
