cases:
  - name: collective detail compatible group record
    input:
      component: VillageCollectiveDetailRecord
      required: [id, name, description, creator, created_at, updated_at, acceptance_mode, data_access, linked_github_org, display_members, transcript_deletion_policy]
      optional: [post_prompts_check, prompts_check_mode]
      nullable: [description, linked_github_org, post_prompts_check, prompts_check_mode]
      nonnullable: [id, name, creator, created_at, updated_at, acceptance_mode, data_access, display_members, transcript_deletion_policy]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: compatible collective read settings}
    mutation: {description: preserves every released base field without fabricating unavailable prompts facts}
  - name: session detail payload
    input:
      component: SessionDetailPayload
      required: [id, harness, turns]
      optional: [schemaVersion, scorecard]
      nullable: [turns, scorecard]
      nonnullable: [id, harness, schemaVersion]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: Go JSON tags are the canonical Types presence contract}
    mutation: {description: contrasts required identity and turn fields with optional push and score fields}
  - name: unified metadata
    input:
      component: UnifiedMetadata
      required: [schemaVersion, parentUuid, diagnostics]
      optional: [cwd, derivedAt, adapterVersion]
      nullable: [parentUuid, derivedAt]
      nonnullable: [schemaVersion, diagnostics, cwd, adapterVersion]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: Go JSON tags are the canonical Types presence contract}
    mutation: {description: covers a required nullable pointer and optional metadata fields}
  - name: publish request
    input:
      component: PublishRequest
      required: [identity, model, diagnostics]
      optional: [quality, license]
      nullable: [quality]
      nonnullable: [identity, model, diagnostics, license]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: Go JSON tags are the canonical Types presence contract}
    mutation: {description: contrasts required composites with optional publication fields}
  - name: transcript content
    input:
      component: TranscriptContent
      required: [contractVersion, kind]
      optional: [sessionDetail]
      nullable: [sessionDetail]
      nonnullable: [contractVersion, kind]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: Go JSON tags are the canonical Types presence contract}
    mutation: {description: contrasts envelope discriminators with optional payload content}
  - name: channel subscription
    input:
      component: ChannelSubscription
      required: [topic]
      optional: [id, axis]
      nullable: []
      nonnullable: [topic, id, axis]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: Go JSON tags are the canonical Types presence contract}
    mutation: {description: contrasts the required topic with topic-specific selectors}
  - name: review timeline payload
    input:
      component: ReviewListPayload
      required: [projectHash, changes, recentCommits, sessions, rewrittenCommits, repoFound]
      optional: [defaultBranch]
      nullable: []
      nonnullable: [projectHash, changes, recentCommits, sessions, rewrittenCommits, repoFound, defaultBranch]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: timeline collections are required non-null arrays}
    mutation: {description: contrasts required timeline arrays with the optional default branch label}
  - name: commit session bindings
    input:
      component: CommitRef
      required: [hash, subject, hasSession, sessionIds, associations]
      optional: [timeMs]
      nullable: [timeMs]
      nonnullable: [hash, subject, hasSession, sessionIds, associations]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: authoritative commit bindings are a required non-null array}
    mutation: {description: contrasts required binding identity with an optional commit timestamp}
  - name: session association observations
    input:
      component: SessionAssociation
      required: [id, sessionId, conclusion, confidence, evidence]
      optional: []
      nullable: []
      nonnullable: [id, sessionId, conclusion, confidence, evidence]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: associations carry durable identity and required atomic observations}
    mutation: {description: "pins all association axes and the non-null evidence array"}
  - name: rewritten commit associations
    input:
      component: RewrittenCommit
      required: [ghostHash, subject, sessionIds, associations, resolution, method, confidence]
      optional: [authorTimeMs, successorHash]
      nullable: [authorTimeMs, successorHash]
      nonnullable: [ghostHash, subject, sessionIds, associations, resolution, method, confidence]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: rewrite ledger rows retain authoritative association arrays}
    mutation: {description: "contrasts required session-era association bindings with optional rewrite metadata"}
  - name: annotation association target
    input:
      component: AnnotationSummary
      required: [id, targetKind, isPrimary, annotatorKind, annotatorName, typeId, typeName, value, createdAt]
      optional: [targetAssociationId]
      nullable: [targetAssociationId]
      nonnullable: [id, targetKind, isPrimary, annotatorKind, annotatorName, typeId, typeName, value, createdAt]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: association annotations use an optional opaque target ID field}
    mutation: {description: "classifies the association target ID as optional and nullable on the generated wire schema"}
  - name: project resolution payload
    input:
      component: ProjectResolutionPayload
      required: [project, projectHash]
      optional: []
      nullable: []
      nonnullable: [project, projectHash]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: resolver responses always carry display and canonical identities}
    mutation: {description: pins both resolver fields as required non-null values}
  - name: transcript update request
    input:
      component: TranscriptUpdateRequest
      required: []
      optional: [title, description, visibility, license]
      nullable: []
      nonnullable: [title, description, visibility, license]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: "optional means leave unchanged and non-nullable means null cannot silently mean preserve"}
    mutation: {description: "pins all four owner-update properties on both the presence and nullability axes"}
  - name: turn detail
    input:
      component: TurnDetail
      required: [index, role, content, timestamp, depth]
      optional: [toolCalls, parentIndex, agentName, observedModel, command, entryType, hasThinking, stopReason, tokensIn, tokensOut]
      nullable: [parentIndex, command, stopReason, tokensIn, tokensOut]
      nonnullable: [index, role, content, timestamp, depth, toolCalls, agentName, observedModel, entryType, hasThinking]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: optional source-observed model identity and command invocation in the session-detail wire}
    mutation: {description: "pins observedModel and command as optional while retaining legacy turns without them"}
  - name: command invocation
    input:
      component: CommandInvocation
      required: [name]
      optional: [args]
      nullable: []
      nonnullable: [name, args]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: a skill invocation always names its command and may carry arguments}
    mutation: {description: contrasts the required name with the optional non-null args}
  - name: pull request attachment
    input:
      component: VillagePullRequestAttachment
      required: [id, owner, name, number, head_sha, is_private_repository, state, author, requested_by, comment_id, check_run_id, created_at, updated_at, confirmed_at, detached_at]
      optional: []
      nullable: [requested_by, comment_id, check_run_id, confirmed_at, detached_at]
      nonnullable: [id, owner, name, number, head_sha, is_private_repository, state, author, created_at, updated_at]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: Village rows are emitted whole with null for fields a state has not reached}
    mutation: {description: contrasts always-present identity with nullable lifecycle fields}
  - name: update user settings request
    input:
      component: VillageUpdateUserSettingsRequest
      required: []
      optional: [preview_before_attach]
      nullable: [preview_before_attach]
      nonnullable: []
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: an omitted setting is left unchanged}
    mutation: {description: a single optional boolean patch}
  - name: session pull request row
    input:
      component: SessionPullRequest
      required: [owner, repo, number, url, source]
      optional: []
      nullable: []
      nonnullable: [owner, repo, number, url, source]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: "a detected pull request row always carries its repository identity, address, and detector"}
    mutation: {description: "pins every session pull request field as required and non-null"}
  - name: local sync session page
    input:
      component: LocalSyncSessionPage
      required: [items, nextItems, page, perPage, total, revision]
      optional: [totals]
      nullable: []
      nonnullable: [items, nextItems, page, perPage, total, revision, totals]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: "generic embedding promotes the six offset fields and the page adds an optional root total"}
    mutation: {description: "contrasts the six required offset fields with the optional totals object"}
  - name: local flat session page
    input:
      component: LocalSessionPage
      required: [items, nextItems, page, perPage, total, revision]
      optional: []
      nullable: []
      nonnullable: [items, nextItems, page, perPage, total, revision]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: "the flat page is exactly the six offset fields"}
    mutation: {description: "pins the flat page as the six offset fields with no root total"}
  - name: session detail read payload
    input:
      component: SessionDetailReadPayload
      required: [id, harness, startTime, endTime, durationMins, totalTokens, tokensIn, tokensOut, turnCount, toolCallCount, turns]
      optional: [title, medians, revision, schemaVersion, teammate, owner, adapterVersion]
      nullable: [medians, teammate, turns]
      nonnullable: [id, harness, startTime, endTime, durationMins, totalTokens, tokensIn, tokensOut, turnCount, toolCallCount, title, revision, schemaVersion, owner, adapterVersion]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: "the durable read keeps its turn content and adds three optional local metadata fields plus the local owner and producer revision"}
    mutation: {description: "contrasts the required durable metadata and turns with the optional title, medians, revision, owner, and adapterVersion"}
  - name: local artifact identity
    input:
      component: LocalArtifactIdentity
      required: [kind]
      optional: [localOwnerId, villageUrl, villageUserId, claimId, username]
      nullable: []
      nonnullable: [kind, localOwnerId, villageUrl, villageUserId, claimId, username]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: "identity kind is required while each identity field is optional and non-null, so an absent identity is withheld rather than null"}
    mutation: {description: "pins kind as required and localOwnerId, villageUrl, villageUserId, claimId, and username as optional non-null fields"}
  - name: transcript turn row
    input:
      component: TranscriptTurn
      required: [index, role, content, timestamp, depth, truncated, byteLength]
      optional: [toolCalls, command, provenance, usage, agentName, controlKind, parentIndex, tokensIn, tokensOut, stopReason]
      nullable: [controlKind, parentIndex, tokensIn, tokensOut]
      nonnullable: [index, role, content, timestamp, depth, truncated, byteLength, toolCalls, command, provenance, usage, agentName, stopReason]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: "one turn row embeds the single TurnDetail definition plus its read facts"}
    mutation: {description: "pins the promoted TurnDetail required fields beside truncated and byteLength"}
  - name: session detail header payload
    input:
      component: SessionDetailHeaderPayload
      required: [id, harness, startTime, endTime, durationMins, totalTokens, tokensIn, tokensOut, turnCount, toolCallCount]
      optional: [relationshipNavigation, teammate, earlierHistory]
      nullable: [teammate]
      nonnullable: [id, harness, startTime, endTime, durationMins, totalTokens, tokensIn, tokensOut, turnCount, toolCallCount, relationshipNavigation, earlierHistory]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: "the metadata-only frame promotes the header fields and adds local navigation and teammate evidence"}
    mutation: {description: "contrasts the required header metadata with the optional local frame additions"}
  - name: local annotation row
    input:
      component: LocalAnnotationRow
      required: [id, targetKind, isPrimary, annotatorKind, annotatorName, typeId, typeName, value, createdAt]
      optional: [owner, author]
      nullable: []
      nonnullable: [id, targetKind, isPrimary, annotatorKind, annotatorName, typeId, typeName, value, createdAt, owner, author]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: "the row flattening the embedded AnnotationSummary must require the nine summary fields, not the Go field name"}
    mutation: {description: "pins the nine promoted summary fields as required and both identity projections as optional non-null"}
  - name: local owner
    input:
      component: LocalOwner
      required: [id, createdAt]
      optional: []
      nullable: []
      nonnullable: [id, createdAt]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: "one permanent local owner carries its identifier and creation time"}
    mutation: {description: "pins both local owner fields as required non-null"}
  - name: local claim entry
    input:
      component: LocalClaimEntry
      required: [id, localOwnerId, villageUrl, userId, username, source, claimedAt]
      optional: []
      nullable: []
      nonnullable: [id, localOwnerId, villageUrl, userId, username, source, claimedAt]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: "a claim entry reuses the account scope names and carries its source and claim time"}
    mutation: {description: "pins every claim entry field as required and non-null"}
  - name: local owner status
    input:
      component: LocalOwnerStatus
      required: [owner, claims, totalClaims, prompt, ownership]
      optional: [nextBefore]
      nullable: []
      nonnullable: [owner, claims, totalClaims, prompt, ownership, nextBefore]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: "the status always carries its owner, bounded claim page, total, prompt, and ownership counts"}
    mutation: {description: "contrasts the required status body with the optional older-page cursor"}
  - name: local owner claim prompt
    input:
      component: LocalOwnerClaimPrompt
      required: [state]
      optional: [account, decidedAt]
      nullable: []
      nonnullable: [state, account, decidedAt]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: "the server computes the prompt state and carries the account and decision only when they apply"}
    mutation: {description: "pins the required state with optional non-null account and decided time"}
  - name: local owner claim result
    input:
      component: LocalOwnerClaimResult
      required: [status, claimed, alreadyClaimed]
      optional: [claimId]
      nullable: []
      nonnullable: [status, claimed, alreadyClaimed, claimId]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: "the claim answer reports what the action did beside the recomputed status"}
    mutation: {description: "pins the required result counts and optional claim entry id"}
