cases:
  - name: session detail payload
    input:
      component: SessionDetailPayload
      required: [id, harness, turns]
      optional: [schemaVersion, scorecard]
      nullable: [turns, scorecard]
      nonnullable: [id, harness, schemaVersion]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: Go JSON tags are the canonical Types presence contract}
    mutation: {description: contrasts required identity and turn fields with optional push and score fields}
  - name: unified metadata
    input:
      component: UnifiedMetadata
      required: [schemaVersion, parentUuid, diagnostics]
      optional: [cwd, derivedAt]
      nullable: [parentUuid, derivedAt]
      nonnullable: [schemaVersion, diagnostics, cwd]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: Go JSON tags are the canonical Types presence contract}
    mutation: {description: covers a required nullable pointer and optional metadata fields}
  - name: publish request
    input:
      component: PublishRequest
      required: [identity, model, diagnostics]
      optional: [quality, license]
      nullable: [quality]
      nonnullable: [identity, model, diagnostics, license]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: Go JSON tags are the canonical Types presence contract}
    mutation: {description: contrasts required composites with optional publication fields}
  - name: transcript content
    input:
      component: TranscriptContent
      required: [contractVersion, kind]
      optional: [sessionDetail]
      nullable: [sessionDetail]
      nonnullable: [contractVersion, kind]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: Go JSON tags are the canonical Types presence contract}
    mutation: {description: contrasts envelope discriminators with optional payload content}
  - name: channel subscription
    input:
      component: ChannelSubscription
      required: [topic]
      optional: [id, axis]
      nullable: []
      nonnullable: [topic, id, axis]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: Go JSON tags are the canonical Types presence contract}
    mutation: {description: contrasts the required topic with topic-specific selectors}
  - name: review timeline payload
    input:
      component: ReviewListPayload
      required: [projectHash, changes, recentCommits, sessions, rewrittenCommits, repoFound]
      optional: [defaultBranch]
      nullable: []
      nonnullable: [projectHash, changes, recentCommits, sessions, rewrittenCommits, repoFound, defaultBranch]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: timeline collections are required non-null arrays}
    mutation: {description: contrasts required timeline arrays with the optional default branch label}
  - name: commit session bindings
    input:
      component: CommitRef
      required: [hash, subject, hasSession, sessionIds, associations]
      optional: [timeMs]
      nullable: [timeMs]
      nonnullable: [hash, subject, hasSession, sessionIds, associations]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: authoritative commit bindings are a required non-null array}
    mutation: {description: contrasts required binding identity with an optional commit timestamp}
  - name: session association observations
    input:
      component: SessionAssociation
      required: [id, sessionId, conclusion, confidence, evidence]
      optional: []
      nullable: []
      nonnullable: [id, sessionId, conclusion, confidence, evidence]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: associations carry durable identity and required atomic observations}
    mutation: {description: "pins all association axes and the non-null evidence array"}
  - name: rewritten commit associations
    input:
      component: RewrittenCommit
      required: [ghostHash, subject, sessionIds, associations, resolution, method, confidence]
      optional: [authorTimeMs, successorHash]
      nullable: [authorTimeMs, successorHash]
      nonnullable: [ghostHash, subject, sessionIds, associations, resolution, method, confidence]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: rewrite ledger rows retain authoritative association arrays}
    mutation: {description: "contrasts required session-era association bindings with optional rewrite metadata"}
  - name: annotation association target
    input:
      component: AnnotationSummary
      required: [id, targetKind, isPrimary, annotatorKind, annotatorName, typeId, typeName, value, createdAt]
      optional: [targetAssociationId]
      nullable: [targetAssociationId]
      nonnullable: [id, targetKind, isPrimary, annotatorKind, annotatorName, typeId, typeName, value, createdAt]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: association annotations use an optional opaque target ID field}
    mutation: {description: "classifies the association target ID as optional and nullable on the generated wire schema"}
  - name: project resolution payload
    input:
      component: ProjectResolutionPayload
      required: [project, projectHash]
      optional: []
      nullable: []
      nonnullable: [project, projectHash]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: resolver responses always carry display and canonical identities}
    mutation: {description: pins both resolver fields as required non-null values}
  - name: transcript update request
    input:
      component: TranscriptUpdateRequest
      required: []
      optional: [title, description, visibility, license]
      nullable: []
      nonnullable: [title, description, visibility, license]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: "optional means leave unchanged and non-nullable means null cannot silently mean preserve"}
    mutation: {description: "pins all four owner-update properties on both the presence and nullability axes"}
  - name: turn detail
    input:
      component: TurnDetail
      required: [index, role, content, timestamp, depth]
      optional: [toolCalls, parentIndex, agentName, observedModel, entryType, hasThinking, stopReason, tokensIn, tokensOut]
      nullable: [parentIndex, stopReason, tokensIn, tokensOut]
      nonnullable: [index, role, content, timestamp, depth, toolCalls, agentName, observedModel, entryType, hasThinking]
    expected: true
    classification: must-pass
    provenance: {source: requirement, ref: optional source-observed model identity in the session-detail wire}
    mutation: {description: "pins observedModel as optional non-null evidence while retaining legacy turns without it"}
