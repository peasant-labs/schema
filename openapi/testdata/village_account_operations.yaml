cases:
- name: logOut
  classification: must-pass
  provenance:
    source: requirement
    ref: Village backend/internal/handler/auth.go
  mutation:
    description: operation contract changes
  input:
    method: POST
    path: /api/v1/auth/logout
  expected:
    operation_id: logOut
    tag: auth
    servers: []
    parameters: []
    responses:
      '200':
        media:
          application/json: SchemaVillageStatusResponse
        headers:
          Set-Cookie: true
    description_anchors:
    - session cookie
