cases:
- name: startGitHubSignIn
  classification: must-pass
  provenance:
    source: requirement
    ref: Village handler and router
  mutation:
    description: Pin the mounted operation contract
  input:
    method: GET
    path: /api/v1/auth/github
  expected:
    operation_id: startGitHubSignIn
    tag: auth
    parameters: []
    responses:
      '307':
        media:
          text/html: string
        headers:
          Location: true
          Set-Cookie: true
          X-RateLimit-Limit: true
          X-RateLimit-Remaining: true
          X-RateLimit-Reset: true
      '429':
        media:
          text/plain: string
        headers:
          X-RateLimit-Limit: true
          X-RateLimit-Remaining: true
          X-RateLimit-Reset: true
          Retry-After: true
    description_anchors:
    - Start GitHub sign-in
- name: completeGitHubSignIn
  classification: must-pass
  provenance:
    source: requirement
    ref: Village handler and router
  mutation:
    description: Pin the mounted operation contract
  input:
    method: GET
    path: /api/v1/auth/github/callback
  expected:
    operation_id: completeGitHubSignIn
    tag: auth
    parameters:
    - name: code
      in: query
      required: false
      schema: string
    - name: state
      in: query
      required: false
      schema: string
    - name: error
      in: query
      required: false
      schema: string
    - name: oauth_state
      in: cookie
      required: false
      schema: string
    responses:
      '307':
        media:
          text/html: string
        headers:
          Location: true
      '400':
        media:
          application/json: SchemaVillageErrorResponse
          text/html: string
        headers:
          Content-Security-Policy: false
          X-Content-Type-Options: false
      '500':
        media:
          application/json: SchemaVillageErrorResponse
          text/html: string
        headers:
          Content-Security-Policy: false
          X-Content-Type-Options: false
    description_anchors:
    - Complete GitHub sign-in
