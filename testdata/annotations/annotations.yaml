    targetSessionId: "quality-ann-1"
    isPrimary: true
    annotatorKind: "human"
    annotatorName: "reviewer-1"
    typeId: "quality.session_outcome"
    typeName: "Session Outcome"
    value: "resolved"
    createdAt: 1700000000000

  - name: "human_outcome_not_resolved"
