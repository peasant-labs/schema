# Subscription validation test cases (Go-only)
subscription_validations:
  # Happy paths
  - name: "dashboard"
    topic: "dashboard"
    valid: true
  - name: "sessions"
    topic: "sessions"
    valid: true
  - name: "trends"
    topic: "trends"
    valid: true
  - name: "quality"
    topic: "quality"
    valid: true
  - name: "session_detail_with_id"
    topic: "session_detail"
    id: "abc"
    valid: true
  - name: "annotations_session_axis"
    topic: "annotations"
    axis: "session"
    id: "sess-abc"
    valid: true
  - name: "annotations_type_axis"
    topic: "annotations"
    axis: "type"
    id: "quality.session_outcome"
    valid: true
  - name: "annotations_project_axis"
    topic: "annotations"
    axis: "project"
    id: "proj-hash"
    valid: true
  - name: "project_familiarity_with_id"
    topic: "project_familiarity"
    id: "abc123hash"
    valid: true
  # Failure paths
  - name: "project_familiarity_missing_id"
    topic: "project_familiarity"
    valid: false
  - name: "session_detail_missing_id"
    topic: "session_detail"
    valid: false
  - name: "annotations_missing_axis"
    topic: "annotations"
    id: "abc"
    valid: false
  - name: "annotations_missing_id"
    topic: "annotations"
    axis: "session"
    valid: false
  - name: "annotations_missing_both"
    topic: "annotations"
    valid: false
  - name: "unknown_topic"
    topic: "nonexistent"
    valid: false
  - name: "empty_topic"
    topic: ""
    valid: false
