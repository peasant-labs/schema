required_names:
  timestamps: [recorded-overprecision, decision-overprecision, first-seen-overprecision, recorded-minute-only, decision-minute-only, first-seen-minute-only, recorded-nine-zero, decision-nine-digits, recorded-zero-fraction, decision-zero-fraction, first-seen-zero-offset, decision-equivalent-trailing-zero, recorded-equivalent-trailing-zero, decision-distinct-nanosecond, original-overprecision-replay, original-minute-replay, populated-history-overprecision, fetch-time-overprecision, fetch-source-minute-only, observation-overprecision]
  scopes: [unbracketed-ipv6-default-port, unbracketed-ipv6-eight-groups, bracketed-ipv6-default-port, bracketed-ipv6-eight-groups]
  statuses: [domain-cancel-remote, scope-cancel-remote, cancel-auth, cancel-persistence, cancel-multiple-codes]
identity: {userId: &id '123e4567-e89b-12d3-a456-426614174000', incarnation: &transcript '123e4567-e89b-12d3-a456-426614174001', kind: remote-attempts, generation: '1'}
timestamps:
  cases:
    - name: recorded-overprecision
      input: {target: LocalRemoteContributionAttempt, payload: &attempt {collectiveId: *id, transcriptId: *transcript, firstSeenAt: &time '2026-10-16T12:00:00.123456789Z', attempt: {event_num: 1, status: approved, recorded_at: *time, decided_at: '2026-10-16T13:00:00.123456789Z', decided_by_actor: moderator}}, set: {attempt.recorded_at: '2026-10-16T12:00:00.1234567891Z'}}
      expected: {valid: false}
      classification: must-fail
      provenance: &p {source: requirement, ref: lossless-collective-evidence}
      mutation: &m {description: validate raw timestamp grammar before native decoding can lose precision or invent seconds}
    - name: decision-overprecision
      input: {target: LocalRemoteContributionAttempt, payload: *attempt, set: {attempt.decided_at: '2026-10-16T13:00:00.1234567891Z'}}
      expected: {valid: false}
      classification: must-fail
      provenance: *p
      mutation: *m
