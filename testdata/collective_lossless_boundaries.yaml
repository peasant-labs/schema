    - name: decision-distinct-nanosecond
      input: {target: LocalRemoteContributionAttempt, payload: *attempt, incomingSet: {attempt.decided_at: '2026-10-16T13:00:00.123456788Z'}}
      expected: {valid: true, conflict: true}
