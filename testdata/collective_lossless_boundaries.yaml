    - name: decision-equivalent-trailing-zero
      input: {target: LocalRemoteContributionAttempt, payload: *attempt, set: {attempt.decided_at: '2026-10-16T13:00:00.123400000Z'}, incomingSet: {attempt.decided_at: '2026-10-16T13:00:00.1234Z'}}
      expected: {valid: true, disposition: unchanged}
      classification: must-pass
      provenance: *p
      mutation: {description: equivalent fractional spellings replay without millisecond rounding}
