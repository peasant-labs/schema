statuses:
  cases:
    - name: domain-cancel-remote
      input: {target: CollectiveFetchReport, payload: *report}
      expected: {valid: true, status: 504}
      classification: must-pass
      provenance: *p
      mutation: {description: cancelled domain states participate in deadline precedence without discarding committed effects or prior remote issues}
    - name: scope-cancel-remote
      input: {target: CollectiveFetchReport, payload: {<<: *report, domains: [{<<: *complete, state: failed, issue: *remote, associations: {requested: 2, completed: 1, failed: 1, scopes: [{transcriptId: *transcript, state: complete, commit: updated, observedAt: *time, completedAt: *time}, {transcriptId: *id, state: cancelled, commit: retained, issue: *remote}]}}, {<<: *cancel, state: failed}, *unrequested]}, omit: [domains.0.completedAt]}
      expected: {valid: true, status: 504}
      classification: must-pass
      provenance: *p
      mutation: {description: cancelled transcript scopes rank as deadline even when aggregate domain state is failed}
    - name: cancel-auth
      input: {target: CollectiveFetchReport, payload: *report, set: {issues: [{<<: *remote, code: auth}]}}
      expected: {valid: true, status: 401}
      classification: must-pass
      provenance: *p
      mutation: {description: authentication outranks cancellation while committed effects remain reported}
    - name: cancel-persistence
      input: {target: CollectiveFetchReport, payload: *report, set: {issues: [{<<: *remote, code: persistence}, {<<: *remote, code: auth}]}}
      expected: {valid: true, status: 500}
      classification: must-pass
      provenance: *p
      mutation: {description: persistence outranks authentication and cancellation}
    - name: cancel-multiple-codes
      input: {target: CollectiveFetchReport, payload: *report, set: {issues: [{<<: *remote, code: superseded}, {<<: *remote, code: contract}, {<<: *remote, code: deadline}]}}
      expected: {valid: true, status: 504}
      classification: must-pass
      provenance: *p
      mutation: {description: deadline/cancellation outranks contract/remote/superseded with every issue retained}
