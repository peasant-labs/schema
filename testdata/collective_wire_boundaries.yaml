scopes:
  cases:
    - name: scope-port-zero
      input: {url: 'https://village.example:0/base'}
      expected: {valid: false}
      classification: must-fail
      provenance: &p {source: requirement, ref: shared-scope-wire-identity}
      mutation: {description: port zero is rejected before either parser can silently accept it}
    - name: scope-slash-dot-ambiguity
      input: {url: 'https://village.example/a//../b'}
      expected: {valid: false}
      classification: must-fail
      provenance: *p
      mutation: {description: reject raw repeated-slash and dot interaction before normalization erases it}
    - name: scope-abbreviated-ipv4
      input: {url: 'https://127.1/base'}
      expected: {valid: false}
      classification: must-fail
      provenance: *p
      mutation: {description: abbreviated numeric host cannot become a different cross-language identity}
    - name: scope-integer-ipv4
      input: {url: 'https://2130706433/base'}
      expected: {valid: false}
      classification: must-fail
      provenance: *p
      mutation: {description: reject integer IPv4 rather than let WHATWG expand it}
    - name: scope-hex-ipv4
      input: {url: 'https://0x7f000001/base'}
      expected: {valid: false}
      classification: must-fail
      provenance: *p
      mutation: {description: hexadecimal IPv4 spelling is outside the supported grammar}
    - name: scope-octal-ipv4
      input: {url: 'https://0177.0.0.1/base'}
      expected: {valid: false}
      classification: must-fail
      provenance: *p
      mutation: {description: leading-zero numeric components cannot be interpreted as octal}
    - name: scope-mixed-hex-ipv4
      input: {url: 'https://0x7f.0.0.1/base'}
      expected: {valid: false}
      classification: must-fail
      provenance: *p
      mutation: {description: mixed-radix numeric components are rejected consistently}
    - name: scope-three-part-ipv4
      input: {url: 'https://127.0.1/base'}
      expected: {valid: false}
      classification: must-fail
      provenance: *p
      mutation: {description: IPv4 requires exactly four canonical decimal components}
    - name: scope-ipv4-out-of-range
      input: {url: 'https://256.0.0.1/base'}
      expected: {valid: false}
      classification: must-fail
      provenance: *p
      mutation: {description: decimal IPv4 components are bounded to one byte}
    - name: scope-ordinary-ipv4
      input: {url: 'https://127.0.0.1/base'}
      expected: {valid: true, normalized: 'https://127.0.0.1/base', token: 'WyIxIiwiaHR0cHM6Ly8xMjcuMC4wLjEvYmFzZSIsIjEyM2U0NTY3LWU4OWItMTJkMy1hNDU2LTQyNjYxNDE3NDAwMCIsIjEyM2U0NTY3LWU4OWItMTJkMy1hNDU2LTQyNjYxNDE3NDAwMSIsInJlbW90ZS1hdHRlbXB0cyIsIjEiXQ'}
      classification: must-pass
      provenance: *p
      mutation: {description: canonical decimal IPv4 remains supported without transport authorization policy}
    - name: scope-decimal-ipv4-port
      input: {url: 'http://192.168.0.1:8080/base'}
      expected: {valid: true, normalized: 'http://192.168.0.1:8080/base', token: 'WyIxIiwiaHR0cDovLzE5Mi4xNjguMC4xOjgwODAvYmFzZSIsIjEyM2U0NTY3LWU4OWItMTJkMy1hNDU2LTQyNjYxNDE3NDAwMCIsIjEyM2U0NTY3LWU4OWItMTJkMy1hNDU2LTQyNjYxNDE3NDAwMSIsInJlbW90ZS1hdHRlbXB0cyIsIjEiXQ'}
      classification: must-pass
      provenance: *p
      mutation: {description: preserve effective nondefault port and full base path}
    - name: scope-ipv6-compressed
      input: {url: 'https://[2001:0DB8:0:0:0:0:0:1]:443/base'}
      expected: {valid: true, normalized: 'https://[2001:db8::1]/base', token: 'WyIxIiwiaHR0cHM6Ly9bMjAwMTpkYjg6OjFdL2Jhc2UiLCIxMjNlNDU2Ny1lODliLTEyZDMtYTQ1Ni00MjY2MTQxNzQwMDAiLCIxMjNlNDU2Ny1lODliLTEyZDMtYTQ1Ni00MjY2MTQxNzQwMDEiLCJyZW1vdGUtYXR0ZW1wdHMiLCIxIl0'}
      classification: must-pass
      provenance: *p
      mutation: {description: IPv6 groups compress identically with first longest zero run}
    - name: scope-ipv6-mapped
      input: {url: 'https://[::ffff:127.0.0.1]/base'}
      expected: {valid: true, normalized: 'https://[::ffff:7f00:1]/base', token: 'WyIxIiwiaHR0cHM6Ly9bOjpmZmZmOjdmMDA6MV0vYmFzZSIsIjEyM2U0NTY3LWU4OWItMTJkMy1hNDU2LTQyNjYxNDE3NDAwMCIsIjEyM2U0NTY3LWU4OWItMTJkMy1hNDU2LTQyNjYxNDE3NDAwMSIsInJlbW90ZS1hdHRlbXB0cyIsIjEiXQ'}
      classification: must-pass
      provenance: *p
      mutation: {description: mapped IPv6 stays bracketed IPv6 with canonical hexadecimal groups}
    - name: scope-ascii-idna
      input: {url: 'https://xn--fsqu00a.example/base'}
      expected: {valid: true, normalized: 'https://xn--fsqu00a.example/base', token: 'WyIxIiwiaHR0cHM6Ly94bi0tZnNxdTAwYS5leGFtcGxlL2Jhc2UiLCIxMjNlNDU2Ny1lODliLTEyZDMtYTQ1Ni00MjY2MTQxNzQwMDAiLCIxMjNlNDU2Ny1lODliLTEyZDMtYTQ1Ni00MjY2MTQxNzQwMDEiLCJyZW1vdGUtYXR0ZW1wdHMiLCIxIl0'}
      classification: must-pass
      provenance: *p
      mutation: {description: explicit ASCII IDNA spelling is accepted without language-specific Unicode conversion}
    - name: scope-unicode-host
      input: {url: 'https://例子.example/base'}
      expected: {valid: false}
      classification: must-fail
      provenance: *p
      mutation: {description: callers must use explicit ASCII IDNA rather than native parser inference}
    - name: scope-escaped-path
      input: {url: 'https://village.example/a%2Fb'}
      expected: {valid: false}
      classification: must-fail
      provenance: *p
      mutation: {description: escaped slash segments are outside the shared identity grammar}
    - name: scope-dot-escaped-path
      input: {url: 'https://village.example/a/%2e%2e/b'}
      expected: {valid: false}
      classification: must-fail
      provenance: *p
      mutation: {description: reject encoded dot segments before WHATWG can erase them}
    - name: scope-repeated-slash
      input: {url: 'https://village.example/a//b'}
      expected: {valid: false}
      classification: must-fail
      provenance: *p
      mutation: {description: the bounded supported grammar excludes repeated path slashes}
    - name: scope-canonical-path
      input: {url: 'HTTPS://name:secret@Village.Example:443/a/../base/./?ignored=1#fragment'}
      expected: {valid: true, normalized: 'https://village.example/base', token: 'WyIxIiwiaHR0cHM6Ly92aWxsYWdlLmV4YW1wbGUvYmFzZSIsIjEyM2U0NTY3LWU4OWItMTJkMy1hNDU2LTQyNjYxNDE3NDAwMCIsIjEyM2U0NTY3LWU4OWItMTJkMy1hNDU2LTQyNjYxNDE3NDAwMSIsInJlbW90ZS1hdHRlbXB0cyIsIjEiXQ'}
      classification: must-pass
      provenance: *p
      mutation: {description: strip nonidentity fields and normalize supported ordinary dot segments}
    - name: scope-reserved-path
      input: {url: "https://village.example/a!$&'()*+,;=:@b"}
      expected: {valid: true, normalized: "https://village.example/a!$&'()*+,;=:@b", token: 'WyIxIiwiaHR0cHM6Ly92aWxsYWdlLmV4YW1wbGUvYSEkJicoKSorLDs9OkBiIiwiMTIzZTQ1NjctZTg5Yi0xMmQzLWE0NTYtNDI2NjE0MTc0MDAwIiwiMTIzZTQ1NjctZTg5Yi0xMmQzLWE0NTYtNDI2NjE0MTc0MDAxIiwicmVtb3RlLWF0dGVtcHRzIiwiMSJd'}
      classification: must-pass
      provenance: *p
      mutation: {description: supported RFC path characters are not re-escaped differently by native URL parsers}
