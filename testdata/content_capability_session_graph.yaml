    - {name: advertisement-empty, classification: must-pass, provenance: {source: requirement, ref: section-12.4}, mutation: {description: supplies empty list}, input: {json: '{"contentCapabilities":[]}'}, expected: {missing: [session_graph_provenance_v1]}}
    - {name: advertisement-null, classification: must-fail, provenance: {source: boundary, ref: section-12.4}, mutation: {description: supplies null list}, input: {json: '{"contentCapabilities":null}'}, expected: {error_contains: contentCapabilities is null}}
    - {name: advertisement-unknown-duplicate-unordered, classification: must-pass, provenance: {source: requirement, ref: section-12.4}, mutation: {description: combines tolerated reader forms}, input: {json: '{"contentCapabilities":["session_graph_provenance_v1","future_v9","observed_model_v1","session_graph_provenance_v1"]}'}, expected: {known: [observed_model_v1, session_graph_provenance_v1]}}
    - {name: advertisement-future-suffix, classification: must-pass, provenance: {source: boundary, ref: section-12.4}, mutation: {description: substitutes opaque v2 suffix}, input: {json: '{"contentCapabilities":["session_graph_provenance_v2"]}'}, expected: {missing: [session_graph_provenance_v1]}}
producer:
