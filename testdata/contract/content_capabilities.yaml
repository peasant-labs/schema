cases:
  - name: omitted-tool-namespace-needs-no-capability
    input: {operation: scan, turns: [{role: assistant, tools: [{}]}]}
    expected: {accepted: true}
    classification: must-pass
    provenance: {source: requirement, ref: tool namespace omission is not recorded evidence}
    mutation: {description: keeps a pending tool without a namespace}
  - name: empty-tool-namespace-needs-capability
    input: {operation: scan, turns: [{role: assistant, tools: [{namespace: ""}]}]}
    expected: {accepted: true, capabilities: [tool_namespace_v1]}
    classification: must-pass
    provenance: {source: requirement, ref: namespace presence requires preservation}
    mutation: {description: adds an explicitly empty namespace to a pending tool}
  - name: namespace-and-observed
    input: {operation: scan, turns: [{role: assistant, observedModel: provider/model, tools: [{namespace: Tools}]}]}
    expected: {accepted: true, capabilities: [observed_model_v1, tool_namespace_v1]}
    classification: must-pass
    provenance: {source: requirement, ref: content requirements accumulate}
    mutation: {description: combines tool identity with observed model}
  - name: namespace-and-tool-usage
    input: {operation: scan, turns: [{role: assistant, tools: [{namespace: Tools, usage: true}]}]}
    expected: {accepted: true, capabilities: [detailed_usage_v1, tool_namespace_v1]}
    classification: must-pass
    provenance: {source: requirement, ref: content requirements accumulate}
    mutation: {description: combines namespace with tool-only usage}
  - name: namespace-and-metadata
    input: {operation: scan, nativeMetadata: true, turns: [{role: assistant, tools: [{namespace: Tools}]}]}
    expected: {accepted: true, capabilities: [native_metadata_v1, tool_namespace_v1]}
    classification: must-pass
    provenance: {source: requirement, ref: content requirements accumulate}
    mutation: {description: combines namespace with metadata}
  - name: namespace-observed-and-usage
    input: {operation: scan, turns: [{role: assistant, observedModel: provider/model, usage: true, tools: [{namespace: Tools}]}]}
    expected: {accepted: true, capabilities: [detailed_usage_v1, observed_model_v1, tool_namespace_v1]}
    classification: must-pass
    provenance: {source: requirement, ref: content requirements accumulate}
    mutation: {description: combines namespace with observed model and turn usage}
  - name: namespace-observed-and-metadata
    input: {operation: scan, nativeMetadata: true, turns: [{role: assistant, observedModel: provider/model, tools: [{namespace: Tools}]}]}
    expected: {accepted: true, capabilities: [native_metadata_v1, observed_model_v1, tool_namespace_v1]}
    classification: must-pass
    provenance: {source: requirement, ref: content requirements accumulate}
    mutation: {description: combines namespace with observed model and metadata}
  - name: namespace-usage-and-metadata
    input: {operation: scan, nativeMetadata: true, turns: [{role: assistant, usage: true, tools: [{namespace: Tools, usage: true}]}]}
    expected: {accepted: true, capabilities: [detailed_usage_v1, native_metadata_v1, tool_namespace_v1]}
    classification: must-pass
    provenance: {source: requirement, ref: content requirements accumulate}
    mutation: {description: combines namespace with both usage scopes and metadata}
  - name: namespace-all-evidence-accumulates
    input:
      operation: scan
      nativeMetadata: true
      turns:
        - {role: assistant, observedModel: provider/root, usage: true, tools: [{namespace: Tools, usage: true}]}
        - {role: assistant, depth: 2, observedModel: provider/nested, tools: [{namespace: ""}, {namespace: Other, usage: true}]}
    expected: {accepted: true, capabilities: [detailed_usage_v1, native_metadata_v1, observed_model_v1, tool_namespace_v1]}
    classification: must-pass
    provenance: {source: requirement, ref: content requirements accumulate}
    mutation: {description: repeats namespace and usage at nested depth alongside every other evidence type}
  - name: namespace-old-advertisement-refused
    input: {operation: missing, advertised: [detailed_usage_v1, native_metadata_v1, observed_model_v1, tool_namespace_v2], required: [tool_namespace_v1]}
    expected: {accepted: false, capabilities: [tool_namespace_v1]}
    classification: must-fail
    provenance: {source: requirement, ref: namespace must not silently downgrade}
    mutation: {description: advertises all prior tokens and a nonmatching revision but omits namespace preservation}
  - name: namespace-matching-advertisement
    input: {operation: missing, advertised: [future_v9, tool_namespace_v1, observed_model_v1, native_metadata_v1, detailed_usage_v1], required: [tool_namespace_v1, observed_model_v1, detailed_usage_v1, native_metadata_v1, tool_namespace_v1]}
    expected: {accepted: true}
    classification: must-pass
    provenance: {source: requirement, ref: exact discovery set membership}
    mutation: {description: satisfies every requirement despite duplicate requirements and an unknown advertisement}
  - name: namespace-full-canonical-advertisement
    input: {operation: validate, advertised: [detailed_usage_v1, native_metadata_v1, observed_model_v1, tool_namespace_v1]}
    expected: {accepted: true}
    classification: must-pass
    provenance: {source: requirement, ref: canonical producer inventory}
    mutation: {description: emits every known token in canonical order}
  - name: namespace-unsorted-advertisement
    input: {operation: validate, advertised: [tool_namespace_v1, detailed_usage_v1, native_metadata_v1, observed_model_v1]}
    expected: {accepted: false, errorContains: not in canonical lexicographic order}
    classification: must-fail
    provenance: {source: requirement, ref: canonical producer inventory}
    mutation: {description: moves the namespace token before the older tokens}
  - name: namespace-discovery-dedup-and-unknown
    input: {operation: filter, advertised: [tool_namespace_v1, future_v9, observed_model_v1, tool_namespace_v1]}
    expected: {accepted: true, capabilities: [observed_model_v1, tool_namespace_v1]}
    classification: must-pass
    provenance: {source: requirement, ref: forward-open discovery}
    mutation: {description: combines duplicate namespace with an unknown token and unsorted known tokens}
  - name: namespace-duplicate-advertisement
    input: {operation: validate, advertised: [tool_namespace_v1, tool_namespace_v1]}
    expected: {accepted: false, errorContains: duplicated}
    classification: must-fail
    provenance: {source: requirement, ref: canonical producer inventory}
    mutation: {description: duplicates namespace in server output}
  - name: omitted-discovery-is-compatible-with-no-requirements
    input: {operation: missing}
    expected: {accepted: true}
    classification: must-pass
    provenance: {source: requirement, ref: omitted and empty discovery are equivalent}
    mutation: {description: omits both advertised and required capabilities}
  - name: empty-discovery-is-compatible-with-no-requirements
    input: {operation: missing, advertised: []}
    expected: {accepted: true}
    classification: must-pass
    provenance: {source: requirement, ref: omitted and empty discovery are equivalent}
    mutation: {description: supplies an explicit empty discovery list}
  - name: known-filter-deduplicates-sorts-and-ignores-unknown
    input: {operation: filter, advertised: [future_v9, observed_model_v1, observed_model_v1]}
    expected: {accepted: true, capabilities: [observed_model_v1]}
    classification: must-pass
    provenance: {source: requirement, ref: discovery parsing is forward-open}
    mutation: {description: combines unknown and duplicate discovery tokens}
  - name: canonical-server-advertisement-valid
    input: {operation: validate, advertised: [observed_model_v1]}
    expected: {accepted: true}
    classification: must-pass
    provenance: {source: requirement, ref: producers emit canonical closed inventory}
    mutation: {description: emits the canonical singleton list}
  - name: unknown-server-advertisement-invalid
    input: {operation: validate, advertised: [future_v9]}
    expected: {accepted: false, errorContains: unknown token}
    classification: must-fail
    provenance: {source: boundary, ref: producer validation remains closed}
    mutation: {description: emits a token absent from the Go inventory}
  - name: duplicate-server-advertisement-invalid
    input: {operation: validate, advertised: [observed_model_v1, observed_model_v1]}
    expected: {accepted: false, errorContains: duplicated or not in canonical lexicographic order}
    classification: must-fail
    provenance: {source: boundary, ref: server advertisements are unique}
    mutation: {description: duplicates the canonical token}
  - name: unsorted-unique-server-advertisement-invalid
    input: {operation: validate, advertised: [observed_model_v1, detailed_usage_v1]}
    expected: {accepted: false, errorContains: not in canonical lexicographic order}
    classification: must-fail
    provenance: {source: requirement, ref: docs/content-capability-negotiation.md evolution requires a distinct-token ordering regression}
    mutation: {description: reverses two distinct known tokens without introducing duplicates}
  - name: required-capability-present
    input: {operation: missing, advertised: [future_v9, observed_model_v1], required: [observed_model_v1]}
    expected: {accepted: true}
    classification: must-pass
    provenance: {source: requirement, ref: negotiation uses set membership}
    mutation: {description: includes the requirement alongside an unknown token}
  - name: required-capability-missing
    input: {operation: missing, advertised: [future_v9], required: [observed_model_v1]}
    expected: {accepted: false, capabilities: [observed_model_v1]}
    classification: must-fail
    provenance: {source: requirement, ref: missing required capabilities block enriched publish}
    mutation: {description: advertises only an unknown token}
  - name: payload-without-observation-needs-no-capability
    input: {operation: scan, turns: [{role: assistant}]}
    expected: {accepted: true}
    classification: must-pass
    provenance: {source: requirement, ref: legacy payloads require no enriched capability}
    mutation: {description: omits observed evidence}
  - name: session-seed-model-alone-needs-no-capability
    input: {operation: scan, sessionModel: provider/legacy-seed, turns: [{role: assistant}]}
    expected: {accepted: true}
    classification: must-pass
    provenance: {source: requirement, ref: session model seed is legacy metadata rather than observed evidence}
    mutation: {description: sets only the session-level model seed}
  - name: root-assistant-observation-requires-capability
    input: {operation: scan, turns: [{role: assistant, observedModel: provider/root}]}
    expected: {accepted: true, capabilities: [observed_model_v1]}
    classification: must-pass
    provenance: {source: requirement, ref: root turn evidence requires preservation}
    mutation: {description: adds evidence at depth zero}
  - name: nested-assistant-observation-requires-capability
    input: {operation: scan, turns: [{role: assistant, depth: 2, observedModel: provider/subagent}]}
    expected: {accepted: true, capabilities: [observed_model_v1]}
    classification: must-pass
    provenance: {source: requirement, ref: nested turn evidence requires preservation}
    mutation: {description: adds evidence on a nested turn}
  - name: assistant-evidence-valid
    input: {operation: evidence, role: assistant, observedModel: Anthropic/Claude-Opus-4-8}
    expected: {accepted: true}
    classification: must-pass
    provenance: {source: requirement, ref: assistant evidence is accepted and byte-exact}
    mutation: {description: supplies mixed-case assistant evidence}
  - name: user-evidence-invalid
    input: {operation: evidence, role: user, observedModel: provider/model}
    expected: {accepted: false, errorContains: is not assistant}
    classification: must-fail
    provenance: {source: requirement, ref: evidence is assistant-only}
    mutation: {description: moves evidence onto a user turn}
  - name: tool-evidence-invalid
    input: {operation: evidence, role: tool, observedModel: provider/model}
    expected: {accepted: false, errorContains: is not assistant}
    classification: must-fail
    provenance: {source: requirement, ref: evidence is not valid on tool turns}
    mutation: {description: moves evidence onto a tool turn}
  - name: invalid-observed-value-invalid
    input: {operation: evidence, role: assistant, observedModel: " padded "}
    expected: {accepted: false, errorContains: has Unicode whitespace at an edge}
    classification: must-fail
    provenance: {source: boundary, ref: observed values retain their validated exact bytes}
    mutation: {description: pads assistant evidence at both edges}
