required_names: [defaults, page-bounds, children, child-project-refused, child-all-refused, empty-parent, zero-limit, excessive-limit, negative-offset, unknown-filter, malformed-project, stats-global, stats-project, stats-malformed-project]
cases:
  - name: defaults
    input: {kind: sessions, json: '{}'}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "Home query defaults"}
    mutation: {description: "omit all optional parameters"}
  - name: page-bounds
    input: {kind: sessions, json: '{"limit":100,"offset":25,"publication":"auto","projectHash":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}'}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: boundary, ref: "Home page bounds"}
    mutation: {description: "use the maximum root page and canonical project"}
  - name: children
    input: {kind: sessions, json: '{"parentSessionId":"parent","limit":25,"offset":0}'}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "Home general children"}
    mutation: {description: "request immediate children without root filters"}
  - name: child-project-refused
    input: {kind: sessions, json: '{"parentSessionId":"parent","projectHash":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}'}
    expected: {valid: false, error_contains: "omit projectHash and publication"}
    classification: must-fail
    provenance: {source: requirement, ref: "Home child filter exclusion"}
    mutation: {description: "apply root project filter to children"}
  - name: child-all-refused
    input: {kind: sessions, json: '{"parentSessionId":"parent","publication":"all"}'}
    expected: {valid: false, error_contains: "omit projectHash and publication"}
    classification: must-fail
    provenance: {source: requirement, ref: "Home explicit root filter exclusion"}
    mutation: {description: "explicit all is still a forbidden child parameter"}
  - name: empty-parent
    input: {kind: sessions, json: '{"parentSessionId":"  "}'}
    expected: {valid: false, error_contains: parentSessionId}
    classification: must-fail
    provenance: {source: boundary, ref: "Home parent ID"}
    mutation: {description: "supply a whitespace parent"}
  - name: zero-limit
    input: {kind: sessions, json: '{"limit":0}'}
    expected: {valid: false, error_contains: "limit 1..100"}
    classification: must-fail
    provenance: {source: boundary, ref: "Home explicit zero"}
    mutation: {description: "zero is not an omitted default"}
  - name: excessive-limit
    input: {kind: sessions, json: '{"limit":101}'}
    expected: {valid: false, error_contains: "limit 1..100"}
    classification: must-fail
    provenance: {source: boundary, ref: "Home page cap"}
    mutation: {description: "exceed the safety cap"}
  - name: negative-offset
    input: {kind: sessions, json: '{"offset":-1}'}
    expected: {valid: false, error_contains: "offset >=0"}
    classification: must-fail
    provenance: {source: boundary, ref: "Home offset"}
    mutation: {description: "read before offset zero"}
  - name: unknown-filter
    input: {kind: sessions, json: '{"publication":"automatic"}'}
    expected: {valid: false, error_contains: "all, not-published, published, or auto"}
    classification: must-fail
    provenance: {source: boundary, ref: LocalHomePublicationFilter}
    mutation: {description: "supply a noncanonical enum"}
  - name: malformed-project
    input: {kind: sessions, json: '{"projectHash":"bad"}'}
    expected: {valid: false, error_contains: projectHash}
    classification: must-fail
    provenance: {source: boundary, ref: ProjectHash}
    mutation: {description: "supply a short root hash"}
  - name: stats-global
    input: {kind: stats, json: '{}'}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "Home global stats"}
    mutation: {description: "omit the facet project"}
  - name: stats-project
    input: {kind: stats, json: '{"projectHash":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}'}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "Home project facets"}
    mutation: {description: "narrow facets by a canonical hash"}
  - name: stats-malformed-project
    input: {kind: stats, json: '{"projectHash":""}'}
    expected: {valid: false, error_contains: projectHash}
    classification: must-fail
    provenance: {source: boundary, ref: ProjectHash}
    mutation: {description: "an explicit empty hash is not omitted"}
