cases:
  - name: go_valid_non_empty_session_id_is_accepted
    input: {id: assoc-session-a, sessionId: session-a, conclusion: confirmed, confidence: high, evidence: [{kind: recorded_commit, recordedCommitHash: commit-a}]}
    expected: true
    classification: must-pass
    provenance: {source: bug, ref: Go SessionAssociation.Validate accepts every non-empty sessionId}
    mutation: {description: uses a non-empty Go-valid session ID that the global branded SessionID schema rejects}
  - name: distinct_same_kind_recorded_commit_observations_in_canonical_order_are_accepted
    input: {id: assoc-repeated-recorded-commits, sessionId: session-a, conclusion: candidate, confidence: medium, evidence: [{kind: recorded_commit, recordedCommitHash: commit-alpha}, {kind: recorded_commit, recordedCommitHash: commit-beta}]}
    expected: true
    classification: must-pass
    provenance: {source: bug, ref: canonical evidence ordering permits distinct details within the same kind}
    mutation: {description: places two distinct recorded_commit observations in canonical detail order}
  - name: unicode_e000_then_10000_utf8_order_is_accepted
    input: {id: assoc-unicode-canonical, sessionId: session-a, conclusion: candidate, confidence: medium, evidence: [{kind: recorded_commit, recordedCommitHash: "\uE000"}, {kind: recorded_commit, recordedCommitHash: "\U00010000"}]}
    expected: true
    classification: must-pass
    provenance: {source: bug, ref: Go string ordering compares UTF-8 bytes rather than JavaScript UTF-16 code units}
    mutation: {description: orders U+E000 before U+10000 by their UTF-8 byte sequences}
  - name: unicode_10000_then_e000_utf8_order_is_rejected
    input: {id: assoc-unicode-reversed, sessionId: session-a, conclusion: candidate, confidence: medium, evidence: [{kind: recorded_commit, recordedCommitHash: "\U00010000"}, {kind: recorded_commit, recordedCommitHash: "\uE000"}]}
    expected: false
    classification: must-fail
    provenance: {source: bug, ref: Go string ordering compares UTF-8 bytes rather than JavaScript UTF-16 code units}
    mutation: {description: reverses the required UTF-8 byte order of U+E000 and U+10000}
