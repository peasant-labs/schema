# The local server refuses a state-changing request that did not come from its
# own pages. Every write operation the Local API declares states that 403 with
# the shared JSON error body. The manifest is the exact set of declared write
# operations, so a newly declared write route that omits the refusal fails, and
# so does a route that stops declaring it. Write routes the server serves but
# the contract does not declare are outside this manifest.
write_operations:
  - {method: post, path: /api/v1/village/collective-observations/fetch, operation_id: fetchCollectiveObservations}
  - {method: put, path: '/api/v1/village/collective-observations/{collectiveId}/tracking', operation_id: trackCollectiveObservation}
  - {method: delete, path: '/api/v1/village/collective-observations/{collectiveId}/tracking', operation_id: untrackCollectiveObservation}
  - {method: post, path: /api/v1/annotations, operation_id: createAnnotation}
  - {method: post, path: /api/v1/shutdown, operation_id: postShutdown}
  - {method: post, path: /api/v1/sync/push, operation_id: pushSyncSessions}
  - {method: post, path: /api/v1/sync/login, operation_id: syncLogin}
  - {method: post, path: /api/v1/sync/logout, operation_id: syncLogout}
  - {method: patch, path: /api/v1/settings, operation_id: updateSetting}
  - {method: put, path: "/api/v1/settings/auto-publish/{id}", operation_id: saveAutoPublishRule}
  - {method: post, path: "/api/v1/settings/auto-publish/{id}/install", operation_id: installAutoPublishHooks}
  - {method: delete, path: "/api/v1/settings/auto-publish/{id}", operation_id: deleteAutoPublishRule}
  - {method: post, path: /api/v1/local-owner/claim, operation_id: claimLocalOwner}
  - {method: post, path: /api/v1/local-owner/decline, operation_id: declineLocalOwnerPrompt}
  - {method: post, path: /api/v1/kickstart/sessions, operation_id: openKickstartSession}
  - {method: patch, path: "/api/v1/kickstart/sessions/{id}", operation_id: patchKickstartSession}
  - {method: post, path: "/api/v1/kickstart/sessions/{id}/scan", operation_id: scanKickstartSession}
  - {method: post, path: "/api/v1/kickstart/sessions/{id}/commit", operation_id: commitKickstartSession}
refusal:
  status: "403"
  component: OpenapiLocalErrorResponse
  required: [error]
  properties: [error, code]
  # The two codes the shared body carries on this refusal, one per reason.
  codes: [request_host_not_local, request_origin_not_local]
  # The exact sentence every write operation description ends with, and the
  # exact description of its 403 response. Both name both codes.
  operation_sentence: "Returns 403 with a JSON error, and changes nothing, when the request did not come from this local server: the request's Host header does not name a loopback address (code request_host_not_local), or a browser sent it from another origin or from a page this server did not serve (code request_origin_not_local)."
  response_description: "Refused, and nothing was changed, because the request did not come from this local server. The JSON error code is request_host_not_local when the request's Host header does not name a loopback address, and request_origin_not_local when a browser sent it from another origin or from a page this server did not serve."
