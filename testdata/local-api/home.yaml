required_names:
  - empty-page
  - full-page-next
  - child-row
  - null-rows
  - excessive-limit
  - negative-offset
  - wrong-next-offset
  - empty-next-page
  - duplicate-row
  - mismatched-row-id
  - hidden-row
  - audience-on-page
  - negative-child-count
  - filter-all
  - filter-published
  - filter-not-published
  - filter-auto
  - filter-unknown
operations:
  - api: local
    method: get
    path: /api/v1/home/sessions
    response: LocalHomeSessionsPage
    statuses: ["200", "400", "404", "500", "503"]
    error_responses: {"400": OpenapiLocalErrorResponse, "404": OpenapiLocalErrorResponse, "500": OpenapiLocalErrorResponse, "503": OpenapiLocalErrorResponse}
    parameters:
      - {name: limit, in: query, required: false}
      - {name: offset, in: query, required: false}
      - {name: parentSessionId, in: query, required: false}
      - {name: projectHash, in: query, required: false}
      - {name: publication, in: query, required: false, enum: [all, not-published, published, auto]}
cases:
  - name: empty-page
    input: {schema: LocalHomeSessionsPage, payload: &empty {rows: [], offset: 0, limit: 25}}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: boundary, ref: "Home empty page"}
    mutation: {description: "no roots is a successful array"}
  - name: full-page-next
    input:
      schema: LocalHomeSessionsPage
      payload: &full
        rows:
          - &row
            sync: &sync {id: local-a, harness: claude-code, projectName: project, projectHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, hostSlug: host, startTime: "2026-10-12T10:00:00Z", durationMs: 1000, totalTokens: 10, turnCount: 2, model: m, syncStatus: new, previouslyPushed: false}
            publication: &publication {sessionId: local-a, state: unpublished, autoPublish: true, outsideSelection: false}
            title: stored title
            preview: redacted preview
            childCount: 2
        offset: 0
        limit: 1
        nextOffset: 1
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "Home shared row projections"}
    mutation: {description: "one hydrated row and another matching metadata row"}
  - name: child-row
    input: {schema: LocalHomeSessionRow, payload: {<<: *row, sync: {<<: *sync, parentSessionId: parent-a}}}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "Home immediate children"}
    mutation: {description: "the same row projection names an immediate parent"}
  - name: null-rows
    input: {schema: LocalHomeSessionsPage, payload: {<<: *empty, rows: null}}
    expected: {valid: false, rejected_by: shape, go_rejects: true}
    classification: must-fail
    provenance: {source: boundary, ref: "Home arrays"}
    mutation: {description: "replace empty array with null"}
  - name: excessive-limit
    input: {schema: LocalHomeSessionsPage, payload: {<<: *empty, limit: 101}}
    expected: {valid: false, rejected_by: shape, go_rejects: true}
    classification: must-fail
    provenance: {source: boundary, ref: "Home maximum limit"}
    mutation: {description: "exceed the API safety cap"}
  - name: negative-offset
    input: {schema: LocalHomeSessionsPage, payload: {<<: *empty, offset: -1}}
    expected: {valid: false, rejected_by: shape, go_rejects: true}
    classification: must-fail
    provenance: {source: boundary, ref: "Home offset"}
    mutation: {description: "use a negative offset"}
  - name: wrong-next-offset
    input: {schema: LocalHomeSessionsPage, payload: {<<: *full, nextOffset: 2}}
    expected: {valid: false, rejected_by: semantics, error_contains: nextOffset}
    classification: must-fail
    provenance: {source: requirement, ref: "Home offset progression"}
    mutation: {description: "skip an offset in a full page"}
  - name: empty-next-page
    input: {schema: LocalHomeSessionsPage, payload: {<<: *empty, nextOffset: 25}}
    expected: {valid: false, rejected_by: semantics, error_contains: nextOffset}
    classification: must-fail
    provenance: {source: requirement, ref: "Home terminal empty page"}
    mutation: {description: "claim another page after an empty one"}
  - name: duplicate-row
    input: {schema: LocalHomeSessionsPage, payload: {rows: [*row, *row], offset: 0, limit: 25}}
    expected: {valid: false, rejected_by: semantics, error_contains: repeat}
    classification: must-fail
    provenance: {source: boundary, ref: "Home page identity"}
    mutation: {description: "repeat a hydrated session within one page"}
  - name: mismatched-row-id
    input: {schema: LocalHomeSessionRow, payload: {<<: *row, publication: {<<: *publication, sessionId: other}}}
    expected: {valid: false, rejected_by: semantics, error_contains: identity}
    classification: must-fail
    provenance: {source: requirement, ref: "Home shared publication identity"}
    mutation: {description: "pair sync with another session publication"}
  - name: hidden-row
    input: {schema: LocalHomeSessionRow, payload: {<<: *row, publication: {<<: *publication, outsideSelection: true}}}
    expected: {valid: false, rejected_by: semantics, error_contains: selection}
    classification: must-fail
    provenance: {source: requirement, ref: "Home selection-scoped reads"}
    mutation: {description: "leak an out-of-selection row"}
  - name: audience-on-page
    input: {schema: LocalHomeSessionRow, payload: {<<: *row, publication: {sessionId: local-a, state: published, transcriptId: 3f9c1d2e-4b5a-4c6d-8e7f-90a1b2c3e21a, transcriptUrl: "https://example.test/transcripts/3f9c1d2e-4b5a-4c6d-8e7f-90a1b2c3e21a", publishedAt: "2026-10-12T10:00:00Z", autoPublish: false, outsideSelection: false, audience: []}}}
    expected: {valid: false, rejected_by: semantics, error_contains: audience}
    classification: must-fail
    provenance: {source: requirement, ref: "Home deferred audience"}
    mutation: {description: "include a remote audience on the critical page"}
  - name: negative-child-count
    input: {schema: LocalHomeSessionRow, payload: {<<: *row, childCount: -1}}
    expected: {valid: false, rejected_by: shape, go_rejects: true}
    classification: must-fail
    provenance: {source: boundary, ref: "Home child count"}
    mutation: {description: "use a negative immediate-child count"}
  - name: filter-all
    input: {schema: LocalHomePublicationFilter, payload: all}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: enum, ref: LocalHomePublicationFilter}
    mutation: {description: "all roots"}
  - name: filter-published
    input: {schema: LocalHomePublicationFilter, payload: published}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: enum, ref: LocalHomePublicationFilter}
    mutation: {description: "roots with an account receipt"}
  - name: filter-not-published
    input: {schema: LocalHomePublicationFilter, payload: not-published}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: enum, ref: LocalHomePublicationFilter}
    mutation: {description: "roots without an account receipt"}
  - name: filter-auto
    input: {schema: LocalHomePublicationFilter, payload: auto}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: enum, ref: LocalHomePublicationFilter}
    mutation: {description: "explicit live auto filter remains available"}
  - name: filter-unknown
    input: {schema: LocalHomePublicationFilter, payload: automatic}
    expected: {valid: false, rejected_by: shape, go_rejects: false}
    classification: must-fail
    provenance: {source: boundary, ref: LocalHomePublicationFilter}
    mutation: {description: "use an off-menu filter spelling"}
