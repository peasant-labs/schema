# The kickstart local setup routes. The status body is configured plus an
# optional activeSessionId. Every non-GET route declares the shared
# cross-origin refusal. The tree is the whole forest: no page, cursor, or limit.
required_names:
  - conflict-missing-theirs
  - conflict-missing-mine
  - commit-saved-false-refused
  - offered-connect-needs-stop
  - tree-total-refused
  - session-get-with-review-stop
  - patch-view-revision-mismatch
  - commit-refusal-row
  - commit-refusal-empty
  - duplicate-next-step-refused
  - empty-patch-refused
  - scan-dropped-labels-capped
  - stale-current-write-names-overwrite-rejected
  - stale-patch-empty-overwritten-valid
  - answers-patch-full
  - status-get
  - sessions-post
  - session-get
  - session-patch
  - stale-patch-no-overwritten-valid
  - overwrite-entry-wrong-shape-rejected
  - tree-get
  - preview-get
  - scan-post
  - commit-post
  - ws-topic-kickstart
  - open-request-selection-scope
  - status-returns-only-configured
  - error-response-session-not-found
  - error-response-field-hidden
  - error-response-contract-breach
  - error-response-unknown-code-refused
  - error-response-missing-code-refused
  - error-response-empty-error-refused
  - error-response-extra-field-refused
  - error-code-member
  - error-code-unknown-refused
  - scan-partial-notice
  - scan-notice-whitespace-refused
operations:
  - api: local
    method: get
    path: /api/v1/kickstart/status
    response: LocalKickstartStatus
    statuses: ["200", "500", "503"]
    error_responses: {"500": LocalKickstartErrorResponse, "503": LocalKickstartErrorResponse}
  - api: local
    method: post
    path: /api/v1/kickstart/sessions
    request: LocalKickstartOpenRequest
    response: LocalKickstartSession
    statuses: ["200", "400", "403", "500", "503"]
    error_responses: {"400": LocalKickstartErrorResponse, "500": LocalKickstartErrorResponse, "503": LocalKickstartErrorResponse}
  - api: local
    method: get
    path: "/api/v1/kickstart/sessions/{id}"
    response: LocalKickstartSession
    statuses: ["200", "404", "500", "503"]
    error_responses: {"404": LocalKickstartErrorResponse, "500": LocalKickstartErrorResponse, "503": LocalKickstartErrorResponse}
    parameters:
      - {name: id, in: path, required: true}
  - api: local
    method: patch
    path: "/api/v1/kickstart/sessions/{id}"
    request: LocalKickstartAnswers
    response: LocalKickstartPatchResult
    statuses: ["200", "400", "403", "404", "500", "503"]
    error_responses: {"400": LocalKickstartErrorResponse, "404": LocalKickstartErrorResponse, "500": LocalKickstartErrorResponse, "503": LocalKickstartErrorResponse}
    parameters:
      - {name: id, in: path, required: true}
  - api: local
    method: get
    path: "/api/v1/kickstart/sessions/{id}/tree"
    response: LocalKickstartTree
    statuses: ["200", "404", "500", "503"]
    error_responses: {"404": LocalKickstartErrorResponse, "500": LocalKickstartErrorResponse, "503": LocalKickstartErrorResponse}
    parameters:
      - {name: id, in: path, required: true}
  - api: local
    method: get
    path: "/api/v1/kickstart/sessions/{id}/tree/{nodeId}/preview"
    response: LocalKickstartPreview
    statuses: ["200", "404", "500", "503"]
    error_responses: {"404": LocalKickstartErrorResponse, "500": LocalKickstartErrorResponse, "503": LocalKickstartErrorResponse}
    parameters:
      - {name: id, in: path, required: true}
      - {name: nodeId, in: path, required: true}
  - api: local
    method: post
    path: "/api/v1/kickstart/sessions/{id}/scan"
    response: LocalKickstartScan
    statuses: ["200", "400", "403", "404", "500", "503"]
    error_responses: {"400": LocalKickstartErrorResponse, "404": LocalKickstartErrorResponse, "500": LocalKickstartErrorResponse, "503": LocalKickstartErrorResponse}
    parameters:
      - {name: id, in: path, required: true}
  - api: local
    method: post
    path: "/api/v1/kickstart/sessions/{id}/commit"
    response: LocalKickstartCommitted
    statuses: ["200", "400", "403", "404", "409", "500", "503"]
    error_responses: {"400": LocalKickstartErrorResponse, "404": LocalKickstartErrorResponse, "409": LocalKickstartCommitRefusal, "500": LocalKickstartErrorResponse, "503": LocalKickstartErrorResponse}
    parameters:
      - {name: id, in: path, required: true}
cases:
  - name: status-get
    input:
      schema: LocalKickstartStatus
      payload: &status
        configured: true
        activeSessionId: ses-full
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "GET /kickstart/status returns configured and the singular activeSessionId"}
    mutation: {description: "a configured install with one full-scope session open"}
  - name: sessions-post
    input:
      schema: LocalKickstartOpenRequest
      payload: {scope: full}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "POST /kickstart/sessions opens or joins one scope"}
    mutation: {description: "opens the full wizard scope"}
  - name: session-get
    input:
      schema: LocalKickstartSession
      payload: &session
        id: ses-full
        scope: full
        revision: 2
        openedAt: "2026-11-10T00:00:00Z"
        stops:
          - key: license
            kind: config
            title: License
            visible: true
            guide: {intro: Choose a license}
            fields: []
        conflicts: []
        connect: {offered: false}
        scan: {state: idle, done: 0, total: 0}
        village: {connected: false}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "GET session is the reconnect snapshot and does not carry the forest"}
    mutation: {description: "reads the full-scope snapshot"}
  - name: session-patch
    input:
      schema: LocalKickstartPatchResult
      payload:
        revision: 2
        stale: true
        overwritten:
          - {key: privacy, previous: true, revision: 2}
        view: *session
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "a stale patch is applied and reports overwritten fields"}
    mutation: {description: "replaces privacy after the caller last rendered revision 2"}
  - name: stale-patch-no-overwritten-valid
    input:
      schema: LocalKickstartPatchResult
      payload:
        revision: 3
        stale: true
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "a stale request may replace no field when no answered field changed after its revision"}
    mutation: {description: "applies a stale write that overwrote nothing"}
  - name: overwrite-entry-wrong-shape-rejected
    input:
      schema: LocalKickstartPatchResult
      payload:
        revision: 3
        stale: true
        overwritten:
          - {previous: true, revision: 2}
    expected: {valid: false, rejected_by: shape, go_rejects: true, go_error_contains: key is empty}
    classification: must-fail
    provenance: {source: requirement, ref: "an overwritten entry names the field it replaced"}
    mutation: {description: "omits the overwritten field key"}
  - name: tree-get
    input:
      schema: LocalKickstartTree
      payload:
        nodes:
          - {id: project-1, kind: project, state: all, label: Peasant}
          - {id: group-1, parentId: project-1, kind: group, state: some, label: src, childCount: 1}
          - {id: session-1, parentId: group-1, kind: session, state: none, label: "Fix the gate", sessionId: ses-stored, locked: true}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "GET tree returns the whole forest and each node's state"}
    mutation: {description: "returns three rows, one of them locked"}
  - name: preview-get
    input:
      schema: LocalKickstartPreview
      payload:
        lines:
          - {kind: label, text: "Fix the gate"}
          - {kind: text, text: "The gate failed closed."}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "GET preview returns bounded typed lines"}
    mutation: {description: "previews one unimported session"}
  - name: scan-post
    input:
      schema: LocalKickstartScan
      payload: {state: running, phase: reading, done: 1, total: 4}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "POST scan accepts a rescan and returns the scan state"}
    mutation: {description: "starts a rescan"}
  - name: commit-post
    input:
      schema: LocalKickstartCommitted
      payload:
        saved: true
        configPath: config.yaml
        ingest: {state: running, new: 1, updated: 0}
        nextSteps: [config, web-start, village-login, village-push, auto-publish-settings]
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "POST commit returns the finish actions and the ingest state"}
    mutation: {description: "saves and starts the import"}
  - name: ws-topic-kickstart
    input:
      schema: ChannelTopic
      payload: kickstart
    expected: {valid: true}
    classification: must-pass
    provenance: {source: enum, ref: "ChannelTopic kickstart"}
    mutation: {description: "subscribes to the live setup topic"}
  - name: open-request-selection-scope
    input:
      schema: LocalKickstartOpenRequest
      payload: {scope: selection}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "open a selection scope"}
    mutation: {description: "opens the selection scope"}
  - name: status-returns-only-configured
    input:
      schema: LocalKickstartStatus
      payload:
        configured: false
        sessions: {full: ses-full}
    expected: {valid: false, rejected_by: shape, go_rejects: true, go_error_contains: unknown field}
    classification: must-fail
    provenance: {source: requirement, ref: "status has configured and optional activeSessionId, and no other status field"}
    mutation: {description: "adds a per-scope session directory"}
  - name: answers-patch-full
    input:
      schema: LocalKickstartAnswers
      payload: {revision: 2, values: {privacy: true}, selectedIds: [a], resolutions: {privacy: mine}, connectAnswer: skip}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "kickstart contract"}
    mutation: {description: "answers-patch-full"}
  - name: stale-patch-empty-overwritten-valid
    input:
      schema: LocalKickstartPatchResult
      payload: {revision: 3, stale: true, overwritten: []}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "kickstart contract"}
    mutation: {description: "stale-patch-empty-overwritten-valid"}
  - name: stale-current-write-names-overwrite-rejected
    input:
      schema: LocalKickstartPatchResult
      payload: {revision: 3, stale: false, overwritten: [{key: privacy, previous: true, revision: 2}]}
    expected: {valid: false, rejected_by: semantics, error_contains: "stale is false"}
    classification: must-fail
    provenance: {source: requirement, ref: "kickstart contract"}
    mutation: {description: "stale-current-write-names-overwrite-rejected"}
  - name: scan-dropped-labels-capped
    input:
      schema: LocalKickstartScan
      payload: {state: done, done: 4, total: 4, droppedLabels: [a,b,c,d]}
    expected: {valid: false, rejected_by: shape, go_rejects: true}
    classification: must-fail
    provenance: {source: requirement, ref: "kickstart contract"}
    mutation: {description: "scan-dropped-labels-capped"}
  - name: empty-patch-refused
    input:
      schema: LocalKickstartAnswers
      payload: {revision: 2}
    expected: {valid: false, rejected_by: semantics, error_contains: "no mutation"}
    classification: must-fail
    provenance: {source: requirement, ref: "kickstart contract"}
    mutation: {description: "empty-patch-refused"}
  - name: duplicate-next-step-refused
    input:
      schema: LocalKickstartCommitted
      payload: {saved: true, configPath: config.yaml, ingest: {state: busy, new: 0, updated: 0}, nextSteps: [config, config]}
    expected: {valid: false, rejected_by: semantics, error_contains: "repeated"}
    classification: must-fail
    provenance: {source: requirement, ref: "kickstart contract"}
    mutation: {description: "duplicate-next-step-refused"}
  - name: commit-refusal-empty
    input:
      schema: LocalKickstartCommitRefusal
      payload: {error: conflict, conflicts: []}
    expected: {valid: false, rejected_by: semantics, error_contains: "conflicts is empty"}
    classification: must-fail
    provenance: {source: requirement, ref: "kickstart contract"}
    mutation: {description: "commit-refusal-empty"}
  - name: commit-refusal-row
    input:
      schema: LocalKickstartCommitRefusal
      payload: {error: conflict, conflicts: [{field: privacy, stop: privacy, label: Privacy, mine: true, theirs: false}]}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "kickstart contract"}
    mutation: {description: "commit-refusal-row"}
  - name: patch-view-revision-mismatch
    input:
      schema: LocalKickstartPatchResult
      payload: {revision: 3, stale: false, view: *session}
    expected: {valid: false, rejected_by: semantics, error_contains: "revision differs"}
    classification: must-fail
    provenance: {source: requirement, ref: "kickstart contract"}
    mutation: {description: "patch-view-revision-mismatch"}
  - name: session-get-with-review-stop
    input:
      schema: LocalKickstartSession
      payload: {id: ses-review, scope: full, revision: 2, openedAt: "2026-11-10T00:00:00Z", stops: [{key: review, kind: review, title: Review, visible: true, guide: {}, fields: [{key: privacy, kind: choice, label: Privacy, value: true, options: [{value: yes, label: Yes}], example: [{kind: text, text: example}]}], summary: {values: [privacy], effects: [local]}, diff: {file: config.yaml, hunks: [{header: "-1 +1", lines: [{type: del, oldNo: 1, text: old}, {type: add, newNo: 1, text: new}, {type: ctx, oldNo: 2, newNo: 2, text: common}]}]}}], conflicts: [], connect: {offered: false}, scan: {state: idle, done: 0, total: 0}, village: {connected: true}}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "kickstart contract"}
    mutation: {description: "session-get-with-review-stop"}
  - name: tree-total-refused
    input:
      schema: LocalKickstartTree
      payload: {nodes: [], total: 0}
    expected: {valid: false, rejected_by: shape, go_rejects: true}
    classification: must-fail
    provenance: {source: requirement, ref: "kickstart contract"}
    mutation: {description: "tree-total-refused"}
  - name: offered-connect-needs-stop
    input:
      schema: LocalKickstartSession
      payload: {id: ses-full, scope: full, revision: 2, openedAt: now, stops: [], conflicts: [], connect: {offered: true}, scan: {state: idle, done: 0, total: 0}, village: {connected: false}}
    expected: {valid: false, rejected_by: semantics, error_contains: "afterStop is empty"}
    classification: must-fail
    provenance: {source: requirement, ref: "kickstart contract"}
    mutation: {description: "offered-connect-needs-stop"}
  - name: commit-saved-false-refused
    input:
      schema: LocalKickstartCommitted
      payload: {saved: false, configPath: config.yaml, ingest: {state: busy, new: 0, updated: 0}, nextSteps: []}
    expected: {valid: false, rejected_by: semantics, error_contains: "saved must be true"}
    classification: must-fail
    provenance: {source: requirement, ref: "kickstart contract"}
    mutation: {description: "commit-saved-false-refused"}
  - name: conflict-missing-mine
    input:
      schema: LocalKickstartCommitRefusal
      payload: {error: conflict, conflicts: [{field: privacy, stop: privacy, label: Privacy, theirs: false}]}
    expected: {valid: false, rejected_by: shape, go_rejects: true}
    classification: must-fail
    provenance: {source: requirement, ref: "conflict rows require both sides"}
    mutation: {description: "conflict-missing-mine"}
  - name: conflict-missing-theirs
    input:
      schema: LocalKickstartCommitRefusal
      payload: {error: conflict, conflicts: [{field: privacy, stop: privacy, label: Privacy, mine: true}]}
    expected: {valid: false, rejected_by: shape, go_rejects: true}
    classification: must-fail
    provenance: {source: requirement, ref: "conflict rows require both sides"}
    mutation: {description: "conflict-missing-theirs"}
  - name: error-response-session-not-found
    input:
      schema: LocalKickstartErrorResponse
      payload: {error: "No setup session has this id. Open a session again.", code: kickstart_session_not_found}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "a kickstart 404 carries a code from the closed set"}
    mutation: {description: "answers a read of a session that expired"}
  - name: error-response-field-hidden
    input:
      schema: LocalKickstartErrorResponse
      payload: {error: "The field is hidden in this session's current view. Nothing was changed.", code: kickstart_field_hidden}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "an answer to a hidden field is a 400 with kickstart_field_hidden"}
    mutation: {description: "refuses an answer to a field the page does not show"}
  - name: error-response-contract-breach
    input:
      schema: LocalKickstartErrorResponse
      payload: {error: "The answer breaks the Local API contract, so it is not sent.", code: publishing_contract_breach}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "the shared contract-breach code is a member of the kickstart set because a kickstart 500 can carry it"}
    mutation: {description: "a kickstart view the server refuses to send"}
  - name: error-response-unknown-code-refused
    input:
      schema: LocalKickstartErrorResponse
      payload: {error: "refused", code: kickstart_made_up}
    expected: {valid: false, rejected_by: shape, go_rejects: true, go_error_contains: "outside the closed set"}
    classification: must-fail
    provenance: {source: requirement, ref: "the code is a closed set, not an open string"}
    mutation: {description: "a code the contract does not publish"}
  - name: error-response-missing-code-refused
    input:
      schema: LocalKickstartErrorResponse
      payload: {error: "refused"}
    expected: {valid: false, rejected_by: shape, go_rejects: true, go_error_contains: "outside the closed set"}
    classification: must-fail
    provenance: {source: requirement, ref: "every kickstart error carries its code"}
    mutation: {description: "omits the code"}
  - name: error-response-empty-error-refused
    input:
      schema: LocalKickstartErrorResponse
      payload: {error: "", code: kickstart_failed}
    expected: {valid: false, rejected_by: shape, go_rejects: true, go_error_contains: "error is empty"}
    classification: must-fail
    provenance: {source: requirement, ref: "an error names what went wrong"}
    mutation: {description: "sends an empty message"}
  - name: error-response-extra-field-refused
    input:
      schema: LocalKickstartErrorResponse
      payload: {error: "refused", code: kickstart_failed, detail: "extra"}
    expected: {valid: false, rejected_by: shape, go_rejects: true, go_error_contains: "unknown field"}
    classification: must-fail
    provenance: {source: requirement, ref: "kickstart bodies are closed objects"}
    mutation: {description: "adds a field the contract does not declare"}
  - name: error-code-member
    input:
      schema: LocalKickstartErrorCode
      payload: kickstart_config_busy
    expected: {valid: true}
    classification: must-pass
    provenance: {source: enum, ref: "LocalKickstartErrorCode kickstart_config_busy"}
    mutation: {description: "a save that another change holds off"}
  - name: error-code-unknown-refused
    input:
      schema: LocalKickstartErrorCode
      payload: kickstart_busy
    expected: {valid: false, rejected_by: shape, go_rejects: true, go_error_contains: "outside the closed set"}
    classification: must-fail
    provenance: {source: enum, ref: "LocalKickstartErrorCode is closed"}
    mutation: {description: "a near-miss spelling of a published code"}
  - name: scan-partial-notice
    input:
      schema: LocalKickstartScan
      payload: {state: done, done: 4, total: 4, notice: "Claude Code could not be read: the transcript folder is not readable"}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "a partial-scan notice is a declared field, not a phase"}
    mutation: {description: "a scan that finished but could not read one harness folder"}
  - name: scan-notice-whitespace-refused
    input:
      schema: LocalKickstartScan
      payload: {state: done, done: 4, total: 4, notice: "   "}
    expected: {valid: false, rejected_by: semantics, error_contains: "notice is only whitespace"}
    classification: must-fail
    provenance: {source: requirement, ref: "a notice that says nothing cannot be shown"}
    mutation: {description: "a notice made only of spaces"}
