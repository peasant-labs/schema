# The local owner and claim contract: the shapes the read, claim, and decline
# routes answer with, the per-kind artifact identity refusals, the server
# computed prompt state, and the exact non-2xx statuses each route declares.
#
# Each case names the input JSON, whether Validate must accept it, and the
# mutation it guards. The required_names manifest is deliberate: dropping or
# renaming a case fails the loader even when the corpus still loads.
required_names:
  - local-owner-valid
  - local-owner-empty-id
  - local-owner-zero-created-at
  - local-owner-id-over-bound
  - owner-status-empty-claims
  - owner-status-bounded-page
  - owner-status-null-claims
  - owner-status-claim-for-other-owner
  - owner-status-total-below-page
  - owner-status-missing-cursor
  - owner-status-cursor-without-more
  - owner-status-page-over-limit
  - owner-status-counts-do-not-partition
  - claim-entry-username-reuse-two-uuids
  - claim-entry-unnormalized-url
  - claim-entry-empty-username
  - claim-entry-invalid-source
  - claim-entry-zero-claimed-at
  - claim-entry-local-owner-over-bound
  - identity-local
  - identity-village
  - identity-foreign
  - identity-unknown
  - owner-unknown-with-local-identity
  - owner-unknown-with-village-identity
  - owner-local-with-village-user
  - owner-local-with-username
  - owner-village-without-user
  - owner-village-without-claim
  - owner-foreign-with-local-id
  - owner-invalid-kind
  - owner-empty-username
  - owner-local-id-over-bound
  - owner-village-unnormalized-url
  - annotation-row-owner-author
  - annotation-row-unknown-author
  - prompt-not-applicable
  - prompt-due
  - prompt-declined
  - prompt-completed
  - prompt-not-applicable-with-account
  - prompt-due-without-account
  - prompt-due-with-decided-at
  - prompt-declined-without-decided-at
  - prompt-state-not-applicable
  - prompt-state-due
  - prompt-state-declined
  - prompt-state-completed
  - prompt-state-open
  - claim-source-manual
  - claim-source-sign-in-prompt
  - claim-source-automatic
  - claim-source-session-end

local_owner:
  cases:
    - name: local-owner-valid
      input: '{"id":"lo_1","createdAt":"2026-11-12T00:00:00Z"}'
      expected: true
      classification: must-pass
      provenance: {source: requirement, ref: "one permanent local owner carries its identifier and creation time"}
      mutation: {description: "names one data directory owner with its creation time"}
    - name: local-owner-empty-id
      input: '{"id":"","createdAt":"2026-11-12T00:00:00Z"}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "the local owner identifier is non-empty"}
      mutation: {description: "empties only the local owner id"}
    - name: local-owner-zero-created-at
      input: '{"id":"lo_1","createdAt":"0001-01-01T00:00:00Z"}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "the local owner records when it was created"}
      mutation: {description: "sets only createdAt to the zero time"}
    - name: local-owner-id-over-bound
      input: '{"id":"lo_1234567890123456789012345678901234567890123456789012345678901234","createdAt":"2026-11-12T00:00:00Z"}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "the local owner id is at most 64 bytes"}
      mutation: {description: "grows only the local owner id one byte past the bound"}

owner_status:
  cases:
    - name: owner-status-empty-claims
      input: '{"owner":{"id":"lo_1","createdAt":"2026-11-12T00:00:00Z"},"claims":[],"totalClaims":0,"prompt":{"state":"not_applicable"},"ownership":{"sessions":{"total":0,"claimed":0,"unclaimed":0},"annotations":{"total":0,"claimed":0,"unclaimed":0}}}'
      expected: true
      classification: must-pass
      provenance: {source: requirement, ref: "an installation with no claims answers an empty page, a zero total, a not-applicable prompt, and zero ownership counts"}
      mutation: {description: "emits the empty status an unclaimed data directory returns"}
    - name: owner-status-bounded-page
      input: '{"owner":{"id":"lo_1","createdAt":"2026-11-12T00:00:00Z"},"claims":[{"id":"clm_2","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"manual","claimedAt":"2026-11-12T01:00:00Z"},{"id":"clm_1","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"automatic","claimedAt":"2026-11-12T00:00:00Z"}],"totalClaims":150,"nextBefore":"clm_1","prompt":{"state":"completed","account":{"villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000"},"decidedAt":"2026-11-12T01:00:00Z"},"ownership":{"sessions":{"total":3,"claimed":2,"unclaimed":1},"annotations":{"total":1,"claimed":1,"unclaimed":0}}}'
      expected: true
      classification: must-pass
      provenance: {source: requirement, ref: "the status pages the append-only log and carries the total, the older-page cursor, and the ownership counts"}
      mutation: {description: "returns two of one hundred fifty entries with the cursor naming the oldest returned entry"}
    - name: owner-status-null-claims
      input: '{"owner":{"id":"lo_1","createdAt":"2026-11-12T00:00:00Z"},"claims":null,"totalClaims":0,"prompt":{"state":"not_applicable"},"ownership":{"sessions":{"total":0,"claimed":0,"unclaimed":0},"annotations":{"total":0,"claimed":0,"unclaimed":0}}}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "an empty claim page is an empty array, never null"}
      mutation: {description: "nulls the claims page of an otherwise valid empty status"}
    - name: owner-status-claim-for-other-owner
      input: '{"owner":{"id":"lo_1","createdAt":"2026-11-12T00:00:00Z"},"claims":[{"id":"clm_1","localOwnerId":"lo_2","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"manual","claimedAt":"2026-11-12T00:00:00Z"}],"totalClaims":1,"prompt":{"state":"not_applicable"},"ownership":{"sessions":{"total":0,"claimed":0,"unclaimed":0},"annotations":{"total":0,"claimed":0,"unclaimed":0}}}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "a status carries only claims appended for its own local owner"}
      mutation: {description: "changes only the claim localOwnerId away from the status owner"}
    - name: owner-status-total-below-page
      input: '{"owner":{"id":"lo_1","createdAt":"2026-11-12T00:00:00Z"},"claims":[{"id":"clm_2","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"manual","claimedAt":"2026-11-12T01:00:00Z"},{"id":"clm_1","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"automatic","claimedAt":"2026-11-12T00:00:00Z"}],"totalClaims":1,"nextBefore":"clm_1","prompt":{"state":"not_applicable"},"ownership":{"sessions":{"total":0,"claimed":0,"unclaimed":0},"annotations":{"total":0,"claimed":0,"unclaimed":0}}}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "the total counts every entry and cannot omit a returned one"}
      mutation: {description: "drops totalClaims below the returned page size"}
    - name: owner-status-missing-cursor
      input: '{"owner":{"id":"lo_1","createdAt":"2026-11-12T00:00:00Z"},"claims":[{"id":"clm_2","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"manual","claimedAt":"2026-11-12T01:00:00Z"},{"id":"clm_1","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"automatic","claimedAt":"2026-11-12T00:00:00Z"}],"totalClaims":150,"prompt":{"state":"not_applicable"},"ownership":{"sessions":{"total":0,"claimed":0,"unclaimed":0},"annotations":{"total":0,"claimed":0,"unclaimed":0}}}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "more entries than the page requires an older-page cursor"}
      mutation: {description: "leaves totalClaims above the page size with no cursor"}
    - name: owner-status-cursor-without-more
      input: '{"owner":{"id":"lo_1","createdAt":"2026-11-12T00:00:00Z"},"claims":[{"id":"clm_2","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"manual","claimedAt":"2026-11-12T01:00:00Z"},{"id":"clm_1","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"automatic","claimedAt":"2026-11-12T00:00:00Z"}],"totalClaims":2,"nextBefore":"clm_1","prompt":{"state":"not_applicable"},"ownership":{"sessions":{"total":0,"claimed":0,"unclaimed":0},"annotations":{"total":0,"claimed":0,"unclaimed":0}}}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "a cursor appears only when older entries remain"}
      mutation: {description: "sets a cursor while the total equals the page size"}
    - name: owner-status-page-over-limit
      input: '{"owner":{"id":"lo_1","createdAt":"2026-11-12T00:00:00Z"},"claims":[{"id":"clm_1","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"automatic","claimedAt":"2026-11-12T00:00:00Z"},{"id":"clm_2","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"automatic","claimedAt":"2026-11-12T00:00:00Z"},{"id":"clm_3","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"automatic","claimedAt":"2026-11-12T00:00:00Z"},{"id":"clm_4","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"automatic","claimedAt":"2026-11-12T00:00:00Z"},{"id":"clm_5","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"automatic","claimedAt":"2026-11-12T00:00:00Z"},{"id":"clm_6","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"automatic","claimedAt":"2026-11-12T00:00:00Z"},{"id":"clm_7","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"automatic","claimedAt":"2026-11-12T00:00:00Z"},{"id":"clm_8","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"automatic","claimedAt":"2026-11-12T00:00:00Z"},{"id":"clm_9","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"automatic","claimedAt":"2026-11-12T00:00:00Z"},{"id":"clm_10","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-