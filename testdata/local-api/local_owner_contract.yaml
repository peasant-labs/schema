claim_entry:
  cases:
    - name: claim-entry-username-reuse-two-uuids
      input: '[{"id":"clm_1","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"manual","claimedAt":"2026-11-12T00:00:00Z"},{"id":"clm_2","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174001","username":"ada","source":"sign_in_prompt","claimedAt":"2026-11-12T01:00:00Z"}]'
      expected: true
      classification: must-pass
      provenance: {source: requirement, ref: "the account is the base URL plus user UUID; a reused username never merges two accounts"}
      mutation: {description: "records two UUIDs under one display username"}
    - name: claim-entry-unnormalized-url
      input: '{"id":"clm_1","localOwnerId":"lo_1","villageUrl":"https://Village.Example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"manual","claimedAt":"2026-11-12T00:00:00Z"}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "the claim entry reuses the normalized collective observation scope grammar"}
      mutation: {description: "changes only the villageUrl host casing away from the canonical spelling"}
    - name: claim-entry-empty-username
      input: '{"id":"clm_1","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"","source":"manual","claimedAt":"2026-11-12T00:00:00Z"}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "a display snapshot that names no person is refused"}
      mutation: {description: "empties only the claim entry username"}
    - name: claim-entry-invalid-source
      input: '{"id":"clm_1","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"session_end","claimedAt":"2026-11-12T00:00:00Z"}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "claim source is a closed menu"}
      mutation: {description: "changes only the source to a value outside the closed set"}
    - name: claim-entry-zero-claimed-at
      input: '{"id":"clm_1","localOwnerId":"lo_1","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"manual","claimedAt":"0001-01-01T00:00:00Z"}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "a claim entry records when it was appended"}
      mutation: {description: "sets only claimedAt to the zero time"}
    - name: claim-entry-local-owner-over-bound
      input: '{"id":"clm_1","localOwnerId":"lo_1234567890123456789012345678901234567890123456789012345678901234","villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000","username":"ada","source":"manual","claimedAt":"2026-11-12T00:00:00Z"}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "the local owner id is at most 64 bytes"}
      mutation: {description: "grows only localOwnerId one byte past the bound"}

artifact_identity:
  cases:
    - name: identity-local
      input: '{"kind":"local","localOwnerId":"lo_1"}'
      expected: true
      classification: must-pass
      provenance: {source: requirement, ref: "a local identity carries only this data directory's owner id"}
      mutation: {description: "names the local holder with no Village identity"}
    - name: identity-village
      input: '{"kind":"village","villageUrl":"https://village.example/base","villageUserId":"123e4567-e89b-12d3-a456-426614174000","claimId":"clm_1","username":"ada"}'
      expected: true
      classification: must-pass
      provenance: {source: requirement, ref: "a village identity carries the full account scope and the claim entry that joins the row to it"}
      mutation: {description: "names one claimed account with its base URL, UUID, claim id, and display snapshot"}
    - name: identity-foreign
      input: '{"kind":"foreign","villageUrl":"https://village.example/base","villageUserId":"123e4567-e89b-12d3-a456-426614174000","username":"ada"}'
      expected: true
      classification: must-pass
      provenance: {source: requirement, ref: "a pulled owner keeps its recorded Village scope and display snapshot but is never claimed"}
      mutation: {description: "names a pulled owner with no claim id"}
    - name: identity-unknown
      input: '{"kind":"unknown"}'
      expected: true
      classification: must-pass
      provenance: {source: requirement, ref: "a projected but withheld owner carries no identity"}
      mutation: {description: "withholds the owner without falling back to the local holder"}
    - name: owner-unknown-with-local-identity
      input: '{"kind":"unknown","localOwnerId":"lo_1"}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "unknown is never a local fallback"}
      mutation: {description: "adds a local owner id to the unknown kind"}
    - name: owner-unknown-with-village-identity
      input: '{"kind":"unknown","villageUrl":"https://village.example/base","villageUserId":"123e4567-e89b-12d3-a456-426614174000"}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "unknown carries no identity at all"}
      mutation: {description: "adds a Village scope to the unknown kind"}
    - name: owner-local-with-village-user
      input: '{"kind":"local","localOwnerId":"lo_1","villageUserId":"123e4567-e89b-12d3-a456-426614174000"}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "kind local is not a Village account"}
      mutation: {description: "adds a Village user UUID to a local identity"}
    - name: owner-local-with-username
      input: '{"kind":"local","localOwnerId":"lo_1","username":"ada"}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "the local owner has no display snapshot"}
      mutation: {description: "adds a username to a local identity"}
    - name: owner-village-without-user
      input: '{"kind":"village","villageUrl":"https://village.example/base","claimId":"clm_1"}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "a village identity requires the stable user UUID"}
      mutation: {description: "drops only villageUserId from a valid village identity"}
    - name: owner-village-without-claim
      input: '{"kind":"village","villageUrl":"https://village.example/base","villageUserId":"123e4567-e89b-12d3-a456-426614174000"}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "a village row must join the claim entry that explains it"}
      mutation: {description: "drops only claimId from a valid village identity"}
    - name: owner-foreign-with-local-id
      input: '{"kind":"foreign","localOwnerId":"lo_1","villageUrl":"https://village.example/base","villageUserId":"123e4567-e89b-12d3-a456-426614174000"}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "a foreign owner is not this directory's local owner"}
      mutation: {description: "adds a local owner id to a foreign identity"}
    - name: owner-invalid-kind
      input: '{"kind":"creator","localOwnerId":"lo_1"}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "artifact identity kind is a closed menu"}
      mutation: {description: "changes only the kind to a value outside the closed set"}
    - name: owner-empty-username
      input: '{"kind":"village","villageUrl":"https://village.example/base","villageUserId":"123e4567-e89b-12d3-a456-426614174000","claimId":"clm_1","username":""}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "an empty display snapshot is refused"}
      mutation: {description: "empties only the username of a valid village identity"}
    - name: owner-local-id-over-bound
      input: '{"kind":"local","localOwnerId":"lo_1234567890123456789012345678901234567890123456789012345678901234"}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "the local owner id is bounded at 64 bytes on the row too"}
      mutation: {description: "grows only localOwnerId one byte past the bound"}
    - name: owner-village-unnormalized-url
      input: '{"kind":"village","villageUrl":"https://village.example/base/","villageUserId":"123e4567-e89b-12d3-a456-426614174000","claimId":"clm_1"}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "the row reuses the normalized account scope, not a second spelling"}
      mutation: {description: "adds a trailing slash to the village base URL"}

annotation_row:
  cases:
