prompt:
  cases:
    - name: prompt-not-applicable
      input: '{"state":"not_applicable"}'
      expected: true
      classification: must-pass
      provenance: {source: requirement, ref: "no selected account means there is nothing to prompt for"}
      mutation: {description: "omits the account and decision for the not-applicable state"}
    - name: prompt-due
      input: '{"state":"due","account":{"villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000"}}'
      expected: true
      classification: must-pass
      provenance: {source: requirement, ref: "a signed-in account with no decision is due"}
      mutation: {description: "carries the account scope with no decision"}
    - name: prompt-declined
      input: '{"state":"declined","account":{"villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000"},"decidedAt":"2026-11-12T00:00:00Z"}'
      expected: true
      classification: must-pass
      provenance: {source: requirement, ref: "a decline is settled for one local owner plus account scope"}
      mutation: {description: "records a declined decision with its account and time"}
    - name: prompt-completed
      input: '{"state":"completed","account":{"villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000"},"decidedAt":"2026-11-12T00:00:00Z"}'
      expected: true
      classification: must-pass
      provenance: {source: requirement, ref: "a completed claim decision is settled even when nothing was left to claim"}
      mutation: {description: "records a completed decision with its account and time"}
    - name: prompt-not-applicable-with-account
      input: '{"state":"not_applicable","account":{"villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000"}}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "the account is present exactly when signed in"}
      mutation: {description: "adds an account to the not-applicable state"}
    - name: prompt-due-without-account
      input: '{"state":"due"}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "a due prompt names the account it is due for"}
      mutation: {description: "drops the account from the due state"}
    - name: prompt-due-with-decided-at
      input: '{"state":"due","account":{"villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000"},"decidedAt":"2026-11-12T00:00:00Z"}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "decidedAt is present only for a settled state"}
      mutation: {description: "adds a decision time to the due state"}
    - name: prompt-declined-without-decided-at
      input: '{"state":"declined","account":{"villageUrl":"https://village.example/base","userId":"123e4567-e89b-12d3-a456-426614174000"}}'
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "a settled state records when it was decided"}
      mutation: {description: "drops decidedAt from the declined state"}

prompt_states:
  cases:
    - {name: prompt-state-not-applicable, input: not_applicable, expected: true, classification: must-pass, provenance: {source: enum, ref: "LocalOwnerPromptState"}, mutation: {description: "accepts the no-account member"}}
    - {name: prompt-state-due, input: due, expected: true, classification: must-pass, provenance: {source: enum, ref: "LocalOwnerPromptState"}, mutation: {description: "accepts the due member"}}
    - {name: prompt-state-declined, input: declined, expected: true, classification: must-pass, provenance: {source: enum, ref: "LocalOwnerPromptState"}, mutation: {description: "accepts the declined member"}}
    - {name: prompt-state-completed, input: completed, expected: true, classification: must-pass, provenance: {source: enum, ref: "LocalOwnerPromptState"}, mutation: {description: "accepts the completed member"}}
    - {name: prompt-state-open, input: open, expected: false, classification: must-fail, provenance: {source: enum, ref: "LocalOwnerPromptState"}, mutation: {description: "refuses a value outside the closed set"}}

claim_sources:
  cases:
    - {name: claim-source-manual, input: manual, expected: true, classification: must-pass, provenance: {source: enum, ref: "LocalClaimSource"}, mutation: {description: "accepts the explicit command member"}}
    - {name: claim-source-sign-in-prompt, input: sign_in_prompt, expected: true, classification: must-pass, provenance: {source: enum, ref: "LocalClaimSource"}, mutation: {description: "accepts the sign-in prompt member"}}
    - {name: claim-source-automatic, input: automatic, expected: true, classification: must-pass, provenance: {source: enum, ref: "LocalClaimSource"}, mutation: {description: "accepts the automatic member"}}
    - {name: claim-source-session-end, input: session_end, expected: false, classification: must-fail, provenance: {source: enum, ref: "LocalClaimSource"}, mutation: {description: "refuses a value outside the closed set"}}

operations:
  - {name: read, method: get, path: /api/v1/local-owner, operation_id: getLocalOwnerStatus, error_statuses: [500]}
  - {name: claim, method: post, path: /api/v1/local-owner/claim, operation_id: claimLocalOwner, error_statuses: [400, 401, 403, 500, 504]}
  - {name: decline, method: post, path: /api/v1/local-owner/decline, operation_id: declineLocalOwnerPrompt, error_statuses: [401, 403, 500]}
