round_trip:
  cases:
    - name: flat-detail-root
      input: {kind: detail, json: '{"id":"child","harness":"claude-code","turnCount":1,"turns":[{"index":0,"role":"user","content":"hello","timestamp":"2026-09-08T00:00:00Z","depth":0}],"relationshipNavigation":[{"kind":"started_by","status":"resolved","localId":"ses_parent"}]}' }
      expected: {valid: true, requiredKeys: [id, turns, relationshipNavigation], forbiddenKeys: [detail, sessionDetail]}
      classification: must-pass
      provenance: {source: requirement, ref: "flat additive local detail read"}
      mutation: {description: "adds authorized navigation beside durable root fields"}
    - name: input-count-absent
      input: {kind: row, json: '{"session":{"id":"legacy","harness":"claude-code","startTime":"2026-09-08T00:00:00Z","durationMins":1,"totalTokens":2,"turnCount":4,"toolCallCount":0}}'}
      expected: {valid: true, requiredKeys: [session], forbiddenKeys: [inputSubmissionCount]}
      classification: must-pass
      provenance: {source: requirement, ref: "absent input count remains unknown"}
      mutation: {description: "omits inputSubmissionCount while retaining turnCount four"}
    - name: input-count-zero
      input: {kind: row, json: '{"session":{"id":"measured","harness":"claude-code","startTime":"2026-09-08T00:00:00Z","durationMins":1,"totalTokens":2,"turnCount":5,"inputSubmissionCount":0,"toolCallCount":0,"rootSessionId":"ses_root","purpose":"interaction"}}'}
      expected: {valid: true, requiredKeys: [session, inputSubmissionCount], forbiddenKeys: []}
      classification: must-pass
      provenance: {source: requirement, ref: "measured zero is independent from main turns"}
      mutation: {description: "sets measured zero beside five transcript records"}
    - name: sync-exact-mirrors
      input: {kind: row, json: '{"session":{"id":"sync","harness":"codex","startTime":"2026-09-08T00:00:00Z","durationMins":1,"totalTokens":9,"turnCount":5,"inputSubmissionCount":1,"toolCallCount":0,"project":"p","projectHash":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"},"sync":{"id":"sync","harness":"codex","projectName":"p","projectHash":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","hostSlug":"h","startTime":"2026-09-08T00:00:00Z","durationMs":60000,"totalTokens":9,"turnCount":5,"model":"m","inputSubmissionCount":1,"syncStatus":"synced","previouslyPushed":true}}'}
      expected: {valid: true, requiredKeys: [session, sync], forbiddenKeys: []}
      classification: must-pass
      provenance: {source: requirement, ref: "sync row preserves exact identity and count mirrors"}
      mutation: {description: "supplies equal session and sync identity/count values"}
    - name: search-exact-session
      input: {kind: row, json: '{"session":{"id":"search","harness":"opencode","startTime":"2026-09-08T00:00:00Z","durationMins":1,"totalTokens":2,"turnCount":1,"toolCallCount":0},"matches":[{"sessionId":"search","project":"p","entryIndex":0,"role":"user","snippet":"hit","score":1}]}' }
      expected: {valid: true, requiredKeys: [session, matches], forbiddenKeys: []}
      classification: must-pass
      provenance: {source: requirement, ref: "search matches belong to their concrete row"}
      mutation: {description: "retains a typed matching SearchResult"}
    - name: context-arm-only
      input: {kind: item, json: '{"kind":"context_container","context":{"groupId":"hg_owner","ownerStatus":"known_unavailable"},"helperGroups":[{"groupId":"hg_owner","purpose":"helper_review","helperThreadCount":2,"memberScope":"scope"}]}' }
      expected: {valid: true, requiredKeys: [kind, context, helperGroups], forbiddenKeys: [transcript]}
      classification: must-pass
      provenance: {source: requirement, ref: "helper-only context uses no fabricated transcript"}
      mutation: {description: "selects only the context_container sum arm"}
    - name: typed-member-array
      input: {kind: members, json: '{"members":[{"kind":"transcript","transcript":{"session":{"id":"g1","harness":"codex","startTime":"2026-09-08T00:00:00Z","durationMins":1,"totalTokens":1,"turnCount":1,"toolCallCount":0}}},{"kind":"transcript","transcript":{"session":{"id":"g2","harness":"codex","startTime":"2026-09-08T00:01:00Z","durationMins":1,"totalTokens":1,"turnCount":1,"toolCallCount":0}}}],"page":1,"limit":20,"total":2}' }
      expected: {valid: true, requiredKeys: [members, page, limit, total], forbiddenKeys: []}
      classification: must-pass
      provenance: {source: requirement, ref: "member response retains concrete LocalSessionRow values"}
      mutation: {description: "contains two typed saved helper identities"}
    - name: legacy-sync-body
      input: {kind: sync-payload, json: '{"sessions":[{"id":"s1","harness":"codex","projectName":"p","projectHash":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","hostSlug":"host","startTime":"2026-09-08T00:00:00Z","durationMs":42,"totalTokens":9,"turnCount":5,"model":"m","syncStatus":"new","previouslyPushed":false}]}' }
      expected: {valid: true, requiredKeys: [sessions], forbiddenKeys: [items, totalItems]}
      classification: must-pass
      provenance: {source: requirement, ref: "the Local API 0.15.0 omitted-view sync response, which adds previouslyPushed to the sync_handler body"}
      mutation: {description: "uses the concrete legacy sessions envelope and complete producer row"}
    - name: grouped-list-values
      input: {kind: list, json: '{"items":[{"kind":"transcript","transcript":{"session":{"id":"p1","harness":"codex","startTime":"2026-09-08T00:00:00Z","durationMins":1,"totalTokens":9,"turnCount":5,"inputSubmissionCount":1,"toolCallCount":0}},"helperGroups":[{"groupId":"hg_p1","purpose":"helper_review","helperThreadCount":2,"memberScope":"scope"}]}],"page":1,"limit":2,"totalItems":3,"ordinarySessionTotal":3,"helperThreadTotal":3}' }
      expected: {valid: true, requiredKeys: [items, page, limit, totalItems, ordinarySessionTotal, helperThreadTotal], forbiddenKeys: [sessions]}
      classification: must-pass
      provenance: {source: requirement, ref: "independent grouped totals and nested helper count"}
      mutation: {description: "retains page totals three/three/three and owner helper count two"}
    - name: legacy-ws-sessions
      input: {kind: sessions, json: '{"sessions":[{"id":"legacy","harness":"codex","startTime":"2026-09-08T00:00:00Z","durationMins":1,"totalTokens":2,"turnCount":4,"toolCallCount":0}]}' }
      expected: {valid: true, requiredKeys: [sessions], forbiddenKeys: [items, relationshipNavigation]}
      classification: must-pass
      provenance: {source: requirement, ref: "existing WebSocket sessions payload"}
      mutation: {description: "preserves the legacy flat sessions array"}
    - name: session-commits-empty
      input: {kind: commits, json: '{"commits":[]}'}
      expected: {valid: true, requiredKeys: [commits], forbiddenKeys: []}
      classification: must-pass
      provenance: {source: requirement, ref: "a stored session with no recorded commits answers an empty array"}
      mutation: {description: "emits the empty commits array rather than null"}
    - name: session-pull-request-row
      input: {kind: pull-requests, json: '{"pullRequests":[{"owner":"acme","repo":"api","number":42,"url":"https://github.com/acme/api/pull/42","source":"gh_pr_create"}]}'}
      expected: {valid: true, requiredKeys: [pullRequests], forbiddenKeys: []}
      classification: must-pass
      provenance: {source: requirement, ref: "a detected pull request carries its repository identity and detector"}
      mutation: {description: "carries one detected row with the open source label"}
    - name: session-pull-request-open-source
      input: {kind: pull-requests, json: '{"pullRequests":[{"owner":"acme","repo":"api","number":7,"url":"https://github.com/acme/api/pull/7","source":"gh_pr_create_v2"}]}'}
      expected: {valid: true, requiredKeys: [pullRequests], forbiddenKeys: []}
      classification: must-pass
      provenance: {source: requirement, ref: "source is an open string, so a later detector needs no rewrite of rows already stored by a consumer"}
      mutation: {description: "carries a detector label the contract does not define through the read unchanged"}
    - name: teammate-name-multibyte-under-bound
      input: {kind: detail, json: '{"id":"teammate","harness":"claude-code","turnCount":1,"turns":[{"index":0,"role":"user","content":"hello","timestamp":"2026-09-08T00:00:00Z","depth":0}],"teammate":{"team":"review-crew","name":"éééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééé","evidence":"native_dynamic_workflow"}}' }
      expected: {valid: true, requiredKeys: [id, turns, teammate], forbiddenKeys: []}
      classification: must-pass
      provenance: {source: boundary, ref: "a name is bounded by Unicode code points, not by encoded bytes"}
      mutation: {description: "keeps a 200-character name of two-byte characters, over 256 encoded bytes but under the 256-character bound"}
    - name: teammate-detail-round-trip
      input: {kind: detail, json: '{"id":"teammate","harness":"claude-code","turnCount":1,"turns":[{"index":0,"role":"user","content":"hello","timestamp":"2026-09-08T00:00:00Z","depth":0}],"parentSessionId":"ses_root","teammate":{"team":"review-crew","name":"parser-reviewer","evidence":"native_dynamic_workflow"}}' }
      expected: {valid: true, requiredKeys: [id, turns, parentSessionId, teammate], forbiddenKeys: []}
      classification: must-pass
      provenance: {source: requirement, ref: "local detail read carries the recorded teammate beside the durable root fields"}
      mutation: {description: "adds one exact teammate identity to a flat detail read"}
    - name: teammate-sync-row-round-trip
      input: {kind: row, json: '{"session":{"id":"teammate","harness":"claude-code","startTime":"2026-09-08T00:00:00Z","durationMins":1,"totalTokens":9,"turnCount":5,"toolCallCount":0,"project":"p","projectHash":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","parentSessionId":"ses_root","teammate":{"team":"review-crew","name":"parser-reviewer","evidence":"native_dynamic_workflow"}},"sync":{"id":"teammate","harness":"claude-code","projectName":"p","projectHash":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","hostSlug":"h","startTime":"2026-09-08T00:00:00Z","durationMs":60000,"totalTokens":9,"turnCount":5,"model":"m","syncStatus":"new","previouslyPushed":false,"parentSessionId":"ses_root","teammate":{"team":"review-crew","name":"parser-reviewer","evidence":"native_dynamic_workflow"}}}' }
      expected: {valid: true, requiredKeys: [session, sync], forbiddenKeys: []}
      classification: must-pass
      provenance: {source: requirement, ref: "the list summary and the sync summary carry the same recorded teammate"}
      mutation: {description: "supplies one equal teammate identity on both summaries of a sync row"}
validation:
  cases:
    - name: mismatched-sync-count
      input: {kind: row, json: '{"session":{"id":"sync","harness":"codex","startTime":"2026-09-08T00:00:00Z","durationMins":1,"totalTokens":9,"turnCount":5,"inputSubmissionCount":1,"toolCallCount":0},"sync":{"id":"sync","harness":"codex","projectName":"","hostSlug":"h","startTime":"x","durationMs":1,"totalTokens":9,"turnCount":1,"model":"m","inputSubmissionCount":1,"syncStatus":"synced","previouslyPushed":true}}'}
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "sync count mirrors"}
      mutation: {description: "changes both sync counts away from the session row"}
    - name: mismatched-search-session
      input: {kind: row, json: '{"session":{"id":"search","harness":"opencode","startTime":"2026-09-08T00:00:00Z","durationMins":1,"totalTokens":2,"turnCount":1,"toolCallCount":0},"matches":[{"sessionId":"other","project":"p","entryIndex":0,"role":"user","snippet":"hit","score":1}]}' }
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "search row identity"}
      mutation: {description: "attaches another session's search match"}
    - name: contradictory-item-arms
      input: {kind: item, json: '{"kind":"transcript","transcript":{"session":{"id":"p","harness":"codex","startTime":"2026-09-08T00:00:00Z","durationMins":1,"totalTokens":1,"turnCount":1,"toolCallCount":0}},"context":{"groupId":"hg_p","ownerStatus":"resolved"}}'}
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "local list discriminated union"}
      mutation: {description: "populates both transcript and context arms"}
    - name: negative-input-count
      input: {kind: row, json: '{"session":{"id":"bad","harness":"codex","startTime":"2026-09-08T00:00:00Z","durationMins":1,"totalTokens":1,"turnCount":1,"inputSubmissionCount":-1,"toolCallCount":0}}'}
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "canonical input count lower bound"}
      mutation: {description: "changes only inputSubmissionCount to negative one"}
    - name: unsafe-input-count
      input: {kind: row, json: '{"session":{"id":"bad","harness":"codex","startTime":"2026-09-08T00:00:00Z","durationMins":1,"totalTokens":1,"turnCount":1,"inputSubmissionCount":9007199254740992,"toolCallCount":0}}'}
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "canonical JS-safe input count upper bound"}
      mutation: {description: "changes only inputSubmissionCount above the safe maximum"}
    - name: invalid-matching-sync-count
      input: {kind: row, json: '{"session":{"id":"bad","harness":"codex","startTime":"2026-09-08T00:00:00Z","durationMins":1,"totalTokens":1,"turnCount":1,"inputSubmissionCount":-1,"toolCallCount":0},"sync":{"id":"bad","harness":"codex","projectName":"","hostSlug":"h","startTime":"x","durationMs":1,"totalTokens":1,"turnCount":1,"model":"m","inputSubmissionCount":-1,"syncStatus":"new","previouslyPushed":false}}'}
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "matching mirrors do not bypass count validity"}
      mutation: {description: "sets only both mirrored input counts to the same invalid value"}
    - name: mixed-sync-search
      input: {kind: row, json: '{"session":{"id":"mixed","harness":"codex","startTime":"2026-09-08T00:00:00Z","durationMins":1,"totalTokens":1,"turnCount":1,"toolCallCount":0},"sync":{"id":"mixed","harness":"codex","projectName":"","hostSlug":"h","startTime":"x","durationMs":1,"totalTokens":1,"turnCount":1,"model":"m","syncStatus":"new"},"matches":[{"sessionId":"mixed","project":"p","entryIndex":0,"role":"user","snippet":"hit","score":1}]}' }
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "route variants are exclusive"}
      mutation: {description: "adds a search match to an otherwise valid sync row"}
    - name: invalid-nested-list-row
      input: {kind: list, json: '{"items":[{"kind":"transcript","transcript":{"session":{"id":"bad","harness":"codex","startTime":"2026-09-08T00:00:00Z","durationMins":1,"totalTokens":1,"turnCount":1,"inputSubmissionCount":-1,"toolCallCount":0}}}],"page":1,"limit":1,"totalItems":1,"ordinarySessionTotal":1,"helperThreadTotal":0}' }
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "list validator traverses rows"}
      mutation: {description: "places one negative count inside a grouped list row"}
    - name: invalid-nested-member-row
      input: {kind: members, json: '{"members":[{"kind":"transcript","transcript":{"session":{"id":"bad","harness":"codex","startTime":"2026-09-08T00:00:00Z","durationMins":1,"totalTokens":1,"turnCount":1,"inputSubmissionCount":9007199254740992,"toolCallCount":0}}}],"page":1,"limit":1,"total":1}' }
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "member validator traverses rows"}
      mutation: {description: "places one unsafe count inside a typed member row"}
    - name: session-commits-null-array
      input: {kind: commits, json: '{"commits":null}'}
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "an empty read must not be answerable with null"}
      mutation: {description: "nulls the commits array of an otherwise empty answer"}
    - name: session-pull-requests-null-array
      input: {kind: pull-requests, json: '{"pullRequests":null}'}
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "an empty detection must not be answerable with null"}
      mutation: {description: "nulls the pullRequests array of an otherwise empty answer"}
    - name: session-pull-request-zero-number
      input: {kind: pull-requests, json: '{"pullRequests":[{"owner":"acme","repo":"api","number":0,"url":"https://github.com/acme/api/pull/0","source":"gh_pr_create"}]}'}
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "a pull request number is one or greater"}
      mutation: {description: "changes only the row number of an otherwise valid detected row to zero"}
    - name: session-pull-request-empty-owner
      input: {kind: pull-requests, json: '{"pullRequests":[{"owner":"","repo":"api","number":42,"url":"https://github.com/acme/api/pull/42","source":"gh_pr_create"}]}'}
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "a detected row must attribute its repository owner"}
      mutation: {description: "empties only the row owner of an otherwise valid detected row"}
    - name: session-pull-request-empty-repo
      input: {kind: pull-requests, json: '{"pullRequests":[{"owner":"acme","repo":"","number":42,"url":"https://github.com/acme/api/pull/42","source":"gh_pr_create"}]}'}
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "a detected row must attribute its repository name"}
      mutation: {description: "empties only the row repo of an otherwise valid detected row"}
    - name: session-pull-request-empty-url
      input: {kind: pull-requests, json: '{"pullRequests":[{"owner":"acme","repo":"api","number":42,"url":"","source":"gh_pr_create"}]}'}
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "a detected row must carry the canonical address it was read from"}
      mutation: {description: "empties only the row url of an otherwise valid detected row"}
    - name: session-pull-request-empty-source
      input: {kind: pull-requests, json: '{"pullRequests":[{"owner":"acme","repo":"api","number":42,"url":"https://github.com/acme/api/pull/42","source":""}]}'}
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "a missing detector must not be told apart from an unknown one"}
      mutation: {description: "empties only the row source of an otherwise valid detected row"}
    - name: teammate-wrong-evidence
      input: {kind: detail, json: '{"id":"teammate","harness":"claude-code","turnCount":1,"turns":[{"index":0,"role":"user","content":"hello","timestamp":"2026-09-08T00:00:00Z","depth":0}],"teammate":{"team":"review-crew","name":"parser-reviewer","evidence":"native_typed"}}' }
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "teammate evidence comes from the dedicated teammate evidence menu, not the shared session graph set"}
      mutation: {description: "changes only the teammate evidence to native_typed, a shared session graph kind outside the teammate menu"}
    - name: teammate-empty-name
      input: {kind: detail, json: '{"id":"teammate","harness":"claude-code","turnCount":1,"turns":[{"index":0,"role":"user","content":"hello","timestamp":"2026-09-08T00:00:00Z","depth":0}],"teammate":{"team":"review-crew","name":"","evidence":"native_dynamic_workflow"}}' }
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "teammate identity fields are non-empty"}
      mutation: {description: "empties only the teammate name"}
    - name: teammate-mismatched-sync
      input: {kind: row, json: '{"session":{"id":"teammate","harness":"claude-code","startTime":"2026-09-08T00:00:00Z","durationMins":1,"totalTokens":9,"turnCount":5,"toolCallCount":0,"teammate":{"team":"review-crew","name":"parser-reviewer","evidence":"native_dynamic_workflow"}},"sync":{"id":"teammate","harness":"claude-code","projectName":"","hostSlug":"h","startTime":"x","durationMs":1,"totalTokens":9,"turnCount":5,"model":"m","syncStatus":"new","teammate":{"team":"review-crew","name":"other-reviewer","evidence":"native_dynamic_workflow"}}}' }
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "one saved transcript has one teammate identity across its route summaries"}
      mutation: {description: "changes only the sync row teammate name away from the session row"}
    - name: teammate-name-over-bound
      input: {kind: detail, json: '{"id":"teammate","harness":"claude-code","turnCount":1,"turns":[{"index":0,"role":"user","content":"hello","timestamp":"2026-09-08T00:00:00Z","depth":0}],"teammate":{"team":"review-crew","name":"ééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééé","evidence":"native_dynamic_workflow"}}' }
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "teammate identity fields are bounded at 256 characters (Unicode code points)"}
      mutation: {description: "grows only the teammate name to 257 characters (Unicode code points), one over the bound"}
    - name: teammate-name-control-character
      input: {kind: detail, json: '{"id":"teammate","harness":"claude-code","turnCount":1,"turns":[{"index":0,"role":"user","content":"hello","timestamp":"2026-09-08T00:00:00Z","depth":0}],"teammate":{"team":"review-crew","name":"reviewer\u0007","evidence":"native_dynamic_workflow"}}' }
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "teammate identity fields carry no control characters"}
      mutation: {description: "appends the U+0007 bell character to the teammate name, which a rendered identity line cannot carry"}
    - name: teammate-only-in-session
      input: {kind: row, json: '{"session":{"id":"teammate","harness":"claude-code","startTime":"2026-09-08T00:00:00Z","durationMins":1,"totalTokens":9,"turnCount":5,"toolCallCount":0,"teammate":{"team":"review-crew","name":"parser-reviewer","evidence":"native_dynamic_workflow"}},"sync":{"id":"teammate","harness":"claude-code","projectName":"","hostSlug":"h","startTime":"x","durationMs":1,"totalTokens":9,"turnCount":5,"model":"m","syncStatus":"new"}}' }
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "one saved transcript has one teammate identity across its route summaries"}
      mutation: {description: "keeps the teammate on the session summary and omits it from the sync summary"}
    - name: teammate-only-in-sync
      input: {kind: row, json: '{"session":{"id":"teammate","harness":"claude-code","startTime":"2026-09-08T00:00:00Z","durationMins":1,"totalTokens":9,"turnCount":5,"toolCallCount":0},"sync":{"id":"teammate","harness":"claude-code","projectName":"","hostSlug":"h","startTime":"x","durationMs":1,"totalTokens":9,"turnCount":5,"model":"m","syncStatus":"new","teammate":{"team":"review-crew","name":"parser-reviewer","evidence":"native_dynamic_workflow"}}}' }
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: "one saved transcript has one teammate identity across its route summaries"}
      mutation: {description: "keeps the teammate on the sync summary and omits it from the session summary"}
