  - legacy-ws-sessions
  - negative-input-count
  - unsafe-input-count
  - invalid-matching-sync-count
  - mixed-sync-search
  - invalid-nested-list-row
  - invalid-nested-member-row
  - session-commits-empty
  - session-pull-request-row
  - session-pull-request-open-source
  - session-commits-null-array
  - session-pull-requests-null-array
