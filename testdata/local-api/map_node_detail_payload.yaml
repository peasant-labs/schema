cases:
  - name: map_successor_present_in_recent_commits_passes
    input:
      payload: map_node_detail
      path: internal/api
      recentCommitHashes: [successor-1]
      rewrittenCommits:
        - ghostHash: ghost-1
          sessionIds: [session-a]
          associations: [{id: assoc-map-ghost-1, sessionId: session-a, conclusion: confirmed, confidence: high, evidence: [{kind: recorded_commit, recordedCommitHash: ghost-1}]}]
          successorHash: successor-1
          resolution: rewritten
          method: patch_id
          confidence: high
      insights: []
      nilSlice: none
    expected:
      valid: true
      mutation: remove_successor_commit
      mutatedValid: false
      mutatedErrorContains: not present in recentCommits
    classification: must-pass
    provenance: {source: requirement, ref: "MapNodeDetailPayload successor cross-reference"}
    mutation: {description: "removes the referenced successor from recentCommits so the cross-reference must fail"}
  - name: map_missing_successor_in_recent_commits_is_rejected
    input:
      payload: map_node_detail
      path: internal/api
      recentCommitHashes: []
      rewrittenCommits:
        - ghostHash: ghost-2
          sessionIds: [session-a]
          associations: [{id: assoc-map-ghost-2, sessionId: session-a, conclusion: confirmed, confidence: high, evidence: [{kind: recorded_commit, recordedCommitHash: ghost-2}]}]
          successorHash: successor-2
          resolution: rewritten
          method: patch_id
          confidence: high
      insights: []
      nilSlice: none
    expected:
      valid: false
      errorContains: not present in recentCommits
      mutation: add_successor_commit
      mutatedValid: true
    classification: must-fail
    provenance: {source: requirement, ref: "MapNodeDetailPayload successor cross-reference"}
    mutation: {description: "adds the missing successor to recentCommits, which must repair the only invalid cross-reference"}
  - name: map_successor_association_drift_is_rejected
    input:
      payload: map_node_detail
      path: internal/api
      recentCommits:
        - hash: successor-mirror
          subject: fixture successor
          hasSession: true
          sessionIds: [session-mirror]
          associations:
            - id: assoc-map-mirror
              sessionId: session-mirror
              conclusion: candidate
              confidence: high
              evidence: [{kind: recorded_commit, recordedCommitHash: ghost-mirror}]
      rewrittenCommits:
        - ghostHash: ghost-mirror
          sessionIds: [session-mirror]
          associations:
            - id: assoc-map-mirror
              sessionId: session-mirror
              conclusion: confirmed
              confidence: high
              evidence: [{kind: recorded_commit, recordedCommitHash: ghost-mirror}]
          successorHash: successor-mirror
          resolution: rewritten
          method: patch_id
          confidence: high
      insights: []
      nilSlice: none
    expected:
      valid: false
      errorContains: does not exactly mirror the rewrite-ledger association
      mutation: repair_successor_association_mirror
      mutatedValid: true
    classification: must-fail
    provenance: {source: boundary, ref: "MapNodeDetailPayload displayed successors preserve rewrite-ledger association identity"}
    mutation: {description: "changes only the displayed successor conclusion, then restores that successor association from the rewrite ledger"}
  - name: map_duplicate_successor_hash_first_conflict_is_rejected
    input:
      payload: map_node_detail
      path: internal/api
      recentCommits:
        - {hash: successor-map-duplicate, subject: first conflicting successor, hasSession: true, sessionIds: [session-map-duplicate], associations: [{id: assoc-map-duplicate, sessionId: session-map-duplicate, conclusion: candidate, confidence: high, evidence: [{kind: recorded_commit, recordedCommitHash: ghost-map-duplicate}]}]}
        - {hash: successor-map-duplicate, subject: second mirrored successor, hasSession: true, sessionIds: [session-map-duplicate], associations: [{id: assoc-map-duplicate, sessionId: session-map-duplicate, conclusion: confirmed, confidence: high, evidence: [{kind: recorded_commit, recordedCommitHash: ghost-map-duplicate}]}]}
