      insights: []
      nilSlice: none
    expected:
      valid: false
      errorContains: duplicates non-empty commit hash
      mutation: remove_duplicate_successor_commit
      duplicateSuccessorIndex: 0
      mutatedValid: true
    classification: must-fail
    provenance: {source: boundary, ref: "MapNodeDetailPayload displayed successor hashes identify exactly one association authority"}
    mutation: {description: "removes the first conflicting duplicate displayed successor so the rewrite ledger retains exactly one mirrored commit"}
