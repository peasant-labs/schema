# The typed push. Publishing is collectives only: the request adds and removes
# collectives and carries no visibility or license. The response keeps the
# counts the route already returned, which tally sessions by status after
# every step ran, and adds one result per step. A session with steps lists the
# content step first, and its status describes the content. A failed step
# makes its session an error; whether later steps still run is the server's
# choice, and a step it did not run is not_attempted.
required_names:
  - request-sessions-only-valid
  - request-add-and-remove-valid
  - request-with-level-valid
  - request-empty-sessions-rejected
  - request-missing-sessions-rejected
  - request-empty-session-id-rejected
  - request-duplicate-session-rejected
  - request-collective-in-both-lists-rejected
  - request-duplicate-add-rejected
  - request-duplicate-remove-rejected
  - request-bad-collective-id-rejected
  - request-null-add-rejected
  - request-unknown-field-rejected
  - request-visibility-rejected
  - response-first-publish-two-collectives-valid
  - response-skipped-collective-valid
  - response-access-only-change-valid
  - response-held-removal-valid
  - response-removal-after-failed-add-valid
  - response-stopped-after-failure-valid
  - response-counts-only-valid
  - response-error-before-steps-valid
  - response-counts-disagree-rejected
  - response-held-counted-rejected
  - response-failed-step-under-success-rejected
  - response-error-without-failed-step-rejected
  - response-new-without-url-rejected
  - response-new-without-steps-rejected
  - response-steps-without-content-rejected
  - response-new-with-skipped-content-rejected
  - response-skipped-with-sent-content-rejected
  - response-held-with-share-rejected
  - response-not-attempted-without-failure-rejected
  - response-content-step-with-collective-rejected
  - response-collective-step-without-collective-rejected
  - response-pending-on-remove-rejected
  - response-pending-on-content-rejected
  - response-failed-without-reason-rejected
  - response-skipped-without-reason-rejected
  - response-reason-on-succeeded-rejected
  - response-content-not-first-rejected
  - response-duplicate-collective-step-rejected
  - response-empty-session-id-rejected
  - response-duplicate-session-rejected
  - response-unknown-step-rejected
  - response-unknown-outcome-rejected
  - response-unknown-status-rejected
  - response-negative-new-rejected
  - response-negative-updated-rejected
  - response-negative-skipped-rejected
  - response-negative-errors-rejected
  - response-null-sessions-rejected
  - response-error-status-without-text-rejected
operations:
  - api: local
    method: post
    path: /api/v1/sync/push
    request: SyncPushRequest
    response: SyncPushResponse
    statuses: ["200", "403"]
    error_responses: {"403": OpenapiLocalErrorResponse}
cases:
  - name: request-sessions-only-valid
    input:
      schema: SyncPushRequest
      payload:
        sessionIds: [s-1]
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "omitted collectives keep the current audience"}
    mutation: {description: "an update that only sends new turns"}
  - name: request-add-and-remove-valid
    input:
      schema: SyncPushRequest
      payload:
        sessionIds: [s-1, s-2]
        collectives: {add: [11111111-1111-4111-8111-111111111111], remove: [22222222-2222-4222-8222-222222222222]}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "collectives add and remove"}
    mutation: {description: "adds one collective and takes the transcript back from another"}
  - name: request-with-level-valid
    input:
      schema: SyncPushRequest
      payload:
        sessionIds: [s-1]
        redactionLevel: standard
        collectives: {add: [11111111-1111-4111-8111-111111111111]}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "redactionLevel is a request the server resolves"}
    mutation: {description: "names the offered level"}
  - name: request-empty-sessions-rejected
    input:
      schema: SyncPushRequest
      payload:
        sessionIds: []
    expected: {valid: false, rejected_by: shape, go_rejects: true}
    classification: must-fail
    provenance: {source: boundary, ref: "a push names at least one session"}
    mutation: {description: "sends an empty session list"}
  - name: request-missing-sessions-rejected
    input:
      schema: SyncPushRequest
      payload:
        collectives: {add: [11111111-1111-4111-8111-111111111111]}
    expected: {valid: false, rejected_by: shape, go_rejects: true}
    classification: must-fail
    provenance: {source: boundary, ref: "sessionIds is required"}
    mutation: {description: "omits the session list"}
  - name: request-empty-session-id-rejected
    input:
      schema: SyncPushRequest
      payload:
        sessionIds: [""]
    expected: {valid: false, rejected_by: semantics, error_contains: empty ID}
    classification: must-fail
    provenance: {source: boundary, ref: "each named session is real"}
    mutation: {description: "names an empty session ID"}
  - name: request-duplicate-session-rejected
    input:
      schema: SyncPushRequest
      payload:
        sessionIds: [s-1, s-1]
    expected: {valid: false, rejected_by: semantics, error_contains: named twice}
    classification: must-fail
    provenance: {source: boundary, ref: "each session is published once"}
    mutation: {description: "names one session twice"}
  - name: request-collective-in-both-lists-rejected
    input:
      schema: SyncPushRequest
      payload:
        sessionIds: [s-1]
        collectives: {add: [11111111-1111-4111-8111-111111111111], remove: [11111111-1111-4111-8111-111111111111]}
    expected: {valid: false, rejected_by: semantics, error_contains: both added and removed}
    classification: must-fail
    provenance: {source: requirement, ref: "the resulting audience is unambiguous"}
    mutation: {description: "adds and removes the same collective"}
  - name: request-duplicate-add-rejected
    input:
      schema: SyncPushRequest
      payload:
        sessionIds: [s-1]
        collectives: {add: [11111111-1111-4111-8111-111111111111, 11111111-1111-4111-8111-111111111111]}
    expected: {valid: false, rejected_by: semantics, error_contains: collectives.add names}
    classification: must-fail
    provenance: {source: boundary, ref: "each collective is named once"}
    mutation: {description: "adds one collective twice"}
  - name: request-duplicate-remove-rejected
    input:
      schema: SyncPushRequest
      payload:
        sessionIds: [s-1]
        collectives: {remove: [22222222-2222-4222-8222-222222222222, 22222222-2222-4222-8222-222222222222]}
    expected: {valid: false, rejected_by: semantics, error_contains: collectives.remove names}
    classification: must-fail
    provenance: {source: boundary, ref: "each collective is named once"}
    mutation: {description: "removes one collective twice"}
  - name: request-bad-collective-id-rejected
    input:
      schema: SyncPushRequest
      payload:
        sessionIds: [s-1]
        collectives: {add: [Acme Platform]}
    expected: {valid: false, rejected_by: shape, go_rejects: false}
    classification: must-fail
    provenance: {source: boundary, ref: "collectives are named by Village UUID"}
    mutation: {description: "names a collective by its display name"}
  - name: request-null-add-rejected
    input:
      schema: SyncPushRequest
      payload:
        sessionIds: [s-1]
        collectives: {add: null}
    expected: {valid: false, rejected_by: shape, go_rejects: false}
    classification: must-fail
    provenance: {source: boundary, ref: "an omitted list is omitted, not null"}
    mutation: {description: "sends null for the add list"}
  - name: request-unknown-field-rejected
    input:
      schema: SyncPushRequest
      payload:
        sessionIds: [s-1]
        collectives: {ad: [11111111-1111-4111-8111-111111111111]}
    expected: {valid: false, rejected_by: shape, go_rejects: false}
    classification: must-fail
    provenance: {source: bug, ref: "a misspelled field would publish with no audience change"}
    mutation: {description: "misspells collectives.add"}
  - name: request-visibility-rejected
    input:
      schema: SyncPushRequest
      payload:
        sessionIds: [s-1]
        visibility: public
    expected: {valid: false, rejected_by: shape, go_rejects: false}
    classification: must-fail
    provenance: {source: requirement, ref: "publishing is collectives only and carries no visibility"}
    mutation: {description: "sends the retired visibility field"}
  - name: response-first-publish-two-collectives-valid
    input:
      schema: SyncPushResponse
      payload:
        new: 1
        updated: 0
        skipped: 0
        errors: 0
        sessions:
          - sessionId: s-1
            status: new
            title: Fix flaky ingest test
            transcriptUrl: "https://village.example/transcripts/3f9c1d2e-4b5a-4c6d-8e7f-90a1b2c3e21a"
            steps:
              - {step: content, outcome: succeeded}
              - {step: add_collective, collectiveId: 11111111-1111-4111-8111-111111111111, outcome: succeeded}
              - {step: add_collective, collectiveId: 22222222-2222-4222-8222-222222222222, outcome: pending_approval}
            waitingPullRequests:
              - {owner: acme, name: ingest-api, number: 42, state: waiting, remote: acme/ingest-api, head_remote: acme/ingest-api, requested_at: "2026-09-20T09:00:00Z"}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "one result per step with the transcript URL and waiting pull requests"}
    mutation: {description: "publishes to one open and one curated collective"}
  - name: response-skipped-collective-valid
    input:
      schema: SyncPushResponse
      payload:
        new: 0
        updated: 1
        skipped: 0
        errors: 0
        sessions:
          - sessionId: s-1
            status: updated
            transcriptUrl: "https://village.example/transcripts/3f9c1d2e-4b5a-4c6d-8e7f-90a1b2c3e21a"
            steps:
              - {step: content, outcome: succeeded}
              - {step: add_collective, collectiveId: 11111111-1111-4111-8111-111111111111, outcome: skipped, reason: the collective already holds the transcript}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "a skipped collective is reported with its reason"}
    mutation: {description: "skips a collective that already holds the transcript"}
  - name: response-access-only-change-valid
    input:
      schema: SyncPushResponse
      payload:
        new: 0
        updated: 0
        skipped: 1
        errors: 0
        sessions:
          - sessionId: s-1
            status: skipped
            transcriptUrl: "https://village.example/transcripts/3f9c1d2e-4b5a-4c6d-8e7f-90a1b2c3e21a"
            steps:
              - {step: content, outcome: skipped, reason: the content is already current}
              - {step: remove_collective, collectiveId: 22222222-2222-4222-8222-222222222222, outcome: succeeded}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "a push that only changes collectives lists a skipped content step and reports skipped"}
    mutation: {description: "takes the transcript back from one collective without new content"}
  - name: response-held-removal-valid
    input:
      schema: SyncPushResponse
      payload:
        new: 0
        updated: 0
        skipped: 0
        errors: 0
        sessions:
          - sessionId: s-1
            status: held
            steps:
              - {step: content, outcome: skipped, reason: held until ingest completes}
              - {step: remove_collective, collectiveId: 22222222-2222-4222-8222-222222222222, outcome: succeeded}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "a held session can still be taken back from a collective, and held sessions are not counted"}
    mutation: {description: "removes a collective from a held session"}
  - name: response-removal-after-failed-add-valid
    input:
      schema: SyncPushResponse
      payload:
        new: 0
        updated: 0
        skipped: 0
        errors: 1
        sessions:
          - sessionId: s-1
            status: error
            error: village refused the share
            transcriptUrl: "https://village.example/transcripts/3f9c1d2e-4b5a-4c6d-8e7f-90a1b2c3e21a"
            steps:
              - {step: content, outcome: succeeded}
              - {step: add_collective, collectiveId: 11111111-1111-4111-8111-111111111111, outcome: failed, reason: village refused the share}
              - {step: remove_collective, collectiveId: 22222222-2222-4222-8222-222222222222, outcome: succeeded}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "removing a collective revokes its access even after another step fails"}
    mutation: {description: "takes the transcript back after an add fails"}
  - name: response-stopped-after-failure-valid
    input:
      schema: SyncPushResponse
      payload:
        new: 0
        updated: 0
        skipped: 0
        errors: 1
        sessions:
          - sessionId: s-1
            status: error
            error: upload failed
            steps:
              - {step: content, outcome: failed, reason: upload failed}
              - {step: add_collective, collectiveId: 11111111-1111-4111-8111-111111111111, outcome: not_attempted}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "a step the server did not run after a failure is not_attempted"}
    mutation: {description: "the content step fails and the share does not run"}
  - name: response-counts-only-valid
    input:
      schema: SyncPushResponse
      payload:
        {new: 0, updated: 0, skipped: 1, errors: 0, sessions: [{sessionId: s-1, status: skipped}]}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "the counts shape the route already returned stays valid"}
    mutation: {description: "a skipped result without steps"}
  - name: response-error-before-steps-valid
    input:
      schema: SyncPushResponse
      payload:
        {new: 0, updated: 0, skipped: 0, errors: 1, sessions: [{sessionId: s-1, status: error, error: build structured content failed}]}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "a session can fail before any step runs"}
    mutation: {description: "an error with no steps"}
  - name: response-counts-disagree-rejected
    input:
      schema: SyncPushResponse
      payload:
        new: 0
        updated: 1
        skipped: 0
        errors: 0
        sessions:
          - sessionId: s-1
            status: error
            error: village refused the share
            transcriptUrl: "https://village.example/transcripts/3f9c1d2e-4b5a-4c6d-8e7f-90a1b2c3e21a"
            steps:
              - {step: content, outcome: succeeded}
              - {step: add_collective, collectiveId: 11111111-1111-4111-8111-111111111111, outcome: failed, reason: village refused the share}
    expected: {valid: false, rejected_by: semantics, error_contains: disagree with the session statuses}
    classification: must-fail
    provenance: {source: bug, ref: "a banner built from the counts must not report success while a share failed"}
    mutation: {description: "counts the error session as updated"}
  - name: response-held-counted-rejected
    input:
      schema: SyncPushResponse
      payload:
        {new: 0, updated: 0, skipped: 1, errors: 0, sessions: [{sessionId: s-1, status: held}]}
    expected: {valid: false, rejected_by: semantics, error_contains: disagree with the session statuses}
    classification: must-fail
    provenance: {source: requirement, ref: "held sessions are not counted"}
    mutation: {description: "counts a held session as skipped"}
  - name: response-failed-step-under-success-rejected
    input:
      schema: SyncPushResponse
      payload:
        new: 0
        updated: 1
        skipped: 0
        errors: 0
        sessions:
          - sessionId: s-1
            status: updated
            transcriptUrl: "https://village.example/transcripts/3f9c1d2e-4b5a-4c6d-8e7f-90a1b2c3e21a"
            steps:
              - {step: content, outcome: succeeded}
              - {step: add_collective, collectiveId: 11111111-1111-4111-8111-111111111111, outcome: failed, reason: village refused the share}
    expected: {valid: false, rejected_by: semantics, error_contains: is an error}
    classification: must-fail
    provenance: {source: requirement, ref: "a failed step makes the session an error"}
    mutation: {description: "reports updated while a share failed"}
  - name: response-error-without-failed-step-rejected
    input:
      schema: SyncPushResponse
      payload:
        new: 0
        updated: 0
        skipped: 0
        errors: 1
        sessions:
          - sessionId: s-1
            status: error
            error: unknown
            steps:
              - {step: content, outcome: succeeded}
    expected: {valid: false, rejected_by: semantics, error_contains: none failed}
    classification: must-fail
    provenance: {source: requirement, ref: "an error with steps names the step that failed"}
    mutation: {description: "reports an error while every step succeeded"}
  - name: response-new-without-url-rejected
    input:
      schema: SyncPushResponse
      payload:
        new: 1
        updated: 0
        skipped: 0
        errors: 0
        sessions:
          - sessionId: s-1
            status: new
            steps:
              - {step: content, outcome: succeeded}
    expected: {valid: false, rejected_by: semantics, error_contains: no transcriptUrl}
    classification: must-fail
    provenance: {source: requirement, ref: "Village accepted the content, so the result links to it"}
    mutation: {description: "drops the transcript URL from a new session"}
  - name: response-new-without-steps-rejected
    input:
      schema: SyncPushResponse
      payload:
        {new: 1, updated: 0, skipped: 0, errors: 0, sessions: [{sessionId: s-1, status: new, transcriptUrl: "https://village.example/transcripts/3f9c1d2e-4b5a-4c6d-8e7f-90a1b2c3e21a"}]}
    expected: {valid: false, rejected_by: semantics, error_contains: lists no steps}
    classification: must-fail
    provenance: {source: requirement, ref: "a new session lists the content step Village accepted"}
    mutation: {description: "omits the steps of a new session"}
  - name: response-steps-without-content-rejected
    input:
      schema: SyncPushResponse
      payload:
        new: 0
        updated: 0
        skipped: 1
        errors: 0
        sessions:
          - sessionId: s-1
            status: skipped
            steps:
              - {step: add_collective, collectiveId: 11111111-1111-4111-8111-111111111111, outcome: succeeded}
    expected: {valid: false, rejected_by: semantics, error_contains: content step first}
    classification: must-fail
    provenance: {source: requirement, ref: "one encoding: a session with steps lists the content step first"}
    mutation: {description: "lists a collective step without the content step"}
  - name: response-new-with-skipped-content-rejected
    input:
      schema: SyncPushResponse
      payload:
        new: 1
        updated: 0
        skipped: 0
        errors: 0
        sessions:
          - sessionId: s-1
            status: new
            transcriptUrl: "https://village.example/transcripts/3f9c1d2e-4b5a-4c6d-8e7f-90a1b2c3e21a"
            steps:
              - {step: content, outcome: skipped, reason: already current}
    expected: {valid: false, rejected_by: semantics, error_contains: Village accepted the content}
    classification: must-fail
    provenance: {source: requirement, ref: "new and updated mean Village accepted the content"}
    mutation: {description: "reports new with a skipped content step"}
  - name: response-skipped-with-sent-content-rejected
    input:
      schema: SyncPushResponse
      payload:
        new: 0
        updated: 0
        skipped: 1
        errors: 0
        sessions:
          - sessionId: s-1
            status: skipped
            steps:
              - {step: content, outcome: succeeded}
    expected: {valid: false, rejected_by: semantics, error_contains: content was not sent}
    classification: must-fail
    provenance: {source: requirement, ref: "skipped means the content was not sent"}
    mutation: {description: "reports skipped with a succeeded content step"}
  - name: response-held-with-share-rejected
    input:
      schema: SyncPushResponse
      payload:
        new: 0
        updated: 0
        skipped: 0
        errors: 0
        sessions:
          - sessionId: s-1
            status: held
            steps:
              - {step: content, outcome: skipped, reason: held until ingest completes}
              - {step: add_collective, collectiveId: 11111111-1111-4111-8111-111111111111, outcome: succeeded}
    expected: {valid: false, rejected_by: semantics, error_contains: only be taken back}
    classification: must-fail
    provenance: {source: requirement, ref: "a held session cannot be shared further"}
    mutation: {description: "shares a held session with a collective"}
  - name: response-not-attempted-without-failure-rejected
    input:
      schema: SyncPushResponse
      payload:
        new: 0
        updated: 1
        skipped: 0
        errors: 0
        sessions:
          - sessionId: s-1
            status: updated
            transcriptUrl: "https://village.example/transcripts/3f9c1d2e-4b5a-4c6d-8e7f-90a1b2c3e21a"
            steps:
              - {step: content, outcome: not_attempted}
              - {step: add_collective, collectiveId: 11111111-1111-4111-8111-111111111111, outcome: succeeded}
    expected: {valid: false, rejected_by: semantics, error_contains: no earlier failed step}
    classification: must-fail
    provenance: {source: requirement, ref: "a step only goes unattempted because an earlier step failed"}
    mutation: {description: "marks the first step not attempted"}
  - name: response-content-step-with-collective-rejected
    input:
      schema: SyncPushResponse
      payload:
        new: 1
        updated: 0
        skipped: 0
        errors: 0
        sessions:
          - {sessionId: s-1, status: new, transcriptUrl: "https://village.example/transcripts/3f9c1d2e-4b5a-4c6d-8e7f-90a1b2c3e21a", steps: [{step: content, collectiveId: 11111111-1111-4111-8111-111111111111, outcome: succeeded}]}
    expected: {valid: false, rejected_by: semantics, error_contains: collectiveId}
    classification: must-fail
    provenance: {source: requirement, ref: "the content step names no collective"}
    mutation: {description: "attaches a collective to the content step"}
  - name: response-collective-step-without-collective-rejected
    input:
      schema: SyncPushResponse
      payload:
        new: 1
        updated: 0
        skipped: 0
        errors: 0
        sessions:
          - {sessionId: s-1, status: new, transcriptUrl: "https://village.example/transcripts/3f9c1d2e-4b5a-4c6d-8e7f-90a1b2c3e21a", steps: [{step: content, outcome: succeeded}, {step: add_collective, outcome: succeeded}]}
    expected: {valid: false, rejected_by: semantics, error_contains: collectiveId}
    classification: must-fail
    provenance: {source: requirement, ref: "a collective step names its collective"}
    mutation: {description: "drops the collective from an add step"}
  - name: response-pending-on-remove-rejected
    input:
      schema: SyncPushResponse
      payload:
        new: 0
        updated: 1
        skipped: 0
        errors: 0
        sessions:
          - {sessionId: s-1, status: updated, transcriptUrl: "https://village.example/transcripts/3f9c1d2e-4b5a-4c6d-8e7f-90a1b2c3e21a", steps: [{step: content, outcome: succeeded}, {step: remove_collective, collectiveId: 11111111-1111-4111-8111-111111111111, outcome: pending_approval}]}
    expected: {valid: false, rejected_by: semantics, error_contains: only adding a collective}
    classification: must-fail
    provenance: {source: requirement, ref: "only a curated share waits for approval"}
    mutation: {description: "marks a removal as waiting for approval"}
  - name: response-pending-on-content-rejected
    input:
      schema: SyncPushResponse
      payload:
        new: 1
        updated: 0
        skipped: 0
        errors: 0
        sessions:
          - {sessionId: s-1, status: new, transcriptUrl: "https://village.example/transcripts/3f9c1d2e-4b5a-4c6d-8e7f-90a1b2c3e21a", steps: [{step: content, outcome: pending_approval}]}
    expected: {valid: false, rejected_by: semantics, error_contains: only adding a collective}
    classification: must-fail
    provenance: {source: requirement, ref: "only a curated share waits for approval"}
    mutation: {description: "marks the content step as waiting for approval"}
  - name: response-failed-without-reason-rejected
    input:
      schema: SyncPushResponse
      payload:
        new: 0
        updated: 0
        skipped: 0
        errors: 1
        sessions:
          - {sessionId: s-1, status: error, error: upload failed, steps: [{step: content, outcome: failed}]}
    expected: {valid: false, rejected_by: semantics, error_contains: reason presence}
    classification: must-fail
    provenance: {source: requirement, ref: "a failed step says why"}
    mutation: {description: "drops the reason from a failed step"}
  - name: response-skipped-without-reason-rejected
