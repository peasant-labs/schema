    provenance: {source: boundary, ref: "128 encoded UTF-8 bytes is the inclusive bound"}
    mutation: {description: "uses 64 two-byte code points"}
  - name: multibyte-raw-over-byte-bound
    input: {operation: decode, json: "{\"thinkingLevelRaw\": \"ééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééa\"}"}
    expected: {accepted: false, errorContains: thinkingLevelRaw}
    classification: must-fail
    provenance: {source: boundary, ref: "129 encoded UTF-8 bytes exceeds the bound"}
    mutation: {description: "appends one byte past the bound"}
