  - name: member-ultracode
    input: {operation: decode, json: '{"thinkingLevel":"ultracode"}'}
    expected: {accepted: true, schemaVersion: 11, thinkingLevel: ultracode}
    classification: must-pass
    provenance: {source: enum, ref: "canonical member ultracode"}
    mutation: {description: "sets the canonical level ultracode without raw"}
  - name: raw-with-canonical
    input: {operation: decode, json: '{"thinkingLevel":"off","thinkingLevelRaw":"none"}'}
    expected: {accepted: true, schemaVersion: 11, thinkingLevel: "off", thinkingLevelRaw: none}
    classification: must-pass
    provenance: {source: requirement, ref: "raw rides with a canonical level when the native spelling differs"}
    mutation: {description: "pairs off with its native spelling none"}
  - name: raw-without-canonical
    input: {operation: decode, json: '{"thinkingLevelRaw":"custom"}'}
    expected: {accepted: true, schemaVersion: 11, thinkingLevelRaw: custom}
    classification: must-pass
    provenance: {source: requirement, ref: "an unrecognized native spelling keeps raw with no canonical level"}
    mutation: {description: "omits the canonical level and keeps the native spelling"}
  - name: multibyte-raw-at-byte-bound
    input: {operation: decode, json: "{\"thinkingLevelRaw\": \"éééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééé\"}"}
    expected: {accepted: true, schemaVersion: 11, thinkingLevelRaw: "éééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééé"}
    classification: must-pass
    provenance: {source: boundary, ref: "128 encoded UTF-8 bytes is the inclusive bound"}
    mutation: {description: "uses 64 two-byte code points"}
  - name: multibyte-raw-over-byte-bound
    input: {operation: decode, json: "{\"thinkingLevelRaw\": \"ééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééa\"}"}
    expected: {accepted: false, errorContains: thinkingLevelRaw}
    classification: must-fail
    provenance: {source: boundary, ref: "129 encoded UTF-8 bytes exceeds the bound"}
    mutation: {description: "appends one byte past the bound"}
  - name: raw-null-is-absent
    input: {operation: decode, json: '{"thinkingLevelRaw":null}'}
    expected: {accepted: true, schemaVersion: 11}
    classification: must-pass
    provenance: {source: boundary, ref: "metadata null raw decodes as absent"}
    mutation: {description: "sends an explicit null raw"}
  - name: noncanonical-level-rejected
    input: {operation: decode, json: '{"thinkingLevel":"custom"}'}
    expected: {accepted: false, errorContains: thinkingLevel}
    classification: must-fail
    provenance: {source: requirement, ref: "native spellings are never canonical values"}
    mutation: {description: "writes an unrecognized native spelling as the canonical level"}
  - name: edge-whitespace-raw-rejected
    input: {operation: decode, json: '{"thinkingLevelRaw":" high"}'}
    expected: {accepted: false, errorContains: thinkingLevelRaw}
    classification: must-fail
    provenance: {source: boundary, ref: "raw spellings have no edge whitespace"}
    mutation: {description: "pads the raw spelling at the leading edge"}
  - name: invalid-utf8-raw-marshal-rejected
    input: {operation: marshal, rawBase64: /w==}
    expected: {accepted: false, errorContains: thinkingLevelRaw}
    classification: must-fail
    provenance: {source: boundary, ref: "raw spellings are valid UTF-8"}
    mutation: {description: "assembles metadata directly with a lone 0xFF byte"}
  - name: over-bound-raw-marshal-rejected
    input: {operation: marshal, raw: "ééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééa"}
    expected: {accepted: false, errorContains: thinkingLevelRaw}
    classification: must-fail
    provenance: {source: boundary, ref: "Marshal refuses a raw spelling over 128 bytes"}
    mutation: {description: "assembles metadata directly with a 129-byte raw"}
  - name: valid-pair-marshal-round-trips
    input: {operation: marshal, level: "off", raw: none}
    expected: {accepted: true, schemaVersion: 12, thinkingLevel: "off", thinkingLevelRaw: none}
    classification: must-pass
    provenance: {source: requirement, ref: "a disabled native spelling travels as off plus raw"}
    mutation: {description: "assembles metadata with off and the native none"}
  - name: history-absent
    input: {operation: decode, json: '{}'}
    expected: {accepted: true, schemaVersion: 11}
    classification: must-pass
    provenance: {source: requirement, ref: "a session that never changed level omits the history"}
    mutation: {description: "reads a sidecar with no thinkingLevelHistory"}
  - name: history-level-only
    input: {operation: decode, json: '{"thinkingLevel":"high","thinkingLevelHistory":[{"level":"low"}]}'}
    expected: {accepted: true, schemaVersion: 11, thinkingLevel: high, thinkingLevelHistory: [{level: low}]}
    classification: must-pass
    provenance: {source: requirement, ref: "a later in-session change records its canonical level"}
    mutation: {description: "seeds high and records a later low change"}
  - name: history-raw-only
    input: {operation: decode, json: '{"thinkingLevelRaw":"custom","thinkingLevelHistory":[{"raw":"other"}]}'}
    expected: {accepted: true, schemaVersion: 11, thinkingLevelRaw: custom, thinkingLevelHistory: [{raw: other}]}
    classification: must-pass
    provenance: {source: requirement, ref: "a later change may carry only its exact native spelling"}
    mutation: {description: "records a raw-only change after a raw-only seed"}
  - name: history-both-fields
    input: {operation: decode, json: '{"thinkingLevelHistory":[{"level":"ultra","raw":"custom"}]}'}
    expected: {accepted: true, schemaVersion: 11, thinkingLevelHistory: [{level: ultra, raw: custom}]}
    classification: must-pass
    provenance: {source: requirement, ref: "a change carries both the canonical level and its native spelling"}
    mutation: {description: "records ultra with a non-canonical native spelling"}
  - name: history-multiple-order-preserved
    input: {operation: decode, json: '{"thinkingLevelHistory":[{"level":"low"},{"level":"high"},{"raw":"custom"}]}'}
    expected: {accepted: true, schemaVersion: 11, thinkingLevelHistory: [{level: low}, {level: high}, {raw: custom}]}
    classification: must-pass
    provenance: {source: requirement, ref: "changes are recorded in source order"}
    mutation: {description: "records three later changes in order"}
  - name: history-empty-entry-rejected
    input: {operation: decode, json: '{"thinkingLevelHistory":[{}]}'}
    expected: {accepted: false, errorContains: thinkingLevelHistory.0}
    classification: must-fail
    provenance: {source: requirement, ref: "a history entry must carry a level or a raw spelling"}
    mutation: {description: "records an entry with neither field"}
  - name: history-invalid-raw-rejected
    input: {operation: decode, json: '{"thinkingLevelHistory":[{"raw":" high"}]}'}
    expected: {accepted: false, errorContains: thinkingLevelHistory.0.raw}
    classification: must-fail
    provenance: {source: boundary, ref: "a history raw spelling follows the seed bound and edge rule"}
    mutation: {description: "pads a history raw spelling at the leading edge"}
