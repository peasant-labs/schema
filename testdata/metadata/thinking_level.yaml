    provenance: {source: enum, ref: "canonical member max"}
    mutation: {description: "sets the canonical level max"}
  - name: member-ultra
    input: {operation: decode, json: "{\"thinkingLevel\": \"ultra\"}"}
    expected: {accepted: true, schemaVersion: 11, thinkingLevel: "ultra"}
