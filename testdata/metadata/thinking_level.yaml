    provenance: {source: boundary, ref: "raw spellings are valid UTF-8"}
    mutation: {description: "assembles metadata directly with a lone 0xFF byte"}
  - name: over-bound-raw-marshal-rejected
    input: {operation: marshal, raw: "ééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééééa"}
