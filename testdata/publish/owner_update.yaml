# Owner transcript update corpus (PATCH /api/v1/transcripts/{id}).
#
# Three behavioral arms, each a testcase corpus:
#
#   request_validations  a raw JSON body decoded into TranscriptUpdateRequest and
#                        validated, exactly as a client would build it. Proves the
#                        closed enum sets and that absence is legal everywhere.
#   encodings            a Go-side intent marshaled to exact bytes. This is where
#                        the three license states are proven distinguishable: a
#                        preserved license must be ABSENT from the wire, a cleared
#                        one must be the empty string, and a replacement must be
#                        the menu value. Collapsing any two would make the
#                        server's irrevocability rule unexpressible.
#   spec_expectations    probes against the generated Village document, so the
#                        declaration cannot drift from the source contract.
#
# The operation is owner-only and its refusals are contract rules rather than
# transport accidents, so the declared status set is asserted here too.

request_validations:
  cases:
    - name: visibility private is accepted
      input: '{"visibility":"private"}'
      expected: {accepted: true, error_contains: ""}
      classification: must-pass
      provenance: {source: enum, ref: "TranscriptUpdateVisibility closed set"}
      mutation: {description: "sends the private member of the accepted visibility menu"}

    - name: visibility public is accepted
      input: '{"visibility":"public"}'
      expected: {accepted: true, error_contains: ""}
      classification: must-pass
      provenance: {source: enum, ref: "TranscriptUpdateVisibility closed set"}
      mutation: {description: "sends the public member of the accepted visibility menu"}

    - name: visibility group is rejected because organization scope is deferred
      input: '{"visibility":"group"}'
      expected: {accepted: false, error_contains: is not an accepted value}
      classification: must-fail
      provenance: {source: requirement, ref: "organization visibility is a deferred capability, not a declared one"}
      mutation: {description: "substitutes the general Visibility enum member this operation deliberately excludes"}

    - name: visibility shared is rejected
      input: '{"visibility":"shared"}'
      expected: {accepted: false, error_contains: is not an accepted value}
      classification: must-fail
      provenance: {source: boundary, ref: "the stored token for organization scope is not a client-sendable value here"}
      mutation: {description: "substitutes the persisted organization-scope token for a declared visibility"}

    - name: unknown visibility is rejected
      input: '{"visibility":"everyone"}'
      expected: {accepted: false, error_contains: is not an accepted value}
      classification: must-fail
      provenance: {source: boundary, ref: "TranscriptUpdateVisibility closed set"}
      mutation: {description: "replaces the visibility with a value outside the closed set"}

    - name: license CC0 is accepted
      input: '{"license":"CC0-1.0"}'
      expected: {accepted: true, error_contains: ""}
      classification: must-pass
      provenance: {source: enum, ref: "canonical License menu"}
      mutation: {description: "sends a canonical menu license as a replacement"}

    - name: license CC-BY is accepted
      input: '{"license":"CC-BY-4.0"}'
      expected: {accepted: true, error_contains: ""}
      classification: must-pass
      provenance: {source: enum, ref: "canonical License menu"}
      mutation: {description: "sends a second canonical menu license so the menu is not proven by one member"}

    - name: license CC-BY-SA is accepted
      input: '{"license":"CC-BY-SA-4.0"}'
      expected: {accepted: true, error_contains: ""}
      classification: must-pass
      provenance: {source: enum, ref: "canonical License menu"}
      mutation: {description: "sends the third canonical menu license so every member is covered"}

    - name: empty license is accepted as the clear request
      input: '{"license":""}'
      expected: {accepted: true, error_contains: ""}
      classification: must-pass
      provenance: {source: requirement, ref: "clearing a never-granted license is an accepted no-op"}
      mutation: {description: "sends the clear sentinel, which is a member of this operation's value set"}

    - name: unknown license is rejected
      input: '{"license":"MIT"}'
      expected: {accepted: false, error_contains: is not on the canonical menu}
      classification: must-fail
      provenance: {source: boundary, ref: "canonical License menu"}
      mutation: {description: "replaces the license with one outside the canonical menu"}

    - name: empty body is accepted as a no-op
      input: '{}'
      expected: {accepted: true, error_contains: ""}
      classification: must-pass
      provenance: {source: requirement, ref: "every field is optional and omission means leave unchanged"}
      mutation: {description: "omits every field so nothing is requested to change"}

    - name: title and description alone are accepted
      input: '{"title":"a better title","description":"a fuller description"}'
      expected: {accepted: true, error_contains: ""}
      classification: must-pass
      provenance: {source: requirement, ref: "metadata axes are patchable independently of governance axes"}
      mutation: {description: "sends only the metadata axes so governance omission is proven legal"}

    - name: empty title is accepted as a real clearing value
      input: '{"title":""}'
      expected: {accepted: true, error_contains: ""}
      classification: must-pass
      provenance: {source: boundary, ref: "an empty title is a value, not an omission"}
      mutation: {description: "sets the title to empty, which must not be confused with omitting it"}

    - name: every axis together is accepted
      input: '{"title":"t","description":"d","visibility":"public","license":"CC-BY-4.0"}'
      expected: {accepted: true, error_contains: ""}
      classification: must-pass
      provenance: {source: requirement, ref: "a single call may move metadata and governance together"}
      mutation: {description: "populates all four axes in one request"}

encodings:
  cases:
    - name: omitted license is absent from the wire
      input: {set_visibility: public}
      expected: '{"visibility":"public"}'
      classification: must-pass
      provenance: {source: requirement, ref: "omission preserves the stored license"}
      mutation: {description: "leaves the license unset so it must not appear on the wire at all"}

    - name: cleared license is the empty string
      input: {set_license: true, license: ""}
      expected: '{"license":""}'
      classification: must-pass
      provenance: {source: requirement, ref: "the empty string is the clear request"}
      mutation: {description: "points the license at the clear sentinel so it must serialize as an empty string, not null and not an omission"}

    - name: replacement license is the menu value
      input: {set_license: true, license: CC-BY-SA-4.0}
      expected: '{"license":"CC-BY-SA-4.0"}'
      classification: must-pass
      provenance: {source: requirement, ref: "a menu value replaces the stored license"}
      mutation: {description: "points the license at a menu value so replacement is distinguishable from clearing"}

    - name: nothing set encodes an empty object
      input: {}
      expected: '{}'
      classification: must-pass
      provenance: {source: boundary, ref: "an all-omitted request changes nothing"}
      mutation: {description: "sets no field so no key may be emitted"}

    - name: empty title is emitted rather than omitted
      input: {set_title: true, title: ""}
      expected: '{"title":""}'
      classification: must-pass
      provenance: {source: boundary, ref: "an empty title is a value, not an omission"}
      mutation: {description: "sets the title to empty so the encoder must still emit the key"}

    - name: metadata and governance encode together
      input: {set_title: true, title: t, set_visibility: private, set_license: true, license: CC0-1.0}
      expected: '{"title":"t","visibility":"private","license":"CC0-1.0"}'
      classification: must-pass
      provenance: {source: requirement, ref: "a single call may move metadata and governance together"}
      mutation: {description: "sets three axes so field order and co-presence are pinned"}

spec_expectations:
  cases:
    - name: the operation is declared on the village document
      input: {probe: operation_declared}
      expected: {strings: ["updateTranscript"]}
      classification: must-pass
      provenance: {source: requirement, ref: "the village already serves this route but the contract never stated it"}
      mutation: {description: "asserts the PATCH operation exists at the transcript path"}

    - name: the transcript id is a required path parameter
      input: {probe: path_parameter}
      expected: {strings: ["id"]}
      classification: must-pass
      provenance: {source: requirement, ref: "the route addresses one transcript"}
      mutation: {description: "asserts the id parameter is declared in path and required"}

    - name: the request body is a referenced component
      input: {probe: body_is_reference}
      expected: {strings: ["OpenapiTranscriptUpdateBody"]}
      classification: must-pass
      provenance: {source: manual, ref: "every other operation in this document references a named body component"}
      mutation: {description: "asserts the body is a component reference rather than an inline object"}

    - name: every reachable status is declared including the bodyless success
      input: {probe: response_statuses}
      expected: {strings: ["200", "400", "403", "404", "500"]}
      classification: must-pass
      provenance: {source: requirement, ref: "the ownership boundary and the irrevocability refusal are contract rules a client must be able to read"}
      mutation: {description: "asserts the declared status set covers every refusal the handler can return plus the success status"}

    - name: the success status is declared with no body schema
      input: {probe: success_has_no_body}
      expected: {strings: ["no-content-declared"]}
      classification: must-pass
      provenance: {source: requirement, ref: "village serves internal storage columns through pgtype wrappers, so no honest success shape exists to declare yet"}
      mutation: {description: "asserts 200 is present but carries no content schema, so a later invented success body fails rather than passing silently"}

    - name: the declared visibility menu excludes organization scope
      input: {probe: visibility_enum}
      expected: {strings: ["private", "public"]}
      classification: must-pass
      provenance: {source: enum, ref: "TranscriptUpdateVisibility closed set"}
      mutation: {description: "asserts the generated enum is exactly the two accepted members"}

    - name: the declared license menu carries the clear sentinel and every menu license
      input: {probe: license_enum}
      expected: {strings: ["", "CC0-1.0", "CC-BY-4.0", "CC-BY-SA-4.0"]}
      classification: must-pass
      provenance: {source: enum, ref: "canonical License menu plus the clear sentinel"}
      mutation: {description: "asserts the generated enum derives from the canonical menu and adds the clear sentinel"}
