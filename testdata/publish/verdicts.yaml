# PublishRequest schema-verdict corpus.
#
# This is the shared source of truth for publish-body accept/reject expectations:
# schema parity tests consume `schema_accepts`; direct publish/e2e consumers use
# `http_status` + `error_category` for rows they exercise at the HTTP boundary.

cases:
  - name: "full-valid"
    body: |
      {
        "diagnostics": {"warnings": []},
        "entries": [
          {"depth": 0, "entryIndex": 0, "entryType": "text", "harness": "claude-code",
           "hasThinking": false, "hasToolUse": false, "isError": false, "role": "user",
           "sessionId": "99d59925-36bc-424c-a789-8be54d9702ba"}
        ],
        "git": {"branch": "feat/openapi-docs", "remote": "https://github.com/user/repo.git"},
        "identity": {"schemaVersion": 9, "sessionId": "99d59925-36bc-424c-a789-8be54d9702ba"},
        "model": {"harness": "claude-code", "hostSlug": "github.com--user--repo",
                  "model": "claude-opus-4-6", "version": "2.1.47"},
        "project": {"hash": "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2", "name": "repo"},
        "quality": {"outcome": "resolved", "totalTokens": 67000, "turnCount": 24},
        "source": {"format": "jsonl"},
        "stats": {"durationMs": 7200000, "subagentCount": 1, "tokensIn": 45000,
                  "tokensOut": 22000, "toolCallCount": 16, "turnCount": 24},
        "timestamp": {"end": 1709139600000, "start": 1709136000000}
      }
    expect:
      schema_accepts: true
      error_category: "accepted"

  # rc2 (#118): model is now required at the PublishRequest root, so a body with
  # no model object is a documented schema-422. The legacy (pre-required) 0.1.0
  # schema still accepted {} (it had no required arrays), hence the legacy_accepts
  # divergence. The verdict FLIP is sequenced with SLICE-3 (the 0.3.0 schema that
  # enforces it); under 0.2.0 this row lands RED until the version bump.
  - name: "empty-object"
    body: "{}"
    expect:
      schema_accepts: false
      legacy_accepts: true
      http_status: 422
      error_category: "required"
      error_contains: "missing properties: 'model'"

  # Smallest body that satisfies the rc2 required-model rule: a model object with
  # both required keys (harness + model) and nothing else. Anchors the accept side
  # of the required-flip (the positive counterpart to the absent-* reject rows).
  - name: "minimal-valid"
    body: |
      {"model": {"harness": "claude-code", "model": "claude-opus-4-6"}}
    expect:
      schema_accepts: true
      error_category: "accepted"

  # Carries a valid model so it still exercises unknown-top-level-field tolerance
  # (additionalProperties) under the rc2 required-model rule rather than being
  # rejected for a missing model.
  - name: "unknown-top-level-field"
    body: |
      {"model": {"harness": "claude-code", "model": "claude-opus-4-6"},
       "source": {"format": "jsonl"}, "bogusField": 42}
    expect:
      schema_accepts: true
      error_category: "accepted"

  # --- rc2 (#118) dedicated model.harness+model required-rejection rows ---
  # All diverge from the legacy (pre-required) 0.1.0 schema, whose SchemaModelInfo
  # had no required array and a plain-string (un-enum'd) harness, so legacy_accepts:
  # true. error_contains is pinned to the real santhosh-tekuri/jsonschema/v5 v5.3.1
  # messages (see RunPublishVerdicts breadcrumb). These land RED until SLICE-3.

  # The model object is present with a valid model, but the `harness` KEY is
  # omitted — SchemaModelInfo.required includes harness, so the validator reports
  # the missing property.
  - name: "absent-harness-key"
    body: |
      {"model": {"model": "claude-opus-4-6"}}
    expect:
      schema_accepts: false
      legacy_accepts: true
      http_status: 422
      error_category: "required"
      error_contains: "missing properties: 'harness'"

  # The `harness` key is PRESENT but empty — required is satisfied, so the failure
  # is the enum (key present, value not a known harness), not a missing-property.
  - name: "empty-harness"
    body: |
      {"model": {"harness": "", "model": "claude-opus-4-6"}}
    expect:
      schema_accepts: false
      legacy_accepts: true
      http_status: 422
      error_category: "enum"
      error_contains: "value must be one of"

  # The model object is present with a valid harness, but the `model` KEY is
  # omitted — SchemaModelInfo.required includes model.
  - name: "absent-model-key"
    body: |
      {"model": {"harness": "claude-code"}}
    expect:
      schema_accepts: false
      legacy_accepts: true
      http_status: 422
      error_category: "required"
      error_contains: "missing properties: 'model'"

  # The whole top-level `model` object is omitted (other fields present) —
  # SchemaPublishRequest.required includes model, so the root rejects.
  - name: "absent-model-object"
    body: |
      {"identity": {"sessionId": "99d59925-36bc-424c-a789-8be54d9702ba", "schemaVersion": 9},
       "source": {"format": "jsonl"}}
    expect:
      schema_accepts: false
      legacy_accepts: true
      http_status: 422
      error_category: "required"
      error_contains: "missing properties: 'model'"

  # --- license: optional top-level enum (CC0-1.0 / CC-BY-4.0 / CC-BY-SA-4.0) ---
  # A valid license on an otherwise-minimal-valid body is accepted. Absent license is
  # already covered by the minimal/full valid rows (the field is omitempty), and the
  # legacy pre-license schema likewise accepts it, so no legacy_accepts divergence.
  - name: "valid-license"
    body: |
      {"model": {"harness": "claude-code", "model": "claude-opus-4-6"}, "license": "CC0-1.0"}
    expect:
      schema_accepts: true
      error_category: "accepted"

  # A license outside the closed menu is a documented schema-422. The body carries a
  # valid model, so the ONLY violation is the license enum. The legacy pre-license
  # schema had no license enum, so it accepts an unknown license — legacy_accepts
  # diverges from schema_accepts here.
  - name: "bad-license"
    body: |
      {"model": {"harness": "claude-code", "model": "claude-opus-4-6"}, "license": "MIT"}
    expect:
      schema_accepts: false
      legacy_accepts: true
      http_status: 422
      error_category: "enum"
      error_contains: "value must be one of"

  - name: "bad-source-format"
    body: |
      {"source": {"format": "xml"}}
    expect:
      schema_accepts: false
      http_status: 422
      error_category: "enum"

  - name: "bad-entry-type"
    body: |
      {"entries": [{"depth": 0, "entryIndex": 0, "entryType": "nonsense",
        "hasThinking": false, "hasToolUse": false, "isError": false}]}
    expect:
      schema_accepts: false
      http_status: 422
      error_category: "enum"

  - name: "bad-role"
    body: |
      {"entries": [{"depth": 0, "entryIndex": 0, "entryType": "text", "role": "wizard",
        "hasThinking": false, "hasToolUse": false, "isError": false}]}
    expect:
      schema_accepts: false
      http_status: 422
      error_category: "enum"

  - name: "bad-outcome"
    body: |
      {"quality": {"outcome": "exploded"}}
    expect:
      schema_accepts: false
      http_status: 422
      error_category: "enum"

  - name: "bad-tool-kind"
    body: |
      {"entries": [{"depth": 0, "entryIndex": 0, "entryType": "tool_use",
        "toolKind": "teleport", "hasThinking": false, "hasToolUse": true, "isError": false}]}
    expect:
      schema_accepts: false
      http_status: 422
      error_category: "enum"

  - name: "bad-stop-reason"
    body: |
      {"entries": [{"depth": 0, "entryIndex": 0, "entryType": "text",
        "stopReason": "vibes", "hasThinking": false, "hasToolUse": false, "isError": false}]}
    expect:
      schema_accepts: false
      http_status: 422
      error_category: "enum"

  - name: "unknown-harness"
    body: |
      {"model": {"harness": "not-a-harness", "hostSlug": "github.com--user--repo",
                 "model": "claude-opus-4-6", "version": "2.1.47"}}
    expect:
      schema_accepts: false
      legacy_accepts: true
      http_status: 422
      error_category: "enum"
      error_contains: "value must be one of"

  - name: "wrong-type-depth-string"
    body: |
      {"entries": [{"depth": "zero", "entryIndex": 0, "entryType": "text",
        "hasThinking": false, "hasToolUse": false, "isError": false}]}
    expect:
      schema_accepts: false
      http_status: 422
      error_category: "type"

  - name: "wrong-type-turncount-string"
    body: |
      {"stats": {"turnCount": "twenty", "tokensIn": 1, "tokensOut": 1,
        "toolCallCount": 1, "durationMs": 1, "subagentCount": 0}}
    expect:
      schema_accepts: false
      http_status: 422
      error_category: "type"

  - name: "wrong-type-start-string"
    body: |
      {"timestamp": {"start": "soon", "end": 2}}
    expect:
      schema_accepts: false
      http_status: 422
      error_category: "type"

  - name: "wrong-type-entries-object"
    body: |
      {"entries": {"not": "an array"}}
    expect:
      schema_accepts: false
      http_status: 422
      error_category: "type"

  - name: "wrong-type-isError-string"
    body: |
      {"entries": [{"depth": 0, "entryIndex": 0, "entryType": "text",
        "hasThinking": false, "hasToolUse": false, "isError": "nope"}]}
    expect:
      schema_accepts: false
      http_status: 422
      error_category: "type"

  - name: "bad-project-hash"
    body: |
      {"project": {"hash": "tooshort", "name": "x"}}
    expect:
      schema_accepts: false
      http_status: 422
      error_category: "pattern"

  - name: "bad-session-id"
    body: |
      {"identity": {"sessionId": "not-a-valid-id", "schemaVersion": 1}}
    expect:
      schema_accepts: false
      http_status: 422
      error_category: "pattern"

  # --- Subsumption of the retired validate/validate_test.go discriminations ---
  # These preserve the SessionID-newtype regex + nested-$ref coverage that lived
  # ONLY in validate_test.go (FINDING-1 / AC5). Each carries a complete, valid
  # model so the ONLY discriminating factor is the sessionId/parentUuid pattern
  # (not the rc2 required-model rule). Both verdicts hold under the legacy 0.1.0
  # schema too (it validates sessionId/parentUuid via the same SchemaSessionID
  # $ref pattern), so no legacy_accepts divergence.
  #
  # AC5 SUBSUMPTION-MAP COMPLETENESS (every deleted validate_test.go case is
  # accounted for — auditable here):
  #   _Valid                          -> full-valid (accept)
  #   _Invalid (top-level sessionId)  -> invalid-sessionId (reject, pattern)
  #   _MissingRequired ({})           -> empty-object FLIP (reject, required)
  #   _NestedSessionID/invalid        -> invalid-parentUuid (reject, pattern)
  #   _NestedSessionID/valid agent-   -> valid-agent-parentUuid (accept)
  #   _NestedSessionID/invalid prov.  -> unknown-harness (reject, enum)
  #   omitted-harness-accepts (0.2.0) -> absent-harness-key (reject, required @0.3.0)
  #   bad-source-format/wrong-type-*  -> existing same-named corpus rows
  #   _InvalidJSON (malformed body)   -> NOT a corpus row. Subsumed by the inline
  #     TestValidatePublishRequest_InvalidJSON (root publish_validate_test.go):
  #     malformed JSON is a VALIDATOR concern (json.Unmarshal pre-pass), not a
  #     schema-verdict one, and the corpus carries a valid-JSON-per-row invariant
  #     (TestPublishVerdictFixtures_Structure + the parity accepts() both
  #     json.Unmarshal every row) that a non-JSON row would break. Same shape as
  #     upstream peasant #118. Behavior preserved (non-JSON -> reject still tested).

  # Subsumes validate_test `_Invalid`: a bad TOP-LEVEL sessionId UUID is rejected
  # by the SchemaSessionID newtype pattern.
  - name: "invalid-sessionId"
    body: |
      {"identity": {"sessionId": "not-a-valid-uuid", "schemaVersion": 1},
       "model": {"harness": "claude-code", "model": "claude-opus-4-6"}}
    expect:
      schema_accepts: false
      http_status: 422
      error_category: "pattern"
      error_contains: "does not match pattern"

  # Subsumes validate_test `_NestedSessionID/invalid`: a bad NESTED parentUuid is
  # rejected via $ref to SchemaSessionID (proves nested-newtype $ref wiring).
  - name: "invalid-parentUuid"
    body: |
      {"identity": {"sessionId": "99d59925-36bc-424c-a789-8be54d9702ba",
       "parentUuid": "not-a-valid-uuid", "schemaVersion": 1},
       "model": {"harness": "claude-code", "model": "claude-opus-4-6"}}
    expect:
      schema_accepts: false
      http_status: 422
      error_category: "pattern"
      error_contains: "does not match pattern"

  # Subsumes validate_test `_NestedSessionID/valid`: an agent-prefixed parentUuid
  # is ACCEPTED by the SchemaSessionID pattern's agent-{hex} alternative.
  - name: "valid-agent-parentUuid"
    body: |
      {"identity": {"sessionId": "99d59925-36bc-424c-a789-8be54d9702ba",
       "parentUuid": "agent-a3aee4f", "schemaVersion": 1},
       "model": {"harness": "claude-code", "model": "claude-opus-4-6"}}
    expect:
      schema_accepts: true
      error_category: "accepted"
