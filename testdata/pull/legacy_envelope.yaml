# Pull envelope 0.2.0, frozen as the Legacy* types Village serves to clients
# that do not request a newer envelope.
#
# frozen_against names the retired Village document whose pull components the
# Legacy* components must equal, field for field, with only the component
# names changed.
frozen_against:
  document: generated/village-api-0.28.0.json
  components:
    SchemaLegacyPullTranscriptInfo: SchemaPullTranscriptInfo
    SchemaLegacyPullListResponse: SchemaPullListResponse
    SchemaLegacyPullAnnotation: SchemaPullAnnotation

# exact_fields pins each legacy body's JSON field set: required are always
# sent, optional only when set.
exact_fields:
  LegacyPullTranscriptInfo:
    required: [transcriptId, ownerUserId, ownerUsername, visibility, publishedAt, updatedAt, annotationCount]
    optional: [localId, title, harness, projectName, license, contentHash, contractVersion]
  LegacyPullListResponse:
    required: [transcripts, page, limit, total]
    optional: []
  LegacyPullAnnotation:
    required: [authorUserId, authorUsername]
    optional: []

# The sentinel and the version names, read by the Go constants test and the
# TypeScript generator.
anonymous_username: anon
header: Peasant-Pull-Contract
versions: {legacy: 0.2.0, public_owner: 0.3.0}

# persons: one legacy person checked by the holder's Validate. holder is
# transcript or annotation; project_name applies to a transcript only.
persons:
  cases:
    - name: transcript-profile
      input: {holder: transcript, id: 123e4567-e89b-12d3-a456-426614174001, username: alice, project_name: project}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: legacy-pull-profile}
      mutation: {description: carries a shown owner's real id, username and project}
    - name: transcript-anonymous-sentinel
      input: {holder: transcript, id: '', username: anon, project_name: ''}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: legacy-pull-sentinel}
      mutation: {description: blanks an anonymous owner to the empty id and anon with no project}
    - name: annotation-anonymous-sentinel
      input: {holder: annotation, id: '', username: anon}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: legacy-pull-sentinel}
      mutation: {description: blanks an anonymous author to the empty id and anon}
    - name: annotation-profile
      input: {holder: annotation, id: 123e4567-e89b-12d3-a456-426614174002, username: bob}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: legacy-pull-profile}
      mutation: {description: carries a shown author's real id and username}
    - name: transcript-empty-id-with-real-username-refused
      input: {holder: transcript, id: '', username: alice, project_name: ''}
      expected: {valid: false}
      classification: must-fail
      provenance: {source: requirement, ref: legacy-pull-sentinel}
      mutation: {description: keeps the hidden owner's username beside the anonymous marker}
    - name: transcript-empty-id-with-empty-username-refused
      input: {holder: transcript, id: '', username: '', project_name: ''}
      expected: {valid: false}
      classification: must-fail
      provenance: {source: boundary, ref: legacy-pull-sentinel}
      mutation: {description: drops the anon username a released CLI displays}
    - name: transcript-anonymous-with-project-refused
      input: {holder: transcript, id: '', username: anon, project_name: project}
      expected: {valid: false}
      classification: must-fail
      provenance: {source: requirement, ref: legacy-pull-sentinel}
      mutation: {description: keeps the project name beside an anonymous owner}
    - name: transcript-id-without-username-refused
      input: {holder: transcript, id: 123e4567-e89b-12d3-a456-426614174001, username: '', project_name: ''}
      expected: {valid: false}
      classification: must-fail
      provenance: {source: boundary, ref: legacy-pull-profile}
      mutation: {description: sends an owner id with no username}
    - name: annotation-empty-id-with-real-username-refused
      input: {holder: annotation, id: '', username: bob}
      expected: {valid: false}
      classification: must-fail
      provenance: {source: requirement, ref: legacy-pull-sentinel}
      mutation: {description: keeps the hidden author's username beside the anonymous marker}

# conversions: a 0.3.0 person rendered in the 0.2.0 shape by the contract's
# own converters, which Village calls instead of re-deriving the rule.
conversions:
  cases:
    - name: profile-owner-kept
      input: {anonymous: false, project_name: project}
      expected: {owner_user_id: 123e4567-e89b-12d3-a456-426614174001, owner_username: alice, project_name: project}
      classification: must-pass
      provenance: {source: requirement, ref: legacy-pull-profile}
      mutation: {description: renders a shown owner with their id, username and project}
    - name: anonymous-owner-blanked
      input: {anonymous: true, project_name: project}
      expected: {owner_user_id: '', owner_username: anon, project_name: ''}
      classification: must-pass
      provenance: {source: requirement, ref: legacy-pull-sentinel}
      mutation: {description: renders an anonymous owner as the sentinel and drops a project name the caller may not see}
    - name: profile-owner-without-project
      input: {anonymous: false, project_name: null}
      expected: {owner_user_id: 123e4567-e89b-12d3-a456-426614174001, owner_username: alice, project_name: ''}
      classification: must-pass
      provenance: {source: requirement, ref: legacy-pull-profile}
      mutation: {description: renders a shown owner whose project was not recorded}
    - name: profile-without-username-blanked
      input: {anonymous: false, malformed: no_username, project_name: project}
      expected: {owner_user_id: '', owner_username: anon, project_name: ''}
      classification: must-pass
      provenance: {source: boundary, ref: legacy-pull-sentinel}
      mutation: {description: renders a profile with an id but no username as the sentinel, so neither the id nor the project leaks}
    - name: profile-noncanonical-id-blanked
      input: {anonymous: false, malformed: noncanonical_id, project_name: project}
      expected: {owner_user_id: '', owner_username: anon, project_name: ''}
      classification: must-pass
      provenance: {source: boundary, ref: legacy-pull-sentinel}
      mutation: {description: renders a profile with an uppercase id as the sentinel, so neither the username nor the project leaks}

# served_bodies validates response bodies against the served Village document's
# 200 schema for each pull read. An empty page and an empty or null annotation
# list fit both envelopes, so the response declares them with anyOf.
served_bodies:
  cases:
    - name: empty-list-page
      input: {path: /api/v1/pull/transcripts, body: '{"transcripts":[],"page":1,"limit":50,"total":0}'}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: bug, ref: 'an empty page matched both envelopes and failed oneOf'}
      mutation: {description: serves an empty page, which either envelope describes}
    - name: empty-annotations
      input: {path: '/api/v1/pull/transcripts/{id}/annotations', body: '[]'}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: bug, ref: 'an empty annotation list matched both envelopes and failed oneOf'}
      mutation: {description: serves no annotations as an empty array}
    - name: null-annotations
      input: {path: '/api/v1/pull/transcripts/{id}/annotations', body: 'null'}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: bug, ref: 'a null annotation list matched both envelopes and failed oneOf'}
      mutation: {description: serves no annotations as null}
    - name: public-owner-list-row
      input: {path: /api/v1/pull/transcripts, body: '{"transcripts":[{"transcriptId":"123e4567-e89b-12d3-a456-426614174003","owner":{"kind":"anonymous"},"visibility":"group","publishedAt":1,"updatedAt":1,"annotationCount":0}],"page":1,"limit":50,"total":1}'}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: requestable-pull-envelope}
      mutation: {description: serves a 0.3.0 row}
    - name: legacy-list-row
      input: {path: /api/v1/pull/transcripts, body: '{"transcripts":[{"transcriptId":"123e4567-e89b-12d3-a456-426614174003","ownerUserId":"","ownerUsername":"anon","visibility":"group","publishedAt":1,"updatedAt":1,"annotationCount":0}],"page":1,"limit":50,"total":1}'}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: requestable-pull-envelope}
      mutation: {description: serves a 0.2.0 row with the anonymous sentinel}
    - name: legacy-metadata
      input: {path: '/api/v1/pull/transcripts/{id}', body: '{"transcriptId":"123e4567-e89b-12d3-a456-426614174003","ownerUserId":"","ownerUsername":"anon","visibility":"group","publishedAt":1,"updatedAt":1,"annotationCount":0}'}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: requestable-pull-envelope}
      mutation: {description: serves 0.2.0 metadata}
    - name: list-row-in-neither-envelope-refused
      input: {path: /api/v1/pull/transcripts, body: '{"transcripts":[{"transcriptId":"123e4567-e89b-12d3-a456-426614174003","visibility":"group","publishedAt":1,"updatedAt":1,"annotationCount":0}],"page":1,"limit":50,"total":1}'}
      expected: {valid: false}
      classification: must-fail
      provenance: {source: requirement, ref: requestable-pull-envelope}
      mutation: {description: drops every owner field, so the row is in neither envelope}

required_names:
  persons: [transcript-profile, transcript-anonymous-sentinel, annotation-anonymous-sentinel, annotation-profile, transcript-empty-id-with-real-username-refused, transcript-empty-id-with-empty-username-refused, transcript-anonymous-with-project-refused, transcript-id-without-username-refused, annotation-empty-id-with-real-username-refused]
  conversions: [profile-owner-kept, anonymous-owner-blanked, profile-owner-without-project, profile-without-username-blanked, profile-noncanonical-id-blanked]
  served_bodies: [empty-list-page, empty-annotations, null-annotations, public-owner-list-row, legacy-list-row, legacy-metadata, list-row-in-neither-envelope-refused]
