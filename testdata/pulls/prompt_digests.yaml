  - name: commits-covered-exceeds-total-invalid
    input:
      header: {sessionCount: 0, promptCount: 0, commitsCovered: 2, commitsTotal: 1, harness: claude-code, redactionLevel: standard, villageUrl: https://village.example/pulls/o/r/42}
      skills: []
