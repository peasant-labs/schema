# The personal automatic linking setting, the transcript pull request read,
# the pull request title and head branch it carries, and the pull request
# summary on list rows and collective rows. The operations' exact
# status sets live in openapi/testdata/village_collectives_operations.yaml.
required_names:
  - settings-auto-attach-off-valid
  - settings-auto-attach-on-valid
  - settings-missing-auto-attach-rejected
  - update-auto-attach-only-valid
  - update-empty-valid
  - update-auto-attach-string-rejected
  - transcript-pulls-attached-and-detached-valid
  - transcript-pulls-empty-valid
  - transcript-pulls-null-rejected
  - transcript-pulls-preview-rejected
  - transcript-pulls-requested-rejected
  - transcript-pulls-waiting-rejected
  - collective-row-summary-valid
  - collective-row-summary-exceeds-count-rejected
  - list-row-summary-exceeds-count-rejected
  - transcript-pulls-empty-owner-rejected
  - transcript-pulls-duplicate-rejected
  - transcript-pulls-missing-title-rejected
  - summary-with-more-valid
  - summary-empty-valid
  - summary-recent-exceeds-count-rejected
  - summary-negative-count-rejected
  - summary-duplicate-recent-rejected
  - summary-null-recent-rejected
  - summary-zero-number-rejected
operations:
  - api: village
    method: get
    path: "/api/v1/transcripts/{id}/pulls"
    response: VillageTranscriptPullRequestsResponse
    parameters:
      - {name: id, in: path, required: true}
  - api: village
    method: get
    path: /api/v1/users/me/settings
    response: VillageUserSettings
  - api: village
    method: patch
    path: /api/v1/users/me/settings
    request: VillageUpdateUserSettingsRequest
    response: VillageUserSettings
cases:
  - name: settings-auto-attach-off-valid
    input: {schema: VillageUserSettings, payload: {preview_before_attach: true, auto_attach_pull_requests: false}}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "automatic linking is off by default"}
    mutation: {description: "the default setting"}
  - name: settings-auto-attach-on-valid
    input: {schema: VillageUserSettings, payload: {preview_before_attach: false, auto_attach_pull_requests: true}}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "each author decides for their own transcripts"}
    mutation: {description: "the author turned automatic linking on"}
  - name: settings-missing-auto-attach-rejected
    input: {schema: VillageUserSettings, payload: {preview_before_attach: true}}
    expected: {valid: false, rejected_by: shape, go_rejects: false}
    classification: must-fail
    provenance: {source: requirement, ref: "the server holds the value, so it always states it"}
    mutation: {description: "omits auto_attach_pull_requests"}
  - name: update-auto-attach-only-valid
    input: {schema: VillageUpdateUserSettingsRequest, payload: {auto_attach_pull_requests: true}}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "an omitted field is left unchanged"}
    mutation: {description: "changes only automatic linking"}
  - name: update-empty-valid
    input: {schema: VillageUpdateUserSettingsRequest, payload: {}}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: boundary, ref: "an empty patch changes nothing"}
    mutation: {description: "sends no field"}
  - name: update-auto-attach-string-rejected
    input: {schema: VillageUpdateUserSettingsRequest, payload: {auto_attach_pull_requests: "yes"}}
    expected: {valid: false, rejected_by: shape, go_rejects: true}
    classification: must-fail
    provenance: {source: boundary, ref: "the setting is a boolean"}
    mutation: {description: "sends a string"}
  - name: transcript-pulls-attached-and-detached-valid
    input:
      schema: VillageTranscriptPullRequestsResponse
      payload:
        pull_requests:
          - {owner: acme, name: ingest-api, number: 42, title: Fix flaky ingest test, head_ref: fix/flaky-ingest, state: attached}
          - {owner: acme, name: web, number: 31, title: null, head_ref: null, state: detached}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "the read lists attached and detached pull requests with title and head branch"}
    mutation: {description: "one attached row and one row recorded before titles were kept"}
  - name: transcript-pulls-empty-valid
    input: {schema: VillageTranscriptPullRequestsResponse, payload: {pull_requests: []}}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: boundary, ref: "a transcript with no pull request"}
    mutation: {description: "an empty list"}
  - name: transcript-pulls-null-rejected
    input: {schema: VillageTranscriptPullRequestsResponse, payload: {pull_requests: null}}
    expected: {valid: false, rejected_by: shape, go_rejects: true}
    classification: must-fail
    provenance: {source: boundary, ref: "pull_requests is an array"}
    mutation: {description: "sends null instead of an empty list"}
  - name: transcript-pulls-preview-rejected
    input:
      schema: VillageTranscriptPullRequestsResponse
      payload:
        pull_requests:
          - {owner: acme, name: ingest-api, number: 42, title: Fix flaky ingest test, head_ref: fix/flaky-ingest, state: preview}
    expected: {valid: false, rejected_by: semantics, error_contains: only attached and detached}
    classification: must-fail
    provenance: {source: requirement, ref: "an unconfirmed attachment never reaches a reader"}
    mutation: {description: "lists a preview attachment"}
  - name: transcript-pulls-duplicate-rejected
    input:
      schema: VillageTranscriptPullRequestsResponse
      payload:
        pull_requests:
          - {owner: acme, name: ingest-api, number: 42, title: null, head_ref: null, state: attached}
          - {owner: acme, name: ingest-api, number: 42, title: null, head_ref: null, state: detached}
    expected: {valid: false, rejected_by: semantics, error_contains: listed twice}
    classification: must-fail
    provenance: {source: boundary, ref: "each pull request is listed once"}
    mutation: {description: "lists one pull request twice"}
  - name: transcript-pulls-missing-title-rejected
    input:
      schema: VillageTranscriptPullRequestsResponse
      payload:
        pull_requests:
          - {owner: acme, name: ingest-api, number: 42, head_ref: fix/flaky-ingest, state: attached}
    expected: {valid: false, rejected_by: shape, go_rejects: false}
    classification: must-fail
    provenance: {source: requirement, ref: "title is always present and null when unknown"}
    mutation: {description: "omits title"}
  - name: summary-with-more-valid
    input: {schema: VillagePullRequestsSummary, payload: {count: 4, recent: [{owner: acme, name: ingest-api, number: 42}, {owner: acme, name: ingest-api, number: 45}]}}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "a row reads #42, #45 +2"}
    mutation: {description: "two recent of four attached pull requests"}
  - name: summary-empty-valid
    input: {schema: VillagePullRequestsSummary, payload: {count: 0, recent: []}}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: boundary, ref: "a transcript with no pull request"}
    mutation: {description: "nothing attached"}
  - name: summary-recent-exceeds-count-rejected
    input: {schema: VillagePullRequestsSummary, payload: {count: 1, recent: [{owner: acme, name: ingest-api, number: 42}, {owner: acme, name: ingest-api, number: 45}]}}
    expected: {valid: false, rejected_by: semantics, error_contains: no longer than}
    classification: must-fail
    provenance: {source: boundary, ref: "recent is part of count"}
    mutation: {description: "lists more recent pull requests than the count"}
  - name: summary-negative-count-rejected
    input: {schema: VillagePullRequestsSummary, payload: {count: -1, recent: []}}
    expected: {valid: false, rejected_by: shape, go_rejects: true}
    classification: must-fail
    provenance: {source: boundary, ref: "count is nonnegative"}
    mutation: {description: "sends a negative count"}
  - name: summary-duplicate-recent-rejected
    input: {schema: VillagePullRequestsSummary, payload: {count: 2, recent: [{owner: acme, name: ingest-api, number: 42}, {owner: acme, name: ingest-api, number: 42}]}}
    expected: {valid: false, rejected_by: semantics, error_contains: listed twice}
    classification: must-fail
    provenance: {source: boundary, ref: "each pull request is listed once"}
    mutation: {description: "repeats one pull request"}
  - name: summary-null-recent-rejected
    input: {schema: VillagePullRequestsSummary, payload: {count: 0, recent: null}}
    expected: {valid: false, rejected_by: shape, go_rejects: true}
    classification: must-fail
    provenance: {source: boundary, ref: "recent is an array"}
    mutation: {description: "sends null instead of an empty list"}
  - name: summary-zero-number-rejected
    input: {schema: VillagePullRequestsSummary, payload: {count: 1, recent: [{owner: acme, name: ingest-api, number: 0}]}}
    expected: {valid: false, rejected_by: shape, go_rejects: true}
    classification: must-fail
    provenance: {source: boundary, ref: "a pull request number is positive"}
    mutation: {description: "sends pull request number zero"}
  - name: transcript-pulls-requested-rejected
    input:
      schema: VillageTranscriptPullRequestsResponse
      payload:
        pull_requests:
          - {owner: acme, name: ingest-api, number: 42, title: Fix flaky ingest test, head_ref: fix/flaky-ingest, state: requested}
    expected: {valid: false, rejected_by: semantics, error_contains: only attached and detached}
    classification: must-fail
    provenance: {source: requirement, ref: "a request that is not attached never reaches a reader"}
    mutation: {description: "lists a requested attachment"}
  - name: transcript-pulls-waiting-rejected
    input:
      schema: VillageTranscriptPullRequestsResponse
      payload:
        pull_requests:
          - {owner: acme, name: ingest-api, number: 42, title: Fix flaky ingest test, head_ref: fix/flaky-ingest, state: waiting}
    expected: {valid: false, rejected_by: semantics, error_contains: only attached and detached}
    classification: must-fail
    provenance: {source: requirement, ref: "a request that is not attached never reaches a reader"}
    mutation: {description: "lists a waiting attachment"}
