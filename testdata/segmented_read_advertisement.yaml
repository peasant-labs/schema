cases:
  - name: advertisement-absent-pair
    classification: must-pass
    provenance: {source: requirement, ref: "An older host omits both members"}
    mutation: {description: "An empty pair is omitted from the wire"}
    input: {current: "", min: ""}
    expected: {outcome: absent}
  - name: advertisement-current-and-minimum
    classification: must-pass
    provenance: {source: requirement, ref: "A host emits both members together"}
    mutation: {description: "Advertise the full served window"}
    input: {current: "0.2.0", min: "0.1.0"}
    expected: {outcome: pair}
  - name: advertisement-current-only-refused
    classification: must-fail
    provenance: {source: requirement, ref: "A partial window cannot establish safe support"}
    mutation: {description: "Omit the minimum"}
    input: {current: "0.2.0", min: ""}
    expected: {outcome: refused}
  - name: advertisement-minimum-only-refused
    classification: must-fail
    provenance: {source: requirement, ref: "A partial window cannot establish safe support"}
    mutation: {description: "Omit the current version"}
    input: {current: "", min: "0.1.0"}
    expected: {outcome: refused}
