cases:
  - {name: decode-absent-pair, classification: must-pass, provenance: {source: requirement, ref: "An older host omits both members"}, mutation: {description: "Decode an older discovery response"}, input: {json: '{}'}, expected: {current: "", min: ""}}
  - {name: decode-empty-pair, classification: must-pass, provenance: {source: requirement, ref: "Empty strings count as absent"}, mutation: {description: "Decode two empty members"}, input: {json: '{"segmentedReadVersion":"","minSegmentedReadVersion":""}'}, expected: {current: "", min: ""}}
  - {name: decode-empty-and-omitted, classification: must-pass, provenance: {source: requirement, ref: "Empty and omitted members both mean absent"}, mutation: {description: "Decode an empty current and omitted minimum"}, input: {json: '{"segmentedReadVersion":""}'}, expected: {current: "", min: ""}}
  - {name: decode-complete-pair, classification: must-pass, provenance: {source: requirement, ref: "A complete pair retains opaque tokens"}, mutation: {description: "Decode a complete window"}, input: {json: '{"segmentedReadVersion":"future-current","minSegmentedReadVersion":"future-minimum"}'}, expected: {current: future-current, min: future-minimum}}
  - {name: decode-current-only-refused, classification: must-fail, provenance: {source: requirement, ref: "Partial windows are unsafe"}, mutation: {description: "Omit the minimum"}, input: {json: '{"segmentedReadVersion":"0.2.0"}'}, expected: {errorContains: "minSegmentedReadVersion is absent"}}
  - {name: decode-minimum-only-refused, classification: must-fail, provenance: {source: requirement, ref: "Partial windows are unsafe"}, mutation: {description: "Omit the current token"}, input: {json: '{"minSegmentedReadVersion":"0.1.0"}'}, expected: {errorContains: "segmentedReadVersion is absent"}}
  - {name: decode-empty-minimum-refused, classification: must-fail, provenance: {source: boundary, ref: "Empty means absent"}, mutation: {description: "Supply a current token and empty minimum"}, input: {json: '{"segmentedReadVersion":"0.2.0","minSegmentedReadVersion":""}'}, expected: {errorContains: "minSegmentedReadVersion is absent"}}
  - {name: decode-numeric-current-refused, classification: must-fail, provenance: {source: boundary, ref: "Version tokens are strings"}, mutation: {description: "Supply a numeric current token"}, input: {json: '{"segmentedReadVersion":2,"minSegmentedReadVersion":"0.1.0"}'}, expected: {errorContains: "segmentedReadVersion is not a string"}}
  - {name: decode-numeric-minimum-refused, classification: must-fail, provenance: {source: boundary, ref: "Version tokens are strings"}, mutation: {description: "Supply a numeric minimum token"}, input: {json: '{"segmentedReadVersion":"0.2.0","minSegmentedReadVersion":1}'}, expected: {errorContains: "minSegmentedReadVersion is not a string"}}
  - {name: decode-null-current-refused, classification: must-fail, provenance: {source: boundary, ref: "Null is malformed, not absent"}, mutation: {description: "Supply null as current"}, input: {json: '{"segmentedReadVersion":null}'}, expected: {errorContains: "segmentedReadVersion is not a string"}}
  - {name: decode-null-minimum-refused, classification: must-fail, provenance: {source: boundary, ref: "Null is malformed, not absent"}, mutation: {description: "Supply null as minimum"}, input: {json: '{"minSegmentedReadVersion":null}'}, expected: {errorContains: "minSegmentedReadVersion is not a string"}}
  - {name: decode-casefold-lone-refused, classification: must-fail, provenance: {source: boundary, ref: "Go's case-insensitive field matching must not bypass validation"}, mutation: {description: "Use a case variant for a lone member"}, input: {json: '{"SegmentedReadVersion":"0.2.0"}'}, expected: {errorContains: "minSegmentedReadVersion is absent"}}
  - {name: decode-casefold-null-refused, classification: must-fail, provenance: {source: boundary, ref: "Go's case-insensitive field matching must not hide null"}, mutation: {description: "Use a case variant with null"}, input: {json: '{"SegmentedReadVersion":null}'}, expected: {errorContains: "segmentedReadVersion is not a string"}}
