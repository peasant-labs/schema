  - index: 4
    role: "assistant"
    content: "Couldn't read the prod config (permission denied), but the defaults show `syncIntervalMs: 30000` — the sync runs every 30 seconds and the cache TTL is also 30 seconds. This creates a guaranteed race window.\n\nThe fix is to use a write-through pattern: update the cache *after* each DB write instead of invalidating everything upfront. Let me implement this."
    toolCalls:
      - name: "Edit"
        arguments:
          file_path: "src/workers/inventory-sync.ts"
          old_string: |
            // Bulk update — invalidate ALL stock cache entries first
            cache.invalidate('stock:');

            for (const item of warehouses.flatMap(w => w.items)) {
              await db.query(
                'UPDATE inventory SET quantity = $1, updated_at = NOW() WHERE product_id = $2',
                [item.quantity, item.productId]
              );
            }
          new_string: |
            for (const item of warehouses.flatMap(w => w.items)) {
              await db.query(
                'UPDATE inventory SET quantity = $1, updated_at = NOW() WHERE product_id = $2',
                [item.quantity, item.productId]
              );
              // Write-through: update cache atomically after each DB write
              const reserved = await db.query(
                'SELECT reserved, warehouse_id FROM inventory WHERE product_id = $1',
                [item.productId]
              );
              if (reserved.rows[0]) {
                cache.set(`stock:${item.productId}`, {
                  available: item.quantity - reserved.rows[0].reserved,
                  warehouse: reserved.rows[0].warehouse_id,
                }, { ttl: 30_000 });
              }
            }
        result: "File edited successfully."
