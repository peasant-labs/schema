  - index: 7
    role: "assistant"
    content: |
      Root cause identified and fixed.

      **Problem**: `inventory-sync` worker invalidated the entire `stock:*` cache prefix before updating DB rows one-by-one. During that update window (~2-5s under load), any `getStock()` call would miss the cache and read stale/undefined data from the DB.

      **Fix**: Write-through cache — update each cache entry *after* its corresponding DB row is written, instead of bulk-invalidating upfront. Also added a null guard in `getStock()` for missing products.

      **Files changed** (2):
      - `src/workers/inventory-sync.ts` — write-through pattern
      - `src/services/inventory.ts` — null guard
    timestamp: "2026-02-24T10:07:00Z"
    depth: 0

