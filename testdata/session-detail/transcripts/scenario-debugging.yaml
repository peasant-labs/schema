    content: "Found it. The `inventory-sync` worker invalidates the entire stock cache prefix, then updates rows one-by-one in a loop. During that loop, any `getStock()` call will:\n\n1. Miss the cache (just invalidated)\n2. Read stale/mid-update data from DB\n3. Potentially get `undefined` if the row is being updated\n\nLet me check how often this sync runs and how long the update loop takes."
