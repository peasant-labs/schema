    - {name: source-empty, input: {alias: source, bytesBase64: ""}, expected: {errorContains: 1..96}, classification: must-fail, provenance: {source: boundary, ref: required-ref}, mutation: {description: empty required source ref}}
    - {name: submission-invalid-utf8, input: {alias: submission, bytesBase64: /w==}, expected: {errorContains: UTF-8}, classification: must-fail, provenance: {source: boundary, ref: invalid-utf8}, mutation: {description: invalid UTF-8 byte vector}}
    - {name: revision-one-byte, input: {alias: revision, bytesBase64: YQ==}, expected: {valueBase64: YQ==}, classification: must-pass, provenance: {source: boundary, ref: one-byte}, mutation: {description: minimum valid ref}}
