durable:
  round_trip:
    cases:
      - name: legacy-durable-decode
        input: {json: '{"id":"ses_legacy","harness":"claude-code","turnCount":4,"turns":[]}' }
        expected: {turn_count: 4, input_present: false, main_refs: [], earlier_refs: []}
        classification: must-pass
        provenance: {source: requirement, ref: legacy-durable-decode}
        mutation: {description: graph fields omitted by an old producer}
      - name: folded-refs-provenance-roundtrip
        input: {json: '{"id":"ses_graph","harness":"claude-code","turnCount":5,"inputSubmissionCount":1,"rootSessionId":"ses_root","purpose":"delegated_work","relationships":[{"kind":"started_by","targetState":"target_known","targetLocalId":"ses_parent","evidence":"native_typed"}],"turns":[{"index":3,"role":"assistant","content":"I will inspect.","timestamp":"2026-09-08T00:00:00Z","depth":0,"sourceEntryRef":"e_a1","provenance":{"origin":"agent_output","actor":"agent_delegate","delivery":"session_admission","ownership":"local","evidence":"native_typed","inputModality":"none"},"toolCalls":[{"id":"call_1","name":"rg","arguments":"parser","result":"parser.go:12","callEntryRef":"e_call1","resultEntryRef":"e_result1","callProvenance":{"origin":"tool_activity","actor":"agent_delegate","delivery":"tool_delivery","ownership":"local","evidence":"native_typed","inputModality":"none"},"resultProvenance":{"origin":"tool_activity","actor":"agent_delegate","delivery":"tool_delivery","ownership":"local","evidence":"native_typed","inputModality":"none"}}]}],"earlierHistory":[{"state":"uncertain_migrated","turns":[{"index":0,"role":"user","content":"old","timestamp":"2026-09-07T00:00:00Z","depth":0,"sourceEntryRef":"e_old","provenance":{"origin":"submitted_input","actor":"unknown","delivery":"inherited_context","ownership":"uncertain","evidence":"retained_last_good","inputModality":"text","submissionRef":"s_old"}}]}]}' }
        expected: {turn_count: 5, input_present: true, input_count: 1, main_refs: [e_a1, e_call1, e_result1], earlier_refs: [e_old]}
        classification: must-pass
        provenance: {source: requirement, ref: folded-round-trip}
        mutation: {description: durable graph evidence is populated}
  counts:
    cases:
      - {name: input-count-absent, input: {json: '{"id":"ses_absent","harness":"claude-code","turnCount":0,"turns":[]}'}, expected: {present: false}, classification: must-pass, provenance: {source: requirement, ref: input-count-absent-zero-positive}, mutation: {description: historical count is omitted}}
      - {name: input-count-zero, input: {json: '{"id":"ses_zero","harness":"claude-code","turnCount":0,"inputSubmissionCount":0,"turns":[]}'}, expected: {present: true, value: 0}, classification: must-pass, provenance: {source: requirement, ref: input-count-absent-zero-positive}, mutation: {description: measured zero is present}}
      - {name: input-count-positive, input: {json: '{"id":"ses_one","harness":"claude-code","turnCount":5,"inputSubmissionCount":1,"turns":[]}'}, expected: {present: true, value: 1}, classification: must-pass, provenance: {source: requirement, ref: three-independent-counts}, mutation: {description: one input remains independent from five turns}}
      - {name: input-count-safe-max, input: {json: '{"id":"ses_max","harness":"claude-code","turnCount":0,"inputSubmissionCount":9007199254740991,"turns":[]}'}, expected: {present: true, value: 9007199254740991}, classification: must-pass, provenance: {source: boundary, ref: input-count-invalid}, mutation: {description: exact JS-safe upper bound}}
  invalid_counts:
    cases:
      - {name: input-count-null, input: {json: '{"id":"ses_bad","harness":"claude-code","turnCount":0,"inputSubmissionCount":null,"turns":[]}'}, expected: {error_contains: explicit null}, classification: must-fail, provenance: {source: requirement, ref: input-count-invalid}, mutation: {description: null replaces omission}}
      - {name: input-count-string, input: {json: '{"id":"ses_bad","harness":"claude-code","turnCount":0,"inputSubmissionCount":"1","turns":[]}'}, expected: {error_contains: inputSubmissionCount}, classification: must-fail, provenance: {source: requirement, ref: input-count-invalid}, mutation: {description: count is a string}}
      - {name: input-count-negative, input: {json: '{"id":"ses_bad","harness":"claude-code","turnCount":0,"inputSubmissionCount":-1,"turns":[]}'}, expected: {error_contains: outside}, classification: must-fail, provenance: {source: boundary, ref: input-count-invalid}, mutation: {description: count is negative}}
      - {name: input-count-fraction, input: {json: '{"id":"ses_bad","harness":"claude-code","turnCount":0,"inputSubmissionCount":1.5,"turns":[]}'}, expected: {error_contains: inputSubmissionCount}, classification: must-fail, provenance: {source: boundary, ref: input-count-invalid}, mutation: {description: count is fractional}}
      - {name: input-count-above-safe-max, input: {json: '{"id":"ses_bad","harness":"claude-code","turnCount":0,"inputSubmissionCount":9007199254740992,"turns":[]}'}, expected: {error_contains: outside}, classification: must-fail, provenance: {source: boundary, ref: input-count-invalid}, mutation: {description: count exceeds JS-safe range}}
  mirrors:
    cases:
      - {name: authoritative-mirrors-match, input: {detail_count: 1, metadata_count: 1, parent: ses_parent, graph_parent: ses_parent}, expected: {accept: true}, classification: must-pass, provenance: {source: requirement, ref: authoritative-mirror}, mutation: {description: every mirror shares one authority}}
      - {name: authoritative-count-disagreement, input: {detail_count: 1, metadata_count: 0, parent: ses_parent, graph_parent: ses_parent}, expected: {accept: false, error_contains: mirrors disagree}, classification: must-fail, provenance: {source: requirement, ref: authoritative-mirror}, mutation: {description: metadata count differs}}
      - {name: graph-legacy-parent-mismatch, input: {detail_count: 1, metadata_count: 1, parent: ses_other, graph_parent: ses_parent}, expected: {accept: false, error_contains: legacy parentSessionId disagrees}, classification: must-fail, provenance: {source: requirement, ref: graph-parent-mismatch}, mutation: {description: legacy parent differs from durable graph}}
  digest:
    cases:
      - {name: digest-absent-versus-zero, input: {left_present: false, right_present: true, right_value: 0}, expected: {different: true}, classification: must-pass, provenance: {source: requirement, ref: digest-presence}, mutation: {description: measured zero is added}}
      - {name: digest-same-positive, input: {left_present: true, left_value: 1, right_present: true, right_value: 1}, expected: {different: false}, classification: must-pass, provenance: {source: requirement, ref: digest-presence}, mutation: {description: equal authoritative count is replayed}}
  required_names: [legacy-durable-decode, folded-refs-provenance-roundtrip, input-count-absent, input-count-zero, input-count-positive, input-count-safe-max, input-count-null, input-count-string, input-count-negative, input-count-fraction, input-count-above-safe-max, authoritative-mirrors-match, authoritative-count-disagreement, graph-legacy-parent-mismatch, digest-absent-versus-zero, digest-same-positive]
