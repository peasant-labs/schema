    - {name: revision-preserves-space, input: {alias: revision, bytesBase64: IHIg}, expected: {valueBase64: IHIg}, classification: must-pass, provenance: {source: requirement, ref: exact-bytes}, mutation: {description: no trimming}}
    - name: source-invalid-bytes
      input:
        alias: source
        bytesBase64: "/w=="
      expected:
        errorContains: UTF-8
      classification: must-fail
      provenance:
        source: boundary
        ref: source-invalid
      mutation:
        description: invalid byte boundary for source
    - name: source-one-bytes
      input:
        alias: source
        bytesBase64: "YQ=="
      expected:
        valueBase64: YQ==
      classification: must-pass
      provenance:
        source: boundary
        ref: source-one
      mutation:
