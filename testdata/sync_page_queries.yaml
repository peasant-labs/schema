required_names: [legacy, grouped, project-options, defaults, zero-default, positive-cap, reject-oversized, children, child-project-refused, child-all-refused, empty-parent, reject-negative, malformed-max, repeated-max, repeated-token, token-with-page, oversized-token, omitted-view-is-home, empty-token-absent, options-filter-refused, unknown-view, unknown-filter, malformed-project, continuation, reject-26, grouped-max-refused, token-4096-alone, options-max-refused]
cases:
  - name: legacy
    input: {query: ""}
    expected: {valid: true, max_items: 25, page: 1}
    classification: must-pass
    provenance: {source: requirement, ref: "the omitted view serves the Home offset page"}
    mutation: {description: "an omitted view is Home and defaults to page one of twenty-five rows"}
  - name: grouped
    input: {query: "view=grouped"}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "grouped sync compatibility"}
    mutation: {description: "retain shipped grouped view"}
  - name: project-options
    input: {query: "view=project-options"}
    expected: {valid: true}
    classification: must-pass
    provenance: {source: requirement, ref: "metadata-only project options"}
    mutation: {description: "explicit complete root project projection"}
  - name: defaults
    input: {query: "view=home"}
    expected: {valid: true, max_items: 25, page: 1}
    classification: must-pass
    provenance: {source: requirement, ref: "default page maximum"}
    mutation: {description: "omit maximum, page, and token"}
  - name: zero-default
    input: {query: "view=home&maxItems=0&pageToken="}
    expected: {valid: true, max_items: 25, page: 1}
    classification: must-pass
    provenance: {source: boundary, ref: "explicit zero default"}
    mutation: {description: "zero and empty token mean the first default page"}
  - name: positive-cap
    input: {query: "view=home&maxItems=100"}
    expected: {valid: true, max_items: 100, page: 1}
    classification: must-pass
    provenance: {source: boundary, ref: "page maximum"}
    mutation: {description: "use the largest accepted member"}
  - name: reject-oversized
    input: {query: "view=home&maxItems=101"}
    expected: {valid: false, error_contains: "outside the closed set"}
    classification: must-fail
    provenance: {source: requirement, ref: "closed page sizes"}
    mutation: {description: "oversized positive is refused rather than clamped"}
  - name: children
    input: {query: "view=home&parentSessionId=parent&maxItems=25"}
    expected: {valid: true, max_items: 25, page: 1}
    classification: must-pass
    provenance: {source: requirement, ref: "general child pages"}
    mutation: {description: "request immediate children without root filters"}
  - name: child-project-refused
    input: {query: "view=home&parentSessionId=parent&projectHash=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}
    expected: {valid: false, error_contains: "omit projectHash and publication"}
    classification: must-fail
    provenance: {source: requirement, ref: "child filter isolation"}
    mutation: {description: "apply root project filter to children"}
  - name: child-all-refused
    input: {query: "view=home&parentSessionId=parent&publication=all"}
    expected: {valid: false, error_contains: "omit projectHash and publication"}
    classification: must-fail
    provenance: {source: requirement, ref: "child filter isolation"}
    mutation: {description: "explicit all is still a root filter"}
  - name: empty-parent
    input: {query: "view=home&parentSessionId="}
    expected: {valid: false, error_contains: parentSessionId}
    classification: must-fail
    provenance: {source: boundary, ref: "parent ID"}
    mutation: {description: "explicit empty parent"}
  - name: reject-negative
    input: {query: "view=home&maxItems=-1"}
    expected: {valid: false, error_contains: negative}
    classification: must-fail
    provenance: {source: boundary, ref: "page maximum"}
    mutation: {description: "negative maximum"}
  - name: malformed-max
    input: {query: "view=home&maxItems=1.5"}
    expected: {valid: false, error_contains: malformed}
    classification: must-fail
    provenance: {source: boundary, ref: "integer maximum"}
    mutation: {description: "noninteger maximum"}
  - name: repeated-max
    input: {query: "maxItems=25&maxItems=50"}
    expected: {valid: false, error_contains: repeated}
    classification: must-fail
    provenance: {source: boundary, ref: "unambiguous query"}
    mutation: {description: "repeat page maximum"}
  - name: repeated-token
    input: {query: "view=home&pageToken=a&pageToken=b"}
    expected: {valid: false, error_contains: repeated}
    classification: must-fail
    provenance: {source: boundary, ref: "unambiguous query"}
    mutation: {description: "repeat retired continuation"}
  - name: token-with-page
    input: {query: "view=home&page=2&pageToken=opaque-next"}
    expected: {valid: false, error_contains: retired}
    classification: must-fail
    provenance: {source: requirement, ref: "retired continuation"}
    mutation: {description: "an old client sends a token beside a page number"}
  - name: oversized-token
    input: {query: "view=home", token_bytes: 4097}
    expected: {valid: false, error_contains: "discard continuation and restart"}
    classification: must-fail
    provenance: {source: boundary, ref: "4096-byte token cap"}
    mutation: {description: "exceed token input cap by one byte"}
  - name: omitted-view-is-home
    input: {query: "maxItems=25"}
    expected: {valid: true, max_items: 25, page: 1}
    classification: must-pass
    provenance: {source: requirement, ref: "the omitted view is Home"}
    mutation: {description: "an omitted view accepts the bounded page maximum"}
  - name: empty-token-absent
    input: {query: "maxItems=25&pageToken="}
    expected: {valid: true, max_items: 25, page: 1}
    classification: must-pass
    provenance: {source: boundary, ref: "empty token is absent"}
    mutation: {description: "an explicit empty token is treated as omitted"}
  - name: options-filter-refused
    input: {query: "view=project-options&publication=published"}
    expected: {valid: false, error_contains: "require view=home"}
    classification: must-fail
    provenance: {source: requirement, ref: "complete project picker"}
    mutation: {description: "do not narrow metadata-only options with root filters"}
  - name: unknown-view
    input: {query: "view=unknown"}
    expected: {valid: false, error_contains: "view is unknown"}
    classification: must-fail
    provenance: {source: boundary, ref: "sync views"}
    mutation: {description: "unrecognized view"}
  - name: unknown-filter
    input: {query: "view=home&publication=automatic"}
    expected: {valid: false, error_contains: "all, not-published, published, or auto"}
    classification: must-fail
    provenance: {source: boundary, ref: LocalSyncPublicationFilter}
    mutation: {description: "unrecognized publication filter"}
  - name: malformed-project
    input: {query: "view=home&projectHash=bad"}
    expected: {valid: false, error_contains: projectHash}
    classification: must-fail
    provenance: {source: boundary, ref: ProjectHash}
    mutation: {description: "short project hash"}
  - name: continuation
    input: {query: "view=home&page=2&maxItems=25"}
    expected: {valid: true, max_items: 25, page: 2}
    classification: must-pass
    provenance: {source: requirement, ref: "offset continuation by page number"}
    mutation: {description: "a client requests the second page directly"}
  - name: reject-26
    input: {query: "view=home&maxItems=26"}
    expected: {valid: false, error_contains: "outside the closed set"}
    classification: must-fail
    provenance: {source: requirement, ref: "closed page sizes"}
    mutation: {description: "a non-member value between two members is refused"}
  - name: grouped-max-refused
    input: {query: "view=grouped&maxItems=25"}
    expected: {valid: false, error_contains: "require view=home"}
    classification: must-fail
    provenance: {source: requirement, ref: "grouped reads keep their legacy envelope"}
    mutation: {description: "paging fields are refused on the grouped read"}
  - name: token-4096-alone
    input: {query: "view=home", token_bytes: 4096}
    expected: {valid: false, error_contains: retired}
    classification: must-fail
    provenance: {source: boundary, ref: "retired continuation at the byte cap"}
    mutation: {description: "the byte cap passes and the retired-token refusal answers"}
  - name: options-max-refused
    input: {query: "view=project-options&maxItems=25"}
    expected: {valid: false, error_contains: "require view=home"}
    classification: must-fail
    provenance: {source: requirement, ref: "metadata-only project picker"}
    mutation: {description: "paging fields are refused on project-options"}
