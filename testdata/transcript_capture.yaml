verdicts:
  cases:
    - name: capture-accept-turns-absent
      classification: must-pass
      provenance: &doc {source: requirement, ref: "Capture refusal precedence: document checks before turns"}
      mutation: {description: "No turns member gives zero turns"}
      input: {detail: '{}'}
      expected:
        cook:
          claudeCode: []
          pi: []
        cuts:
          budget: []
          one: []
    - name: capture-accept-turns-null
      classification: must-pass
      provenance: *doc
      mutation: {description: "A null turns member gives zero turns"}
      input: {detail: '{"turns":null}'}
      expected:
        cook:
          claudeCode: []
          pi: []
        cuts:
          budget: []
          one: []
    - name: capture-accept-turns-empty
      classification: must-pass
      provenance: *doc
      mutation: {description: "An empty array gives zero turns"}
      input: {detail: '{"turns":[]}'}
      expected:
        cook:
          claudeCode: []
          pi: []
        cuts:
          budget: []
          one: []
    - name: capture-refuse-invalid-utf8-outside-turns
      classification: must-fail
      provenance: *doc
      mutation: {description: "Invalid UTF-8 outside the turns refuses the document"}
      input: {bytes: '"{\"x\":\"\xff\",\"turns\":[]}"'}
      expected:
        refusal: document-invalid
        turn: -1
    - name: capture-refuse-invalid-utf8-inside-turn
      classification: must-fail
      provenance: *doc
      mutation: {description: "Invalid UTF-8 inside a turn refuses the document, not the turn"}
      input: {bytes: '"{\"turns\":[{\"content\":\"\xc3\x28\"}]}"'}
      expected:
        refusal: document-invalid
        turn: -1
    - name: capture-refuse-trailing-value
      classification: must-fail
      provenance: *doc
      mutation: {description: "A second JSON value refuses the document"}
      input: {detail: '{"turns":[]} {}'}
      expected:
        refusal: document-invalid
        turn: -1
    - name: capture-refuse-byte-order-mark
      classification: must-fail
      provenance: *doc
      mutation: {description: "A byte order mark is not JSON whitespace"}
      input: {bytes: '"\xef\xbb\xbf{\"turns\":[]}"'}
      expected:
        refusal: document-invalid
        turn: -1
    - name: capture-accept-depth-10000-in-turn
      classification: must-pass
      provenance: *doc
      mutation: {description: "Total nesting of 10,000 is within the decoder limit"}
      input: {nest: {depth: 10000, where: turn}}
