# Capture verdicts of schema.NewTranscriptCookTurns. Expected values are
# written only by the baseline build of tools/capture-differential
# (make capture-differential RECORD=1), never from the code under test.
# Inputs: detail is the document text; bytes is a Go double-quoted literal for
# bytes YAML cannot carry; nest generates a document of the given total depth.
recordedIndex:
  cases:
    - name: recorded-index-present-zero
      classification: must-pass
      provenance: &index {source: requirement, ref: "The captured turn reads its recorded index with the rule DecodeTranscriptRecordedIndex applies"}
      mutation: {description: "Zero is a present index"}
      input: {detail: '{"turns":[{"index":0,"role":"user","content":"a"}]}'}
      expected:
        turns:
          - raw: ee4bb6d74f99f8b9cec3512d9cf135036fa64ac173c16b299948526f61c8565c
            recordedIndex: present:0
            byteLength: 3
            detail: 7192ecf1f8c5d18aeb194ec73fe7859fb8adf3bd04b7b3830fe39f50f702623b
            role: user
            entryType: ""
            depth: 0
            usage: false
            conversation: false
        cook:
          claudeCode: [keep 0 1]
          pi: [keep 0 1]
        cuts:
          budget: [0 0-0 3B 0+0]
          one: [0 0-0 3B 0+0]
