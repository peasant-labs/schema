          pi: [keep 0 1]
        cuts:
          budget: [0 0-0 2B 0+0]
          one: [0 0-0 2B 0+0]
    - name: capture-refuse-depth-10001-in-turn
      classification: must-fail
      provenance: *doc
      mutation: {description: "Total nesting of 10,001 inside a turn refuses the document"}
      input: {nest: {depth: 10001, where: turn}}
      expected:
        refusal: document-invalid
