      expected: "valid"
    - name: header-session-header-omission-set-named
      classification: must-pass
      provenance: {source: requirement, ref: "Bounded header omission set"}
      mutation: {description: "The five omitted names are held as a closed set"}
      input: "omissions"
      expected: "valid"
    - name: header-session-header-carries-no-retained-records
      classification: must-pass
      provenance: {source: requirement, ref: "Retained records remain outside the header"}
      mutation: {description: "A header cannot carry full evidence records"}
      input: "records"
      expected: "valid"
    - name: header-withholding-member-set-closed
      classification: must-pass
      provenance: {source: requirement, ref: "Repository withholding member inventory"}
      mutation: {description: "The four repository members are exact"}
      input: "withholding"
      expected: "valid"
