          {"index":4,"role":"user","content":"p3","depth":0},
          {"index":5,"role":"assistant","content":"r3","depth":0},
          {"index":6,"role":"user","content":"p4","depth":0},
          {"index":7,"role":"assistant","content":"r4","depth":0},
          {"index":8,"role":"user","content":"p5","depth":0},
          {"index":9,"role":"assistant","content":"r5","depth":0},
          {"index":10,"role":"user","content":"p6","depth":0},
          {"index":11,"role":"assistant","content":"r6","depth":0},
          {"index":12,"role":"user","content":"p7","depth":0},
          {"index":13,"role":"assistant","content":"r7","depth":0},
          {"index":14,"role":"user","content":"p8","depth":0},
          {"index":15,"role":"assistant","content":"r8","depth":0},
          {"index":16,"role":"user","content":"p9","depth":0},
          {"index":17,"role":"assistant","content":"reply-to-nine","depth":0},
          {"index":18,"role":"user","content":"p10","depth":0},
          {"index":19,"role":"assistant","content":"r10","depth":0}
