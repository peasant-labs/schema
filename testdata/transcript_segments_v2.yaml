      input: {subject: segment, json: '{"context":{"transport":{"kind":"local_session","sessionId":"ses_test"},"revision":"1","representation":"r1.test","validation":"published_strict","nativePresence":"present","totalTurns":1,"totalSegments":1},"partition":{"kind":"main"},"index":0,"rows":[{"position":0,"recordedIndexState":"present","recordedIndex":0,"turn":{"index":0}}],"byteLength":0,"hasOlder":false,"hasNewer":false,"nativeMetadata":[{"id":"native-1","kind":"pi.toolresult.details","source":{"entryRef":"result-1","sourceType":"pi.message","messageRole":"toolResult"},"attachment":{"turnIndex":0,"toolCallId":"call-1"},"data":{"value":"kept"}}]}'}
      expected: {requiredMembers: [nativeMetadata], contains: '"toolCallId":"call-1"'}
    - name: native-turn-only
      classification: must-pass
      provenance: *wireRequirement
      mutation: {description: "A turn-attached record need not name a tool call"}
      input: {subject: segment, json: '{"context":{"transport":{"kind":"local_session","sessionId":"ses_test"},"revision":"1","representation":"r1.test","validation":"published_strict","nativePresence":"present","totalTurns":1,"totalSegments":1},"partition":{"kind":"main"},"index":0,"rows":[{"position":0,"recordedIndexState":"present","recordedIndex":0,"turn":{"index":0}}],"byteLength":0,"hasOlder":false,"hasNewer":false,"nativeMetadata":[{"id":"native-2","kind":"pi.custommessage.details","source":{"entryRef":"entry-2","sourceType":"pi.custom_message"},"attachment":{"turnIndex":0},"customType":"example","data":{"value":"kept"}}]}'}
