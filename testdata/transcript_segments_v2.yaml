wire:
  cases:
    - name: ref-v2-required-positions
      classification: must-pass
      provenance: &wireRequirement {source: requirement, ref: "The route identity belongs to the transport"}
      mutation: {description: "The Types contract requires both served-position boundaries"}
      input: {subject: ref-schema, json: "{}"}
      expected: {requiredMembers: [sourceFirstPosition, sourceLastPosition]}
    - name: transport-local-session
      classification: must-pass
      provenance: *wireRequirement
      mutation: &wireMutation {description: "Decode and validate the supplied wire object"}
      input: {subject: transport, json: '{"kind":"local_session","sessionId":"ses_test"}'}
      expected: {}
    - name: transport-village-transcript
      classification: must-pass
      provenance: *wireRequirement
      mutation: *wireMutation
      input: {subject: transport, json: '{"kind":"village_transcript","transcriptId":"123e4567-e89b-12d3-a456-426614174000"}'}
      expected: {}
    - name: transport-both-rejected
      classification: must-fail
      provenance: *wireRequirement
      mutation: *wireMutation
      input: {subject: transport, json: '{"kind":"local_session","sessionId":"ses_test","transcriptId":"123e4567-e89b-12d3-a456-426614174000"}'}
      expected: {errorContains: "requires only sessionId"}
    - name: transport-neither-rejected
      classification: must-fail
      provenance: *wireRequirement
      mutation: *wireMutation
      input: {subject: transport, json: '{"kind":"local_session"}'}
      expected: {errorContains: "requires only sessionId"}
    - name: transport-wrong-kind-rejected
      classification: must-fail
      provenance: *wireRequirement
      mutation: *wireMutation
      input: {subject: transport, json: '{"kind":"village_transcript","sessionId":"ses_test"}'}
      expected: {errorContains: "requires only transcriptId"}
    - name: content-session-id-absent
      classification: must-pass
      provenance: *wireRequirement
      mutation: *wireMutation
      input: {subject: context, json: '{"transport":{"kind":"local_session","sessionId":"ses_test"},"revision":"1","representation":"r1.test","validation":"served_legacy","nativePresence":"absent","totalTurns":0,"totalSegments":0}'}
      expected: {checkContentSession: true}
    - name: content-session-id-empty
      classification: must-pass
      provenance: *wireRequirement
      mutation: *wireMutation
      input: {subject: context, json: '{"transport":{"kind":"local_session","sessionId":"ses_test"},"contentSessionId":"","revision":"1","representation":"r1.test","validation":"served_legacy","nativePresence":"absent","totalTurns":0,"totalSegments":0}'}
      expected: {checkContentSession: true, contentSessionId: ""}
    - name: content-session-id-outside-grammar
      classification: must-pass
      provenance: *wireRequirement
      mutation: *wireMutation
      input: {subject: context, json: '{"transport":{"kind":"local_session","sessionId":"ses_test"},"contentSessionId":"legacy value","revision":"1","representation":"r1.test","validation":"served_legacy","nativePresence":"absent","totalTurns":0,"totalSegments":0}'}
      expected: {checkContentSession: true, contentSessionId: "legacy value"}
    - name: context-native-presence-present
      classification: must-pass
      provenance: *wireRequirement
      mutation: *wireMutation
      input: {subject: context, json: '{"transport":{"kind":"local_session","sessionId":"ses_test"},"revision":"1","representation":"r1.test","validation":"served_legacy","nativePresence":"present","totalTurns":0,"totalSegments":0}'}
      expected: {}
    - name: context-harness-absent
      classification: must-pass
      provenance: *wireRequirement
      mutation: {description: "An omitted harness stays omitted in the read context"}
      input: {subject: context, json: '{"transport":{"kind":"local_session","sessionId":"ses_test"},"revision":"1","representation":"r1.test","validation":"served_legacy","nativePresence":"absent","totalTurns":0,"totalSegments":0}'}
      expected: {checkHarness: true}
    - name: context-harness-present-empty
      classification: must-pass
      provenance: *wireRequirement
      mutation: {description: "An explicitly empty harness is present and is not an omitted value"}
      input: {subject: context, json: '{"transport":{"kind":"local_session","sessionId":"ses_test"},"harness":"","revision":"1","representation":"r1.test","validation":"served_legacy","nativePresence":"absent","totalTurns":0,"totalSegments":0}'}
      expected: {checkHarness: true, harness: ""}
    - name: context-harness-legacy-spelling
      classification: must-pass
      provenance: *wireRequirement
      mutation: {description: "Preserve the spelling of a served legacy harness"}
      input: {subject: context, json: '{"transport":{"kind":"local_session","sessionId":"ses_test"},"harness":"claude","revision":"1","representation":"r1.test","validation":"served_legacy","nativePresence":"absent","totalTurns":0,"totalSegments":0}'}
      expected: {checkHarness: true, harness: "claude"}
    - name: context-harness-null-projects-as-absent
      classification: must-pass
      provenance: *wireRequirement
      mutation: {description: "A null input produces no harness in the output"}
      input: {subject: context, json: '{"transport":{"kind":"local_session","sessionId":"ses_test"},"harness":null,"revision":"1","representation":"r1.test","validation":"served_legacy","nativePresence":"absent","totalTurns":0,"totalSegments":0}'}
      expected: {checkHarness: true}
    - name: context-native-presence-withheld
      classification: must-pass
      provenance: *wireRequirement
      mutation: *wireMutation
      input: {subject: context, json: '{"transport":{"kind":"local_session","sessionId":"ses_test"},"revision":"1","representation":"r1.test","validation":"served_legacy","nativePresence":"withheld","totalTurns":0,"totalSegments":0}'}
      expected: {}
    - name: representation-required
      classification: must-fail
      provenance: *wireRequirement
      mutation: *wireMutation
      input: {subject: context, json: '{"transport":{"kind":"local_session","sessionId":"ses_test"},"revision":"1","validation":"served_legacy","nativePresence":"absent","totalTurns":0,"totalSegments":0}'}
      expected: {errorContains: "representation must be present"}
    - name: partition-history-requires-section
      classification: must-fail
      provenance: *wireRequirement
      mutation: *wireMutation
      input: {subject: partition, json: '{"kind":"history"}'}
      expected: {errorContains: "history requires a nonnegative sectionIndex"}
    - name: partition-main-refuses-section
      classification: must-fail
      provenance: *wireRequirement
      mutation: *wireMutation
      input: {subject: partition, json: '{"kind":"main","sectionIndex":0}'}
      expected: {errorContains: "main carries sectionIndex"}
    - name: position-refuses-negative
      classification: must-fail
      provenance: *wireRequirement
      mutation: *wireMutation
      input: {subject: row, json: '{"position":-1,"recordedIndexState":"absent","turn":{}}'}
      expected: {errorContains: "position or recorded-index state"}
    - name: row-recorded-index-paired-with-state
      classification: must-fail
      provenance: *wireRequirement
      mutation: *wireMutation
      input: {subject: row, json: '{"position":0,"recordedIndexState":"present","turn":{}}'}
      expected: {errorContains: "pair a present state with its recorded index"}
    - name: row-recorded-index-absent-cannot-carry-value
      classification: must-fail
      provenance: *wireRequirement
      mutation: *wireMutation
      input: {subject: row, json: '{"position":0,"recordedIndexState":"absent","recordedIndex":0,"turn":{}}'}
      expected: {errorContains: "pair a present state with its recorded index"}
    - name: row-display-number-pattern
      classification: must-pass
      provenance: *wireRequirement
      mutation: *wireMutation
      input: {subject: row, json: '{"position":0,"recordedIndexState":"present","recordedIndex":42,"displayNumber":"27aa","turn":{"index":42}}'}
      expected: {}
    - name: row-display-number-absent-means-predating-server
      classification: must-pass
      provenance: *wireRequirement
      mutation: *wireMutation
      input: {subject: row, json: '{"position":0,"recordedIndexState":"absent","turn":{}}'}
      expected: {}
    - name: row-display-number-never-zero
      classification: must-fail
      provenance: *wireRequirement
      mutation: *wireMutation
      input: {subject: row, json: '{"position":0,"recordedIndexState":"absent","displayNumber":"0","turn":{}}'}
      expected: {errorContains: "displayNumber is malformed"}
    - name: row-display-number-not-a-recorded-index
      classification: must-pass
      provenance: *wireRequirement
      mutation: {description: "The displayed number and recorded turn identity remain independent"}
      input: {subject: row, json: '{"position":0,"recordedIndexState":"present","recordedIndex":42,"displayNumber":"27aa","turn":{"index":42}}'}
      expected: {recordedIndex: 42, displayNumber: "27aa"}
    - name: history-state-forward-open
      classification: must-pass
      provenance: *wireRequirement
      mutation: {description: "A future history section state remains an open string"}
      input: {subject: directory, json: '{"context":{"transport":{"kind":"local_session","sessionId":"ses_test"},"revision":"1","representation":"r1.test","validation":"served_legacy","nativePresence":"absent","totalTurns":0,"totalSegments":0},"partition":{"kind":"main"},"history":[{"index":0,"state":"future-state","totalTurns":0,"usagePresent":"unknown"}],"usagePresent":"unknown","segments":[]}'}
      expected: {contains: '"state":"future-state"'}
    - name: manifest-usage-present
      classification: must-pass
      provenance: *wireRequirement
      mutation: {description: "The directory can report observed usage evidence"}
      input: {subject: directory, json: '{"context":{"transport":{"kind":"local_session","sessionId":"ses_test"},"revision":"1","representation":"r1.test","validation":"served_legacy","nativePresence":"absent","totalTurns":0,"totalSegments":0},"partition":{"kind":"main"},"usagePresent":"present","segments":[]}'}
      expected: {requiredMembers: [usagePresent], contains: '"usagePresent":"present"'}
    - name: manifest-usage-empty
      classification: must-pass
      provenance: *wireRequirement
      mutation: {description: "Known empty usage is distinct from unknown"}
      input: {subject: directory, json: '{"context":{"transport":{"kind":"local_session","sessionId":"ses_test"},"revision":"1","representation":"r1.test","validation":"served_legacy","nativePresence":"absent","totalTurns":0,"totalSegments":0},"partition":{"kind":"main"},"usagePresent":"empty","segments":[]}'}
      expected: {requiredMembers: [usagePresent], contains: '"usagePresent":"empty"'}
    - name: manifest-usage-unknown
      classification: must-pass
      provenance: *wireRequirement
      mutation: {description: "Unknown usage is not a claim that no usage exists"}
      input: {subject: directory, json: '{"context":{"transport":{"kind":"local_session","sessionId":"ses_test"},"revision":"1","representation":"r1.test","validation":"served_legacy","nativePresence":"withheld","totalTurns":0,"totalSegments":0},"partition":{"kind":"main"},"usagePresent":"unknown","segments":[]}'}
      expected: {requiredMembers: [usagePresent], contains: '"usagePresent":"unknown"'}
    - name: directory-carries-no-display-number
      classification: must-pass
      provenance: *wireRequirement
      mutation: {description: "Display numbers belong to rows rather than directories or refs"}
      input: {subject: directory, json: '{"context":{"transport":{"kind":"local_session","sessionId":"ses_test"},"revision":"1","representation":"r1.test","validation":"served_legacy","nativePresence":"absent","totalTurns":1,"totalSegments":1},"partition":{"kind":"main"},"usagePresent":"unknown","segments":[{"index":0,"sourceFirstPosition":0,"sourceLastPosition":0,"byteLength":1}]}'}
      expected: {forbiddenMembers: [displayNumber], notContains: '"displayNumber"'}
    - name: segment-carries-no-native-presence
