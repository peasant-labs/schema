operations:
  - {path: /api/v1/village/collective-observations, method: get, operation_id: listCollectiveObservations}
  - {path: /api/v1/village/contributions, method: get, operation_id: listLocalContributionEvidence}
  - {path: /api/v1/village/collective-observations/fetch, method: post, operation_id: fetchCollectiveObservations}
  - {path: '/api/v1/village/collective-observations/{collectiveId}/tracking', method: put, operation_id: trackCollectiveObservation}
  - {path: '/api/v1/village/collective-observations/{collectiveId}/tracking', method: delete, operation_id: untrackCollectiveObservation}
  - {path: /api/v1/annotation-types, method: get, operation_id: listAnnotationTypes}
  - {path: /api/v1/annotations, method: get, operation_id: listAnnotations}
  - {path: /api/v1/annotations, method: post, operation_id: createAnnotation}
  - {path: /api/v1/config/mock, method: get, operation_id: getMockConfig}
  - {path: /api/v1/config/capabilities, method: get, operation_id: getUICapabilities}
  - {path: /api/v1/health, method: get, operation_id: getHealth}
  - {path: "/api/v1/map/{projectHash}", method: get, operation_id: getMapGraph}
  - {path: "/api/v1/map/{projectHash}/node", method: get, operation_id: getMapNodeDetail}
  - {path: "/api/v1/map/{projectHash}/tasks", method: get, operation_id: listProjectTasks}
  - {path: /api/v1/projects/resolve, method: get, operation_id: resolveProject}
  - {path: /api/v1/projects/summary, method: get, operation_id: listProjectSummaries,
     description_anchors: [{name: eligible_session_count, text: "The sessions count covers every session recorded for a project"}]}
  - {path: "/api/v1/review/{projectHash}", method: get, operation_id: listReviewChanges}
  - {path: "/api/v1/review/{projectHash}/change", method: get, operation_id: getChangeDetail}
  - {path: "/api/v1/review/{projectHash}/diff", method: get, operation_id: getChangeDiff}
  - {path: /api/v1/search, method: get, operation_id: searchMessages,
     description_anchors: [{name: indexed_search_match, text: "The saved ingestion selection never excludes an indexed entry that matches the query"}]}
  - path: /api/v1/session-summaries
    method: get
    operation_id: getSessionSummariesByID
    description_anchors:
      - {name: summaries_stored_read_not_narrowed, text: "the saved ingestion selection never narrows a stored read"}
  - path: "/api/v1/session-groups/{groupId}/members"
    method: get
    operation_id: listLocalHelperGroupMembers
    description_anchors:
      - {name: member_scope_excludes_ingestion_selection, text: "the saved ingestion selection is not part of it"}
      - {name: member_scope_keeps_route_eligibility, text: "The originating grouped route's own eligibility and query predicate rules are kept"}
  - path: /api/v1/sessions
    method: get
    operation_id: listSessions
    description_anchors:
      - {name: no_ingestion_browse_filter, text: "The saved ingestion selection never narrows this read"}
      - {name: list_independent_bounds, text: "Independent origin, index-readiness, and query rules still apply"}
  - {path: "/api/v1/sessions/{id}", method: get, operation_id: getSession,
     description_anchors: [{name: session_by_id_not_selection_filtered, text: "The saved ingestion selection never refuses a stored session here"}]}
  - {path: "/api/v1/sessions/{id}/commits", method: get, operation_id: getSessionCommits}
  - {path: "/api/v1/sessions/{id}/pull-requests", method: get, operation_id: getSessionPullRequests}
  - {path: "/api/v1/sessions/{id}/transcript", method: get, operation_id: getSessionTranscript,
     description_anchors: [{name: transcript_by_id_not_selection_filtered, text: "is not refused because that selection would leave it out of a future ingest"}]}
  - {path: /api/v1/shutdown, method: post, operation_id: postShutdown}
  - path: /api/v1/sync/sessions
    method: get
    operation_id: listSyncSessionsGrouped
    description_anchors:
      - {name: home_no_ingestion_browse_filter, text: "it excludes no root, child, or project option that the view's own eligibility rules admit"}
      - {name: home_counts_follow_eligible_filters, text: "counts and empty states derive from the eligible browsing set the caller's explicit filters select"}
      - {name: home_independent_bounds, text: "Independent origin, index-readiness, publication, project, parent, and account rules still apply before paging"}
      - {name: unknown_parent_only_404, text: "Unknown parents return 404"}
      - {name: token_scope_excludes_ingestion_selection, text: "or the saved ingestion selection, so changing that selection leaves an in-flight continuation valid"}
      - {name: token_scope_excludes_page_size, text: "it does not include the page size, which a caller may change independently"}
      - {name: publication_metadata_fails_closed, text: "when that metadata cannot be determined the read returns 500"}
  - {path: /api/v1/publications, method: get, operation_id: listPublications,
     description_anchors: [{name: publications_not_selection_filtered, text: "This read ignores the saved ingestion and push selection"}]}
  - {path: /api/v1/settings, method: get, operation_id: getSettings}
  - {path: /api/v1/settings, method: patch, operation_id: updateSetting}
  - {path: "/api/v1/settings/auto-publish/{id}", method: delete, operation_id: deleteAutoPublishRule}
  - {path: "/api/v1/settings/auto-publish/{id}", method: put, operation_id: saveAutoPublishRule}
  - {path: "/api/v1/settings/auto-publish/{id}/install", method: post, operation_id: installAutoPublishHooks}
  - {path: /api/v1/sync/auth, method: get, operation_id: getSyncAuth}
  - {path: /api/v1/sync/login, method: post, operation_id: syncLogin}
  - {path: /api/v1/sync/logout, method: post, operation_id: syncLogout}
  - {path: /api/v1/sync/push, method: post, operation_id: pushSyncSessions}
  - {path: /api/v1/sync/redactions, method: get, operation_id: getSyncRedactions}
  - {path: /api/v1/village/collectives, method: get, operation_id: listVillageCollectives}
mutations:
  cases:
    - name: removed_operation_is_rejected
      input: {kind: remove, path: /api/v1/projects/resolve, method: get}
      expected: false
      classification: must-fail
      provenance: {source: requirement, ref: exact local API operation manifest}
      mutation: {description: removes the project resolver operation}
    - name: added_operation_is_rejected
      input: {kind: add, path: /api/v1/unexpected, method: get, operation_id: unexpectedOperation}
      expected: false
      classification: must-fail
      provenance: {source: boundary, ref: exact local API operation manifest}
      mutation: {description: adds an unaccounted operation to the public surface}
    - name: redirected_operation_is_rejected
      input: {kind: redirect, path: "/api/v1/review/{projectHash}", method: get, operation_id: resolveProject}
      expected: false
      classification: must-fail
      provenance: {source: requirement, ref: exact local API operation mapping}
      mutation: {description: redirects the review timeline route to the resolver operation}
