aliases:
  - name: PushContractVersion
    target: ContractVersion
    surfaces: [root]
  - name: paths
    target: GeneratedPaths
    surfaces: [local, village]
  - name: operations
    target: GeneratedOperations
    surfaces: [local, village]
constants:
  - name: VillageAPIVersion
    value: 0.12.0
    surfaces: [root, village]
  - name: PeasantLocalAPIVersion
    value: 0.6.0
    surfaces: [root, local]
  - name: TypesVersion
    value: 0.9.0
    surfaces: [root]
  - name: MetadataSchemaVersion
    value: "9"
    surfaces: [root]
functions:
  - name: isProjectHash
    target: runtime-guard:ProjectHash
    surfaces: [root]
  - name: validateProjectHash
    target: runtime-validator:ProjectHash
    surfaces: [root]
  - name: newProjectHash
    target: runtime-constructor:ProjectHash
    surfaces: [root]
forbidden:
  - Provider
  - BestiaryHarness
  - VersionResponse
