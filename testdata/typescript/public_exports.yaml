aliases:
  - name: PushContractVersion
    target: ContractVersion
    surfaces: [root]
  - name: paths
    target: GeneratedPaths
    surfaces: [local, village]
  - name: operations
    target: GeneratedOperations
    surfaces: [local, village]
constants:
  - name: VillageAPIVersion
    value: 0.17.0
    surfaces: [root, village]
  - name: PeasantLocalAPIVersion
    value: 0.13.0
    surfaces: [root, local]
  - name: TypesVersion
    value: 0.19.0
    surfaces: [root]
  - name: MetadataSchemaVersion
    value: "11"
    surfaces: [root]
functions:
  - name: parseSchemaVersionAdvertisement
    target: runtime-capability-advertisement-parser
    surfaces: [root]
  - name: knownContentCapabilities
    target: runtime-capability-reader
    surfaces: [root]
  - name: missingContentCapabilities
    target: runtime-capability-negotiation
    surfaces: [root]
  - name: requiredContentCapabilities
    target: runtime-capability-derivation
    surfaces: [root]
  - name: validateContentCapabilityAdvertisements
    target: runtime-capability-producer-validation
    surfaces: [root]
  - name: isProjectHash
    target: runtime-guard:ProjectHash
    surfaces: [root]
  - name: validateProjectHash
    target: runtime-validator:ProjectHash
    surfaces: [root]
  - name: newProjectHash
    target: runtime-constructor:ProjectHash
    surfaces: [root]
  - name: scanRawJsonText
    target: runtime-scanner:RawJSON
    surfaces: [root]
  - name: parseServerMessageRaw
    target: runtime-parser:ServerMessage
    surfaces: [root]
  - name: parseSessionDetailPayloadValue
    target: runtime-parser:SessionDetailPayload
    surfaces: [root]
  - name: parseSessionDetailPayloadText
    target: runtime-parser:SessionDetailPayload
    surfaces: [root]
  - name: parseTranscriptContentText
    target: runtime-parser:TranscriptContent
    surfaces: [root]
  - name: parseNativeMetadataRecordsText
    target: runtime-parser:NativeMetadataRecords
    surfaces: [root]
  - name: parseNativeMetadataRecordsValue
    target: runtime-parser:NativeMetadataRecords
    surfaces: [root]
forbidden:
  - Provider
  - BestiaryHarness
  - VersionResponse
