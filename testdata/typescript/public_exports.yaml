aliases:
  - name: PushContractVersion
    target: ContractVersion
    surfaces: [root]
  - name: paths
    target: GeneratedPaths
    surfaces: [local, village]
  - name: operations
    target: GeneratedOperations
    surfaces: [local, village]
constants:
  - name: VillageAPIVersion
    value: 0.15.0
    surfaces: [root, village]
  - name: PeasantLocalAPIVersion
    value: 0.11.0
    surfaces: [root, local]
  - name: TypesVersion
    value: 0.17.0
    surfaces: [root]
  - name: MetadataSchemaVersion
    value: "10"
    surfaces: [root]
functions:
  - name: isProjectHash
    target: runtime-guard:ProjectHash
    surfaces: [root]
  - name: validateProjectHash
    target: runtime-validator:ProjectHash
    surfaces: [root]
  - name: newProjectHash
    target: runtime-constructor:ProjectHash
    surfaces: [root]
  - name: scanRawJsonText
    target: runtime-scanner:RawJSON
    surfaces: [root]
  - name: parseServerMessageRaw
    target: runtime-parser:ServerMessage
    surfaces: [root]
  - name: parseSessionDetailPayloadValue
    target: runtime-parser:SessionDetailPayload
    surfaces: [root]
  - name: parseSessionDetailPayloadText
    target: runtime-parser:SessionDetailPayload
    surfaces: [root]
  - name: parseTranscriptContentText
    target: runtime-parser:TranscriptContent
    surfaces: [root]
  - name: parseNativeMetadataRecordsText
    target: runtime-parser:NativeMetadataRecords
    surfaces: [root]
  - name: parseNativeMetadataRecordsValue
    target: runtime-parser:NativeMetadataRecords
    surfaces: [root]
forbidden:
  - Provider
  - BestiaryHarness
  - VersionResponse
