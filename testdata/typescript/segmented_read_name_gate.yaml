cases:
  - {name: name-gate-retired-type, classification: must-fail, provenance: {source: requirement, ref: "Retired protocol declarations must not ship"}, mutation: {description: "Restore a retired type"}, input: {source: "type TranscriptSegmentDirectoryV2 struct{}"}, expected: true}
  - {name: name-gate-retired-zod, classification: must-fail, provenance: {source: requirement, ref: "Generated validator names follow the renamed declaration"}, mutation: {description: "Restore a generated validator"}, input: {source: "export const zTranscriptWindowV2 = value;"}, expected: true}
  - {name: name-gate-retired-schema, classification: must-fail, provenance: {source: requirement, ref: "Generated response names follow the renamed declaration"}, mutation: {description: "Restore a generated schema reference"}, input: {source: '"#/components/schemas/SchemaTranscriptSegmentV2"'}, expected: true}
  - {name: name-gate-retired-schema-suffix, classification: must-fail, provenance: {source: requirement, ref: "Generated schema suffixes are also protected"}, mutation: {description: "Restore a suffix-form schema"}, input: {source: "TranscriptWindowV2Schema"}, expected: true}
  - {name: name-gate-retired-function, classification: must-fail, provenance: {source: requirement, ref: "The mandatory writer has one role name"}, mutation: {description: "Restore a retired writer"}, input: {source: "MarshalTranscriptSegmentV2(segment)"}, expected: true}
  - {name: name-gate-old-lowercase-identifier, classification: must-fail, provenance: {source: requirement, ref: "Protocol identifiers use their role, not a generation"}, mutation: {description: "Restore a lower-case generation prefix"}, input: {source: "type v2WindowInput struct{}"}, expected: true}
  - {name: name-gate-old-embedded-identifier, classification: must-fail, provenance: {source: requirement, ref: "Protocol identifiers remain protected after a prefix"}, mutation: {description: "Restore a prefixed generation name"}, input: {source: "const storedTranscriptv2Value = 1;"}, expected: true}
  - {name: name-gate-old-lowercase-prose, classification: must-fail, provenance: {source: requirement, ref: "Protocol prose names its role"}, mutation: {description: "Restore old segmented-read prose"}, input: {source: "// v2 segment validation"}, expected: true}
  - {name: name-gate-old-separated-prose, classification: must-fail, provenance: {source: requirement, ref: "A protocol subject can be separated from its old generation label"}, mutation: {description: "Restore a non-adjacent generation label"}, input: {source: "// v2 page-two segment ordinals are absolute"}, expected: true}
  - {name: name-gate-old-trailing-prose, classification: must-fail, provenance: {source: requirement, ref: "A generation label can follow its protocol subject"}, mutation: {description: "Restore a trailing generation label"}, input: {source: "// the positioned directory is served by v2"}, expected: true}
  - {name: name-gate-hash-not-name, classification: must-pass, provenance: {source: boundary, ref: "Dependency hashes are not protocol declarations"}, mutation: {description: "Include an unrelated checksum"}, input: {source: "// h1:Kk03w/5aGmagtuKrV2NLeRVeclA90UBghSXKjTbU4ls="}, expected: false}
  - {name: name-gate-unrelated-dependency, classification: must-pass, provenance: {source: boundary, ref: "Unrelated dependency names remain unchanged"}, mutation: {description: "Include an unrelated module path"}, input: {source: "gopkg.in/yaml.v2 v2.4.0"}, expected: false}
  - {name: name-gate-fixture-key, classification: must-pass, provenance: {source: requirement, ref: "Pinned fixture case names remain unchanged"}, mutation: {description: "Refer to a fixture case key"}, input: {source: '"v2-directory-span-at-total"'}, expected: false}
  - {name: name-gate-positioned-name, classification: must-pass, provenance: {source: requirement, ref: "The new role names are legal"}, mutation: {description: "Use the positioned type"}, input: {source: "type PositionedDirectory struct{}"}, expected: false}
