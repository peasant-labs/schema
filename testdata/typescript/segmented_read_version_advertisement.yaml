cases:
  - {name: version-advertisement-both-absent, classification: must-pass, provenance: {source: requirement, ref: "Absent pair means the shipped protocol only"}, mutation: {description: "Omit both members"}, input: {json: '{}'}, expected: {outcome: absent}}
  - {name: version-advertisement-both-empty, classification: must-pass, provenance: {source: boundary, ref: "Empty strings count as absent"}, mutation: {description: "Send empty strings"}, input: {json: '{"segmentedReadVersion":"","minSegmentedReadVersion":""}'}, expected: {outcome: absent}}
  - {name: version-advertisement-omitted-and-empty, classification: must-pass, provenance: {source: boundary, ref: "Both kinds of absence are equivalent"}, mutation: {description: "Combine omission and empty string"}, input: {json: '{"segmentedReadVersion":""}'}, expected: {outcome: absent}}
  - {name: version-advertisement-explicit-minimal, classification: must-pass, provenance: {source: requirement, ref: "An explicit minimal host differs from omission"}, mutation: {description: "Advertise one declared version"}, input: {json: '{"segmentedReadVersion":"0.1.0","minSegmentedReadVersion":"0.1.0"}'}, expected: {outcome: pair, current: "0.1.0", min: "0.1.0"}}
  - {name: version-advertisement-complete-window, classification: must-pass, provenance: {source: requirement, ref: "Both tokens are preserved"}, mutation: {description: "Advertise the served window"}, input: {json: '{"segmentedReadVersion":"0.2.0","minSegmentedReadVersion":"0.1.0"}'}, expected: {outcome: pair, current: "0.2.0", min: "0.1.0"}}
  - {name: version-advertisement-unknown-verbatim, classification: must-pass, provenance: {source: requirement, ref: "Version tokens are opaque and forward-open"}, mutation: {description: "Advertise future opaque tokens"}, input: {json: '{"segmentedReadVersion":"future-current","minSegmentedReadVersion":"future-minimum"}'}, expected: {outcome: pair, current: future-current, min: future-minimum}}
  - {name: version-advertisement-current-only, classification: must-fail, provenance: {source: requirement, ref: "Partial windows cannot be selected safely"}, mutation: {description: "Omit the minimum"}, input: {json: '{"segmentedReadVersion":"0.2.0"}'}, expected: {outcome: refused, errorContains: minSegmentedReadVersion}}
  - {name: version-advertisement-minimum-only, classification: must-fail, provenance: {source: requirement, ref: "Partial windows cannot be selected safely"}, mutation: {description: "Omit the current"}, input: {json: '{"minSegmentedReadVersion":"0.1.0"}'}, expected: {outcome: refused, errorContains: segmentedReadVersion}}
  - {name: version-advertisement-empty-minimum, classification: must-fail, provenance: {source: boundary, ref: "Empty is absent"}, mutation: {description: "Supply an empty minimum"}, input: {json: '{"segmentedReadVersion":"0.2.0","minSegmentedReadVersion":""}'}, expected: {outcome: refused, errorContains: minSegmentedReadVersion}}
  - {name: version-advertisement-null-current, classification: must-fail, provenance: {source: boundary, ref: "Null is malformed, not absence"}, mutation: {description: "Use null for current"}, input: {json: '{"segmentedReadVersion":null,"minSegmentedReadVersion":"0.1.0"}'}, expected: {outcome: refused, errorContains: segmentedReadVersion}}
  - {name: version-advertisement-numeric-minimum, classification: must-fail, provenance: {source: boundary, ref: "Versions are strings"}, mutation: {description: "Use a numeric minimum"}, input: {json: '{"segmentedReadVersion":"0.2.0","minSegmentedReadVersion":1}'}, expected: {outcome: refused, errorContains: minSegmentedReadVersion}}
  - {name: version-advertisement-not-object, classification: must-fail, provenance: {source: boundary, ref: "Discovery bodies are objects"}, mutation: {description: "Use an array"}, input: {json: '[]'}, expected: {outcome: refused, errorContains: object}}
  - {name: version-advertisement-capability-independent, classification: must-pass, provenance: {source: requirement, ref: "Capability tokens never imply a read version"}, mutation: {description: "Advertise capabilities without a window"}, input: {json: '{"contentCapabilities":["future_version"]}'}, expected: {outcome: absent, capabilities: [future_version]}}
