      expected: {valid: true}
      classification: must-pass
      provenance: {source: boundary, ref: 'an astral character is one code point but two UTF-16 units'}
      mutation: {description: 'Offers 200 astral characters: 200 code points inside the bound, 400 UTF-16 units over it; a UTF-16-counting validator refuses a value the wire accepts.'}
