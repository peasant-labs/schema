# The exact case names testdata/typescript/transcript_directory_positions.yaml
# must hold. A case renamed or removed without its entry here fails the suite:
# these are the only cases for the helper's explicit-null, non-safe-number and
# broken-container branches.
expectedCaseCount: 20
requiredCaseNames:
  - directory-null
  - directory-array
  - directory-missing-segments
  - directory-non-array-segments
  - directory-non-object-ref
  - directory-empty-segments
  - directory-spans-only-without-total
  - directory-explicit-null-total
  - directory-explicit-null-span
  - directory-string-total
  - directory-fractional-total
  - directory-fractional-before
  - directory-string-before
  - directory-span-missing-before
  - directory-span-missing-count
  - directory-span-ends-past-total
  - directory-total-safe-integer-boundary
  - directory-total-above-safe-integer-boundary
  - directory-span-before-above-safe-integer-boundary
  - directory-required-field-invalid-with-valid-positions
