cases:
  - {name: v2-directory-null, classification: must-fail, provenance: {source: boundary, ref: "directory is an object"}, mutation: {description: "Pass null"}, input: {json: 'null'}, expected: false}
  - {name: v2-directory-context-missing, classification: must-fail, provenance: {source: boundary, ref: "v2 states context"}, mutation: {description: "Omit context"}, input: {json: '{"segments":[]}'}, expected: false}
  - {name: v2-directory-context-not-object, classification: must-fail, provenance: {source: boundary, ref: "context is an object"}, mutation: {description: "Use an array as context"}, input: {json: '{"context":[],"segments":[]}'}, expected: false}
  - {name: v2-directory-segments-not-array, classification: must-fail, provenance: {source: boundary, ref: "segments is an array"}, mutation: {description: "Use an object for segments"}, input: {json: '{"context":{},"segments":{}}'}, expected: false}
  - {name: v2-directory-empty-segments, classification: must-pass, provenance: {source: requirement, ref: "an empty directory is valid"}, mutation: {description: "Supply no refs"}, input: {json: '{"context":{},"segments":[]}'}, expected: true}
  - {name: v2-directory-total-absent, classification: must-pass, provenance: {source: requirement, ref: "an absent total is unknown"}, mutation: {description: "Omit the total with a continuous ref chain"}, input: {json: '{"context":{},"segments":[{"conversationTurns":{"before":2,"count":1}},{"conversationTurns":{"before":3,"count":1}}]}'}, expected: true}
  - {name: v2-directory-total-null, classification: must-fail, provenance: {source: boundary, ref: "an absent total is omitted"}, mutation: {description: "Set the total to null"}, input: {json: '{"context":{"totalConversationTurns":null},"segments":[]}'}, expected: false}
  - {name: v2-directory-total-negative, classification: must-fail, provenance: {source: boundary, ref: "the total is non-negative"}, mutation: {description: "Use a negative total"}, input: {json: '{"context":{"totalConversationTurns":-1},"segments":[]}'}, expected: false}
  - {name: v2-directory-total-fractional, classification: must-fail, provenance: {source: boundary, ref: "the total is integral"}, mutation: {description: "Use a fractional total"}, input: {json: '{"context":{"totalConversationTurns":1.5},"segments":[]}'}, expected: false}
  - {name: v2-directory-total-string, classification: must-fail, provenance: {source: boundary, ref: "the total is numeric"}, mutation: {description: "Use a string total"}, input: {json: '{"context":{"totalConversationTurns":"1"},"segments":[]}'}, expected: false}
  - {name: v2-directory-total-above-safe-domain, classification: must-fail, provenance: {source: boundary, ref: "the total must be a safe integer"}, mutation: {description: "Use an unsafe total"}, input: {json: '{"context":{"totalConversationTurns":9007199254740992},"segments":[]}', numbers: [{pointer: /context/totalConversationTurns, safeInteger: false}]}, expected: false}
  - {name: v2-directory-span-ends-past-total, classification: must-fail, provenance: {source: requirement, ref: "the span cannot end after the context total"}, mutation: {description: "End the span past the total"}, input: {json: '{"context":{"totalConversationTurns":1},"segments":[{"conversationTurns":{"before":1,"count":1}}]}'}, expected: false}
  - {name: v2-directory-span-at-total, classification: must-pass, provenance: {source: boundary, ref: "a span may end exactly at the total"}, mutation: {description: "End the span at the total"}, input: {json: '{"context":{"totalConversationTurns":1},"segments":[{"conversationTurns":{"before":0,"count":1}}]}'}, expected: true}
  - {name: v2-directory-span-chain-not-continuous, classification: must-fail, provenance: {source: requirement, ref: "adjacent stated spans must meet"}, mutation: {description: "Introduce a gap between adjacent spans"}, input: {json: '{"context":{"totalConversationTurns":3},"segments":[{"conversationTurns":{"before":0,"count":1}},{"conversationTurns":{"before":2,"count":1}}]}'}, expected: false}
  - {name: v2-directory-omitted-span-breaks-chain, classification: must-pass, provenance: {source: requirement, ref: "an omitted span breaks the adjacent chain"}, mutation: {description: "Omit a span between two stated spans"}, input: {json: '{"context":{"totalConversationTurns":4},"segments":[{"conversationTurns":{"before":0,"count":1}},{},{"conversationTurns":{"before":3,"count":1}}]}'}, expected: true}
  - {name: v2-directory-top-level-total-ignored, classification: must-pass, provenance: {source: requirement, ref: "only the context supplies the v2 total"}, mutation: {description: "Add a conflicting stray top-level total"}, input: {json: '{"context":{"totalConversationTurns":1},"totalConversationTurns":0,"segments":[{"conversationTurns":{"before":0,"count":1}}]}'}, expected: true}
  - {name: v2-directory-required-field-invalid-with-valid-positions, classification: must-pass, provenance: {source: requirement, ref: "the helper checks positions, not the complete wire shape"}, mutation: {description: "Supply invalid unrelated required fields with valid positions"}, input: {json: '{"context":{"revision":null,"totalConversationTurns":1},"segments":[{"index":"invalid","conversationTurns":{"before":0,"count":1}}]}'}, expected: true}
