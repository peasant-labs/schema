      mutation: {description: invitation listing behind the admin boundary}
    - name: admin-revoke-invite
      input: {method: DELETE, path: "/api/v1/admin/invites/{id}", operation_id: adminRevokeInvite, success_status: 200, statuses: [200, 400, 401, 403, 404, 500]}
