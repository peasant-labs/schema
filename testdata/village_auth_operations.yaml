status_sets:
  cases:
    - name: rate-limited-credential-entry-points
      input:
        status: 429
        operations:
          - {method: POST, path: "/api/v1/auth/bootstrap/claim"}
          - {method: POST, path: "/api/v1/auth/local/login"}
          - {method: POST, path: "/api/v1/auth/local/accept-invite"}
          - {method: POST, path: "/api/v1/auth/local/signup"}
          - {method: POST, path: "/api/v1/auth/local/verify"}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: middleware-rate-limit}
      mutation: {description: shared limiter covers every unauthenticated credential entry point}
    - name: csrf-refused-cookie-mutations
      input:
        status: 403
        operations:
          - {method: POST, path: "/api/v1/auth/logout"}
          - {method: POST, path: "/api/v1/auth/me/password"}
          - {method: DELETE, path: "/api/v1/auth/sessions/{id}"}
          - {method: POST, path: "/api/v1/admin/users"}
          - {method: POST, path: "/api/v1/admin/invites"}
          - {method: DELETE, path: "/api/v1/admin/invites/{id}"}
          - {method: POST, path: "/api/v1/admin/users/{username}/temporary-password"}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: middleware-csrf}
      mutation: {description: cookie-authenticated unsafe requests are refused before the handler}
    - name: forced-change-gate-protected-mutations
      input:
        status: 403
        operations:
          - {method: POST, path: "/api/v1/auth/logout"}
          - {method: DELETE, path: "/api/v1/auth/sessions/{id}"}
          - {method: POST, path: "/api/v1/admin/users"}
          - {method: POST, path: "/api/v1/admin/invites"}
          - {method: DELETE, path: "/api/v1/admin/invites/{id}"}
          - {method: POST, path: "/api/v1/admin/users/{username}/temporary-password"}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: middleware-forced-change}
      mutation: {description: forced-change gate blocks protected mutations outside the allowlist}
    - name: admin-boundary-anonymous
      input:
        status: 401
        operations:
          - {method: POST, path: "/api/v1/admin/users"}
          - {method: GET, path: "/api/v1/admin/users"}
          - {method: POST, path: "/api/v1/admin/invites"}
          - {method: GET, path: "/api/v1/admin/invites"}
          - {method: DELETE, path: "/api/v1/admin/invites/{id}"}
          - {method: POST, path: "/api/v1/admin/users/{username}/temporary-password"}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: middleware-admin-gate}
      mutation: {description: anonymous admin calls are refused without a mutation or a secret}
    - name: admin-boundary-member
      input:
        status: 403
        operations:
          - {method: POST, path: "/api/v1/admin/users"}
          - {method: GET, path: "/api/v1/admin/users"}
          - {method: POST, path: "/api/v1/admin/invites"}
          - {method: GET, path: "/api/v1/admin/invites"}
          - {method: DELETE, path: "/api/v1/admin/invites/{id}"}
          - {method: POST, path: "/api/v1/admin/users/{username}/temporary-password"}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: middleware-admin-gate}
      mutation: {description: authenticated non-admins are refused on every admin route}
