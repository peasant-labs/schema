      mutation: {description: invitation revocation behind the admin boundary}
    - name: admin-reissue-temporary-password
      input: {method: POST, path: "/api/v1/admin/users/{username}/temporary-password", operation_id: adminReissueTemporaryPassword, success_status: 200, statuses: [200, 400, 401, 403, 404, 409, 500]}
      expected: {valid: true}
