# This corpus asserts the local-account wire surface: every declared operation
# and its exact status set, the middleware-produced status groups (rate limiting,
# CSRF, the forced-change gate, and the admin boundary), the strict request
# bodies that must reject unknown fields, and a round-trip value for every new
# catalog type.
#
# Every declared status is asserted twice over: the routes arm pins the exact
# response-code set of each operation, and the status_sets arm records which
# middleware rule produces each shared status on which routes. A status that
# drifts off an operation, or a route that gains an undeclared status, fails
# both arms rather than passing vacuously.
routes:
  cases:
    - name: bootstrap-claim
      input: {method: POST, path: "/api/v1/auth/bootstrap/claim", operation_id: bootstrapClaimInstance, success_status: 200, statuses: [200, 400, 401, 403, 409, 429, 500]}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: local-account-bootstrap-claim}
      mutation: {description: one-time instance claim with its rate limit and handle collision}
    - name: local-login
      input: {method: POST, path: "/api/v1/auth/local/login", operation_id: localLogin, success_status: 200, statuses: [200, 400, 401, 403, 429, 500]}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: local-account-password-login}
      mutation: {description: uniform wrong-password and unknown-handle refusal plus the rate limit}
    - name: accept-invite
      input: {method: POST, path: "/api/v1/auth/local/accept-invite", operation_id: acceptInvite, success_status: 200, statuses: [200, 400, 401, 403, 409, 410, 429, 500]}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: local-account-invite-acceptance}
      mutation: {description: single-use invitation consume with collision and gone outcomes}
    - name: local-signup
      input: {method: POST, path: "/api/v1/auth/local/signup", operation_id: localSignup, success_status: 202, statuses: [202, 400, 403, 429, 500]}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: local-account-self-serve-signup}
      mutation: {description: non-revealing accepted signup with no account-existence oracle}
    - name: local-verify
      input: {method: POST, path: "/api/v1/auth/local/verify", operation_id: localVerifyEmail, success_status: 200, statuses: [200, 400, 403, 410, 429, 500]}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: local-account-email-verification}
      mutation: {description: single-use expiring verification token with a gone outcome}
    - name: local-logout
      input: {method: POST, path: "/api/v1/auth/logout", operation_id: localLogout, success_status: 200, statuses: [200, 401, 403, 500]}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: local-account-logout}
      mutation: {description: immediate session revocation with the CSRF refusal}
    - name: change-password
      input: {method: POST, path: "/api/v1/auth/me/password", operation_id: changeOwnPassword, success_status: 200, statuses: [200, 400, 401, 403, 500]}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: local-account-password-change}
      mutation: {description: forced-change allowlisted mutation with the CSRF refusal}
    - name: own-account
      input: {method: GET, path: "/api/v1/auth/me", operation_id: getOwnAccount, success_status: 200, statuses: [200, 401, 403, 500]}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: local-account-profile-read}
      mutation: {description: self profile carrying the neutral handle}
    - name: auth-providers
      input: {method: GET, path: "/api/v1/auth/providers", operation_id: listAuthProviders, success_status: 200, statuses: [200, 500]}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: local-account-provider-discovery}
      mutation: {description: unauthenticated sign-in-method discovery carrying the registration mode}
    - name: list-sessions
      input: {method: GET, path: "/api/v1/auth/sessions", operation_id: listOwnSessions, success_status: 200, statuses: [200, 401, 403, 500]}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: local-account-session-listing}
      mutation: {description: token-free session listing}
    - name: revoke-session
      input: {method: DELETE, path: "/api/v1/auth/sessions/{id}", operation_id: revokeOwnSession, success_status: 200, statuses: [200, 400, 401, 403, 404, 500]}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: local-account-session-revocation}
      mutation: {description: own-session revocation with the CSRF refusal}
    - name: admin-create-user
      input: {method: POST, path: "/api/v1/admin/users", operation_id: adminCreateUser, success_status: 201, statuses: [201, 400, 401, 403, 409, 500]}
      expected: {valid: true}
      classification: must-pass
      provenance: {source: requirement, ref: local-account-admin-create}
      mutation: {description: administrator provisioning with the admin boundary and handle collision}
    - name: admin-list-users
      input: {method: GET, path: "/api/v1/admin/users", operation_id: adminListUsers, success_status: 200, statuses: [200, 401, 403, 500]}
