# Where an email address may appear in a response. A person's notification
# address is personal contact data: only that person's own settings carry it.
# The guard walks every operation's response in each served spec and fails
# when a response outside self_operations reaches the address component or
# declares a property that looks like a contact address (a name containing
# one of name_terms, or a string with one of formats) and is not exempt below.
address_component: SchemaVillageNotificationEmail
name_terms: [email, address]
formats: [email]
specs:
  village:
    # The caller's own settings and the operations that change the address
    # return VillageUserSettings to the caller alone.
    self_operations:
      - getMySettings
      - updateMySettings
      - setMyNotificationEmail
      - removeMyNotificationEmail
      - verifyMyNotificationEmail
    # Properties named like an email that are not an account's contact
    # address, each with the reason it may reach other viewers.
    exempt_properties:
      SchemaVillageRepositoryCommit.author_email: a git commit's author email in a linked repository's history, read from GitHub, not a Village account's address
  local:
    self_operations: []
    exempt_properties:
      SchemaCommitInfo.authorEmail: a git commit's author email recorded in the session's own repository, not a Village account's address
